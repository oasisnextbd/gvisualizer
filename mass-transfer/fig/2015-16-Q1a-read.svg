.8" cy="366.2" r="11" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="106.8" y="370.8" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><circle cx="134.8" cy="411.1" r="11" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="134.8" y="415.7" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><circle cx="355.2" cy="411.1" r="11" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="355.2" y="415.7" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><path d="M322.8 470V352.2M445.2 470V352.2" fill="none" stroke="#6A4FC9" stroke-width="1.4" stroke-dasharray="4 3"/><circle cx="322.8" cy="352.2" r="5.5" fill="#6A4FC9" stroke="#FFFFFF" stroke-width="1.5"/><text x="328.8" y="344.2" font-size="13" fill="#6A4FC9" text-anchor="start" font-weight="bold" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">z = 0.40</text><circle cx="445.2" cy="352.2" r="5.5" fill="#6A4FC9" stroke="#FFFFFF" stroke-width="1.5"/><text x="451.2" y="344.2" font-size="13" fill="#6A4FC9" text-anchor="start" font-weight="bold" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">z = 0.60</text><circle cx="336.8" cy="368.2" r="11" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="336.8" y="372.8" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><circle cx="497.2" cy="434.7" r="4" fill="#1E2B3A" stroke="#FFFFFF" stroke-width="1.5"/><text x="503.2" y="450.7" font-size="12" fill="#1E2B3A" text-anchor="start" font-weight="normal" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">azeotrope ≈ 0.68, 80.1 °C</text><circle cx="33.0" cy="525.5" r="9" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="33.0" y="530.1" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="48.0" y="530.0" font-size="12.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">Find T = 85 °C on the temperature axis and go across (horizontal line).</text><circle cx="33.0" cy="542.5" r="9" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="33.0" y="547.1" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="48.0" y="547.0" font-size="12.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">Stop where it meets the bubble curve (lower, liquid) and the dew curve (upper, vapor).</text><circle cx="33.0" cy="559.5" r="9" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="33.0" y="564.1" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="48.0" y="564.0" font-size="12.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">Drop vertically from each meeting point to the axis: x ≈ 0.07, y ≈ 0.43.</text><circle cx="33.0" cy="576.5" r="9" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="33.0" y="581.1" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="48.0" y="581.0" font-size="12.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">z = 0.40 lies between them: V/F = (0.40 − 0.07)/(0.43 − 0.07) = 0.92; z = 0.60 at 85 °C is above the dew curve (all vapor).</text><text x="360.0" y="604.0" font-size="11" fill="#55667D" text-anchor="middle" font-weight="normal" font-style="italic">Redrawn from the correlation; in the exam read the printed chart — values may differ slightly.</text></svg>