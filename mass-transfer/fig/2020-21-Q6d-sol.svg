<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Helvetica, Arial, sans-serif">
<title>Feed-stage flow profiles</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1E2B3A"/></marker>
<marker id="h" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#D2552B"/></marker>
<marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0B7C8C"/></marker></defs>
<text x="320" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#1E2B3A">Flow profile around the feed stage</text>
<g>
<text x="160" y="50" font-size="13" font-weight="bold" text-anchor="middle" fill="#1E2B3A">(i) Superheated vapor, q = −1/9</text>
<line x1="80" y1="70" x2="80" y2="270" stroke="#1E2B3A" stroke-width="2"/><line x1="250" y1="70" x2="250" y2="270" stroke="#1E2B3A" stroke-width="2"/>
<line x1="80" y1="170" x2="250" y2="170" stroke="#1E2B3A" stroke-width="2.4"/>
<line x1="20" y1="160" x2="78" y2="160" stroke="#D2552B" stroke-width="2" marker-end="url(#h)"/><text x="22" y="150" font-size="12" fill="#D2552B">F (vapor)</text>
<line x1="120" y1="80" x2="120" y2="165" stroke="#0B7C8C" stroke-width="2" marker-end="url(#c)"/><text x="104" y="78" font-size="12" fill="#0B7C8C">L</text>
<line x1="120" y1="175" x2="120" y2="262" stroke="#0B7C8C" stroke-width="2" marker-end="url(#c)"/><text x="96" y="285" font-size="12" fill="#0B7C8C">L̄ = L − F/9</text>
<path d="M150,160 Q150,130 170,128 L170,82" fill="none" stroke="#D2552B" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#h)"/><text x="176" y="116" font-size="11" fill="#D2552B">F/9 of L vaporizes</text>
<line x1="215" y1="262" x2="215" y2="82" stroke="#D2552B" stroke-width="2" marker-end="url(#h)"/><text x="190" y="285" font-size="12" fill="#D2552B">V̄</text>
<text x="200" y="66" font-size="12" fill="#D2552B">V = V̄ + 10F/9</text>
</g>
<g>
<text x="480" y="50" font-size="13" font-weight="bold" text-anchor="middle" fill="#1E2B3A">(ii) Subcooled liquid, q = 1.07</text>
<line x1="400" y1="70" x2="400" y2="270" stroke="#1E2B3A" stroke-width="2"/><line x1="570" y1="70" x2="570" y2="270" stroke="#1E2B3A" stroke-width="2"/>
<line x1="400" y1="170" x2="570" y2="170" stroke="#1E2B3A" stroke-width="2.4"/>
<line x1="340" y1="160" x2="398" y2="160" stroke="#0B7C8C" stroke-width="2" marker-end="url(#c)"/><text x="342" y="150" font-size="12" fill="#0B7C8C">F (liq.)</text>
<line x1="440" y1="80" x2="440" y2="165" stroke="#0B7C8C" stroke-width="2" marker-end="url(#c)"/><text x="424" y="78" font-size="12" fill="#0B7C8C">L</text>
<line x1="440" y1="175" x2="440" y2="262" stroke="#0B7C8C" stroke-width="2" marker-end="url(#c)"/><text x="410" y="285" font-size="12" fill="#0B7C8C">L̄ = L + 1.07F</text>
<path d="M530,262 L530,190 Q530,160 500,160 L470,160 L470,175" fill="none" stroke="#D2552B" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#h)"/><text x="476" y="208" font-size="11" fill="#D2552B">0.07F vapor condenses</text>
<line x1="545" y1="262" x2="545" y2="82" stroke="#D2552B" stroke-width="2" marker-end="url(#h)"/><text x="530" y="285" font-size="12" fill="#D2552B">V̄</text>
<text x="500" y="66" font-size="12" fill="#D2552B">V = V̄ − 0.07F</text>
</g>
<text x="320" y="315" font-size="12" text-anchor="middle" fill="#55667D">L̄ = L + qF and V̄ = V − (1 − q)F in both cases</text>
</svg>
