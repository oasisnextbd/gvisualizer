roke-linejoin="round" stroke-linecap="round" marker-end="url(#arB7840A)"/><circle cx="461.3" cy="278.1" r="5" fill="#B7840A" stroke="#FFFFFF" stroke-width="1.5"/><text x="456.3" y="462.0" font-size="13" fill="#B7840A" text-anchor="start" font-weight="bold" transform="rotate(-90 456.3 462.0)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">y = 0.63</text><circle cx="78.0" cy="278.1" r="5" fill="#B7840A" stroke="#FFFFFF" stroke-width="1.5"/><rect x="82.0" y="256.1" width="78.2" height="18.9" rx="3" fill="#FFFFFF" stroke="#B7840A" stroke-width="1.3"/><text x="121.1" y="269.1" font-size="13" fill="#B7840A" text-anchor="middle" font-weight="bold">T = 95 °C</text><circle cx="178.2" cy="264.1" r="11" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="178.2" y="268.7" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><circle cx="211.8" cy="292.1" r="11" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="211.8" y="296.7" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><circle cx="339.5" cy="374.1" r="11" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="339.5" y="378.7" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><circle cx="475.3" cy="374.1" r="11" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="475.3" y="378.7" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><path d="M384 470V278.1" fill="none" stroke="#6A4FC9" stroke-width="1.4" stroke-dasharray="4 3"/><circle cx="384.0" cy="278.1" r="5.5" fill="#6A4FC9" stroke="#FFFFFF" stroke-width="1.5"/><text x="390.0" y="294.1" font-size="13" fill="#6A4FC9" text-anchor="start" font-weight="bold" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">z = 0.50</text><circle cx="398.0" cy="314.1" r="11" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="398.0" y="318.7" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><circle cx="33.0" cy="525.5" r="9" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="33.0" y="530.1" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="48.0" y="530.0" font-size="12.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">Pick the temperature on the T axis (here 95 °C) and draw a horizontal line.</text><circle cx="33.0" cy="542.5" r="9" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="33.0" y="547.1" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="48.0" y="547.0" font-size="12.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">It meets the bubble curve (lower, liquid) and the dew curve (upper, vapor).</text><circle cx="33.0" cy="559.5" r="9" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="33.0" y="564.1" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="48.0" y="564.0" font-size="12.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">Drop vertically to the axis: liquid x = 0.40, vapor y = 0.63 (the tie line).</text><circle cx="33.0" cy="576.5" r="9" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="33.0" y="581.1" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="48.0" y="581.0" font-size="12.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">For a feed z between them: V/F = (z − x)/(y − x). Bubble point of z: go up from z to the lower curve, then across to T.</text><text x="24.0" y="598.0" font-size="12.5" fill="#55667D" text-anchor="start" font-weight="normal">Below the bubble curve: subcooled liquid. Above the dew curve: superheated vapor. Between: two phases.</text><text x="360.0" y="621.0" font-size="11" fill="#55667D" text-anchor="middle" font-weight="normal" font-style="italic">Redrawn from the correlation; in the exam read the printed chart — values may differ slightly.</text></svg>