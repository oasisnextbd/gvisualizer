<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 425" width="660" height="425" font-family="Helvetica, Arial, sans-serif"><title>CMO flow profiles for subcooled and two-phase feeds</title><rect width="100%" height="100%" fill="#FFFFFF"/><text x="150" y="40" font-size="14" text-anchor="middle" fill="#1E2B3A" font-weight="bold">(i) Subcooled liquid feed, q &gt; 1</text><line x1="40" y1="60" x2="40" y2="330" stroke="#1E2B3A" stroke-width="1.5"/><line x1="40" y1="330" x2="290" y2="330" stroke="#1E2B3A" stroke-width="1.5"/><text x="165" y="360" font-size="12" text-anchor="middle" fill="#55667D" font-weight="normal">flow rate (mol/h) →</text><text x="22" y="195" font-size="12" text-anchor="middle" fill="#55667D" font-weight="normal" transform="rotate(-90 22 195)">stage location (top → bottom)</text><text x="34" y="72" font-size="11" text-anchor="end" fill="#55667D" font-weight="normal">1</text><text x="34" y="328" font-size="11" text-anchor="end" fill="#55667D" font-weight="normal">N</text><line x1="40" y1="190" x2="290" y2="190" stroke="#9AA8B8" stroke-width="1" stroke-dasharray="4 3"/><text x="288" y="184" font-size="11" text-anchor="end" fill="#B7840A" font-weight="normal">feed stage f</text><line x1="140.0" y1="62" x2="140.0" y2="190" stroke="#0B7C8C" stroke-width="3"/><line x1="190.0" y1="62" x2="190.0" y2="190" stroke="#D2552B" stroke-width="3"/><line x1="265.0" y1="190" x2="265.0" y2="328" stroke="#0B7C8C" stroke-width="3"/><line x1="215.0" y1="190" x2="215.0" y2="328" stroke="#D2552B" stroke-width="3"/><line x1="140.0" y1="190" x2="265.0" y2="190" stroke="#0B7C8C" stroke-width="1.2" stroke-dasharray="2 2"/><line x1="190.0" y1="190" x2="215.0" y2="190" stroke="#D2552B" stroke-width="1.2" stroke-dasharray="2 2"/><text x="136.0" y="100" font-size="13" text-anchor="end" fill="#0B7C8C" font-weight="bold">L</text><text x="194.0" y="100" font-size="13" text-anchor="start" fill="#D2552B" font-weight="bold">V</text><text x="261.0" y="280" font-size="13" text-anchor="end" fill="#0B7C8C" font-weight="bold">L̄</text><text x="219.0" y="280" font-size="13" text-anchor="start" fill="#D2552B" font-weight="bold">V̄</text><text x="165" y="385" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">L̄ = L + qF &gt; L + F;  V̄ = V + (q − 1)F &gt; V</text><text x="480" y="40" font-size="14" text-anchor="middle" fill="#1E2B3A" font-weight="bold">(ii) Two-phase feed, 0 &lt; q &lt; 1</text><line x1="370" y1="60" x2="370" y2="330" stroke="#1E2B3A" stroke-width="1.5"/><line x1="370" y1="330" x2="620" y2="330" stroke="#1E2B3A" stroke-width="1.5"/><text x="495" y="360" font-size="12" text-anchor="middle" fill="#55667D" font-weight="normal">flow rate (mol/h) →</text><text x="352" y="195" font-size="12" text-anchor="middle" fill="#55667D" font-weight="normal" transform="rotate(-90 352 195)">stage location (top → bottom)</text><text x="364" y="72" font-size="11" text-anchor="end" fill="#55667D" font-weight="normal">1</text><text x="364" y="328" font-size="11" text-anchor="end" fill="#55667D" font-weight="normal">N</text><line x1="370" y1="190" x2="620" y2="190" stroke="#9AA8B8" stroke-width="1" stroke-dasharray="4 3"/><text x="618" y="184" font-size="11" text-anchor="end" fill="#B7840A" font-weight="normal">feed stage f</text><line x1="470.0" y1="62" x2="470.0" y2="190" stroke="#0B7C8C" stroke-width="3"/><line x1="520.0" y1="62" x2="520.0" y2="190" stroke="#D2552B" stroke-width="3"/><line x1="520.0" y1="190" x2="520.0" y2="328" stroke="#0B7C8C" stroke-width="3"/><line x1="470.0" y1="190" x2="470.0" y2="328" stroke="#D2552B" stroke-width="3"/><line x1="470.0" y1="190" x2="520.0" y2="190" stroke="#0B7C8C" stroke-width="1.2" stroke-dasharray="2 2"/><line x1="520.0" y1="190" x2="470.0" y2="190" stroke="#D2552B" stroke-width="1.2" stroke-dasharray="2 2"/><text x="466.0" y="100" font-size="13" text-anchor="end" fill="#0B7C8C" font-weight="bold">L</text><text x="524.0" y="100" font-size="13" text-anchor="start" fill="#D2552B" font-weight="bold">V</text><text x="516.0" y="280" font-size="13" text-anchor="end" fill="#0B7C8C" font-weight="bold">L̄</text><text x="474.0" y="280" font-size="13" text-anchor="start" fill="#D2552B" font-weight="bold">V̄</text><text x="495" y="385" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">L̄ = L + qF;  V̄ = V − (1 − q)F &lt; V</text><text x="330" y="412" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">Example numbers: F = 100, L = 100, V = 150; (i) q = 1.25, (ii) q = 0.5. CMO: flows constant within each section.</text></svg>