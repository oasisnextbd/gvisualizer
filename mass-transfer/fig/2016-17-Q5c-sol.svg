<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" width="660" height="350" font-family="Helvetica, Arial, sans-serif"><title>Tray efficiency versus vapor flow rate</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker></defs><line x1="80" y1="300" x2="80" y2="40" stroke="#1E2B3A" stroke-width="1.8" marker-end="url(#ar)"/><line x1="80" y1="300" x2="620" y2="300" stroke="#1E2B3A" stroke-width="1.8" marker-end="url(#ar)"/><text x="350" y="335" font-size="13" text-anchor="middle" fill="#55667D" font-weight="normal">vapor flow rate (velocity) →</text><text x="40" y="170" font-size="13" text-anchor="middle" fill="#55667D" font-weight="normal" transform="rotate(-90 40 170)">tray efficiency →</text><path d="M110,280 C150,120 220,95 330,90 C440,88 480,95 520,130 C545,160 560,230 575,285" fill="none" stroke="#0B7C8C" stroke-width="2.6"/><path d="M110,280 C130,110 200,85 330,82 C460,80 500,88 525,125 C550,165 565,235 580,288" fill="none" stroke="#6A4FC9" stroke-width="2.0" stroke-dasharray="6 4"/><line x1="130" y1="40" x2="130" y2="300" stroke="#9AA8B8" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="530" y1="40" x2="530" y2="300" stroke="#9AA8B8" stroke-width="1.2" stroke-dasharray="4 3"/><text x="135" y="78" font-size="12" text-anchor="start" fill="#D2552B" font-weight="bold">weeping limit</text><text x="525" y="60" font-size="12" text-anchor="end" fill="#D2552B" font-weight="bold">flooding (entrainment) limit</text><circle cx="360" cy="89" r="5" fill="#B7840A"/><text x="360" y="76" font-size="12" text-anchor="middle" fill="#B7840A" font-weight="bold">design point</text><text x="120" y="240" font-size="11" text-anchor="start" fill="#55667D" font-weight="normal">weeping:</text><text x="120" y="254" font-size="11" text-anchor="start" fill="#55667D" font-weight="normal">liquid drains</text><text x="120" y="268" font-size="11" text-anchor="start" fill="#55667D" font-weight="normal">through holes</text><text x="560" y="240" font-size="11" text-anchor="end" fill="#55667D" font-weight="normal">excessive</text><text x="560" y="254" font-size="11" text-anchor="end" fill="#55667D" font-weight="normal">entrainment</text><text x="300" y="150" font-size="12" text-anchor="middle" fill="#0B7C8C" font-weight="bold">sieve tray</text><text x="300" y="120" font-size="11" text-anchor="middle" fill="#6A4FC9" font-weight="normal">valve tray: wider flat top (better turndown)</text></svg>