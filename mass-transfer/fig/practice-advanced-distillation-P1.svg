<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 600" width="660" height="600" font-family="Helvetica, Arial, sans-serif"><title>Flowsheet: two feeds and a liquid side draw</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="330" y="26" font-size="15" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Two feeds and a liquid side draw: four sections</text><rect x="270" y="70" width="120" height="430" fill="#F4F7FA" stroke="#1E2B3A" stroke-width="2"/><line x1="270" y1="170" x2="390" y2="170" stroke="#55667D" stroke-dasharray="4 3"/><line x1="270" y1="250" x2="390" y2="250" stroke="#55667D" stroke-dasharray="4 3"/><line x1="270" y1="370" x2="390" y2="370" stroke="#55667D" stroke-dasharray="4 3"/><text x="330" y="116" font-size="13" text-anchor="middle" fill="#D2552B" font-weight="bold">Section I</text><text x="330" y="134" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">L = 137.8, V = 206.7</text><text x="330" y="206" font-size="13" text-anchor="middle" fill="#D2552B" font-weight="bold">Section II</text><text x="330" y="224" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">L′ = 237.8, V′ = 206.7</text><text x="330" y="306" font-size="13" text-anchor="middle" fill="#D2552B" font-weight="bold">Section III</text><text x="330" y="324" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">L″ = 217.8, V″ = 206.7</text><text x="330" y="431" font-size="13" text-anchor="middle" fill="#D2552B" font-weight="bold">Section IV</text><text x="330" y="449" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">L̄ = 217.8, V̄ = 146.7</text><circle cx="330" cy="50" r="0" /><path d="M330,70 L330,48 L470,48" fill="none" stroke="#1E2B3A" stroke-width="2"/><circle cx="470" cy="48" r="13" fill="#fff" stroke="#1E2B3A" stroke-width="2"/><text x="470" y="53" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">C</text><line x1="483" y1="48" x2="600" y2="48" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="600" y="66" font-size="12" text-anchor="end" fill="#1E2B3A" font-weight="normal">D = 68.9, xD = 0.95</text><path d="M470,61 L470,85 L392,85" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="480" y="100" font-size="11" text-anchor="start" fill="#55667D" font-weight="normal">reflux L0, R = 2</text><line x1="130" y1="170" x2="268" y2="170" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="130" y="160" font-size="12" text-anchor="start" fill="#0B7C8C" font-weight="normal">F1 = 100, z = 0.60</text><text x="130" y="188" font-size="11" text-anchor="start" fill="#55667D" font-weight="normal">saturated liquid</text><line x1="392" y1="250" x2="560" y2="250" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="560" y="240" font-size="12" text-anchor="end" fill="#B7840A" font-weight="normal">S = 20, liquid</text><text x="560" y="268" font-size="11" text-anchor="end" fill="#55667D" font-weight="normal">x5 = 0.474 (target 0.45)</text><line x1="130" y1="370" x2="268" y2="370" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="130" y="360" font-size="12" text-anchor="start" fill="#0B7C8C" font-weight="normal">F2 = 60, z = 0.30</text><text x="130" y="388" font-size="11" text-anchor="start" fill="#55667D" font-weight="normal">saturated vapor</text><path d="M330,500 L330,540 L440,540" fill="none" stroke="#1E2B3A" stroke-width="2"/><rect x="440" y="526" width="40" height="28" fill="#fff" stroke="#1E2B3A" stroke-width="2"/><text x="460" y="545" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="normal">PR</text><line x1="480" y1="540" x2="600" y2="540" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="600" y="532" font-size="12" text-anchor="end" fill="#1E2B3A" font-weight="normal">B = 71.1, xB = 0.05</text><text x="330" y="580" font-size="12" text-anchor="middle" fill="#55667D" font-weight="normal">saturated liquid changes L only; saturated vapor changes V only</text></svg>