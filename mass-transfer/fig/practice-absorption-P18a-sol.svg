<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="Helvetica, Arial, sans-serif"><title>Gas treatment plant flowsheet</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs><rect x="120" y="80" width="90" height="240" rx="14" fill="#F4F7FA" stroke="#1E2B3A" stroke-width="2.2"/><text x="165.0" y="205.0" font-size="14" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Absorber</text><rect x="480" y="80" width="90" height="240" rx="14" fill="#F4F7FA" stroke="#1E2B3A" stroke-width="2.2"/><text x="525.0" y="205.0" font-size="14" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Stripper</text><line x1="10" y1="300" x2="120" y2="300" stroke="#1E2B3A" stroke-width="2" marker-end="url(#ah)"/><text x="10" y="320" font-size="12" text-anchor="start" fill="#55667D" font-weight="normal">feed gas (solute)</text><line x1="165" y1="80" x2="165" y2="30" stroke="#1E2B3A" stroke-width="2" marker-end="url(#ah)"/><text x="175" y="40" font-size="12" text-anchor="start" fill="#55667D" font-weight="normal">treated gas</text><polyline points="210,300 300,300 300,240 360,240" fill="none" stroke="#D2552B" stroke-width="2.2" marker-end="url(#ahh)"/><circle cx="390" cy="240" r="28" fill="#FFF" stroke="#1E2B3A" stroke-width="2"/><text x="390" y="245" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">HX</text><polyline points="418,240 450,240 450,110 480,110" fill="none" stroke="#D2552B" stroke-width="2.2" marker-end="url(#ahh)"/><text x="300" y="318" font-size="12" text-anchor="middle" fill="#D2552B" font-weight="normal">rich solvent</text><polyline points="525,320 525,370 390,370 390,268" fill="none" stroke="#0B7C8C" stroke-width="2.2" marker-end="url(#ahc)"/><polyline points="362,250 250,250 250,110 210,110" fill="none" stroke="#0B7C8C" stroke-width="2.2" marker-end="url(#ahc)"/><text x="450" y="388" font-size="12" text-anchor="middle" fill="#0B7C8C" font-weight="normal">lean (regenerated) solvent, cooled in HX</text><line x1="680" y1="300" x2="570" y2="300" stroke="#1E2B3A" stroke-width="2" marker-end="url(#ah)"/><text x="682" y="320" font-size="12" text-anchor="end" fill="#55667D" font-weight="normal">stripping gas / steam</text><line x1="525" y1="80" x2="525" y2="30" stroke="#1E2B3A" stroke-width="2" marker-end="url(#ah)"/><text x="535" y="40" font-size="12" text-anchor="start" fill="#55667D" font-weight="normal">solute-rich gas</text><text x="350" y="24" font-size="15" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Gas treatment plant: absorber + stripper with solvent recycle</text><text x="165" y="345" font-size="12" text-anchor="middle" fill="#55667D" font-weight="normal">low T, high p</text><text x="600" y="345" font-size="12" text-anchor="start" fill="#55667D" font-weight="normal">high T, low p</text></svg>