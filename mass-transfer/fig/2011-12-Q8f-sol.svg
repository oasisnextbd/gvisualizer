<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Helvetica, Arial, sans-serif"><title>Pressure heads on a sieve tray</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="360.0" y="22.0" font-size="14" fill="#1E2B3A" text-anchor="middle" font-weight="bold">Heads on a sieve tray and downcomer backup</text><line x1="60.0" y1="300.0" x2="440.0" y2="300.0" stroke="#1E2B3A" stroke-width="4"/><line x1="440.0" y1="264.0" x2="440.0" y2="300.0" stroke="#1E2B3A" stroke-width="3"/><line x1="120.0" y1="130.0" x2="560.0" y2="130.0" stroke="#1E2B3A" stroke-width="4"/><line x1="120.0" y1="130.0" x2="120.0" y2="282.0" stroke="#1E2B3A" stroke-width="2.5"/><rect x="62.0" y="180.0" width="56.0" height="120.0" fill="#BFE0E5" stroke="#0B7C8C" stroke-width="0" rx="0"/><line x1="60.0" y1="40.0" x2="60.0" y2="380.0" stroke="#1E2B3A" stroke-width="2"/><line x1="560.0" y1="40.0" x2="560.0" y2="380.0" stroke="#1E2B3A" stroke-width="2"/><polygon points="120.0,299.0 120.0,242.0 438.0,252.0 438.0,299.0" fill="#BFE0E5" stroke="#0B7C8C" stroke-width="0" stroke-linejoin="round"/><line x1="120.0" y1="242.0" x2="438.0" y2="252.0" stroke="#0B7C8C" stroke-width="1.5"/><line x1="150.0" y1="360.0" x2="150.0" y2="306.0" stroke="#D2552B" stroke-width="1.4" marker-end="url(#ar)"/><line x1="180.0" y1="360.0" x2="180.0" y2="306.0" stroke="#D2552B" stroke-width="1.4" marker-end="url(#ar)"/><line x1="210.0" y1="360.0" x2="210.0" y2="306.0" stroke="#D2552B" stroke-width="1.4" marker-end="url(#ar)"/><line x1="240.0" y1="360.0" x2="240.0" y2="306.0" stroke="#D2552B" stroke-width="1.4" marker-end="url(#ar)"/><line x1="270.0" y1="360.0" x2="270.0" y2="306.0" stroke="#D2552B" stroke-width="1.4" marker-end="url(#ar)"/><line x1="300.0" y1="360.0" x2="300.0" y2="306.0" stroke="#D2552B" stroke-width="1.4" marker-end="url(#ar)"/><line x1="330.0" y1="360.0" x2="330.0" y2="306.0" stroke="#D2552B" stroke-width="1.4" marker-end="url(#ar)"/><line x1="360.0" y1="360.0" x2="360.0" y2="306.0" stroke="#D2552B" stroke-width="1.4" marker-end="url(#ar)"/><line x1="390.0" y1="360.0" x2="390.0" y2="306.0" stroke="#D2552B" stroke-width="1.4" marker-end="url(#ar)"/><text x="250.0" y="376.0" font-size="11" fill="#D2552B" text-anchor="middle" font-weight="normal">vapor through holes: dry-tray head h_dry</text><line x1="450.0" y1="300.0" x2="450.0" y2="264.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/><line x1="450.0" y1="264.0" x2="450.0" y2="300.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/><text x="456.0" y="286.0" font-size="11" fill="#1E2B3A" text-anchor="start" font-weight="normal">h_weir</text><line x1="450.0" y1="264.0" x2="450.0" y2="252.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/><line x1="450.0" y1="252.0" x2="450.0" y2="264.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/><text x="456.0" y="262.0" font-size="11" fill="#1E2B3A" text-anchor="start" font-weight="normal">h_crest</text><line x1="180.0" y1="250.0" x2="180.0" y2="242.0" stroke="#B7840A" stroke-width="1.2" marker-end="url(#ar)"/><line x1="180.0" y1="242.0" x2="180.0" y2="250.0" stroke="#B7840A" stroke-width="1.2" marker-end="url(#ar)"/><text x="188.0" y="250.0" font-size="11" fill="#B7840A" text-anchor="start" font-weight="normal"></text><text x="188.0" y="236.0" font-size="11" fill="#B7840A" text-anchor="start" font-weight="normal">h_grad (liquid gradient)</text><line x1="90.0" y1="300.0" x2="90.0" y2="180.0" stroke="#0B7C8C" stroke-width="1.2" marker-end="url(#ar)"/><line x1="90.0" y1="180.0" x2="90.0" y2="300.0" stroke="#0B7C8C" stroke-width="1.2" marker-end="url(#ar)"/><text x="96.0" y="244.0" font-size="11" fill="#0B7C8C" text-anchor="start" font-weight="normal"></text><text x="64.0" y="172.0" font-size="12" fill="#0B7C8C" text-anchor="start" font-weight="bold">h_dc</text><text x="126.0" y="290.0" font-size="10" fill="#B7840A" text-anchor="start" font-weight="normal">h_du</text><text x="150.0" y="118.0" font-size="11" fill="#55667D" text-anchor="start" font-weight="normal">tray n−1</text><text x="470.0" y="320.0" font-size="11" fill="#55667D" text-anchor="middle" font-weight="normal">tray n</text><text x="565.0" y="60.0" font-size="11" fill="#D2552B" text-anchor="start" font-weight="bold">Heads (in of clear liquid):</text><text x="565.0" y="79.0" font-size="11" fill="#1E2B3A" text-anchor="start" font-weight="normal">h_dry  dry-tray (orifice) loss</text><text x="565.0" y="98.0" font-size="11" fill="#1E2B3A" text-anchor="start" font-weight="normal">h_weir weir height</text><text x="565.0" y="117.0" font-size="11" fill="#1E2B3A" text-anchor="start" font-weight="normal">h_crest crest (Francis eq.)</text><text x="565.0" y="136.0" font-size="11" fill="#1E2B3A" text-anchor="start" font-weight="normal">h_grad liquid gradient</text><text x="565.0" y="155.0" font-size="11" fill="#1E2B3A" text-anchor="start" font-weight="normal">h_du   loss under apron</text><text x="565.0" y="174.0" font-size="11" fill="#1E2B3A" text-anchor="start" font-weight="normal"></text><text x="565.0" y="193.0" font-size="11" fill="#D2552B" text-anchor="start" font-weight="bold">Downcomer backup</text><text x="565.0" y="212.0" font-size="11" fill="#D2552B" text-anchor="start" font-weight="bold">(Wankat Eq. 10-23):</text><text x="565.0" y="231.0" font-size="11" fill="#1E2B3A" text-anchor="start" font-weight="normal">h_dc = h_dry + h_weir</text><text x="565.0" y="250.0" font-size="11" fill="#1E2B3A" text-anchor="start" font-weight="normal">  + h_crest + h_grad + h_du</text><text x="565.0" y="269.0" font-size="11" fill="#1E2B3A" text-anchor="start" font-weight="normal"></text><text x="565.0" y="288.0" font-size="11" fill="#D2552B" text-anchor="start" font-weight="bold">Aerated (φ ≈ 0.5):</text><text x="565.0" y="307.0" font-size="11" fill="#1E2B3A" text-anchor="start" font-weight="normal">h_dc,aer = h_dc/φ ≈ 2h_dc</text><text x="565.0" y="326.0" font-size="11" fill="#1E2B3A" text-anchor="start" font-weight="normal">need tray spacing > 2h_dc</text><text x="565.0" y="345.0" font-size="11" fill="#1E2B3A" text-anchor="start" font-weight="normal">else downcomer floods</text></svg>