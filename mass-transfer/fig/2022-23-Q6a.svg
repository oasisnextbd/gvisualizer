<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif"><title>Column with cold-reflux stream C and total reboiler (Q6a)</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="300.0" y="22.0" font-size="14" text-anchor="middle" fill="#1E2B3A" font-weight="bold">No condenser: pure ethanol stream C is the reflux</text><rect x="250.0" y="60.0" width="70.0" height="230.0" rx="0" fill="#F4F7FA" fill-opacity="1" stroke="#1E2B3A" stroke-width="1.6"/><text x="285.0" y="80.0" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">1</text><text x="285.0" y="282.0" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">N</text><line x1="150.0" y1="50.0" x2="250.0" y2="50.0" stroke="#1E2B3A" stroke-width="1.6"/><line x1="250.0" y1="50.0" x2="250.0" y2="62.0" stroke="#1E2B3A" stroke-width="1.6"/><text x="150.0" y="42.0" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">C = 1000 kg/h, x_C = 1 (sat. liq.)</text><line x1="320.0" y1="62.0" x2="320.0" y2="50.0" stroke="#1E2B3A" stroke-width="1.6"/><line x1="320.0" y1="50.0" x2="430.0" y2="50.0" stroke="#1E2B3A" stroke-width="1.6" marker-end="url(#ar)"/><text x="436.0" y="54.0" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">D, y_D = 0.80 (vapor)</text><line x1="140.0" y1="175.0" x2="250.0" y2="175.0" stroke="#1E2B3A" stroke-width="1.6" marker-end="url(#ar)"/><text x="60.0" y="170.0" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">F = 2000 kg/h</text><text x="60.0" y="186.0" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">z = 0.40, −20 °C</text><text x="335.0" y="170.0" font-size="12" text-anchor="start" fill="#55667D" font-weight="normal">Q_col = 0</text><line x1="270.0" y1="290.0" x2="270.0" y2="330.0" stroke="#1E2B3A" stroke-width="1.6"/><line x1="270.0" y1="330.0" x2="270.0" y2="370.0" stroke="#1E2B3A" stroke-width="1.6" marker-end="url(#ar)"/><text x="278.0" y="385.0" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">B, x_B = 0.05</text><line x1="270.0" y1="330.0" x2="320.0" y2="330.0" stroke="#1E2B3A" stroke-width="1.6"/><rect x="320.0" y="315.0" width="40.0" height="30.0" rx="0" fill="none" fill-opacity="1" stroke="#1E2B3A" stroke-width="1.6"/><text x="340.0" y="334.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="normal">Q_R</text><line x1="360.0" y1="330.0" x2="380.0" y2="330.0" stroke="#1E2B3A" stroke-width="1.6"/><line x1="380.0" y1="330.0" x2="380.0" y2="290.0" stroke="#1E2B3A" stroke-width="1.6"/><line x1="380.0" y1="290.0" x2="300.0" y2="290.0" stroke="#1E2B3A" stroke-width="1.6" marker-end="url(#ar)"/><text x="388.0" y="305.0" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">V̄, y = x_B (sat. vapor)</text><text x="180.0" y="320.0" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">L̄, x_N</text><text x="388.0" y="345.0" font-size="11" text-anchor="start" fill="#55667D" font-weight="normal">total reboiler</text></svg>