<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Helvetica, Arial, sans-serif"><title>Downcomer and weir designs</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="360.0" y="22.0" font-size="14" fill="#1E2B3A" text-anchor="middle" font-weight="bold">Downcomer designs (top row) and weir designs (bottom row)</text><line x1="170.0" y1="60.0" x2="170.0" y2="210.0" stroke="#1E2B3A" stroke-width="3"/><line x1="20.0" y1="210.0" x2="170.0" y2="210.0" stroke="#1E2B3A" stroke-width="3"/><line x1="20.0" y1="100.0" x2="80.0" y2="100.0" stroke="#1E2B3A" stroke-width="3"/><line x1="110.0" y1="100.0" x2="170.0" y2="100.0" stroke="#1E2B3A" stroke-width="3"/><rect x="82.0" y="80.0" width="26.0" height="105.0" fill="#BFE0E5" stroke="#1E2B3A" stroke-width="1.5" rx="0"/><text x="95.0" y="74.0" font-size="10" fill="#55667D" text-anchor="middle" font-weight="normal">weir</text><text x="95.0" y="232.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">(A) circular pipe</text><line x1="345.0" y1="60.0" x2="345.0" y2="210.0" stroke="#1E2B3A" stroke-width="3"/><line x1="195.0" y1="210.0" x2="345.0" y2="210.0" stroke="#1E2B3A" stroke-width="3"/><line x1="195.0" y1="100.0" x2="285.0" y2="100.0" stroke="#1E2B3A" stroke-width="3"/><line x1="285.0" y1="85.0" x2="285.0" y2="190.0" stroke="#1E2B3A" stroke-width="2.5"/><rect x="287.0" y="130.0" width="56.0" height="60.0" fill="#BFE0E5" stroke="#0B7C8C" stroke-width="0" rx="0"/><text x="270.0" y="232.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">(B) straight segmental</text><line x1="520.0" y1="60.0" x2="520.0" y2="210.0" stroke="#1E2B3A" stroke-width="3"/><line x1="370.0" y1="210.0" x2="520.0" y2="210.0" stroke="#1E2B3A" stroke-width="3"/><line x1="370.0" y1="100.0" x2="450.0" y2="100.0" stroke="#1E2B3A" stroke-width="3"/><polyline points="450.0,85.0 450.0,140.0 480.0,195.0" fill="none" stroke="#1E2B3A" stroke-width="2.5" stroke-linejoin="round"/><polygon points="451.0,100.0 518.0,100.0 518.0,195.0 480.0,195.0 451.0,140.0" fill="#BFE0E5" stroke="#0B7C8C" stroke-width="0" stroke-linejoin="round"/><text x="425.0" y="180.0" font-size="9" fill="#D2552B" text-anchor="middle" font-weight="normal">more active</text><text x="425.0" y="193.0" font-size="9" fill="#D2552B" text-anchor="middle" font-weight="normal">area below</text><text x="445.0" y="232.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">(C) sloped segmental</text><line x1="695.0" y1="60.0" x2="695.0" y2="210.0" stroke="#1E2B3A" stroke-width="3"/><line x1="545.0" y1="210.0" x2="695.0" y2="210.0" stroke="#1E2B3A" stroke-width="3"/><line x1="545.0" y1="100.0" x2="625.0" y2="100.0" stroke="#1E2B3A" stroke-width="3"/><line x1="655.0" y1="100.0" x2="695.0" y2="100.0" stroke="#1E2B3A" stroke-width="3"/><line x1="623.0" y1="85.0" x2="623.0" y2="100.0" stroke="#1E2B3A" stroke-width="2"/><path d="M625,100 L625,150 L655,150 L655,100" fill="#BFE0E5" stroke="#1E2B3A" stroke-width="2.5"/><line x1="640.0" y1="152.0" x2="640.0" y2="200.0" stroke="#0B7C8C" stroke-width="1.6" marker-end="url(#ar)"/><text x="620.0" y="232.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">(D) envelope</text><line x1="40.0" y1="330.0" x2="220.0" y2="330.0" stroke="#1E2B3A" stroke-width="3"/><rect x="70.0" y="304.0" width="120.0" height="26.0" fill="#E3ECF1" stroke="#1E2B3A" stroke-width="1.8" rx="0"/><text x="130.0" y="352.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">straight (2–4 in high)</text><line x1="270.0" y1="330.0" x2="450.0" y2="330.0" stroke="#1E2B3A" stroke-width="3"/><rect x="300.0" y="316.0" width="120.0" height="14.0" fill="#E3ECF1" stroke="#1E2B3A" stroke-width="1.8" rx="0"/><rect x="300.0" y="292.0" width="120.0" height="24.0" fill="#F3E3D9" stroke="#1E2B3A" stroke-width="1.8" rx="0"/><rect x="321.0" y="296.0" width="8.0" height="16.0" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.2" rx="3"/><rect x="391.0" y="296.0" width="8.0" height="16.0" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.2" rx="3"/><line x1="432.0" y1="290.0" x2="432.0" y2="320.0" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ar)"/><text x="360.0" y="352.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">adjustable (avoid)</text><line x1="500.0" y1="330.0" x2="680.0" y2="330.0" stroke="#1E2B3A" stroke-width="3"/><polygon points="530.0,330.0 530.0,296.0 540.0,296.0 540.0,308.0 550.0,308.0 550.0,296.0 560.0,296.0 560.0,308.0 570.0,308.0 570.0,296.0 580.0,296.0 580.0,308.0 590.0,308.0 590.0,296.0 600.0,296.0 600.0,308.0 610.0,308.0 610.0,296.0 620.0,296.0 620.0,308.0 630.0,308.0 630.0,296.0 640.0,296.0 640.0,308.0 650.0,308.0 650.0,296.0 650.0,330.0" fill="#E3ECF1" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round"/><text x="590.0" y="352.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">notched / picket-fence</text><text x="360.0" y="390.0" font-size="11" fill="#55667D" text-anchor="middle" font-weight="normal">B is the common choice; C keeps active area on the tray below; notched weirs help at low liquid rates</text></svg>