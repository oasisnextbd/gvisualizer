<g font-size="11" fill="#0B7C8C"><text x="425" y="84" text-anchor="middle">to drain</text><text x="515" y="84" text-anchor="middle">to drain</text><text x="605" y="84" text-anchor="middle">to drain</text></g>
<text x="20" y="48" font-size="12" text-anchor="start" fill="#0B7C8C">pure wash water, 0.2 kg per 1000 cm³ wet sand on each stage 4 … N</text>
<text x="350" y="298" font-size="11" text-anchor="middle" fill="#55667D">overflow of N → stage 3, of N−1 → stage 2, of N−2 → stage 1</text>
