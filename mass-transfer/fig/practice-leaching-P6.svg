<path d="M690,142 L632,142" marker-end="url(#a)"/><path d="M580,142 L542,142" marker-end="url(#a)"/><path d="M490,142 L452,142" marker-end="url(#a)"/>
<path d="M400,142 L360,142" stroke-dasharray="4 4"/><path d="M340,142 L302,142" marker-end="url(#a)"/><path d="M250,142 L212,142" marker-end="url(#a)"/><path d="M160,142 L122,142" marker-end="url(#a)"/><path d="M70,142 L20,142" marker-end="url(#a)"/></g>
<text x="690" y="190" font-size="12" text-anchor="end" fill="#1E2B3A">wet sand feed</text><text x="690" y="206" font-size="12" text-anchor="end" fill="#1E2B3A">x0 = 0.035</text>
<text x="8" y="126" font-size="12" fill="#1E2B3A">washed sand, xN</text>
