<g stroke="#1E2B3A" stroke-width="2" fill="#F4F6F9">
<rect x="70" y="120" width="50" height="44"/><rect x="160" y="120" width="50" height="44"/><rect x="250" y="120" width="50" height="44"/>
<rect x="400" y="120" width="50" height="44"/><rect x="490" y="120" width="50" height="44"/><rect x="580" y="120" width="50" height="44"/></g>
