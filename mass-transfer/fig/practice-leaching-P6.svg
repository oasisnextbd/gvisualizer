<path d="M95,60 L95,118" marker-end="url(#b)"/><path d="M185,60 L185,118" marker-end="url(#b)"/><path d="M275,60 L275,118" marker-end="url(#b)"/>
<path d="M95,166 L95,280 L425,280 L425,166" marker-end="url(#b)"/>
<path d="M185,166 L185,262 L515,262 L515,166" marker-end="url(#b)"/>
<path d="M275,166 L275,244 L605,244 L605,166" marker-end="url(#b)"/>
