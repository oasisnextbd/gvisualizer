<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" font-family="Helvetica, Arial, sans-serif"><title>Gas treatment plant with absorber and stripper</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="340" y="24" font-size="15" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Gas treatment plant: absorber + stripper with solvent recycle</text><rect x="120" y="80" width="70" height="260" rx="4" fill="#F3F6F9" stroke="#1E2B3A" stroke-width="2"/><text x="198" y="330" font-size="12" text-anchor="start" fill="#0B7C8C" font-weight="bold">ABSORBER</text><text x="198" y="346" font-size="11" text-anchor="start" fill="#55667D" font-weight="normal">low T, high p</text><rect x="470" y="80" width="70" height="260" rx="4" fill="#F3F6F9" stroke="#1E2B3A" stroke-width="2"/><text x="548" y="350" font-size="12" text-anchor="start" fill="#D2552B" font-weight="bold">STRIPPER</text><text x="548" y="366" font-size="11" text-anchor="start" fill="#55667D" font-weight="normal">high T, low p</text><polyline points="15,320 120,320" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="15" y="310" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">feed gas</text><polyline points="155,80 155,50 60,50" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="60" y="42" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">treated gas</text><polyline points="155,340 155,410 300,410" fill="none" stroke="#0B7C8C" stroke-width="2" marker-end="url(#ac)"/><text x="230" y="402" font-size="11" text-anchor="middle" fill="#0B7C8C" font-weight="normal">rich solvent</text><rect x="300" y="385" width="70" height="50" rx="6" fill="#FBEDE7" stroke="#D2552B" stroke-width="2"/><text x="335" y="450" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="normal">heat exchanger</text><text x="335" y="464" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">(heater)</text><polyline points="370,410 420,410 420,100 470,100" fill="none" stroke="#D2552B" stroke-width="2" marker-end="url(#ah)"/><polyline points="640,320 540,320" fill="none" stroke="#D2552B" stroke-width="2" marker-end="url(#ah)"/><text x="548" y="300" font-size="11" text-anchor="start" fill="#D2552B" font-weight="normal">stripping gas</text><text x="548" y="313" font-size="11" text-anchor="start" fill="#D2552B" font-weight="normal">or steam</text><polyline points="505,80 505,50 620,50" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="625" y="46" font-size="12" text-anchor="end" fill="#1E2B3A" font-weight="normal">solute + stripping gas</text><polyline points="505,340 505,500 100,500 100,100 120,100" fill="none" stroke="#0B7C8C" stroke-width="2" marker-end="url(#ac)"/><text x="300" y="492" font-size="11" text-anchor="middle" fill="#0B7C8C" font-weight="normal">lean solvent recycled (cooled)</text></svg>