stroke-width="1.8"/><circle cx="150.0" cy="235.9" r="14" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.8"/><circle cx="210.0" cy="235.9" r="14" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.8"/><circle cx="270.0" cy="235.9" r="14" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.8"/><circle cx="330.0" cy="235.9" r="14" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.8"/><circle cx="390.0" cy="235.9" r="14" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.8"/><circle cx="450.0" cy="235.9" r="14" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.8"/><polygon points="240,80 300,80 270.0,132.0" fill="#B7840A" fill-opacity="0.15" stroke="#B7840A" stroke-width="2"/><text x="270.0" y="60" font-size="12" text-anchor="middle" fill="#B7840A" font-weight="bold">pitch p</text><text x="560" y="95" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="bold">equilateral triangle:</text><text x="560" y="113" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">every hole is p from</text><text x="560" y="131" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">its 6 neighbours</text><text x="560" y="165" font-size="12" text-anchor="start" fill="#D2552B" font-weight="bold">p = 2.5–5 d₀</text><text x="560" y="183" font-size="12" text-anchor="start" fill="#55667D" font-weight="normal">(≈ 3.8 d₀ typical)</text><text x="560" y="215" font-size="12" text-anchor="start" fill="#0B7C8C" font-weight="bold">d₀ = 1/8–1 in</text><text x="560" y="233" font-size="12" text-anchor="start" fill="#55667D" font-weight="normal">(½ in first guess)</text><line x1="106" y1="108.0" x2="134" y2="108.0" stroke="#0B7C8C" stroke-width="1.4"/><text x="120" y="124.0" font-size="12" text-anchor="middle" fill="#0B7C8C" font-weight="bold">d₀</text><text x="360" y="300" font-size="12" text-anchor="middle" fill="#55667D" font-weight="normal">A_hole/A_active = 0.907 (d₀/p)² for a triangular pattern; β ≈ 6–25 %, 10 % first guess</text></svg>