pecified R1.</text><text x="4.0" y="204.8" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">2. F_T on F1F2 (lever rule); M on S–F_T.</text><text x="4.0" y="222.8" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">3. Line R1–M extended gives E_N.</text><text x="4.0" y="240.8" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">4. Δ1 on line S–R1, Δ2 on line E_N–F1;</text><text x="4.0" y="258.8" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">    check: Δ1, F2, Δ2 are collinear.</text><text x="4.0" y="276.8" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">5. Step from R1 with Δ1 (tie line, then</text><text x="4.0" y="294.8" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">    op line), switch to Δ2 after F2 stage.</text></svg>