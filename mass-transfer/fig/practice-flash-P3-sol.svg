<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" height="270" font-family="Helvetica, Arial, sans-serif"><title>Cascade of two flash drums: vapor from drum 1 is partially condensed and flashed in drum 2</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs><text x="58.0" y="98.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="normal">F = 1000 kmol/h</text><text x="58.0" y="115.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="normal">z = 0.55</text><line x1="10.0" y1="128.0" x2="118.0" y2="128.0" stroke="#1E2B3A" stroke-width="1.8" marker-end="url(#ar)"/><rect x="118.0" y="70.0" width="74.0" height="120.0" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.8" rx="18.5"/><rect x="119.0" y="151.6" width="72.0" height="37.4" fill="#DCEFF2" stroke="none" stroke-width="0" rx="6"/><line x1="120.0" y1="151.6" x2="190.0" y2="151.6" stroke="#0B7C8C" stroke-width="1.2" stroke-dasharray="4 3"/><text x="155.0" y="124.0" font-size="13" fill="#1E2B3A" text-anchor="middle" font-weight="bold">1</text><text x="155.0" y="212.0" font-size="11" fill="#55667D" text-anchor="middle" font-weight="normal">p = 1 atm, adiabatic</text><polyline points="155.0,190.0 155.0,240.0 250.0,240.0" fill="none" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar)"/><text x="258.0" y="244.0" font-size="12" fill="#1E2B3A" text-anchor="start" font-weight="normal">L₁, x₁ = 0.30</text><polyline points="155.0,70.0 155.0,40.0 300.0,40.0" fill="none" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round"/><text x="228.0" y="32.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="normal">V₁, y₁</text><circle cx="318.0" cy="40.0" r="16" fill="#FFFFFF" stroke="#0B7C8C" stroke-width="1.6"/><line x1="306.0" y1="52.0" x2="330.0" y2="28.0" stroke="#0B7C8C" stroke-width="1.6"/><text x="318.0" y="74.0" font-size="11" fill="#55667D" text-anchor="middle" font-weight="normal">cooler</text><text x="318.0" y="88.0" font-size="10" fill="#55667D" text-anchor="middle" font-weight="normal">(partial condenser)</text><polyline points="334.0,40.0 400.0,40.0 400.0,128.0 437.0,128.0" fill="none" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar)"/><text x="392.0" y="120.0" font-size="11" fill="#1E2B3A" text-anchor="end" font-weight="normal">F₂ = V₁, z₂ = y₁</text><rect x="439.0" y="70.0" width="74.0" height="120.0" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.8" rx="18.5"/><rect x="440.0" y="151.6" width="72.0" height="37.4" fill="#DCEFF2" stroke="none" stroke-width="0" rx="6"/><line x1="441.0" y1="151.6" x2="511.0" y2="151.6" stroke="#0B7C8C" stroke-width="1.2" stroke-dasharray="4 3"/><text x="476.0" y="124.0" font-size="13" fill="#1E2B3A" text-anchor="middle" font-weight="bold">2</text><polyline points="476.0,70.0 476.0,40.0 560.0,40.0" fill="none" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar)"/><text x="568.0" y="44.0" font-size="12" fill="#1E2B3A" text-anchor="start" font-weight="normal">V₂, y₂</text><text x="520.0" y="100.0" font-size="12" fill="#1E2B3A" text-anchor="start" font-weight="normal">(V/F)₂ = 0.25</text><text x="520.0" y="118.0" font-size="11" fill="#55667D" text-anchor="start" font-weight="normal">p = 1 atm</text><polyline points="476.0,190.0 476.0,225.0 560.0,225.0" fill="none" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar)"/><text x="568.0" y="229.0" font-size="12" fill="#1E2B3A" text-anchor="start" font-weight="normal">L₂, x₂</text></svg>