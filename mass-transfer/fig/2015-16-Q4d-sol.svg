<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" width="660" height="460" font-family="Helvetica, Arial, sans-serif"><title>Pressure heads on a sieve tray and downcomer</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker></defs><rect x="40" y="50" width="600" height="10" fill="#E3E8EF" stroke="#1E2B3A" stroke-width="1.5" rx="0"/><text x="400" y="42" font-size="12" text-anchor="middle" fill="#55667D" font-weight="normal">tray n − 1 (above)</text><rect x="40" y="330" width="600" height="10" fill="#E3E8EF" stroke="#1E2B3A" stroke-width="1.5" rx="0"/><text x="105" y="358" font-size="12" text-anchor="middle" fill="#55667D" font-weight="normal">tray n (perforated deck)</text><line x1="170" y1="60" x2="170" y2="312" stroke="#1E2B3A" stroke-width="2.5"/><rect x="42" y="150" width="126" height="180" fill="#0B7C8C" fill-opacity="0.25"/><line x1="42" y1="150" x2="168" y2="150" stroke="#0B7C8C" stroke-width="1.5" stroke-dasharray="4 3"/><text x="105" y="140" font-size="11" text-anchor="middle" fill="#0B7C8C" font-weight="normal">liquid level in downcomer</text><text x="105" y="250" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">downcomer</text><rect x="172" y="285" width="368" height="45" fill="#0B7C8C" fill-opacity="0.25"/><line x1="540" y1="330" x2="540" y2="290" stroke="#1E2B3A" stroke-width="3"/><text x="535" y="280" font-size="11" text-anchor="end" fill="#1E2B3A" font-weight="normal">outlet weir</text><path d="M515,285 Q545,262 575,282" fill="none" stroke="#0B7C8C" stroke-width="1.6"/><line x1="210" y1="380" x2="210" y2="342" stroke="#D2552B" stroke-width="1.5" marker-end="url(#ar)"/><line x1="255" y1="380" x2="255" y2="342" stroke="#D2552B" stroke-width="1.5" marker-end="url(#ar)"/><line x1="300" y1="380" x2="300" y2="342" stroke="#D2552B" stroke-width="1.5" marker-end="url(#ar)"/><line x1="345" y1="380" x2="345" y2="342" stroke="#D2552B" stroke-width="1.5" marker-end="url(#ar)"/><line x1="390" y1="380" x2="390" y2="342" stroke="#D2552B" stroke-width="1.5" marker-end="url(#ar)"/><line x1="435" y1="380" x2="435" y2="342" stroke="#D2552B" stroke-width="1.5" marker-end="url(#ar)"/><line x1="480" y1="380" x2="480" y2="342" stroke="#D2552B" stroke-width="1.5" marker-end="url(#ar)"/><text x="360" y="396" font-size="11" text-anchor="middle" fill="#D2552B" font-weight="normal">vapor rises through the holes (dry-tray head h_Δp,dry)</text><line x1="565" y1="330" x2="565" y2="290" stroke="#B7840A" stroke-width="1.4" marker-end="url(#ar)"/><line x1="565" y1="290" x2="565" y2="330" stroke="#B7840A" stroke-width="1.4" marker-end="url(#ar)"/><text x="571" y="314.0" font-size="12" text-anchor="start" fill="#B7840A" font-weight="bold">h_weir</text><line x1="565" y1="290" x2="565" y2="268" stroke="#B7840A" stroke-width="1.4" marker-end="url(#ar)"/><line x1="565" y1="268" x2="565" y2="290" stroke="#B7840A" stroke-width="1.4" marker-end="url(#ar)"/><text x="571" y="283.0" font-size="12" text-anchor="start" fill="#B7840A" font-weight="bold">h_crest</text><line x1="200" y1="330" x2="200" y2="285" stroke="#B7840A" stroke-width="1.4" marker-end="url(#ar)"/><line x1="200" y1="285" x2="200" y2="330" stroke="#B7840A" stroke-width="1.4" marker-end="url(#ar)"/><text x="206" y="311.5" font-size="12" text-anchor="start" fill="#B7840A" font-weight="bold">tray liquid (clear)</text><line x1="170" y1="312" x2="172" y2="312" stroke="#1E2B3A" stroke-width="1"/><text x="178" y="322" font-size="1" text-anchor="middle" fill="#1E2B3A" font-weight="normal"></text><line x1="150" y1="330" x2="150" y2="312" stroke="#6A4FC9" stroke-width="1.4" marker-end="url(#ar)"/><line x1="150" y1="312" x2="150" y2="330" stroke="#6A4FC9" stroke-width="1.4" marker-end="url(#ar)"/><text x="142" y="325.0" font-size="12" text-anchor="end" fill="#6A4FC9" font-weight="bold">h_du</text><line x1="20" y1="330" x2="20" y2="150" stroke="#6A4FC9" stroke-width="1.4" marker-end="url(#ar)"/><line x1="20" y1="150" x2="20" y2="330" stroke="#6A4FC9" stroke-width="1.4" marker-end="url(#ar)"/><text x="26" y="244.0" font-size="12" text-anchor="start" fill="#6A4FC9" font-weight="bold">h_dc</text><text x="330" y="425" font-size="13" text-anchor="middle" fill="#1E2B3A" font-weight="bold">h_dc = h_Δp,dry + h_weir + h_crest + h_grad + h_du   (Wankat Eq. 10-23)</text><text x="330" y="445" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">h_du: loss under the downcomer apron (gap ≈ 1 in) · h_grad: liquid gradient (≈ 0 on sieve trays) · need h_dc/φ_dc &lt; tray spacing</text></svg>