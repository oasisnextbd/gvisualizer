<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 295" width="660" height="295" font-family="Helvetica, Arial, sans-serif"><title>Downcomer and weir designs</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker></defs><rect x="20" y="40" width="140" height="190" fill="none" stroke="#1E2B3A" stroke-width="1.6" rx="0"/><rect x="20" y="90" width="140" height="6" fill="#E3E8EF" stroke="#1E2B3A" stroke-width="1.2" rx="0"/><rect x="20" y="170" width="140" height="6" fill="#E3E8EF" stroke="#1E2B3A" stroke-width="1.2" rx="0"/><text x="90.0" y="250" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">(i) circular pipe</text><rect x="80" y="96" width="14" height="70" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.6" rx="0"/><rect x="80" y="80" width="14" height="16" fill="none" stroke="#1E2B3A" stroke-width="1.2" rx="0"/><text x="90.0" y="30" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">pipe also acts as weir</text><line x1="140" y1="80" x2="60" y2="80" stroke="#0B7C8C" stroke-width="1.4" marker-end="url(#ar)"/><rect x="178" y="40" width="140" height="190" fill="none" stroke="#1E2B3A" stroke-width="1.6" rx="0"/><rect x="178" y="90" width="140" height="6" fill="#E3E8EF" stroke="#1E2B3A" stroke-width="1.2" rx="0"/><rect x="178" y="170" width="140" height="6" fill="#E3E8EF" stroke="#1E2B3A" stroke-width="1.2" rx="0"/><text x="248.0" y="250" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">(ii) straight segmental</text><line x1="206" y1="96" x2="206" y2="160" stroke="#1E2B3A" stroke-width="2.4"/><line x1="290" y1="170" x2="290" y2="150" stroke="#1E2B3A" stroke-width="2.4"/><rect x="179" y="120" width="26" height="40" fill="#0B7C8C" fill-opacity="0.3"/><text x="248.0" y="30" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">vertical wall + weir</text><line x1="298" y1="80" x2="218" y2="80" stroke="#0B7C8C" stroke-width="1.4" marker-end="url(#ar)"/><rect x="336" y="40" width="140" height="190" fill="none" stroke="#1E2B3A" stroke-width="1.6" rx="0"/><rect x="336" y="90" width="140" height="6" fill="#E3E8EF" stroke="#1E2B3A" stroke-width="1.2" rx="0"/><rect x="336" y="170" width="140" height="6" fill="#E3E8EF" stroke="#1E2B3A" stroke-width="1.2" rx="0"/><text x="406.0" y="250" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">(iii) sloped segmental</text><path d="M370,96 L352,160" fill="none" stroke="#1E2B3A" stroke-width="2.4"/><line x1="448" y1="170" x2="448" y2="150" stroke="#1E2B3A" stroke-width="2.4"/><path d="M337,120 L364,120 L353,160 L337,160 z" fill="#0B7C8C" fill-opacity="0.3"/><text x="406.0" y="30" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">more active area below</text><line x1="456" y1="80" x2="376" y2="80" stroke="#0B7C8C" stroke-width="1.4" marker-end="url(#ar)"/><rect x="494" y="40" width="140" height="190" fill="none" stroke="#1E2B3A" stroke-width="1.6" rx="0"/><rect x="494" y="90" width="140" height="6" fill="#E3E8EF" stroke="#1E2B3A" stroke-width="1.2" rx="0"/><rect x="494" y="170" width="140" height="6" fill="#E3E8EF" stroke="#1E2B3A" stroke-width="1.2" rx="0"/><text x="564.0" y="250" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">(iv) envelope</text><path d="M524,96 L524,140 L506,140 L506,164" fill="none" stroke="#1E2B3A" stroke-width="2.2"/><rect x="506" y="140" width="18" height="24" fill="#0B7C8C" fill-opacity="0.3"/><line x1="606" y1="170" x2="606" y2="155" stroke="#1E2B3A" stroke-width="2.4"/><text x="564.0" y="30" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">for very low liquid rates</text><line x1="614" y1="80" x2="534" y2="80" stroke="#0B7C8C" stroke-width="1.4" marker-end="url(#ar)"/><text x="330" y="280" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">Liquid flows across each tray (arrow), over the outlet weir and down the downcomer to the tray below.</text></svg>