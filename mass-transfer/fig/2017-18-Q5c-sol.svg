<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 445" width="660" height="445" font-family="Helvetica, Arial, sans-serif"><title>Murphree efficiency model on a cross-flow tray</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="330" y="26" font-size="15" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Murphree efficiency model: cross-flow tray (Wankat Fig. 10-12 idea)</text><polyline points="60,250 600,250" fill="none" stroke="#1E2B3A" stroke-width="3"/><polyline points="560,250 560,170" fill="none" stroke="#1E2B3A" stroke-width="3"/><text x="572" y="165" font-size="11" text-anchor="start" fill="#55667D" font-weight="normal">outlet weir</text><polyline points="100,80 100,215" fill="none" stroke="#1E2B3A" stroke-width="2.4"/><text x="108" y="95" font-size="11" text-anchor="start" fill="#55667D" font-weight="normal">downcomer from tray above</text><path d="M62,250 L62,205 Q200,190 330,205 Q450,215 558,200 L558,250 Z" fill="#D7EEF1" stroke="none"/><polyline points="110,228 540,228" fill="none" stroke="#0B7C8C" stroke-width="2.4" marker-end="url(#ac)"/><text x="330" y="222" font-size="12" text-anchor="middle" fill="#0B7C8C" font-weight="normal">liquid flows across the tray, losing light component</text><text x="150" y="246" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">x₁</text><polyline points="150,330 150,262" fill="none" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="150,195 150,120" fill="none" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ah)"/><text x="250" y="246" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">x₂</text><polyline points="250,330 250,262" fill="none" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="250,195 250,120" fill="none" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ah)"/><text x="350" y="246" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">x₃</text><polyline points="350,330 350,262" fill="none" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="350,195 350,120" fill="none" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ah)"/><text x="450" y="246" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">x₄</text><polyline points="450,330 450,262" fill="none" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="450,195 450,120" fill="none" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ah)"/><text x="545" y="246" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">x_out</text><polyline points="545,330 545,262" fill="none" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="545,195 545,120" fill="none" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ah)"/><text x="330" y="350" font-size="12" text-anchor="middle" fill="#D2552B" font-weight="normal">vapor in, y_in (well mixed below the tray)</text><text x="330" y="110" font-size="12" text-anchor="middle" fill="#D2552B" font-weight="normal">vapor out: average y_out (well mixed above the tray)</text><polyline points="560,252 600,252 600,330" fill="none" stroke="#0B7C8C" stroke-width="2" marker-end="url(#ac)"/><text x="608" y="320" font-size="12" text-anchor="start" fill="#0B7C8C" font-weight="bold">x_out</text><text x="330" y="385" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">x₁ &gt; x₂ &gt; x₃ &gt; x₄ &gt; x_out, so vapor rising near the inlet meets richer liquid.</text><text x="330" y="405" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">y*_out is in equilibrium with x_out, the LEANEST liquid on the tray;</text><text x="330" y="425" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">average y_out can exceed y*_out  ⇒  E_MV = (y_out − y_in)/(y*_out − y_in) &gt; 1.</text></svg>