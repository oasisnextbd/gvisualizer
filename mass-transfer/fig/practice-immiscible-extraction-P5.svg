<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" font-family="Helvetica, Arial, sans-serif">
<title>Temperature-swing extraction: column at 40 C extracts acid into benzene, column at 25 C returns it to water</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker></defs>
<rect x="150" y="80" width="70" height="230" fill="#FBEAE3" stroke="#1E2B3A" stroke-width="2"/>
<rect x="420" y="80" width="70" height="230" fill="#E3F1F3" stroke="#1E2B3A" stroke-width="2"/>
<text x="185" y="200" font-size="15" text-anchor="middle" fill="#D2552B" font-weight="bold">40 °C</text>
<text x="185" y="222" font-size="13" text-anchor="middle" fill="#1E2B3A">N = 11</text>
<text x="455" y="200" font-size="15" text-anchor="middle" fill="#0B7C8C" font-weight="bold">25 °C</text>
<text x="455" y="222" font-size="13" text-anchor="middle" fill="#1E2B3A">N = 9</text>
<text x="185" y="392" font-size="12" text-anchor="middle" fill="#55667D">column 1 (extractor)</text>
<text x="455" y="392" font-size="12" text-anchor="middle" fill="#55667D">column 2 (back-extractor)</text>
<path d="M20,100 L148,100" stroke="#1E2B3A" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text x="20" y="88" font-size="12" fill="#1E2B3A">feed R = 100 kg/h</text>
<text x="20" y="118" font-size="12" fill="#1E2B3A">x0 = 0.01</text>
<path d="M150,295 L20,295" stroke="#1E2B3A" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text x="20" y="285" font-size="12" fill="#1E2B3A">xN = 0.0008</text>
<path d="M205,80 L205,40 L330,40 L330,330 L470,330 L470,312" stroke="#D2552B" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text x="215" y="34" font-size="12" fill="#D2552B">benzene, y1 (to column 2 bottom)</text>
<circle cx="330" cy="180" r="9" fill="#FFFFFF" stroke="#D2552B" stroke-width="1.6"/><line x1="324" y1="186" x2="336" y2="174" stroke="#D2552B" stroke-width="1.6"/>
<text x="342" y="176" font-size="11" fill="#55667D">cool</text>
<path d="M440,80 L440,55 L360,55 L360,350 L200,350 L200,312" stroke="#0B7C8C" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text x="372" y="48" font-size="12" fill="#0B7C8C">benzene, yN+1 (back to column 1)</text>
<circle cx="360" cy="250" r="9" fill="#FFFFFF" stroke="#0B7C8C" stroke-width="1.6"/><line x1="354" y1="256" x2="366" y2="244" stroke="#0B7C8C" stroke-width="1.6"/>
<text x="372" y="254" font-size="11" fill="#55667D">heat</text>
<text x="215" y="370" font-size="12" fill="#1E2B3A">benzene phase E = 1000 kg/h recirculates</text>
<path d="M680,100 L492,100" stroke="#1E2B3A" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text x="505" y="88" font-size="12" fill="#1E2B3A">pure water R′, x′0 = 0</text>
<path d="M490,295 L680,295" stroke="#1E2B3A" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text x="505" y="285" font-size="12" fill="#1E2B3A">acid-rich water x′N</text>
</svg>
