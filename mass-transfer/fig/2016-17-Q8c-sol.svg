<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500" width="660" height="500" font-family="Helvetica, Arial, sans-serif"><title>Countercurrent leaching cascade and McCabe-Thiele diagram</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker></defs><rect x="100" y="50" width="80" height="60" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="2" rx="0"/><text x="140" y="86" font-size="15" text-anchor="middle" fill="#1E2B3A" font-weight="bold">1</text><rect x="260" y="50" width="80" height="60" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="2" rx="0"/><text x="300" y="86" font-size="15" text-anchor="middle" fill="#1E2B3A" font-weight="bold">j</text><rect x="420" y="50" width="80" height="60" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="2" rx="0"/><text x="460" y="86" font-size="15" text-anchor="middle" fill="#1E2B3A" font-weight="bold">N</text><line x1="40" y1="95" x2="98" y2="95" stroke="#1E2B3A" stroke-width="1.8" marker-end="url(#ar)"/><text x="45" y="128" font-size="11" text-anchor="start" fill="#1E2B3A" font-weight="normal">F_solid, X₀ (feed solids)</text><line x1="182" y1="95" x2="258" y2="95" stroke="#1E2B3A" stroke-width="1.8" marker-end="url(#ar)"/><line x1="342" y1="95" x2="418" y2="95" stroke="#1E2B3A" stroke-width="1.8" marker-end="url(#ar)"/><line x1="502" y1="95" x2="600" y2="95" stroke="#1E2B3A" stroke-width="1.8" marker-end="url(#ar)"/><text x="600" y="128" font-size="11" text-anchor="end" fill="#1E2B3A" font-weight="normal">F_solid, X_N</text><line x1="620" y1="65" x2="502" y2="65" stroke="#0B7C8C" stroke-width="1.8" marker-end="url(#ar)"/><text x="615" y="45" font-size="11" text-anchor="end" fill="#0B7C8C" font-weight="normal">F_solv, Y_N+1 (fresh solvent)</text><line x1="418" y1="65" x2="342" y2="65" stroke="#0B7C8C" stroke-width="1.8" marker-end="url(#ar)"/><line x1="258" y1="65" x2="182" y2="65" stroke="#0B7C8C" stroke-width="1.8" marker-end="url(#ar)"/><line x1="98" y1="65" x2="30" y2="65" stroke="#0B7C8C" stroke-width="1.8" marker-end="url(#ar)"/><text x="32" y="45" font-size="11" text-anchor="start" fill="#0B7C8C" font-weight="normal">F_solv, Y₁ (extract)</text><line x1="90" y1="430" x2="90" y2="170" stroke="#1E2B3A" stroke-width="1.5" marker-end="url(#ar)"/><line x1="90" y1="430" x2="580" y2="430" stroke="#1E2B3A" stroke-width="1.5" marker-end="url(#ar)"/><text x="330.0" y="462" font-size="12" text-anchor="middle" fill="#55667D" font-weight="normal">X, kg solute / kg insoluble solid</text><text x="60" y="305.0" font-size="12" text-anchor="middle" fill="#55667D" font-weight="normal" transform="rotate(-90 60 305.0)">Y, kg solute / kg solvent</text><line x1="90" y1="430" x2="570" y2="166.0" stroke="#1E2B3A" stroke-width="2.2"/><text x="566" y="158.0" font-size="11" text-anchor="end" fill="#1E2B3A" font-weight="normal">equilibrium Y = m X (effective m_E)</text><line x1="130" y1="430.0" x2="530" y2="262.0" stroke="#D2552B" stroke-width="2.2"/><text x="390" y="350.8" font-size="11" text-anchor="start" fill="#D2552B" font-weight="normal">operating line, slope F_solid/F_solv</text><path d="M530.0,262.0 L395.5,262.0 L395.5,318.5 L292.7,318.5 L292.7,361.7 L214.3,361.7 L214.3,394.6 L154.3,394.6 L154.3,419.8 L108.6,419.8" fill="none" stroke="#0B7C8C" stroke-width="1.8"/><text x="390.45454545454544" y="257.0" font-size="11" text-anchor="end" fill="#0B7C8C" font-weight="bold">1</text><text x="287.7107438016528" y="313.5090909090909" font-size="11" text-anchor="end" fill="#0B7C8C" font-weight="bold">2</text><text x="209.25184072126217" y="356.6614876033058" font-size="11" text-anchor="end" fill="#0B7C8C" font-weight="bold">3</text><text x="149.33776927805474" y="389.6142268970699" font-size="11" text-anchor="end" fill="#0B7C8C" font-weight="bold">4</text><text x="103.58520563051452" y="414.778136903217" font-size="11" text-anchor="end" fill="#0B7C8C" font-weight="bold">5</text><text x="530" y="444" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="normal">X₀</text><text x="130" y="444" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="normal">X_N</text><text x="84" y="266.0" font-size="11" text-anchor="end" fill="#1E2B3A" font-weight="normal">Y₁</text><line x1="90" y1="262.0" x2="530" y2="262.0" stroke="#9AA8B8" stroke-width="1" stroke-dasharray="3 3"/><text x="330" y="486" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Y_j+1 = (F_solid/F_solv) X_j + Y₁ − (F_solid/F_solv) X₀ ; stepping starts at (X₀, Y₁)</text></svg>