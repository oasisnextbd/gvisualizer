<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="Helvetica, Arial, sans-serif"><title>Three types of liquid–liquid ternary systems</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><polygon points="12.0,255.0 217.0,255.0 114.5,77.5" fill="none" stroke="#1E2B3A" stroke-width="1.5" stroke-linejoin="round"/><text x="114.5" y="77.5" font-size="11" fill="#1E2B3A" text-anchor="middle" font-weight="normal"></text><text x="114.5" y="71.5" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">A</text><text x="16.0" y="270.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">B</text><text x="213.0" y="270.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">S</text><text x="114.5" y="288.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">Type I: one pair (B–S) partially miscible</text><path d="M18.1,255.0 C22.9,247.9 27.7,240.4 32.5,233.7 C38.3,225.6 44.1,217.4 49.9,210.6 C56.7,202.6 63.6,195.3 70.4,189.3 C78.9,181.8 87.5,174.9 96.0,169.8 C101.8,166.3 107.7,160.9 113.5,160.9 C117.3,160.9 121.0,166.6 124.8,169.8 C132.0,175.8 139.1,182.4 146.3,189.3 C153.1,195.9 160.0,203.4 166.8,210.6 C174.0,218.2 181.1,226.1 188.3,233.7 C195.1,240.9 202.0,247.9 208.8,255.0"  fill="#EEF5F7" stroke="#1E2B3A" stroke-width="2.2" stroke-linejoin="round"/><line x1="32.5" y1="233.7" x2="188.3" y2="233.7" stroke="#0B7C8C" stroke-width="1.3"/><line x1="49.9" y1="210.6" x2="166.8" y2="210.6" stroke="#0B7C8C" stroke-width="1.3"/><line x1="70.4" y1="189.3" x2="146.3" y2="189.3" stroke="#0B7C8C" stroke-width="1.3"/><line x1="96.0" y1="169.8" x2="124.8" y2="169.8" stroke="#0B7C8C" stroke-width="1.3"/><path d="M100.2,244.3 C101.5,237.2 102.9,230.0 104.2,223.0 C105.6,215.8 106.9,211.4 108.3,201.7 C109.0,196.7 109.7,185.9 110.4,180.4 C111.4,172.3 112.5,167.4 113.5,160.9"  fill="none" stroke="#6A4FC9" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 3"/><circle cx="113.5" cy="160.9" r="3.5" fill="#B7840A"/><text x="119.5" y="154.9" font-size="10" fill="#B7840A" text-anchor="start" font-weight="bold">P plait point</text><line x1="108.3" y1="201.7" x2="46.3" y2="161.7" stroke="#6A4FC9" stroke-width="0.8"/><text x="44.3" y="157.7" font-size="10" fill="#6A4FC9" text-anchor="middle" font-weight="normal">conjugate line</text><text x="118.6" y="249.9" font-size="10" fill="#55667D" text-anchor="middle" font-weight="normal">2 phases</text><text x="110.4" y="127.2" font-size="10" fill="#55667D" text-anchor="middle" font-weight="normal">1 phase</text><polygon points="250.0,255.0 455.0,255.0 352.5,77.5" fill="none" stroke="#1E2B3A" stroke-width="1.5" stroke-linejoin="round"/><text x="352.5" y="77.5" font-size="11" fill="#1E2B3A" text-anchor="middle" font-weight="normal"></text><text x="352.5" y="71.5" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">A</text><text x="254.0" y="270.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">B</text><text x="451.0" y="270.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">S</text><text x="352.5" y="288.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">Type II: two pairs partially miscible</text><polygon points="260.2,255.0 295.1,219.5 332.0,184.0 366.9,148.5 381.2,127.2 434.5,219.5 435.5,228.4 436.6,237.2 439.6,246.1 444.8,255.0" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="2.2" stroke-linejoin="round"/><line x1="295.1" y1="219.5" x2="439.6" y2="246.1" stroke="#0B7C8C" stroke-width="1.3"/><line x1="332.0" y1="184.0" x2="436.6" y2="237.2" stroke="#0B7C8C" stroke-width="1.3"/><line x1="366.9" y1="148.5" x2="435.5" y2="228.4" stroke="#0B7C8C" stroke-width="1.3"/><line x1="381.2" y1="127.2" x2="434.5" y2="219.5" stroke="#0B7C8C" stroke-width="1.3"/><text x="378.1" y="210.6" font-size="10" fill="#55667D" text-anchor="middle" font-weight="normal">2-phase band</text><text x="352.5" y="302.0" font-size="10" fill="#55667D" text-anchor="middle" font-weight="normal">no plait point</text><polygon points="488.0,255.0 693.0,255.0 590.5,77.5" fill="none" stroke="#1E2B3A" stroke-width="1.5" stroke-linejoin="round"/><text x="590.5" y="77.5" font-size="11" fill="#1E2B3A" text-anchor="middle" font-weight="normal"></text><text x="590.5" y="71.5" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">A</text><text x="492.0" y="270.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">B</text><text x="689.0" y="270.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">S</text><text x="590.5" y="288.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">B and S completely immiscible</text><line x1="488.0" y1="255.0" x2="590.5" y2="77.5" stroke="#1E2B3A" stroke-width="3.2"/><line x1="693.0" y1="255.0" x2="590.5" y2="77.5" stroke="#1E2B3A" stroke-width="3.2"/><line x1="498.2" y1="237.2" x2="674.6" y2="223.0" stroke="#0B7C8C" stroke-width="1.3"/><line x1="508.5" y1="219.5" x2="659.2" y2="196.4" stroke="#0B7C8C" stroke-width="1.3"/><line x1="518.8" y1="201.7" x2="645.9" y2="173.3" stroke="#0B7C8C" stroke-width="1.3"/><line x1="529.0" y1="184.0" x2="634.6" y2="153.8" stroke="#0B7C8C" stroke-width="1.3"/><text x="595.6" y="228.4" font-size="10" fill="#55667D" text-anchor="middle" font-weight="normal">2 phases everywhere</text><text x="590.5" y="302.0" font-size="10" fill="#55667D" text-anchor="middle" font-weight="normal">raffinate on A–B edge, extract on A–S edge</text><text x="360.0" y="322.0" font-size="11" fill="#55667D" text-anchor="middle" font-weight="normal">A = solute, B = diluent, S = solvent. Blue = tie lines; shaded = two-phase region inside the binodal (equilibrium envelope)</text></svg>