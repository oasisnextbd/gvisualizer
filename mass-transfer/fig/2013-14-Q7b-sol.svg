<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" font-family="Helvetica, Arial, sans-serif"><title>Tray operating regimes and stable operating window</title><defs><marker id="ar1E2B3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="ar55667D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="arD2552B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="ar0B7C8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arB7840A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="ar6A4FC9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4FC9"/></marker><marker id="ar9AA8B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="350" y="24" font-size="14" fill="#1E2B3A" text-anchor="middle" font-weight="bold">Flow regimes on a tray and the stable operating window (sieve tray)</text><line x1="60.0" y1="380.0" x2="60.0" y2="60.0" stroke="#1E2B3A" stroke-width="2" marker-end="url(#ar1E2B3A)"/><text x="40" y="220" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="normal" transform="rotate(-90 40 220)">vapor velocity increases</text><rect x="75" y="320" width="170" height="58" rx="6" fill="none" stroke="#55667D" stroke-width="1.8"/><text x="160" y="342" font-size="13" fill="#55667D" text-anchor="middle" font-weight="bold">bubble regime</text><text x="160" y="362" font-size="11" fill="#55667D" text-anchor="middle" font-weight="normal">stagnant pool, low E</text><rect x="75" y="240" width="170" height="58" rx="6" fill="none" stroke="#B7840A" stroke-width="1.8"/><text x="160" y="262" font-size="13" fill="#B7840A" text-anchor="middle" font-weight="bold">foam regime</text><text x="160" y="282" font-size="11" fill="#55667D" text-anchor="middle" font-weight="normal">large area; may flood</text><rect x="75" y="160" width="170" height="58" rx="6" fill="none" stroke="#0B7C8C" stroke-width="1.8"/><text x="160" y="182" font-size="13" fill="#0B7C8C" text-anchor="middle" font-weight="bold">froth regime</text><text x="160" y="202" font-size="11" fill="#55667D" text-anchor="middle" font-weight="normal">normal design regime</text><rect x="75" y="80" width="170" height="58" rx="6" fill="none" stroke="#D2552B" stroke-width="1.8"/><text x="160" y="102" font-size="13" fill="#D2552B" text-anchor="middle" font-weight="bold">spray regime</text><text x="160" y="122" font-size="11" fill="#55667D" text-anchor="middle" font-weight="normal">gas continuous, low E</text><line x1="330.0" y1="370.0" x2="670.0" y2="370.0" stroke="#1E2B3A" stroke-width="2" marker-end="url(#ar1E2B3A)"/><line x1="330.0" y1="370.0" x2="330.0" y2="60.0" stroke="#1E2B3A" stroke-width="2" marker-end="url(#ar1E2B3A)"/><text x="500.0" y="400" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="normal">liquid flow rate</text><text x="285" y="215.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="normal" transform="rotate(-90 285 215.0)">vapor flow rate</text><path d="M 360 300 Q 470 280 600 250 L 610 150 Q 520 115 380 120 Z" fill="#0B7C8C" fill-opacity="0.13" stroke="none"/><path d="M 380 120 Q 520 115 610 150" fill="none" stroke="#D2552B" stroke-width="2.4"/><text x="470" y="100" font-size="12" fill="#D2552B" text-anchor="middle" font-weight="normal">entrainment / jet flooding</text><line x1="610.0" y1="150.0" x2="600.0" y2="250.0" stroke="#6A4FC9" stroke-width="2.4"/><text x="625" y="205" font-size="11" fill="#6A4FC9" text-anchor="start" font-weight="normal">downcomer</text><text x="625" y="219" font-size="11" fill="#6A4FC9" text-anchor="start" font-weight="normal">flooding</text><path d="M 360 300 Q 470 280 600 250" fill="none" stroke="#B7840A" stroke-width="2.4"/><text x="470" y="320" font-size="12" fill="#B7840A" text-anchor="middle" font-weight="normal">weeping (dumping further below)</text><line x1="380.0" y1="120.0" x2="360.0" y2="300.0" stroke="#55667D" stroke-width="2" stroke-dasharray="5 4"/><text x="340" y="215" font-size="11" fill="#55667D" text-anchor="end" font-weight="normal">coning /</text><text x="340" y="229" font-size="11" fill="#55667D" text-anchor="end" font-weight="normal">excess.</text><text x="340" y="243" font-size="11" fill="#55667D" text-anchor="end" font-weight="normal">entrain.</text><text x="490" y="205" font-size="13" fill="#0B7C8C" text-anchor="middle" font-weight="bold">stable operation</text><text x="490" y="222" font-size="11" fill="#0B7C8C" text-anchor="middle" font-weight="normal">(froth regime)</text></svg>