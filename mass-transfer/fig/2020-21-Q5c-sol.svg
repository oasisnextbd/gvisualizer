<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" width="680" height="370" font-family="Helvetica, Arial, sans-serif">
<title>Basic flash distillation system</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker></defs>
<text x="340" y="26" font-size="15" font-weight="bold" text-anchor="middle" fill="#1E2B3A">Flash system: pump → heater → valve → drum</text>
<line x1="20" y1="200" x2="88" y2="200" stroke="#1E2B3A" stroke-width="2" marker-end="url(#ar)"/>
<text x="20" y="185" font-size="12" fill="#1E2B3A">Feed F, z</text><text x="20" y="222" font-size="12" fill="#55667D">T₁, p₁ (liquid)</text>
<circle cx="110" cy="200" r="20" fill="none" stroke="#1E2B3A" stroke-width="2"/><path d="M98,190 L126,200 L98,210" fill="none" stroke="#1E2B3A" stroke-width="1.5"/>
<text x="110" y="244" font-size="12" text-anchor="middle" fill="#1E2B3A">Pump</text><text x="110" y="290" font-size="11" text-anchor="middle" fill="#55667D">raises p</text><text x="110" y="304" font-size="11" text-anchor="middle" fill="#55667D">above p_drum</text>
<line x1="130" y1="200" x2="170" y2="200" stroke="#1E2B3A" stroke-width="2"/>
<path d="M170,200 q8,-22 16,0 q8,22 16,0 q8,-22 16,0 q8,22 16,0 q8,-22 16,0 q8,22 16,0" fill="none" stroke="#D2552B" stroke-width="2.4"/>
<text x="218" y="244" font-size="12" text-anchor="middle" fill="#D2552B">Heater, Q_H</text><text x="218" y="260" font-size="11" text-anchor="middle" fill="#55667D">liquid heated,</text><text x="218" y="274" font-size="11" text-anchor="middle" fill="#55667D">stays liquid</text>
<line x1="266" y1="200" x2="320" y2="200" stroke="#1E2B3A" stroke-width="2"/>
<text x="290" y="186" font-size="11" text-anchor="middle" fill="#55667D">T_F, p_F, h_F</text>
<path d="M320,190 L344,210 L344,190 L320,210 z" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="2"/>
<text x="332" y="244" font-size="12" text-anchor="middle" fill="#1E2B3A">Valve</text><text x="345" y="290" font-size="11" text-anchor="middle" fill="#55667D">isenthalpic p drop:</text><text x="345" y="304" font-size="11" text-anchor="middle" fill="#55667D">part of liquid flashes</text>
<line x1="344" y1="200" x2="440" y2="200" stroke="#1E2B3A" stroke-width="2" marker-end="url(#ar)"/>
<rect x="440" y="70" width="110" height="250" rx="40" fill="none" stroke="#1E2B3A" stroke-width="2.4"/>
<rect x="446" y="100" width="98" height="14" fill="#E3E8EF" stroke="#55667D"/><text x="560" y="112" font-size="11" fill="#55667D">demister</text>
<path d="M442,250 q27,-8 54,0 q27,8 52,0 L548,292 Q495,330 442,292 z" fill="#0B7C8C" fill-opacity="0.25" stroke="none"/>
<text x="495" y="185" font-size="12" text-anchor="middle" fill="#1E2B3A">T_drum, p_drum</text><text x="495" y="275" font-size="12" text-anchor="middle" fill="#0B7C8C">liquid pool</text>
<line x1="495" y1="70" x2="495" y2="44" stroke="#1E2B3A" stroke-width="2"/><line x1="495" y1="44" x2="610" y2="44" stroke="#1E2B3A" stroke-width="2" marker-end="url(#ar)"/>
<text x="618" y="48" font-size="12" fill="#D2552B">V, y</text>
<line x1="495" y1="320" x2="495" y2="340" stroke="#1E2B3A" stroke-width="2"/><line x1="495" y1="340" x2="610" y2="340" stroke="#1E2B3A" stroke-width="2" marker-end="url(#ar)"/>
<text x="618" y="344" font-size="12" fill="#0B7C8C">L, x</text>
<text x="20" y="342" font-size="12" fill="#B7840A">Heater supplies the enthalpy that the isenthalpic</text>
<text x="20" y="358" font-size="12" fill="#B7840A">valve turns into vaporization: h_F sets V/F.</text>
</svg>
