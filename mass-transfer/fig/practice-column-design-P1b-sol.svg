ke="#1E2B3A" stroke-width="2" marker-end="url(#ah)"/><text x="275" y="52" font-size="12" text-anchor="start" fill="#55667D" font-weight="normal">vapor to total condenser</text><text x="310" y="560" font-size="15" text-anchor="middle" fill="#1E2B3A" font-weight="bold">H = 11.5 + 1.2 + 2.0 = 14.7 m</text><text x="310" y="24" font-size="15" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Column height from the tray count (24 real trays)</text></svg>