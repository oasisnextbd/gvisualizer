<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="Helvetica, Arial, sans-serif"><title>Sieve, valve and bubble-cap tray openings</title><defs><marker id="ar1E2B3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="ar55667D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="arD2552B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="ar0B7C8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arB7840A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="ar6A4FC9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4FC9"/></marker><marker id="ar9AA8B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="360" y="24" font-size="14" fill="#1E2B3A" text-anchor="middle" font-weight="bold">How vapor passes through the deck: sieve, valve, bubble-cap</text><text x="130" y="58" font-size="13" fill="#0B7C8C" text-anchor="middle" font-weight="bold">Sieve tray</text><rect x="30" y="140" width="200" height="70" rx="0" fill="#E4F3F5" stroke="none" stroke-width="0"/><text x="130" y="152" font-size="10" fill="#0B7C8C" text-anchor="middle" font-weight="normal">liquid / froth</text><line x1="30.0" y1="210.0" x2="110.0" y2="210.0" stroke="#1E2B3A" stroke-width="4"/><line x1="150.0" y1="210.0" x2="230.0" y2="210.0" stroke="#1E2B3A" stroke-width="4"/><text x="130" y="272" font-size="10" fill="#D2552B" text-anchor="middle" font-weight="normal">vapor from tray below</text><line x1="130.0" y1="262.0" x2="130.0" y2="170.0" stroke="#D2552B" stroke-width="2.4" marker-end="url(#arD2552B)"/><text x="130" y="232" font-size="10" fill="#55667D" text-anchor="middle" font-weight="normal">hole</text><text x="130" y="92" font-size="11" fill="#55667D" text-anchor="middle" font-weight="normal">fixed holes (3–12 mm)</text><text x="130" y="108" font-size="11" fill="#55667D" text-anchor="middle" font-weight="normal">weeps at low vapor rate</text><text x="366" y="58" font-size="13" fill="#B7840A" text-anchor="middle" font-weight="bold">Valve tray</text><rect x="266" y="140" width="200" height="70" rx="0" fill="#E4F3F5" stroke="none" stroke-width="0"/><text x="366" y="152" font-size="10" fill="#0B7C8C" text-anchor="middle" font-weight="normal">liquid / froth</text><line x1="266.0" y1="210.0" x2="346.0" y2="210.0" stroke="#1E2B3A" stroke-width="4"/><line x1="386.0" y1="210.0" x2="466.0" y2="210.0" stroke="#1E2B3A" stroke-width="4"/><text x="366" y="272" font-size="10" fill="#D2552B" text-anchor="middle" font-weight="normal">vapor from tray below</text><rect x="336" y="182" width="60" height="8" rx="0" fill="#B7840A" stroke="#B7840A" stroke-width="1"/><line x1="344.0" y1="190.0" x2="344.0" y2="222.0" stroke="#B7840A" stroke-width="2"/><line x1="388.0" y1="190.0" x2="388.0" y2="222.0" stroke="#B7840A" stroke-width="2"/><line x1="366.0" y1="262.0" x2="366.0" y2="200.0" stroke="#D2552B" stroke-width="2.4"/><line x1="366.0" y1="200.0" x2="316.0" y2="170.0" stroke="#D2552B" stroke-width="2.2" marker-end="url(#arD2552B)"/><line x1="366.0" y1="200.0" x2="416.0" y2="170.0" stroke="#D2552B" stroke-width="2.2" marker-end="url(#arD2552B)"/><text x="366" y="92" font-size="11" fill="#55667D" text-anchor="middle" font-weight="norm