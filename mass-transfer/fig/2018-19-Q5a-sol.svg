<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480" font-family="Helvetica, Arial, sans-serif"><title>Flash distillation system</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="340" y="26" font-size="15" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Flash distillation system</text><polyline points="20,250 70,250" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="8" y="225" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">Feed F, z, T₁, p₁</text><circle cx="90" cy="250" r="20" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="2"/><polyline points="80,240 105,250 80,260" fill="none" stroke="#1E2B3A" stroke-width="2"/><text x="90" y="290" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">pump</text><text x="90" y="305" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">(raises p)</text><polyline points="110,250 160,250" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><rect x="160" y="225" width="90" height="50" rx="6" fill="#FBEDE7" stroke="#D2552B" stroke-width="2"/><polyline points="170,262 185,238 200,262 215,238 230,262 240,245" fill="none" stroke="#D2552B" stroke-width="1.6"/><text x="205" y="295" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">heater, Q_h</text><text x="205" y="310" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">(T rises, stays liquid)</text><polyline points="250,250 300,250" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="275" y="240" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">T_F, p_F</text><polygon points="300,238 300,262 324,250" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="2"/><polygon points="348,238 348,262 324,250" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="2"/><text x="324" y="290" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">valve</text><text x="324" y="305" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">(p drops, isenthalpic</text><text x="324" y="318" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">→ partial vaporization)</text><polyline points="348,250 420,250" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><rect x="420" y="80" width="130" height="300" rx="60" fill="#F3F6F9" stroke="#1E2B3A" stroke-width="2.2"/><rect x="440" y="112" width="90" height="18" fill="url(#m)" stroke="#55667D" stroke-width="1.4"/><polyline points="442,112 450,130" fill="none" stroke="#55667D" stroke-width="1"/><polyline points="450,112 458,130" fill="none" stroke="#55667D" stroke-width="1"/><polyline points="458,112 466,130" fill="none" stroke="#55667D" stroke-width="1"/><polyline points="466,112 474,130" fill="none" stroke="#55667D" stroke-width="1"/><polyline points="474,112 482,130" fill="none" stroke="#55667D" stroke-width="1"/><polyline points="482,112 490,130" fill="none" stroke="#55667D" stroke-width="1"/><polyline points="490,112 498,130" fill="none" stroke="#55667D" stroke-width="1"/><polyline points="498,112 506,130" fill="none" stroke="#55667D" stroke-width="1"/><polyline points="506,112 514,130" fill="none" stroke="#55667D" stroke-width="1"/><polyline points="514,112 522,130" fill="none" stroke="#55667D" stroke-width="1"/><polyline points="522,112 530,130" fill="none" stroke="#55667D" stroke-width="1"/><text x="485" y="148" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">demister pad</text><text x="485" y="200" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">vapor disengagement</text><text x="485" y="215" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">zone</text><polyline points="420,250 455,250 455,262" fill="none" stroke="#1E2B3A" stroke-width="2"/><path d="M422,300 L548,300 L548,340 Q485,385 422,340 Z" fill="#D7EEF1" stroke="none"/><polyline points="422,300 548,300" fill="none" stroke="#0B7C8C" stroke-width="1.6"/><text x="485" y="325" font-size="11" text-anchor="middle" fill="#0B7C8C" font-weight="normal">liquid holdup</text><text x="485" y="178" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">T_drum, p_drum</text><polyline points="485,80 485,50 640,50" fill="none" stroke="#0B7C8C" stroke-width="2" marker-end="url(#ac)"/><text x="600" y="40" font-size="13" text-anchor="middle" fill="#0B7C8C" font-weight="bold">Vapor V, y</text><polyline points="485,380 485,410 640,410" fill="none" stroke="#0B7C8C" stroke-width="2" marker-end="url(#ac)"/><text x="600" y="430" font-size="13" text-anchor="middle" fill="#0B7C8C" font-weight="bold">Liquid L, x</text><text x="340" y="465" font-size="12" text-anchor="middle" fill="#55667D" font-weight="normal">Equilibrium stage: y and x are in equilibrium at T_drum, p_drum;  F = V + L,  Fz = Vy + Lx</text></svg>