<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" font-family="Helvetica, Arial, sans-serif">
<title>Vertical flash drum heights</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="d" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#55667D"/></marker></defs>
<text x="300" y="26" font-size="15" font-weight="bold" text-anchor="middle" fill="#1E2B3A">Vertical flash drum: h_total = h_V + h_f + h_L</text>
<rect x="230" y="60" width="140" height="360" rx="30" fill="none" stroke="#1E2B3A" stroke-width="2.4"/>
<rect x="236" y="86" width="128" height="12" fill="#E3E8EF" stroke="#55667D"/><text x="380" y="96" font-size="11" fill="#55667D">demister</text>
<line x1="300" y1="60" x2="300" y2="40" stroke="#1E2B3A" stroke-width="2"/><text x="310" y="48" font-size="12" fill="#D2552B">V</text>
<line x1="120" y1="210" x2="230" y2="210" stroke="#1E2B3A" stroke-width="2.4"/><text x="40" y="214" font-size="12" fill="#1E2B3A">feed nozzle</text>
<line x1="230" y1="210" x2="370" y2="210" stroke="#9AA8B8" stroke-dasharray="4 3"/>
<path d="M232,300 q34,-8 68,0 q34,8 68,0 L368,410 Q300,430 232,410 z" fill="#0B7C8C" fill-opacity="0.25"/>
<line x1="230" y1="300" x2="370" y2="300" stroke="#0B7C8C" stroke-dasharray="4 3"/><text x="380" y="304" font-size="11" fill="#0B7C8C">maximum liquid level</text>
<line x1="300" y1="420" x2="300" y2="445" stroke="#1E2B3A" stroke-width="2"/><text x="310" y="450" font-size="12" fill="#0B7C8C">L</text>
<line x1="200" y1="70" x2="200" y2="208" stroke="#55667D" marker-end="url(#d)" marker-start="url(#d)"/><text x="192" y="140" font-size="12" text-anchor="end" fill="#1E2B3A">h_V ≥ 36 in + ½ d_feed</text><text x="192" y="156" font-size="11" text-anchor="end" fill="#55667D">(minimum 48 in)</text>
<line x1="200" y1="212" x2="200" y2="298" stroke="#55667D" marker-end="url(#d)" marker-start="url(#d)"/><text x="192" y="254" font-size="12" text-anchor="end" fill="#1E2B3A">h_f ≥ 12 in + ½ d_feed</text><text x="192" y="270" font-size="11" text-anchor="end" fill="#55667D">(minimum 18 in)</text>
<line x1="200" y1="302" x2="200" y2="415" stroke="#55667D" marker-end="url(#d)" marker-start="url(#d)"/><text x="192" y="352" font-size="12" text-anchor="end" fill="#1E2B3A">h_L = V_surge/(πD²/4)</text><text x="192" y="368" font-size="11" text-anchor="end" fill="#55667D">V_surge = Q_L × t_surge</text>
<line x1="232" y1="440" x2="368" y2="440" stroke="#55667D" marker-end="url(#d)" marker-start="url(#d)"/><text x="300" y="465" font-size="12" text-anchor="middle" fill="#1E2B3A">D from u_perm (vapor)</text>
<text x="430" y="200" font-size="12" fill="#B7840A">check 3 ≤ h_total/D ≤ 5</text>
</svg>
