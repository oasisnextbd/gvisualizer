<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" font-family="Helvetica, Arial, sans-serif"><title>Binary distillation column external balance envelope</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="320" y="24" font-size="15" text-anchor="middle" fill="#1E2B3A" font-weight="bold">External balances: envelope around the whole column</text><rect x="130" y="40" width="380" height="410" rx="10" fill="none" stroke="#B7840A" stroke-width="1.8" stroke-dasharray="7 5"/><text x="500" y="58" font-size="11" text-anchor="end" fill="#B7840A" font-weight="normal">balance envelope</text><rect x="270" y="110" width="80" height="260" rx="4" fill="#F3F6F9" stroke="#1E2B3A" stroke-width="2"/><polyline points="310,110 310,80 370,80" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="320" y="72" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">V₁, y₁</text><circle cx="390" cy="80" r="18" fill="#E7F1F3" stroke="#0B7C8C" stroke-width="2"/><text x="420" y="70" font-size="12" text-anchor="start" fill="#0B7C8C" font-weight="normal">Q_C</text><polyline points="408,80 450,80 450,140" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><polyline points="450,140 350,140" fill="none" stroke="#0B7C8C" stroke-width="2" marker-end="url(#ac)"/><text x="400" y="133" font-size="11" text-anchor="middle" fill="#0B7C8C" font-weight="normal">L₀, x_D</text><polyline points="450,140 590,140" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="595" y="144" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">D, x_D, h_D</text><polyline points="40,240 270,240" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="40" y="230" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">F, z, h_F</text><polyline points="310,370 310,395 370,395" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><circle cx="390" cy="395" r="18" fill="#FBEDE7" stroke="#D2552B" stroke-width="2"/><text x="420" y="385" font-size="12" text-anchor="start" fill="#D2552B" font-weight="normal">Q_R (partial reboiler)</text><polyline points="390,377 390,350 350,350" fill="none" stroke="#D2552B" stroke-width="2" marker-end="url(#ah)"/><text x="395" y="345" font-size="12" text-anchor="start" fill="#D2552B" font-weight="normal">V̄</text><polyline points="390,413 390,430 590,430" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="595" y="434" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">B, x_B, h_B</text><text x="320" y="480" font-size="13" text-anchor="middle" fill="#1E2B3A" font-weight="bold">F = D + B ;  Fz = Dx_D + Bx_B ;  Fh_F + Q_C + Q_R = Dh_D + Bh_B</text></svg>