-anchor="start" fill="#1E2B3A" font-weight="normal">V2, y2</text><text x="482.0" y="62.0" font-size="11" text-anchor="start" fill="#55667D" font-weight="normal">p = 1 atm</text><line x1="205.0" y1="160.0" x2="205.0" y2="200.0" stroke="#1E2B3A" stroke-width="1.6"/><line x1="205.0" y1="200.0" x2="300.0" y2="200.0" stroke="#1E2B3A" stroke-width="1.6"/><circle cx="315.0" cy="200.0" r="13" fill="none" stroke="#1E2B3A" stroke-width="1.6"/><text x="315.0" y="226.0" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">pump</text><line x1="328.0" y1="200.0" x2="355.0" y2="200.0" stroke="#1E2B3A" stroke-width="1.6"/><circle cx="370.0" cy="200.0" r="13" fill="none" stroke="#1E2B3A" stroke-width="1.6"/><line x1="360.0" y1="212.0" x2="380.0" y2="188.0" stroke="#1E2B3A" stroke-width="1.6"/><text x="370.0" y="226.0" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">heater</text><line x1="383.0" y1="200.0" x2="410.0" y2="200.0" stroke="#1E2B3A" stroke-width="1.6"/><line x1="410.0" y1="200.0" x2="410.0" y2="120.0" stroke="#1E2B3A" stroke-width="1.6"/><line x1="410.0" y1="120.0" x2="440.0" y2="120.0" stroke="#1E2B3A" stroke-width="1.6" marker-end="url(#ar)"/><text x="250.0" y="192.0" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">L1, x1</text><line x1="475.0" y1="160.0" x2="475.0" y2="200.0" stroke="#1E2B3A" stroke-width="1.6"/><line x1="475.0" y1="200.0" x2="580.0" y2="200.0" stroke="#1E2B3A" stroke-width="1.6" marker-end="url(#ar)"/><text x="520.0" y="218.0" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">L2, x2 = 0.25</text><text x="518.0" y="118.0" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">(V/F)2 = 0.7</text></svg>