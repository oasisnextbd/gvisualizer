<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="Helvetica, Arial, sans-serif"><title>Horizontal flash drum: length h, diameter D, vapor flows along the drum over the liquid</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4FC9"/></marker><pattern id="mesh" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#55667D" stroke-width="1.2"/></pattern></defs><text x="340" y="26" font-size="15" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Horizontal flash drum (Wankat Fig. 2-15 / slide sketch)</text><path d="M150,185 L520,185 L520,230 L150,230 Z" fill="#DCEFF2"/><path d="M150,185 A26,60.0 0 0 0 150,230 Z" fill="#DCEFF2"/><path d="M520,185 A26,60.0 0 0 1 520,230 Z" fill="#DCEFF2"/><line x1="129" y1="185" x2="541" y2="185" stroke="#0B7C8C" stroke-width="1.4"/><path d="M150,110 L520,110 A26,60.0 0 0 1 520,230 L150,230 A26,60.0 0 0 1 150,110 Z" fill="none" stroke="#1E2B3A" stroke-width="2"/><path d="M150,110 A26,60.0 0 0 1 150,230" fill="none" stroke="#9AA8B8" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M520,110 A26,60.0 0 0 0 520,230" fill="none" stroke="#9AA8B8" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="180" y1="60" x2="180" y2="110" stroke="#1E2B3A" stroke-width="2"/><line x1="180" y1="48" x2="180" y2="70" stroke="#1E2B3A" stroke-width="1.8" marker-end="url(#ar)"/><text x="190" y="56" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="bold">Feed</text><line x1="490" y1="110" x2="490" y2="62" stroke="#1E2B3A" stroke-width="2"/><line x1="490" y1="62" x2="560" y2="62" stroke="#1E2B3A" stroke-width="2"/><path d="M522,55 L522,69 L538,55 L538,69 Z" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.4"/><line x1="560" y1="62" x2="590" y2="62" stroke="#1E2B3A" stroke-width="1.8" marker-end="url(#ar)"/><text x="596" y="66" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="bold">V</text><line x1="490" y1="230" x2="490" y2="280" stroke="#1E2B3A" stroke-width="2"/><path d="M483,252 L497,252 L483,268 L497,268 Z" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.4"/><line x1="490" y1="270" x2="490" y2="292" stroke="#1E2B3A" stroke-width="1.8" marker-end="url(#ar)"/><text x="502" y="290" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="bold">L</text><line x1="230" y1="148" x2="280" y2="148" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ar)"/><line x1="330" y1="148" x2="380" y2="148" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ar)"/><line x1="420" y1="148" x2="470" y2="148" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ar)"/><text x="335.0" y="140" font-size="11" text-anchor="middle" fill="#D2552B" font-weight="normal">vapor flows along the drum; drops fall a distance &lt; D</text><text x="335.0" y="214" font-size="11" text-anchor="middle" fill="#0B7C8C" font-weight="normal">liquid pool (large surge volume)</text><line x1="150" y1="252" x2="520" y2="252" stroke="#6A4FC9" stroke-width="1.2" marker-start="url(#av)" marker-end="url(#av)"/><text x="335.0" y="270" font-size="13" text-anchor="middle" fill="#6A4FC9" font-weight="bold">h   (h/D = C = 3–5)</text><line x1="100" y1="110" x2="100" y2="230" stroke="#6A4FC9" stroke-width="1.2" marker-start="url(#av)" marker-end="url(#av)"/><line x1="94" y1="110" x2="106" y2="110" stroke="#6A4FC9" stroke-width="1.2"/><line x1="94" y1="230" x2="106" y2="230" stroke="#6A4FC9" stroke-width="1.2"/><text x="90" y="174.0" font-size="13" text-anchor="end" fill="#6A4FC9" font-weight="bold">D</text><text x="340" y="300" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">vapor area taken as D·h = C·D²;  K<tspan dy="4" font-size="80%">horizontal</tspan><tspan dy="-4">​</tspan> = 1.25 K<tspan dy="4" font-size="80%">vertical</tspan><tspan dy="-4">​</tspan></text></svg>