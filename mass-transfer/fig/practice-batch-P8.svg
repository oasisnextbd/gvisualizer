<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" font-family="Helvetica, Arial, sans-serif"><title>Batch still with decanter</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="320" y="26" font-size="15" text-anchor="middle" fill="#1E2B3A" font-weight="bold">9.D9: batch still with a decanter (heterogeneous azeotrope)</text><rect x="80" y="230" width="230" height="110" rx="20" fill="#F4F7FA" stroke="#1E2B3A" stroke-width="2"/><path d="M95,262 q20,-8 40,0 t40,0 t40,0 t40,0 t40,0" fill="none" stroke="#0B7C8C"/><text x="195" y="300" font-size="13" text-anchor="middle" fill="#1E2B3A" font-weight="normal">still pot W, xW</text><text x="195" y="322" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">40 → 28 mol% water</text><path d="M195,230 L195,90 L330,90" fill="none" stroke="#1E2B3A" stroke-width="2"/><text x="185" y="160" font-size="12" text-anchor="end" fill="#D2552B" font-weight="normal">vapor y</text><circle cx="345" cy="90" r="14" fill="#fff" stroke="#1E2B3A" stroke-width="2"/><text x="345" y="95" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">C</text><path d="M359,90 L420,90" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><rect x="420" y="70" width="110" height="80" fill="#fff" stroke="#1E2B3A" stroke-width="2"/><line x1="420" y1="110" x2="530" y2="110" stroke="#55667D" stroke-dasharray="4 3"/><text x="475" y="95" font-size="11" text-anchor="middle" fill="#B7840A" font-weight="normal">α: 57.3% water</text><text x="475" y="135" font-size="11" text-anchor="middle" fill="#0B7C8C" font-weight="normal">β: 97.5% water</text><text x="475" y="64" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">decanter</text><path d="M530,135 L610,135" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="615" y="160" font-size="12" text-anchor="end" fill="#0B7C8C" font-weight="normal">D, xD = 0.975</text><path d="M475,70 L475,50 L560,50 L560,200 L260,200 L260,228" fill="none" stroke="#B7840A" stroke-width="2" marker-end="url(#a)"/><text x="410" y="218" font-size="11" text-anchor="middle" fill="#B7840A" font-weight="normal">butanol-rich layer returned to the pot</text><text x="320" y="380" font-size="12" text-anchor="middle" fill="#55667D" font-weight="normal">net product is always the 97.5% water layer → constant xD, so overall balances suffice</text></svg>