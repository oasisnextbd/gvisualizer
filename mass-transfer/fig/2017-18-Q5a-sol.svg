<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480" font-family="Helvetica, Arial, sans-serif"><title>Stripping and inverted distillation columns</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="330" y="24" font-size="15" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Stripping column (left) and inverted column (right)</text><rect x="120" y="70" width="70" height="280" rx="4" fill="#F3F6F9" stroke="#1E2B3A" stroke-width="2"/><polyline points="20,90 120,90" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="20" y="80" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">Feed F (top)</text><polyline points="155,70 155,45 260,45" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="265" y="50" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">vapor D = V, y_D</text><polyline points="155,350 155,375 210,375" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><circle cx="228" cy="375" r="16" fill="#FBEDE7" stroke="#D2552B" stroke-width="2"/><text x="250" y="370" font-size="12" text-anchor="start" fill="#D2552B" font-weight="normal">Q_R</text><polyline points="228,359 228,330 190,330" fill="none" stroke="#D2552B" stroke-width="2" marker-end="url(#ah)"/><polyline points="228,391 228,410 300,410" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="305" y="414" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">B, x_B</text><text x="155" y="450" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">no condenser, no reflux: only</text><text x="155" y="466" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">the stripping section exists</text><rect x="460" y="70" width="70" height="280" rx="4" fill="#F3F6F9" stroke="#1E2B3A" stroke-width="2"/><polyline points="495,70 495,45 560,45" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><circle cx="578" cy="45" r="16" fill="#E7F1F3" stroke="#0B7C8C" stroke-width="2"/><text x="600" y="40" font-size="12" text-anchor="start" fill="#0B7C8C" font-weight="normal">Q_C</text><polyline points="578,61 578,95 530,95" fill="none" stroke="#0B7C8C" stroke-width="2" marker-end="url(#ac)"/><polyline points="578,61 640,61 640,30" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="640" y="22" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">D</text><polyline points="370,330 460,330" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="370" y="320" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">Feed F</text><polyline points="495,350 495,400 560,400" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="565" y="404" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">B (liquid), x_B</text><text x="495" y="450" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">feed enters at the bottom; only the</text><text x="495" y="466" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">enriching section exists, no reboiler</text></svg>