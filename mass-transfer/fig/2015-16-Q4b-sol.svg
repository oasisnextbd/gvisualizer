<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 410" width="660" height="410" font-family="Helvetica, Arial, sans-serif"><title>Sieve tray performance diagram</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker></defs><line x1="80" y1="360" x2="80" y2="50" stroke="#1E2B3A" stroke-width="1.8" marker-end="url(#ar)"/><line x1="80" y1="360" x2="620" y2="360" stroke="#1E2B3A" stroke-width="1.8" marker-end="url(#ar)"/><text x="350" y="392" font-size="13" text-anchor="middle" fill="#55667D" font-weight="normal">liquid flow rate →</text><text x="40" y="205" font-size="13" text-anchor="middle" fill="#55667D" font-weight="normal" transform="rotate(-90 40 205)">vapor flow rate →</text><path d="M110,95 C250,85 380,80 520,95" fill="none" stroke="#D2552B" stroke-width="2.4"/><path d="M520,95 C545,170 555,250 560,330" fill="none" stroke="#D2552B" stroke-width="2.4"/><path d="M110,300 C250,300 400,305 560,330" fill="none" stroke="#0B7C8C" stroke-width="2.4"/><path d="M110,95 C100,170 100,240 110,300" fill="none" stroke="#6A4FC9" stroke-width="2.4"/><path d="M110,335 C250,338 400,345 560,352" fill="none" stroke="#0B7C8C" stroke-width="1.6" stroke-dasharray="5 4"/><text x="320" y="190" font-size="15" text-anchor="middle" fill="#1E2B3A" font-weight="bold">SATISFACTORY</text><text x="320" y="210" font-size="15" text-anchor="middle" fill="#1E2B3A" font-weight="bold">OPERATION</text><circle cx="320" cy="245" r="5" fill="#B7840A"/><text x="330" y="250" font-size="12" text-anchor="start" fill="#B7840A" font-weight="bold">design point</text><text x="315" y="72" font-size="13" text-anchor="middle" fill="#D2552B" font-weight="normal">entrainment (jet) flooding</text><text x="585" y="200" font-size="13" text-anchor="middle" fill="#D2552B" font-weight="normal">downcomer</text><text x="585" y="216" font-size="1