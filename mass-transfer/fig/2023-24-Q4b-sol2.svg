<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" font-family="Helvetica, Arial, sans-serif"><title>Downcomer and weir designs</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="350.0" y="22.0" font-size="15" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Downcomer designs (side view) and weir designs</text><line x1="15.0" y1="60.0" x2="125.0" y2="60.0" stroke="#1E2B3A" stroke-width="3"/><line x1="165.0" y1="40.0" x2="165.0" y2="190.0" stroke="#1E2B3A" stroke-width="3"/><line x1="15.0" y1="180.0" x2="165.0" y2="180.0" stroke="#1E2B3A" stroke-width="3"/><rect x="95.0" y="50.0" width="18.0" height="105.0" rx="0" fill="#BFD9E3" fill-opacity="1" stroke="#1E2B3A" stroke-width="1.6"/><text x="90.0" y="210.0" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">(A) Circular pipe</text><text x="90.0" y="226.0" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">small columns, pilot plants</text><line x1="190.0" y1="60.0" x2="300.0" y2="60.0" stroke="#1E2B3A" stroke-width="3"/><line x1="340.0" y1="40.0" x2="340.0" y2="190.0" stroke="#1E2B3A" stroke-width="3"/><line x1="190.0" y1="180.0" x2="340.0" y2="180.0" stroke="#1E2B3A" stroke-width="3"/><line x1="300.0" y1="48.0" x2="300.0" y2="160.0" stroke="#1E2B3A" stroke-width="2.4"/><rect x="301.0" y="110.0" width="38.0" height="50.0" rx="0" fill="#BFD9E3" fill-opacity="1" stroke="none" stroke-width="0"/><text x="265.0" y="210.0" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">(B) Straight segmental</text><text x="265.0" y="226.0" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">most common: cheap, robust</text><line x1="365.0" y1="60.0" x2="475.0" y2="60.0" stroke="#1E2B3A" stroke-width="3"/><line x1="515.0" y1="