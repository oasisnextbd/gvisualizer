<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" font-family="Helvetica, Arial, sans-serif"><title>Murphree efficiency on a tray</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="340.0" y="22.0" font-size="14" fill="#1E2B3A" text-anchor="middle" font-weight="bold">Murphree efficiency: tray n with well-mixed liquid</text><line x1="60.0" y1="50.0" x2="60.0" y2="330.0" stroke="#1E2B3A" stroke-width="2"/><line x1="400.0" y1="50.0" x2="400.0" y2="330.0" stroke="#1E2B3A" stroke-width="2"/><line x1="60.0" y1="220.0" x2="340.0" y2="220.0" stroke="#1E2B3A" stroke-width="3"/><path d="M340,220 L340,330" fill="none" stroke="#1E2B3A" stroke-width="2"/><line x1="120.0" y1="110.0" x2="400.0" y2="110.0" stroke="#1E2B3A" stroke-width="3"/><line x1="120.0" y1="110.0" x2="120.0" y2="200.0" stroke="#1E2B3A" stroke-width="2"/><rect x="62.0" y="200.0" width="58.0" height="20.0" fill="#BFE0E5" stroke="#0B7C8C" stroke-width="0" rx="0"/><rect x="62.0" y="198.0" width="256.0" height="22.0" fill="#BFE0E5" stroke="#0B7C8C" stroke-width="0" rx="0"/><line x1="318.0" y1="198.0" x2="318.0" y2="220.0" stroke="#1E2B3A" stroke-width="2.2"/><line x1="80.0" y1="221.0" x2="90.0" y2="221.0" stroke="#FFFFFF" stroke-width="2"/><line x1="102.0" y1="221.0" x2="112.0" y2="221.0" stroke="#FFFFFF" stroke-width="2"/><line x1="124.0" y1="221.0" x2="134.0" y2="221.0" stroke="#FFFFFF" stroke-width="2"/><line x1="146.0" y1="221.0" x2="156.0" y2="221.0" stroke="#FFFFFF" stroke-width="2"/><line x1="168.0" y1="221.0" x2="178.0" y2="221.0" stroke="#FFFFFF" stroke-width="2"/><line x1="190.0" y1="221.0" x2="200.0" y2="221.0" stroke="#FFFFFF" stroke-width="2"/><line x1="212.0" y1="221.0" x2="222.0" y2="221.0" stroke="#FFFFFF" stroke-width="2"/><line x1="234.0" y1="221.0" x2="244.0" y2="221.0" stroke="#FFFFFF" stroke-width="2"/><line x1="256.0" y1="221.0" x2="266.0" y2="221.0" stroke="#FFFFFF" stroke-width="2"/><line x1="278.0" y1="221.0" x2="288.0" y2="221.0" stroke="#FFFFFF" stroke-width="2"/><line x1="300.0" y1="221.0" x2="310.0" y2="221.0" stroke="#FFFFFF" stroke-width="2"/><text x="200.0" y="214.0" font-size="11" fill="#0B7C8C" text-anchor="middle" font-weight="normal">liquid on tray n: uniform xₙ</text><line x1="90.0" y1="140.0" x2="90.0" y2="195.0" stroke="#0B7C8C" stroke-width="1.8" marker-end="url(#ar)"/><text x="96.0" y="185.0" font-size="11" fill="#0B7C8C" text-anchor="start" font-weight="normal">L, xₙ₋₁</text><line x1="330.0" y1="205.0" x2="370.0" y2="205.0" stroke="#0B7C8C" stroke-width="1.8"/><line x1="370.0" y1="205.0" x2="370.0" y2="300.0" stroke="#0B7C8C" stroke-width="1.8" marker-end="url(#ar)"/><text x="376.0" y="290.0" font-size="11" fill="#0B7C8C" text-anchor="start" font-weight="normal">L, xₙ</text><line x1="160.0" y1="300.0" x2="160.0" y2="226.0" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ar)"/><line x1="160.0" y1="194.0" x2="160.0" y2="130.0" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ar)"/><line x1="220.0" y1="300.0" x2="220.0" y2="226.0" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ar)"/><line x1="220.0" y1="194.0" x2="220.0" y2="130.0" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ar)"/><line x1="280.0" y1="300.0" x2="280.0" y2="226.0" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ar)"/><line x1="280.0" y1="194.0" x2="280.0" y2="130.0" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ar)"/><text x="220.0" y="318.0" font-size="11" fill="#D2552B" text-anchor="middle" font-weight="normal">V, yₙ₊₁ (vapor in, uniform)</text><text x="292.0" y="165.0" font-size="11" fill="#D2552B" text-anchor="start" font-weight="normal">V, yₙ (mixed)</text><text x="320.0" y="240.0" font-size="10" fill="#55667D" text-anchor="start" font-weight="normal">weir</text><text x="420.0" y="70.0" font-size="11.5" fill="#1E2B3A" text-anchor="start" font-weight="bold">E_MV = (yₙ − yₙ₊₁) / (yₙ* − yₙ₊₁)</text><text x="420.0" y="89.0" font-size="11.5" fill="#55667D" text-anchor="start" font-weight="normal">yₙ* = in equilibrium with xₙ (liquid leaving)</text><text x="420.0" y="108.0" font-size="11.5" fill="#1E2B3A" text-anchor="start" font-weight="bold">E_ML = (xₙ₋₁ − xₙ) / (xₙ₋₁ − xₙ*)</text><text x="420.0" y="127.0" font-size="11.5" fill="#55667D" text-anchor="start" font-weight="normal">xₙ* = in equilibrium with yₙ (vapor leaving)</text><text x="420.0" y="146.0" font-size="11.5" fill="#1E2B3A" text-anchor="start" font-weight="normal"></text><text x="420.0" y="165.0" font-size="11.5" fill="#D2552B" text-anchor="start" font-weight="bold">Model assumptions → shortcomings</text><text x="420.0" y="184.0" font-size="11.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">• liquid fully mixed (one xₙ) — big trays</text><text x="420.0" y="203.0" font-size="11.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">  have a gradient, so E_MV can exceed 1</text><text x="420.0" y="222.0" font-size="11.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">• vapor between trays fully mixed</text><text x="420.0" y="241.0" font-size="11.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">• E_MV ≠ E_ML; not symmetric</text><text x="420.0" y="260.0" font-size="11.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">• varies tray to tray and with flow</text><text x="420.0" y="279.0" font-size="11.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">• ignores entrainment and weeping</text><text x="420.0" y="298.0" font-size="11.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">• binary concept: in multicomponent</text><text x="420.0" y="317.0" font-size="11.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">  systems each component differs</text></svg>