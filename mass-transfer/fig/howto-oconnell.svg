th="2"/><text x="33.0" y="532.1" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="48.0" y="532.0" font-size="12.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">Find α (key components) and μ (feed liquid viscosity, cP) at the average column T and p; form αμ (here 0.5).</text><circle cx="33.0" cy="544.5" r="9" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="33.0" y="549.1" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="48.0" y="549.0" font-size="12.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">Go straight up from αμ on the log axis to the curve.</text><circle cx="33.0" cy="561.5" r="9" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="33.0" y="566.1" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="48.0" y="566.0" font-size="12.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">Go across to the E_o axis.</text><circle cx="33.0" cy="578.5" r="9" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="33.0" y="583.1" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="48.0" y="583.0" font-size="12.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">Read E_o (here 0.61); then N_actual = N_equil/E_o, rounded up.</text><text x="360.0" y="606.0" font-size="11" fill="#55667D" text-anchor="middle" font-weight="normal" font-style="italic">Redrawn from the correlation (curve fit of O’Connell’s data); in the exam read the printed chart — values may differ slightly.</text></svg>