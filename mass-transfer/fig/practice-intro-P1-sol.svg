<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" height="310" font-family="Helvetica, Arial, sans-serif"><title>Generic chemical plant: separators before and after the reactor, with recycle</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs><text x="50.0" y="128.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="normal">raw</text><text x="50.0" y="144.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="normal">materials</text><line x1="85.0" y1="140.0" x2="120.0" y2="140.0" stroke="#1E2B3A" stroke-width="1.8" marker-end="url(#ar)"/><rect x="120.0" y="105.0" width="120.0" height="70.0" fill="#E8F5F7" stroke="#0B7C8C" stroke-width="1.8" rx="6"/><text x="180.0" y="140.0" font-size="13" fill="#0B7C8C" text-anchor="middle" font-weight="bold">feed</text><text x="180.0" y="158.0" font-size="10" fill="#55667D" text-anchor="middle" font-weight="normal">separation / purification</text><line x1="240.0" y1="140.0" x2="290.0" y2="140.0" stroke="#1E2B3A" stroke-width="1.8" marker-end="url(#ar)"/><rect x="290.0" y="105.0" width="110.0" height="70.0" fill="#FFF3EE" stroke="#D2552B" stroke-width="1.8" rx="6"/><text x="345.0" y="140.0" font-size="13" fill="#D2552B" text-anchor="middle" font-weight="bold">reactor</text><text x="345.0" y="158.0" font-size="10" fill="#55667D" text-anchor="middle" font-weight="normal">conversion</text><line x1="400.0" y1="140.0" x2="450.0" y2="140.0" stroke="#1E2B3A" stroke-width="1.8" marker-end="url(#ar)"/><rect x="450.0" y="105.0" width="130.0" height="70.0" fill="#E8F5F7" stroke="#0B7C8C" stroke-width="1.8" rx="6"/><text x="515.0" y="140.0" font-size="13" fill="#0B7C8C" text-anchor="middle" font-weight="bold">product</text><text x="515.0" y="158.0" font-size="10" fill="#55667D" text-anchor="middle" font-weight="normal">separation train</text><line x1="580.0" y1="140.0" x2="630.0" y2="140.0" stroke="#1E2B3A" stroke-width="1.8" marker-end="url(#ar)"/><text x="660.0" y="136.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="normal">pure</text><text x="660.0" y="152.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="normal">products</text><polyline points="515.0,175.0 515.0,235.0 345.0,235.0 345.0,177.0" fill="none" stroke="#6A4FC9" stroke-width="1.8" stroke-linejoin="round"/><text x="430.0" y="252.0" font-size="12" fill="#6A4FC9" text-anchor="middle" font-weight="normal">recycle of unreacted feed</text><line x1="345" y1="235" x2="345" y2="179" stroke="#6A4FC9" stroke-width="1.8" marker-end="url(#ar)"/><line x1="180.0" y1="105.0" x2="180.0" y2="60.0" stroke="#55667D" stroke-width="1.6" marker-end="url(#ar)"/><text x="180.0" y="52.0" font-size="11" fill="#55667D" text-anchor="middle" font-weight="normal">impurities, water</text><line x1="515.0" y1="105.0" x2="515.0" y2="60.0" stroke="#55667D" stroke-width="1.6" marker-end="url(#ar)"/><text x="515.0" y="52.0" font-size="11" fill="#55667D" text-anchor="middle" font-weight="normal">by-products, waste</text><text x="360.0" y="292.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="normal">Separation equipment: 40–70% of plant capital cost; separations use about half of industrial energy</text></svg>