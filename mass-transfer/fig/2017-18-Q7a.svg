<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" width="660" height="470" font-family="Helvetica, Arial, sans-serif"><title>Ethanol–water column with direct steam injection</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="320" y="24" font-size="15" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Column with direct steam injection (no reboiler)</text><rect x="250" y="90" width="80" height="280" rx="4" fill="#F3F6F9" stroke="#1E2B3A" stroke-width="2"/><polyline points="290,90 290,60 370,60" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="300" y="52" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">V₁</text><circle cx="390" cy="60" r="18" fill="#E7F1F3" stroke="#0B7C8C" stroke-width="2"/><text x="412" y="52" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">Q_C (total condenser)</text><polyline points="408,60 450,60 450,120" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><polyline points="450,120 330,120" fill="none" stroke="#0B7C8C" stroke-width="2" marker-end="url(#ac)"/><text x="390" y="113" font-size="11" text-anchor="middle" fill="#0B7C8C" font-weight="normal">L (sat. liquid reflux)</text><polyline points="450,120 560,120" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="565" y="124" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">D, x_D = 0.60 wt</text><polyline points="120,230 250,230" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="110" y="220" font-size="12" text-anchor="end" fill="#1E2B3A" font-weight="normal">F = 100 kg/min</text><text x="110" y="236" font-size="12" text-anchor="end" fill="#1E2B3A" font-weight="normal">z = 0.30 wt, 20 °C</text><polyline points="270,430 270,370" fill="none" stroke="#D2552B" stroke-width="2" marker-end="url(#ah)"/><text x="262" y="450" font-size="12" text-anchor="end" fill="#D2552B" font-weight="normal">S = 100 kg/min sat. steam, y_S = 0</text><polyline points="310,370 310,430" fill="none" stroke="#1E2B3A" stroke-width="2" marker-end="url(#a)"/><text x="318" y="450" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="normal">B, x_B = 0.05 wt</text><text x="150" y="110" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">Q_col = 0</text><text x="150" y="128" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">p = 1 kg/cm²</text></svg>