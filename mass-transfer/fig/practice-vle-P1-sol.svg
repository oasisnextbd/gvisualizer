<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="Helvetica, Arial, sans-serif"><title>Phase diagram of water with the phase-rule degrees of freedom in each region, on each curve and at the triple point</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs><line x1="80.0" y1="330.0" x2="600.0" y2="330.0" stroke="#1E2B3A" stroke-width="1.6" marker-end="url(#ar)"/><line x1="80.0" y1="330.0" x2="80.0" y2="50.0" stroke="#1E2B3A" stroke-width="1.6" marker-end="url(#ar)"/><text x="340.0" y="364.0" font-size="13" fill="#1E2B3A" text-anchor="middle" font-weight="normal">temperature</text><text x="42" y="190.0" font-size="13" fill="#1E2B3A" text-anchor="middle" transform="rotate(-90 42 190.0)">pressure</text><path d="M100,320 Q190,300 250,240" fill="none" stroke="#1E2B3A" stroke-width="2.2"/><path d="M250,240 Q410,200 520,95" fill="none" stroke="#0B7C8C" stroke-width="2.4"/><path d="M250,240 L228,60" fill="none" stroke="#D2552B" stroke-width="2.2"/><circle cx="250.0" cy="240.0" r="5" fill="#B7840A" stroke="#B7840A" stroke-width="1.6"/><text x="260.0" y="258.0" font-size="12" fill="#B7840A" text-anchor="start" font-weight="bold">triple point: C = 1, P = 3, F = 0</text><circle cx="520.0" cy="95.0" r="5" fill="#6A4FC9" stroke="#6A4FC9" stroke-width="1.6"/><text x="512.0" y="85.0" font-size="12" fill="#6A4FC9" text-anchor="end" font-weight="bold">critical point</text><text x="150.0" y="160.0" font-size="13" fill="#1E2B3A" text-anchor="middle" font-weight="bold">ice (solid)</text><text x="340.0" y="115.0" font-size="13" fill="#1E2B3A" text-anchor="middle" font-weight="bold">liquid water</text><text x="440.0" y="280.0" font-size="13" fill="#1E2B3A" text-anchor="middle" font-weight="bold">vapor</text><text x="340.0" y="133.0" font-size="11" fill="#55667D" text-anchor="middle" font-weight="normal">one phase: F = 2 (T and p free)</text><text x="440.0" y="298.0" font-size="11" fill="#55667D" text-anchor="middle" font-weight="normal">F = 2</text><text x="425.0" y="180.0" font-size="12" fill="#0B7C8C" text-anchor="start" font-weight="normal">boiling curve: P = 2, F = 1</text></svg>