<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="Helvetica, Arial, sans-serif"><title>Low-pressure storage tank protection: pressure–vacuum conservation vent, emergency vent and flame arrester</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="60.0" y="150.0" width="320.0" height="150.0" rx="0" fill="#F7F1E1" stroke="#1E2B3A" stroke-width="1.8"/><path d="M60,150 Q220,115 380,150" fill="none" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round"/><line x1="60.0" y1="240.0" x2="380.0" y2="240.0" stroke="#0B7C8C" stroke-width="1.2" stroke-dasharray="5 3"/><text x="220.0" y="275.0" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">liquid (hydrocarbon)</text><text x="220.0" y="200.0" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">vapor space ~ atmospheric (few in. water)</text><rect x="150.0" y="75.0" width="70.0" height="50.0" rx="0" fill="#FAFBFC" stroke="#1E2B3A" stroke-width="1.6"/><line x1="185.0" y1="125.0" x2="185.0" y2="138.0" stroke="#1E2B3A" stroke-width="2"/><rect x="160.0" y="98.0" width="20.0" height="5.0" rx="0" fill="#D2552B" stroke="#D2552B" stroke-width="1.6"/><text x="150.0" y="70.0" font-size="11" text-anchor="start" fill="#1E2B3A" font-weight="bold">P/V vent</text><rect x="190.0" y="108.0" width="20.0" height="5.0" rx="0" fill="#6A4FC9" stroke="#6A4FC9" stroke-width="1.6"/><line x1="170.0" y1="96.0" x2="170.0" y2="80.0" stroke="#D2552B" stroke-width="1.4" marker-end="url(#ar)"/><line x1="200.0" y1="90.0" x2="200.0" y2="106.0" stroke="#6A4FC9" stroke-width="1.4" marker-end="url(#ar)"/><rect x="290.0" y="100.0" width="50.0" height="34.0" rx="0" fill="#D8DEE6" stroke="#1E2B3A" stroke-width="1.4"/><text x="315.0" y="95.0" font-size="10" text-anchor="middle" fill="#1E2B3A" font-weight="normal">emergency vent</text><text x="315.0" y="121.0" font-size="9" text-anchor="middle" fill="#55667D" font-weight="normal">cover</text><rect x="90.0" y="112.0" width="40.0" height="18.0" rx="0" fill="#EEF0F3" stroke="#1E2B3A" stroke-width="1.2"/><text x="110.0" y="108.0" font-size="9" text-anchor="middle" fill="#55667D" font-weight="normal">flame arrester</text><text x="550.0" y="24.0" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Weight-loaded pallet vent (detail)</text><rect x="440.0" y="60.0" width="220.0" height="170.0" rx="0" fill="#FAFBFC" stroke="#1E2B3A" stroke-width="1.6"/><line x1="550.0" y1="60.0" x2="550.0" y2="230.0" stroke="#1E2B3A" stroke-width="1.2"/><rect x="470.0" y="160.0" width="50.0" height="10.0" rx="0" fill="#FBEDE7" stroke="#D2552B" stroke-width="1.4"/><rect x="480.0" y="150.0" width="30.0" height="10.0" rx="0" fill="#D2552B" stroke="#D2552B" stroke-width="1.6"/><rect x="470.0" y="170.0" width="6.0" height="40.0" rx="0" fill="#D8DEE6" stroke="#1E2B3A" stroke-width="1.6"/><rect x="514.0" y="170.0" width="6.0" height="40.0" rx="0" fill="#D8DEE6" stroke="#1E2B3A" stroke-width="1.6"/><line x1="495.0" y1="225.0" x2="495.0" y2="180.0" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ar)"/><line x1="495.0" y1="140.0" x2="495.0" y2="80.0" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ar)"/><text x="495.0" y="255.0" font-size="10" text-anchor="middle" fill="#D2552B" font-weight="normal">pressure pallet</text><text x="495.0" y="268.0" font-size="9" text-anchor="middle" fill="#D2552B" font-weight="normal">lifts: tank breathes out</text><rect x="580.0" y="120.0" width="50.0" height="10.0" rx="0" fill="#F0ECFA" stroke="#6A4FC9" stroke-width="1.4"/><rect x="590.0" y="130.0" width="30.0" height="10.0" rx="0" fill="#6A4FC9" stroke="#6A4FC9" stroke-width="1.6"/><rect x="580.0" y="80.0" width="6.0" height="40.0" rx="0" fill="#D8DEE6" stroke="#1E2B3A" stroke-width="1.6"/><rect x="624.0" y="80.0" width="6.0" height="40.0" rx="0" fill="#D8DEE6" stroke="#1E2B3A" stroke-width="1.6"/><line x1="640.0" y1="75.0" x2="605.0" y2="110.0" stroke="#6A4FC9" stroke-width="1.6" marker-end="url(#ar)"/><line x1="605.0" y1="145.0" x2="605.0" y2="215.0" stroke="#6A4FC9" stroke-width="1.6" marker-end="url(#ar)"/><text x="605.0" y="255.0" font-size="10" text-anchor="middle" fill="#6A4FC9" font-weight="normal">vacuum pallet</text><text x="605.0" y="268.0" font-size="9" text-anchor="middle" fill="#6A4FC9" font-weight="normal">lifts: air breathes in</text><text x="550.0" y="318.0" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">set by pallet weight (oz/in²)</text></svg>