<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" width="660" height="440" font-family="Helvetica, Arial, sans-serif">
<title>Outlet velocity triangle of a centrifugal pump impeller with backward-curved vanes</title>
<defs><marker id="m1E2B3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="mD2552B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="m0B7C8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="mB7840A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="m6A4FC9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4FC9"/></marker><marker id="m55667D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker></defs>
<rect x="0" y="0" width="660" height="440" fill="#FFFFFF"/>
<text x="330.0" y="26.0" font-size="15" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Impeller outlet velocity triangle (β₂ = 30°, backward-curved vanes)</text>
<line x1="90.0" y1="360.0" x2="502.4" y2="360.0" stroke="#0B7C8C" stroke-width="2.6" marker-end="url(#m0B7C8C)"/>
<text x="296.2" y="386.0" font-size="13" text-anchor="middle" fill="#0B7C8C" font-weight="normal">u₂ = ω r₂ = 22.9 m/s (blade tip speed)</text>
<line x1="90.0" y1="360.0" x2="442.8" y2="188.1" stroke="#D2552B" stroke-width="2.6" marker-end="url(#mD2552B)"/>
<text x="242.8" y="270.6" font-size="13" text-anchor="end" fill="#D2552B" font-weight="bold">V₂ (absolute)</text>
<line x1="502.4" y1="360.0" x2="442.8" y2="188.1" stroke="#6A4FC9" stroke-width="2.6" marker-end="url(#m6A4FC9)"/>
<text x="510.4" y="228.1" font-size="13" text-anchor="start" fill="#6A4FC9" font-weight="normal">v₂ (relative,</text>
<text x="510.4" y="244.1" font-size="13" text-anchor="start" fill="#6A4FC9" font-weight="normal">along the vane)</text>
<line x1="442.8" y1="188.1" x2="442.8" y2="360.0" stroke="#55667D" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="436.8" y="278.1" font-size="12" text-anchor="end" fill="#55667D" font-weight="normal">V_r2 (radial)</text>
<line x1="90.0" y1="410.0" x2="442.8" y2="410.0" stroke="#55667D" stroke-width="1.4" marker-end="url(#m55667D)"/>
<text x="266.4" y="426.0" font-size="12" text-anchor="middle" fill="#55667D" font-weight="normal">V_u2 = u₂ − V_r2 / tan β₂ = 19.6 m/s</text>
<path d="M456.4,360.0 A46,46 0 0 1 487.3,316.5" fill="none" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="446.4" y="348.0" font-size="14" text-anchor="end" fill="#1E2B3A" font-weight="bold">β₂</text>
<text x="90.0" y="70.0" font-size="13" text-anchor="start" fill="#1E2B3A" font-weight="normal">Euler (ideal) head:  ΔH = u₂V_u2 / g = u₂(u₂ − Q/(A_p tan β₂)) / g</text>
<text x="90.0" y="92.0" font-size="12" text-anchor="start" fill="#55667D" font-weight="normal" font-style="italic">Radial component drawn 5× enlarged for clarity (V_r2 = Q/A_p = 1.91 m/s).</text>
</svg>