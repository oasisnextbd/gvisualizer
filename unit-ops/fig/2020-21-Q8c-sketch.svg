<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="Helvetica, Arial, sans-serif"><title>Screw conveyor: helical flight in a U-trough</title><defs><marker id="a0B7C8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="a1E2B3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="aB7840A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="90" y="110" width="480" height="80" rx="4" stroke="#1E2B3A" stroke-width="1.6" fill="#F3F6F9"/><line x1="70" y1="150" x2="600" y2="150" stroke="#1E2B3A" stroke-width="3"/><path d="M110,112 C120,130 132,170 140,188" stroke="#55667D" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M162,112 C172,130 184,170 192,188" stroke="#55667D" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M214,112 C224,130 236,170 244,188" stroke="#55667D" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M266,112 C276,130 288,170 296,188" stroke="#55667D" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M318,112 C328,130 340,170 348,188" stroke="#55667D" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M370,112 C380,130 392,170 400,188" stroke="#55667D" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M422,112 C432,130 444,170 452,188" stroke="#55667D" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M474,112 C484,130 496,170 504,188" stroke="#55667D" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M526,112 C536,130 548,170 556,188" stroke="#55667D" stroke-width="2" fill="none" stroke-linejoin="round"/><text x="330" y="100" font-size="10.5" fill="#55667D" text-anchor="middle">U-trough with cover</text><polyline points="120,40 170,40 155,108 135,108" stroke="#B7840A" stroke-width="1.6" fill="#F6EBCB" stroke-linejoin="round"/><text x="180" y="52" font-size="10.5" fill="#B7840A" text-anchor="start">inlet (feed hopper)</text><line x1="520" y1="190" x2="520" y2="240" stroke="#B7840A" stroke-width="2" marker-end="url(#aB7840A)"/><text x="530" y="232" font-size="10.5" fill="#B7840A" text-anchor="start">discharge</text><rect x="600" y="135" width="50" height="30" rx="3" stroke="#1E2B3A" stroke-width="1.6" fill="#FBE3D9"/><text x="625" y="155" font-size="10" fill="#1E2B3A" text-anchor="middle">drive</text><line x1="162" y1="205" x2="214" y2="205" stroke="#1E2B3A" stroke-width="1" marker-end="url(#a1E2B3A)" marker-start="url(#a1E2B3A)"/><text x="188" y="222" font-size="10.5" fill="#1E2B3A" text-anchor="middle">pitch P</text><line x1="80" y1="112" x2="80" y2="188" stroke="#1E2B3A" stroke-width="1" marker-end="url(#a1E2B3A)" marker-start="url(#a1E2B3A)"/><text x="72" y="154" font-size="11" fill="#1E2B3A" text-anchor="end">D</text><line x1="260" y1="250" x2="420" y2="250" stroke="#0B7C8C" stroke-width="2" marker-end="url(#a0B7C8C)"/><text x="340" y="272" font-size="10.5" fill="#0B7C8C" text-anchor="middle">material moves along the trough as the screw turns</text><text x="340" y="290" font-size="10" fill="#55667D" text-anchor="middle">P/D ≈ 1 standard; 1.5 easy-flowing horizontal; 0.5–0.67 vertical</text></svg>