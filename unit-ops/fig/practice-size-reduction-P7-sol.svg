"round" stroke-dasharray="2,3"/><text x="320" y="24" font-size="11" fill="#D2552B" text-anchor="middle" font-weight="bold">largest particle nipped, radius r₂ (gap exaggerated, not to scale)</text><polyline points="320,30 320,145.219" stroke="#D2552B" stroke-width="1" fill="none" stroke-linejoin="round" stroke-dasharray="3,3"/><text x="162" y="235" font-size="11" fill="#1E2B3A" text-anchor="middle">roll radius r₁</text><text x="478" y="235" font-size="11" fill="#1E2B3A" text-anchor="middle">roll radius r₁</text><text x="320" y="231" font-size="10" fill="#0B7C8C" text-anchor="middle">gap 2b</text><polyline points="302,219 338,219" stroke="#0B7C8C" stroke-width="1.4" fill="none" stroke-linejoin="round"/><text x="212" y="201" font-size="11" fill="#B7840A" text-anchor="start">α/2</text><path d="M202,215 A40,40 0 0 0 200.545,204.31" stroke="#B7840A" stroke-width="1.4" fill="none"/><path d="M92,81.76 A152,152 0 0 1 232,81.76" stroke="#1E2B3A" stroke-width="1.4" fill="none" marker-end="url(#a1E2B3A)"/><path d="M548,81.76 A152,152 0 0 0 408,81.76" stroke="#1E2B3A" stroke-width="1.4" fill="none" marker-end="url(#a1E2B3A)"/><text x="320" y="385" font-size="11" fill="#1E2B3A" text-anchor="middle">cos(α/2) = (r₁ + b)/(r₁ + r₂);   particle is nipped only if α/2 ≤ friction angle (tan α/2 ≤ μ)</text><text x="320" y="405" font-size="10" fill="#55667D" text-anchor="middle">Rolls turn towards each other; the particle is drawn down through the gap</text></svg>