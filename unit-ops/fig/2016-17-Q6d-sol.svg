,</text><text x="305.0" y="282.0" font-size="10" text-anchor="middle" fill="#1E2B3A" font-weight="normal">coalesce into a film and drain down (hooks/pockets) to the sump</text><line x1="330.0" y1="240.0" x2="330.0" y2="258.0" stroke="#6A4FC9" stroke-width="1.6" marker-end="url(#ar)"/><text x="560.0" y="200.0" font-size="10" text-anchor="middle" fill="#1E2B3A" font-weight="normal">V_max = k √((ρ_L − ρ_V)/ρ_V)</text><text x="560.0" y="214.0" font-size="9" text-anchor="middle" fill="#55667D" font-weight="normal">k ≈ 0.40 up-flow, 0.65 horizontal (ft/s)</text></svg>