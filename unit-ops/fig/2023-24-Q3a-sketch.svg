<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="Helvetica, Arial, sans-serif"><title>Two-stage steam jet ejector with barometric intercondenser</title><defs><marker id="a1E2B3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="a55667D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="aD2552B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="a0B7C8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="aB7840A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="a6A4FC9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4FC9"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><path d="M40,76 L80,76 L100,84 L160,78 L160,102 L100,96 L80,104 L40,104 Z" stroke="#1E2B3A" stroke-width="1.6" fill="#F3F6F9"/><text x="100" y="68" font-size="10" fill="#1E2B3A" text-anchor="middle" font-weight="bold">1st-stage ejector</text><path d="M400,76 L440,76 L460,84 L520,78 L520,102 L460,96 L440,104 L400,104 Z" stroke="#1E2B3A" stroke-width="1.6" fill="#F3F6F9"/><text x="460" y="68" font-size="10" fill="#1E2B3A" text-anchor="middle" font-weight="bold">2nd-stage ejector</text><polyline points="10,90 40,90" stroke="#D2552B" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#aD2552B)"/><text x="10" y="80" font-size="9" fill="#D2552B" text-anchor="start">steam</text><polyline points="370,90 400,90" stroke="#D2552B" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#aD2552B)"/><text x="370" y="80" font-size="9" fill="#D2552B" text-anchor="start">steam</text><polyline points="60,160 60,104" stroke="#0B7C8C" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#a0B7C8C)"/><text x="60" y="175" font-size="9" fill="#0B7C8C" text-anchor="middle">vapour + air from process</text><text x="60" y="187" font-size="9" fill="#0B7C8C" text-anchor="middle">(e.g. 5 torr)</text><polyline points="160,90 230,90 230,120" stroke="#1E2B3A" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#a1E2B3A)"/><text x="195" y="82" font-size="9" fill="#55667D" text-anchor="middle">steam + load</text><rect x="205" y="120" width="60" height="110" rx="8" stroke="#1E2B3A" stroke-width="1.6" fill="#E6F4F6"/><text x="235" y="245" font-size="10" fill="#0B7C8C" text-anchor="middle" font-weight="bold">intercondenser</text><polyline points="300,135 265,135" stroke="#0B7C8C" stroke-width="1.4" fill="none" stroke-linejoin="round" marker-end="url(#a0B7C8C)"/><text x="304" y="139" font-size="9" fill="#0B7C8C" text-anchor="start">cooling water</text><polyline points="215,150 255,156" stroke="#0B7C8C" stroke-width="0.8" fill="none" stroke-linejoin="round" stroke-dasharray="2 2"/><polyline points="215,165 255,171" stroke="#0B7C8C" stroke-width="0.8" fill="none" stroke-linejoin="round" stroke-dasharray="2 2"/><polyline points="215,180 255,186" stroke="#0B7C8C" stroke-width="0.8" fill="none" stroke-linejoin="round" stroke-dasharray="2 2"/><polyline points="215,195 255,201" stroke="#0B7C8C" stroke-width="0.8" fill="none" stroke-linejoin="round" stroke-dasharray="2 2"/><polyline points="235,230 235,300" stroke="#0B7C8C" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#a0B7C8C)"/><text x="242" y="296" font-size="9" fill="#0B7C8C" text-anchor="start">condensate + water (barometric leg / pump)</text><polyline points="250,120 250,60 330,60 330,150 420,150 420,104" stroke="#1E2B3A" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#a1E2B3A)"/><text x="335" y="170" font-size="9" fill="#55667D" text-anchor="start">non-condensables + residual vapour only</text><polyline points="520,90 590,90 590,120" stroke="#1E2B3A" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#a1E2B3A)"/><rect x="565" y="120" width="50" height="70" rx="8" stroke="#1E2B3A" stroke-width="1.6" fill="#E6F4F6"/><text x="590" y="205" font-size="10" fill="#0B7C8C" text-anchor="middle">after-condenser</text><polyline points="590,120 590,120" stroke="#1E2B3A" stroke-width="1" fill="none" stroke-linejoin="round"/><polyline points="615,135 660,135 660,110" stroke="#55667D" stroke-width="1.4" fill="none" stroke-linejoin="round" marker-end="url(#a55667D)"/><text x="664" y="106" font-size="9" fill="#55667D" text-anchor="start">vent</text><text x="40" y="40" font-size="10" fill="#55667D" text-anchor="start">The intercondenser removes the 1st-stage motive steam and condensables, so the 2nd stage compresses only the gas.</text></svg>