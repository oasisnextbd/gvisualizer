<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Helvetica, Arial, sans-serif"><title>Compounding of impulse turbines: pressure and absolute steam velocity along the stages</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="10.0" y="22.0" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="bold">(a) Velocity compounding (Curtis)</text><rect x="80.0" y="32.0" width="34.0" height="26.0" rx="0" fill="#F7F1E1" stroke="#1E2B3A" stroke-width="1.2"/><text x="97.0" y="49.0" font-size="10" text-anchor="middle" fill="#1E2B3A" font-weight="normal">N</text><rect x="124.0" y="32.0" width="34.0" height="26.0" rx="0" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.2"/><text x="141.0" y="49.0" font-size="10" text-anchor="middle" fill="#1E2B3A" font-weight="normal">M</text><rect x="168.0" y="32.0" width="34.0" height="26.0" rx="0" fill="#EEF0F3" stroke="#1E2B3A" stroke-width="1.2"/><text x="185.0" y="49.0" font-size="10" text-anchor="middle" fill="#1E2B3A" font-weight="normal">F</text><rect x="212.0" y="32.0" width="34.0" height="26.0" rx="0" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.2"/><text x="229.0" y="49.0" font-size="10" text-anchor="middle" fill="#1E2B3A" font-weight="normal">M</text><line x1="80.0" y1="125.0" x2="256.0" y2="125.0" stroke="#1E2B3A" stroke-width="1.4"/><line x1="80.0" y1="65.0" x2="80.0" y2="125.0" stroke="#1E2B3A" stroke-width="1.4"/><polyline points="80.0,65.0 124.0,119.0 124.0,119.0 168.0,119.0 168.0,119.0 212.0,119.0 212.0,119.0 256.0,119.0" fill="none" stroke="#D2552B" stroke-width="2" stroke-linejoin="round"/><polyline points="80.0,122.0 124.0,65.0 124.0,65.0 168.0,92.0 168.0,92.0 212.0,92.0 212.0,92.0 256.0,119.0" fill="none" stroke="#0B7C8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 3"/><text x="330.0" y="70.0" font-size="10" text-anchor="start" fill="#1E2B3A" font-weight="normal">whole pressure drop in one nozzle row; velocity</text><text x="330.0" y="84.0" font-size="10" text-anchor="start" fill="#1E2B3A" font-weight="normal">absorbed in 2–3 moving rows with guide blades</text><text x="330.0" y="98.0" font-size="10" text-anchor="start" fill="#1E2B3A" font-weight="normal">between → short, cheap, lower efficiency</text><text x="10.0" y="152.0" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="bold">(b) Pressure compounding (Rateau)</text><rect x="80.0" y="162.0" width="34.0" height="26.0" rx="0" fill="#F7F1E1" stroke="#1E2B3A" stroke-width="1.2"/><text x="97.0" y="179.0" font-size="10" text-anchor="middle" fill="#1E2B3A" font-weight="normal">N</text><rect x="124.0" y="162.0" width="34.0" height="26.0" rx="0" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.2"/><text x="141.0" y="179.0" font-size="10" text-anchor="middle" fill="#1E2B3A" font-weight="normal">M</text><rect x="168.0" y="162.0" width="34.0" height="26.0" rx="0" fill="#F7F1E1" stroke="#1E2B3A" stroke-width="1.2"/><text x="185.0" y="179.0" font-size="10" text-anchor="middle" fill="#1E2B3A" font-weight="normal">N</text><rect x="212.0" y="162.0" width="34.0" height="26.0" rx="0" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.2"/><text x="229.0" y="179.0" font-size="10" text-anchor="middle" fill="#1E2B3A" font-weight="normal">M</text><rect x="256.0" y="162.0" width="34.0" height="26.0" rx="0" fill="#F7F1E1" stroke="#1E2B3A" stroke-width="1.2"/><text x="273.0" y="179.0" font-size="10" text-anchor="middle" fill="#1E2B3A" font-weight="normal">N</text><rect x="300.0" y="162.0" width="34.0" height="26.0" rx="0" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.2"/><text x="317.0" y="179.0" font-size="10" text-anchor="middle" fill="#1E2B3A" font-weight="normal">M</text><line x1="80.0" y1="255.0" x2="344.0" y2="255.0" stroke="#1E2B3A" stroke-width="1.4"/><line x1="80.0" y1="195.0" x2="80.0" y2="255.0" stroke="#1E2B3A" stroke-width="1.4"/><polyline points="80.0,195.0 124.0,213.0 124.0,213.0 168.0,213.0 168.0,213.0 212.0,231.0 212.0,231.0 256.0,231.0 256.0,231.0 300.0,249.0 300.0,249.0 344.0,249.0" fill="none" stroke="#D2552B" stroke-width="2" stroke-linejoin="round"/><polyline points="80.0,249.0 124.0,219.0 124.0,219.0 168.0,249.0 168.0,249.0 212.0,219.0 212.0,219.0 256.0,249.0 256.0,249.0 300.0,219.0 300.0,219.0 344.0,249.0" fill="none" stroke="#0B7C8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 3"/><text x="360.0" y="200.0" font-size="10" text-anchor="start" fill="#1E2B3A" font-weight="normal">pressure dropped in several nozzle rows, each followed</text><text x="360.0" y="214.0" font-size="10" text-anchor="start" fill="#1E2B3A" font-weight="normal">by one moving row → low steam and blade speed,</text><text x="360.0" y="228.0" font-size="10" text-anchor="start" fill="#1E2B3A" font-weight="normal">high efficiency, long machine</text><text x="10.0" y="282.0" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="bold">(c) Pressure–velocity compounding</text><rect x="80.0" y="292.0" width="34.0" height="26.0" rx="0" fill="#F7F1E1" stroke="#1E2B3A" stroke-width="1.2"/><text x="97.0" y="309.0" font-size="10" text-anchor="middle" fill="#1E2B3A" font-weight="normal">N</text><rect x="124.0" y="292.0" width="34.0" height="26.0" rx="0" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.2"/><text x="141.0" y="309.0" font-size="10" text-anchor="middle" fill="#1E2B3A" font-weight="normal">M</text><rect x="168.0" y="292.0" width="34.0" height="26.0" rx="0" fill="#EEF0F3" stroke="#1E2B3A" stroke-width="1.2"/><text x="185.0" y="309.0" font-size="10" text-anchor="middle" fill="#1E2B3A" font-weight="normal">F</text><rect x="212.0" y="292.0" width="34.0" height="26.0" rx="0" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.2"/><text x="229.0" y="309.0" font-size="10" text-anchor="middle" fill="#1E2B3A" font-weight="normal">M<