="505.0" y="404.0" font-size="10" text-anchor="start" fill="#D2552B" font-weight="normal">pressure</text><line x1="575.0" y1="400.0" x2="605.0" y2="400.0" stroke="#0B7C8C" stroke-width="2" stroke-dasharray="6 3"/><text x="610.0" y="404.0" font-size="10" text-anchor="start" fill="#0B7C8C" font-weight="normal">absolute velocity</text><text x="250.0" y="404.0" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">N nozzle (fixed)   M moving blades   F fixed guide blades</text></svg>