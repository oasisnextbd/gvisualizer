<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 495" width="720" height="495" font-family="Helvetica, Arial, sans-serif"><title>Steam turbines classified by steam path: condensing, back-pressure, extraction, induction</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="10.0" y="10.0" width="345.0" height="220.0" rx="6" fill="none" stroke="#9AA8B8" stroke-width="1"/><text x="182.0" y="28.0" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">(a) Straight condensing</text><polygon points="100.0,92.0 190.0,80.0 190.0,140.0 100.0,128.0" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round"/><line x1="190.0" y1="110.0" x2="212.0" y2="110.0" stroke="#1E2B3A" stroke-width="3"/><circle cx="222.0" cy="110.0" r="10.0" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.4"/><text x="222.0" y="114.0" font-size="9" text-anchor="middle" fill="#1E2B3A" font-weight="normal">G</text><line x1="40.0" y1="92.0" x2="100.0" y2="92.0" stroke="#D2552B" stroke-width="2" marker-end="url(#ar)"/><text x="50.0" y="82.0" font-size="10" text-anchor="middle" fill="#D2552B" font-weight="normal">HP steam</text><line x1="190.0" y1="140.0" x2="190.0" y2="170.0" stroke="#0B7C8C" stroke-width="2"/><rect x="150.0" y="170.0" width="80.0" height="30.0" rx="0" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.4"/><text x="190.0" y="189.0" font-size="10" text-anchor="middle" fill="#1E2B3A" font-weight="normal">condenser</text><text x="240.0" y="160.0" font-size="10" text-anchor="start" fill="#0B7C8C" font-weight="normal">exhaust at vacuum</text><text x="240.0" y="173.0" font-size="10" text-anchor="start" fill="#0B7C8C" font-weight="normal">(≈ 2–4 in Hg abs)</text><text x="182.0" y="220.0" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">max power per kg steam; exhaust heat lost</text><rect x="365.0" y="10.0" width="345.0" height="220.0" rx="6" fill="none" stroke="#9AA8B8" stroke-width="1"/><text x="537.0" y="28.0" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">(b) Back-pressure (non-condensing)</text><polygon points="455.0,92.0 545.0,80.0 545.0,140.0 455.0,128.0" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round"/><line x1="545.0" y1="110.0" x2="567.0" y2="110.0" stroke="#1E2B3A" stroke-width="3"/><circle cx="577.0" cy="110.0" r="10.0" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.4"/><text x="577.0" y="114.0" font-size="9" text-anchor="middle" fill="#1E2B3A" font-weight="normal">G</text><line x1="395.0" y1="92.0" x2="455.0" y2="92.0" stroke="#D2552B" stroke-width="2" marker-end="url(#ar)"/><text x="405.0" y="82.0" font-size="10" text-anchor="middle" fill="#D2552B" font-weight="normal">HP steam</text><line x1="545.0" y1="140.0" x2="545.0" y2="175.0" stroke="#B7840A" stroke-width="2"/><line x1="545.0" y1="175.0" x2="655.0" y2="175.0" stroke="#B7840A" stroke-width="2" marker-end="url(#ar)"/><text x="600.0" y="168.0" font-size="10" text-anchor="middle" fill="#B7840A" font-weight="normal">LP steam to process</text><text x="537.0" y="220.0" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">all exhaust used for heating (cogeneration)</text><rect x="10.0" y="245.0" width="345.0" height="220.0" rx="6" fill="none" stroke="#9AA8B8" stroke-width="1"/><text x="182.0" y="263.0" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">(c) Extraction (bleeder) condensing</text><polygon points="80.0,317.0 140.0,307.0 140.0,373.0 80.0,363.0" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round"/><polygon points="150.0,307.0 220.0,295.0 220.0,385.0 150.0,373.0" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round"/><text x="110.0" y="344.0" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">HP</text><text x="185.0" y="344.0" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">LP</text><line x1="220.0" y1="340.0" x2="242.0" y2="340.0" stroke="#1E2B3A" stroke-width="3"/><circle cx="252.0" cy="340.0" r="10.0" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.4"/><text x="252.0" y="344.0" font-size="9" text-anchor="middle" fill="#1E2B3A" font-weight="normal">G</text><line x1="30.0" y1="325.0" x2="80.0" y2="325.0" stroke="#D2552B" stroke-width="2" marker-end="url(#ar)"/><text x="40.0" y="315.0" font-size="10" text-anchor="middle" fill="#D2552B" font-weight="normal">HP</text><line x1="145.0" y1="370.0" x2="145.0" y2="420.0" stroke="#B7840A" stroke-width="2"/><line x1="145.0" y1="420.0" x2="70.0" y2="420.0" stroke="#B7840A" stroke-width="2" marker-end="url(#ar)"/><text x="80.0" y="413.0" font-size="10" text-anchor="middle" fill="#B7840A" font-weight="normal">MP steam out</text><line x1="210.0" y1="385.0" x2="210.0" y2="415.0" stroke="#0B7C8C" stroke-width="2"/><rect x="185.0" y="415.0" width="70.0" height="24.0" rx="0" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.4"/><text x="220.0" y="431.0" font-size="9" text-anchor="middle" fill="#1E2B3A" font-weight="normal">condenser</text><text x="182.0" y="457.0" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">steam withdrawn part-way at controlled pressure</text><rect x="365.0" y="245.0" width="345.0" height="220.0" rx="6" fill="none" stroke="#9AA8B8" stroke-width="1"/><text x="537.0" y="263.0" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">(d) Induction (mixed-pressure)</text><polygon points="435.0,317.0 495.0,307.0 495.0,373.0 435.0,363.0" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round"/><polygon points="505.0,307.0 575.0,295.0 575.0,385.0 505.0,373.0" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round"/><line x1="575.0" y1="340.0" x2="597.0" y2="340.0" stroke="#1E2B3A" stroke-width="3"/><circle cx="607.0" cy="340.0" r="10.0" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.4"/><text x="607.0" y="344.0" font-size="9" text-anchor="middle" fill="#1E2B3A" font-weight="normal">G</text><line x1="385.0" y1="325.0" x2="435.0" y2="325.0" stroke="#D2552B" stroke-width="2" marker-end="url(#ar)"/><text x="395.0" y="315.0" font-size="10" text-anchor="middle" fill="#D2552B" font-weight="normal">HP</text><line x1="425.0" y1="420.0" x2="500.0" y2="420.0" stroke="#B7840A" stroke-width="2"/><line x1="500.0" y1="420.0" x2="500.0" y2="373.0" stroke="#B7840A" stroke-width="2" marker-end="url(#ar)"/><text x="445.0" y="413.0" font-size="10" text-anchor="middle" fill="#B7840A" font-weight="normal">surplus LP steam in</text><line x1="565.0" y1="385.0" x2="565.0" y2="415.0" stroke="#0B7C8C" stroke-width="2"/><rect x="540.0" y="415.0" width="70.0" height="24.0" rx="0" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.4"/><text x="575.0" y="431.0" font-size="9" text-anchor="middle" fill="#1E2B3A" font-weight="normal">condenser</text><text x="537.0" y="457.0" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">waste low-pressure steam admitted to later stages</text><text x="360.0" y="487.0" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">Also by flow direction: axial (most common), radial (Ljungström) and tangential (Terry) machines; single- or multi-casing.</text></svg>