<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="Helvetica, Arial, sans-serif"><title>Steam turbine classification by steam path: condensing, back-pressure, extraction, induction, reheat and double-flow</title><defs><marker id="a0B7C8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="a55667D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="aB7840A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="aD2552B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="10" y="10" width="220" height="220" rx="6" stroke="#9AA8B8" stroke-width="1" fill="none"/><text x="120" y="30" font-size="11" fill="#1E2B3A" text-anchor="middle" font-weight="bold">(a) Straight condensing</text><rect x="250" y="10" width="220" height="220" rx="6" stroke="#9AA8B8" stroke-width="1" fill="none"/><text x="360" y="30" font-size="11" fill="#1E2B3A" text-anchor="middle" font-weight="bold">(b) Back-pressure (non-condensing)</text><rect x="490" y="10" width="220" height="220" rx="6" stroke="#9AA8B8" stroke-width="1" fill="none"/><text x="600" y="30" font-size="11" fill="#1E2B3A" text-anchor="middle" font-weight="bold">(c) Extraction–condensing</text><rect x="10" y="240" width="220" height="220" rx="6" stroke="#9AA8B8" stroke-width="1" fill="none"/><text x="120" y="260" font-size="11" fill="#1E2B3A" text-anchor="middle" font-weight="bold">(d) Induction (mixed pressure)</text><rect x="250" y="240" width="220" height="220" rx="6" stroke="#9AA8B8" stroke