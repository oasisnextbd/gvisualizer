<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" font-family="Helvetica, Arial, sans-serif"><title>Ball at the shell of a rotating mill: forces at the critical speed</title><defs><marker id="a0B7C8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="aB7840A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="aD2552B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><circle cx="230" cy="210" r="150" stroke="#1E2B3A" stroke-width="3" fill="none"/><circle cx="230" cy="210" r="5" stroke="#1E2B3A" stroke-width="1.6" fill="#1E2B3A"/><circle cx="296" cy="95.6846" r="18" stroke="#1E2B3A" stroke-width="1.5" fill="#9AA8B8"/><line x1="230" y1="210" x2="296" y2="95.6846" stroke="#55667D" stroke-width="1" stroke-dasharray="4 3"/><text x="275" y="162.842" font-size="11" fill="#55667D" text-anchor="start">R − r</text><line x1="230" y1="210" x2="230" y2="60" stroke="#55667D" stroke-width="1" stroke-dasharray="4 3"/><path d="M230,160 A50,50 0 0 1 255,166.699" stroke="#55667D" stroke-width="1" fill="none" stroke-linejoin="round"/><text x="246" y="154" font-size="13" fill="#55667D" text-anchor="start">α</text><line x1="296" y1="95.6846" x2="296" y2="175.685" stroke="#D2552B" stroke-width="2.2" marker-end="url(#aD2552B)"/><text x="302" y="175.685" font-size="12" fill="#D2552B" text-anchor="start">mg</text><line x1="296" y1="95.6846" x2="331" y2="35.0629" stroke="#0B7C8C" stroke-width="2.2" marker-end="url(#a0B7C8C)"/><text x="337" y="31.0629" font-size="12" fill="#0B7C8C" text-anchor="start">m ω²(R − r)</text><line x1="296" y1="95.6846" x2="268.5" y2="143.316" stroke="#B7840A" stroke-width="1.8" marker-end="url(#aB7840A)"/><text x="193.5" y="159.316" font-size="11" fill="#B7840A" text-anchor="start">mg cos α</text><path d="M89.6929,305.989 A170,170 0 0 0 370.307,305.989" stroke="#0B7C8C" stroke-width="1.4" fill="none" stroke-linejoin="round" marker-end="url(#a0B7C8C)"/><text x="380" y="390" font-size="11" fill="#0B7C8C" text-anchor="start">shell rotates at n</text><text x="400" y="110" font-size="11" fill="#1E2B3A" text-anchor="start">Ball stays on the</text><text x="400" y="123.75" font-size="11" fill="#1E2B3A" text-anchor="start">wall while</text><text x="400" y="137.5" font-size="11" fill="#1E2B3A" text-anchor="start">m ω²(R−r) ≥ mg cos α</text><text x="400" y="151.25" font-size="11" fill="#1E2B3A" text-anchor="start"></text><text x="400" y="165" font-size="11" fill="#1E2B3A" text-anchor="start">Critical (α = 0, top):</text><text x="400" y="178.75" font-size="11" fill="#1E2B3A" text-anchor="start">ω_c² (R − r) = g</text><text x="400" y="192.5" font-size="11" fill="#1E2B3A" text-anchor="start">n_c = (1/2π)√(g/(R−r))</text></svg>