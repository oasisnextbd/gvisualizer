<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" font-family="Helvetica, Arial, sans-serif"><title>Flow patterns in agitated vessels: unbaffled swirl and vortex, baffled radial-flow turbine, baffled axial-flow propeller</title><defs><marker id="a1E2B3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="a55667D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="aD2552B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="a0B7C8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="aB7840A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="a6A4FC9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4FC9"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="20" y="80" width="180" height="230" rx="0" stroke="#1E2B3A" stroke-width="1.8" fill="none"/><text x="110" y="340" font-size="11" fill="#1E2B3A" text-anchor="middle" font-weight="bold">(a) Unbaffled: swirl + vortex</text><path d="M20,110 Q80,110 110,190 Q140,110 200,110" stroke="#0B7C8C" stroke-width="1.8" fill="none"/><polyline points="110,40 110,240" stroke="#55667D" stroke-width="2.4" fill="none" stroke-linejoin="round"/><rect x="80" y="236" width="60" height="8" rx="0" stroke="#1E2B3A" stroke-width="1" fill="#1E2B3A"/><ellipse cx="110" cy="270" rx="70" ry="14" stroke="#0B7C8C" stroke-width="1.6" fill="none"/><text x="110" y="300" font-size="9" fill="#0B7C8C" text-anchor="middle">liquid rotates as a whole</text><polyline points="60,262 70,258" stroke="#0B7C8C" stroke-width="1.4" fill="none" stroke-linejoin="round" marker-end="url(#a0B7C8C)"/><rect x="260" y="80" width="180" height="230" rx="0" stroke="#1E2B3A" stroke-width="1.8" fill="none"/><rect x="262" y="90" width="8" height="210" rx="0" stroke="#55667D" stroke-width="1" fill="#D5DCE4"/><rect x="430" y="90" width="8" height="210" rx="0" stroke="#55667D" stroke-width="1" fill="#D5DCE4"/><text x="350" y="340" font-size="11" fill="#1E2B3A" text-anchor="middle" font-weight="bold">(b) Baffled, flat-blade turbine (radial)</text><polyline points="350,40 350,230" stroke="#55667D" stroke-width="2.4" fill="none" stroke-linejoin="round"/><rect x="320" y="226" width="60" height="10" rx="0" stroke="#1E2B3A" stroke-width="1" fill="#1E2B3A"/><path d="M318,231 C270,231 270,231 272,180 C274,130 310,130 314,190" stroke="#0B7C8C" stroke-width="1.6" fill="none" marker-end="url(#a0B7C8C)"/><path d="M318,236 C270,236 270,240 280,280 C290,305 310,300 314,250" stroke="#0B7C8C" stroke-width="1.6" fill="none" marker-end="url(#a0B7C8C)"/><path d="M382,231 C430,231 430,231 428,180 C426,130 390,130 386,190" stroke="#0B7C8C" stroke-width="1.6" fill="none" marker-end="url(#a0B7C8C)"/><path d="M382,236 C430,236 430,240 420,280 C410,305 390,300 386,250" stroke="#0B7C8C" stroke-width="1.6" fill="none" marker-end="url(#a0B7C8C)"/><text x="350" y="72" font-size="9" fill="#0B7C8C" text-anchor="middle">jet to wall splits: two circulation loops</text><rect x="500" y="80" width="180" height="230" rx="0" stroke="#1E2B3A" stroke-width="1.8" fill="none"/><rect x="502" y="90" width="8" height="210" rx="0" stroke="#55667D" stroke-width="1" fill="#D5DCE4"/><rect x="670" y="90" width="8" height="210" rx="0" stroke="#55667D" stroke-width="1" fill="#D5DCE4"/><text x="590" y="340" font-size="11" fill="#1E2B3A" text-anchor="middle" font-weight="bold">(c) Baffled, propeller (axial)</text><polyline points="590,40 590,220" stroke="#55667D" stroke-width="2.4" fill="none" stroke-linejoin="round"/><ellipse cx="590" cy="222" rx="26" ry="6" stroke="#1E2B3A" stroke-width="1" fill="#1E2B3A"/><path d="M582,230 C570,290 520,300 516,270 C514,200 516,120 540,120 C566,120 576,140 578,200" stroke="#0B7C8C" stroke-width="1.6" fill="none" marker-end="url(#a0B7C8C)"/><path d="M598,230 C610,290 660,300 664,270 C666,200 664,120 640,120 C614,120 604,140 602,200" stroke="#0B7C8C" stroke-width="1.6" fill="none" marker-end="url(#a0B7C8C)"/><text x="590" y="72" font-size="9" fill="#0B7C8C" text-anchor="middle">flow down the axis, up the walls</text><text x="350" y="26" font-size="11" fill="#55667D" text-anchor="middle">Baffles (width about Dt/12) stop the swirl, kill the vortex and turn rotation into top-to-bottom circulation</text></svg>