<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="Helvetica, Arial, sans-serif"><title>Closed-circuit grinding: mill with a classifier returning oversize</title><defs><marker id="a1E2B3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="s1E2B3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="a55667D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="s55667D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="a9AA8B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><marker id="s9AA8B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><marker id="aD2552B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="sD2552B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="a0B7C8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="s0B7C8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="aB7840A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="sB7840A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="a6A4FC9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4FC9"/></marker><marker id="s6A4FC9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4FC9"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><line x1="20.0" y1="140.0" x2="90.0" y2="140.0" stroke="#B7840A" stroke-width="2" marker-end="url(#aB7840A)"/><text x="22.0" y="132.0" font-size="10" text-anchor="start" fill="#B7840A">fresh feed F</text><rect x="90.0" y="110.0" width="120.0" height="60.0" rx="5" stroke="(free crushing)" stroke-width="1.6" fill="#F3F6F9"/><text x="150.0" y="144.0" font-size="11" text-anchor="middle" fill="(free crushing)" font-weight="bold">Ball / rod mill</text><line x1="210.0" y1="140.0" x2="280.0" y2="140.0" stroke="#B7840A" stroke-width="2" marker-end="url(#aB7840A)"/><text x="245.0" y="132.0" font-size="9" text-anchor="middle" fill="#B7840A">mill discharge</text><text x="245.0" y="158.0" font-size="9" text-anchor="middle" fill="#B7840A">F + R</text><rect x="280.0" y="105.0" width="140.0" height="70.0" rx="5" stroke="(hydrocyclone, air classifier)" stroke-width="1.6" fill="#F3F6F9"/><text x="350.0" y="144.0" font-size="11" text-anchor="middle" fill="(hydrocyclone, air classifier)" font-weight="bold">Classifier / screen</text><line x1="420.0" y1="140.0" x2="520.0" y2="140.0" stroke="#0B7C8C" stroke-width="2" marker-end="url(#a0B7C8C)"/><text x="470.0" y="132.0" font-size="10" text-anchor="middle" fill="#0B7C8C">fines = product F</text><rect x="520.0" y="115.0" width="130.0" height="50.0" rx="5" stroke="#0B7C8C" stroke-width="1.6" fill="#DCEFF2"/><text x="585.0" y="140.0" font-size="11" text-anchor="middle" fill="#0B7C8C" font-weight="bold">Product</text><text x="585.0" y="154.0" font-size="9" text-anchor="middle" fill="#55667D">to storage / next step</text><polyline points="350.0,175.0 350.0,240.0 150.0,240.0 150.0,172.0" stroke="#D2552B" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#aD2552B)"/><text x="250.0" y="256.0" font-size="10" text-anchor="middle" fill="#D2552B">oversize recycled R (circulating load R/F ≈ 1–4)</text><text x="340.0" y="40.0" font-size="10" text-anchor="middle" fill="#55667D">Feed rate kept low; product removed as soon as it is fine enough:</text><text x="340.0" y="56.0" font-size="10" text-anchor="middle" fill="#55667D">less over-grinding, narrower size distribution, lower energy than open circuit</text></svg>