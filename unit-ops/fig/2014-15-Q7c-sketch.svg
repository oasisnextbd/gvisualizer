ing</text><rect x="96.0" y="128.0" width="14.0" height="24.0" rx="0" stroke="#55667D" stroke-width="1" fill="#9AA8B8"/><text x="100.0" y="120.0" font-size="9" text-anchor="end" fill="#55667D">seal</text><text x="350.0" y="284.0" font-size="10" text-anchor="middle" fill="#1E2B3A">H_total ≈ Σ stage heads (same Q through every stage); n identical stages give ≈ n × single-stage head</text></svg>