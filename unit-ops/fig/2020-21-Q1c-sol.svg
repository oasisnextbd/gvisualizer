<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Helvetica, Arial, sans-serif"><title>Double-effect backward-feed NaOH evaporator: converged trial</title><defs><marker id="a0B7C8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="a55667D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="aD2552B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="140" y="90" width="170" height="200" rx="6" stroke="#1E2B3A" stroke-width="1.6" fill="#F3F6F9"/><text x="225" y="110" font-size="13" fill="#1E2B3A" text-anchor="middle" font-weight="bold">Effect I</text><text x="150" y="132" font-size="11" fill="#1E2B3A" text-anchor="start">50 % NaOH boils at 251.1 °F</text><text x="150" y="145.75" font-size="11" fill="#1E2B3A" text-anchor="start">vapour space 175.7 °F</text><text x="150" y="159.5" font-size="11" fill="#1E2B3A" text-anchor="start">(6.86 psia), BPE 75.4 °F</text><text x="150" y="173.25" font-size="11" fill="#1E2B3A" text-anchor="start">ΔT₁ = 358.4 − 251.1</text><text x="150" y="187" font-size="11" fill="#1E2B3A" text-anchor="start">     = 107.3 °F</text><text x="150" y="200.75" font-size="11" fill="#1E2B3A" text-anchor="start">U₁ = 400, A = 2000 ft²</text><text x="150" y="214.5" font-size="11" fill="#1E2B3A" text-anchor="start">q₁ = 85.9 × 10⁶ Btu/h</text><rect x="420" y="90" width="170" height="200" rx="6" stroke="#1E2B3A" stroke-width="1.6" fill="#F3F6F9"/><text x="505" y="110" font-size="13" fill="#1E2B3A" text-anchor="middle" font-weight="bold">Effect II</text><text x="430" y="132" font-size="11" fill="#1E2B3A" text-anchor="start"