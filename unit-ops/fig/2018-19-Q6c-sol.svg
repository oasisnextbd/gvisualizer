<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="Helvetica, Arial, sans-serif"><title>Draft-tube-baffle (DTB) crystallizer</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><path d="M140,120 L140,330 L220,420 L300,420 L380,330 L380,120 Q380,80 340,80 L180,80 Q140,80 140,120 Z" fill="#FAFBFC" stroke="#1E2B3A" stroke-width="2" stroke-linejoin="round"/><line x1="140.0" y1="150.0" x2="380.0" y2="150.0" stroke="#0B7C8C" stroke-width="1.2" stroke-dasharray="5 3"/><text x="375.0" y="145.0" font-size="9" text-anchor="end" fill="#0B7C8C" font-weight="normal">boiling surface</text><rect x="230.0" y="165.0" width="60.0" height="200.0" rx="0" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.6"/><text x="260.0" y="260.0" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">draft</text><text x="260.0" y="273.0" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">tube</text><line x1="260.0" y1="420.0" x2="260.0" y2="340.0" stroke="#1E2B3A" stroke-width="2.4"/><path d="M236,345 L284,355 M236,355 L284,345" fill="none" stroke="#1E2B3A" stroke-width="2.4" stroke-linejoin="round"/><line x1="260.0" y1="420.0" x2="260.0" y2="450.0" stroke="#1E2B3A" stroke-width="2.4"/><rect x="246.0" y="450.0" width="28.0" height="16.0" rx="0" fill="#D8DEE6" stroke="#1E2B3A" stroke-width="1.4"/><text x="282.0" y="462.0" font-size="9" text-anchor="start" fill="#55667D" font-weight="normal">agitator drive</text><line x1="260.0" y1="300.0" x2="260.0" y2="170.0" stroke="#0B7C8C" stroke-width="1.6" marker-end="url(#ar)"/><path d="M220,175 Q200,250 220,330" fill="none" stroke="#0B7C8C" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ar)"/><path d="M300,175 Q320,250 300,330" fill="none" stroke="#0B7C8C" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ar)"/><line x1="175.0" y1="200.0" x2="175.0" y2="370.0" stroke="#6A4FC9" stroke-width="2.4"/><line x1="345.0" y1="200.0" x2="345.0" y2="370.0" stroke="#6A4FC9" stroke-width="2.4"/><text x="158.0" y="215.0" font-size="9" text-anchor="end" fill="#6A4FC9" font-weight="normal">baffle</text><text x="360.0" y="300.0" font-size="9" text-anchor="start" fill="#B7840A" font-weight="normal">settling</text><text x="360.0" y="312.0" font-size="9" text-anchor="start" fill="#B7840A" font-weight="normal">zone</text><line x1="362.0" y1="250.0" x2="362.0" y2="205.0" stroke="#B7840A" stroke-width="1.2" marker-end="url(#ar)"/><line x1="380.0" y1="190.0" x2="460.0" y2="190.0" stroke="#B7840A" stroke-width="1.8" marker-end="url(#ar)"/><line x1="460.0" y1="190.0" x2="460.0" y2="400.0" stroke="#B7840A" stroke-width="1.8"/><rect x="440.0" y="290.0" width="40.0" height="30.0" rx="0" fill="#FBEDE7" stroke="#1E2B3A" stroke-width="1.4"/><text x="460.0" y="309.0" font-size="9" text-anchor="middle" fill="#1E2B3A" font-weight="normal">heater</text><text x="470.0" y="260.0" font-size="10" text-anchor="start" fill="#B7840A" font-weight="normal">fines</text><text x="470.0" y="272.0" font-size="10" text-anchor="start" fill="#B7840A" font-weight="normal">dissolved</text><line x1="460.0" y1="400.0" x2="300.0" y2="400.0" stroke="#B7840A" stroke-width="1.8" marker-end="url(#ar)"/><circle cx="420.0" cy="400.0" r="9.0" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.3"/><text x="420.0" y="425.0" font-size="10" text-anchor="middle" fill="#B7840A" font-weight="normal">feed + recycle in</text><line x1="505.0" y1="400.0" x2="470.0" y2="400.0" stroke="#1E2B3A" stroke-width="1.6"/><text x="550.0" y="404.0" font-size="10" text-anchor="middle" fill="#1E2B3A" font-weight="normal">feed</text><line x1="220.0" y1="420.0" x2="220.0" y2="445.0" stroke="#1E2B3A" stroke-width="1.8"/><line x1="220.0" y1="445.0" x2="130.0" y2="445.0" stroke="#1E2B3A" stroke-width="1.8" marker-end="u