<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Helvetica, Arial, sans-serif"><title>Ideal settling basin: critical and slower particle trajectories</title><defs><marker id="a1E2B3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="a55667D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="aD2552B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="a0B7C8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="aB7840A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="a6A4FC9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4FC9"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="90" y="70" width="470" height="180" rx="0" stroke="#1E2B3A" stroke-width="2" fill="#EEF4F7"/><rect x="90" y="250" width="470" height="14" rx="0" stroke="#55667D" stroke-width="1.2" fill="#D9DEE5"/><text x="325" y="261" font-size="10" fill="#55667D" text-anchor="middle">sludge zone</text><polyline points="5,95 50,95" stroke="#0B7C8C" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#a0B7C8C)"/><polyline points="5,140 50,140" stroke="#0B7C8C" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#a0B7C8C)"/><polyline points="5,185 50,185" stroke="#0B7C8C" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#a0B7C8C)"/><polyline points="5,230 50,230" stroke="#0B7C8C" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#a0B7C8C)"/><text x="5" y="60" font-size="11" fill="#0B7C8C" text-anchor="start">Q = 0.6 m³/s</text><polyline points="590,90 635,90" stroke="#0B7C8C" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#a0B7C8C)"/><text x="588" y="80" font-size="10" fill="#0B7C8C" text-anchor="start">clear water</text><polyline points="90,72 560,250" stroke="#D2552B" stroke-width="2.2" fill="none" stroke-linejoin="round"/><text x="250" y="112" font-size="11" fill="#D2552B" text-anchor="middle" transform="rotate(21 250 112)">critical particle, V_c = Q/A = 0.005 m/s</text><polyline points="90,72 560,214" stroke="#6A4FC9" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-dasharray="6,4"/><text x="552" y="230" font-size="10" fill="#6A4FC9" text-anchor="end">0.004 m/s from top: escapes</text><polyline points="90,106 560,250" stroke="#B7840A" stroke-width="1.8" fill="none" stroke-linejoin="round"/><text x="130" y="140" font-size="10" fill="#B7840A" text-anchor="start" transform="rotate(13 130 140)">0.004 m/s entering 2.4 m above floor: just caught</text><polyline points="90,284 560,284" stroke="#55667D" stroke-width="1" fill="none" stroke-linejoin="round" marker-end="url(#a55667D)"/><polyline points="560,284 90,284" stroke="#55667D" stroke-width="1" fill="none" stroke-linejoin="round" marker-end="url(#a55667D)"/><text x="325" y="300" font-size="11" fill="#55667D" text-anchor="middle">L = 20 m (width W = 6 m)</text><polyline points="72,70 72,250" stroke="#55667D" stroke-width="1" fill="none" stroke-linejoin="round" marker-end="url(#a55667D)"/><polyline points="72,250 72,70" stroke="#55667D" stroke-width="1" fill="none" stroke-linejoin="round" marker-end="url(#a55667D)"/><text x="66" y="160" font-size="11" fill="#55667D" text-anchor="middle" transform="rotate(-90 66 160)">H = 3 m</text><polyline points="578,106 578,250" stroke="#B7840A" stroke-width="1" fill="none" stroke-linejoin="round" marker-end="url(#aB7840A)"/><polyline points="578,250 578,106" stroke="#B7840A" stroke-width="1" fill="none" stroke-linejoin="round" marker-end="url(#aB7840A)"/><text x="590" y="182" font-size="10" fill="#B7840A" text-anchor="start">2.4 m</text><text x="320" y="30" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">t_d = V/Q = 360/0.6 = 600 s;  removal = v_p/V_c = 0.004/0.005 = 80%</text></svg>