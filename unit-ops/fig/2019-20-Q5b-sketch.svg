<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="Helvetica, Arial, sans-serif"><title>Three steam-trap families: mechanical (float), thermostatic (bellows) and thermodynamic (disc)</title><defs><marker id="a0B7C8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="aD2552B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="10" y="10" width="226" height="310" rx="6" stroke="#9AA8B8" stroke-width="1" fill="none"/><text x="123" y="32" font-size="11.5" fill="#1E2B3A" text-anchor="middle" font-weight="bold">(a) Mechanical: ball float</text><rect x="247" y="10" width="226" height="310" rx="6" stroke="#9AA8B8" stroke-width="1" fill="none"/><text x="360" y="32" font-size="11.5" fill="#1E2B3A" text-anchor="middle" font-weight="bold">(b) Thermostatic: balanced bellows</text><rect x="484" y="10" width="226" height="310" rx="6" stroke="#9AA8B8" stroke-width="1" fill="none"/><text x="597" y="32" font-size="11.5" fill="#1E2B3A" text-anchor="middle" font-weight="bold">(c) Thermodynamic: disc</text><rect x="50" y="70" width="150" height="150" rx="14" stroke="#1E2B3A" stroke-width="1.8" fill="none"/><rect x="52" y="150" width="146" height="68" rx="0" stroke="none" stroke-width="0" fill="#D6EEF1"/><line x1="52" y1="150" x2="198" y2="150" stroke="#0B7C8C" stroke-width="1" stroke-dasharray="4 3"/><circle cx="140" cy="150" r="26" stroke="#1E2B3A" stroke-width="1.5" fill="#9AA8B8"/><line x1="114" y1="150" x2="80" y2="190" stroke="#1E2B3A" stroke-width="2"/><circle cx="78" cy="196" r="6" stroke="#D2552B" stroke-width="1.6" fill="#FBE3D9"/><line x1="15" y1="100" x2="48" y2="100" stroke="#D2552B" stroke-width="2" marker-end="url(#aD2552B)"/><text x="18" y="92" font-size="9.5" fill="#D2552B" text-anchor="start">steam + cond.</text><line x1="78" y1="222" x2="78" y2="250" stroke="#0B7C8C" stroke-width="2" marker-end="url(#a0B7C8C)"/><text x="88" y="248" font-size="9.5" fill="#0B7C8C" text-anchor="start">condensate out</text><text x="25" y="270" font-size="9.5" fill="#1E2B3A" text-anchor="start">float rises with condensate level</text><text x="25" y="281.875" font-size="9.5" fill="#1E2B3A" text-anchor="start">and opens the outlet valve;</text><text x="25" y="293.75" font-size="9.5" fill="#1E2B3A" text-anchor="start">steam cannot lift it (no level)</text><rect x="287" y="70" width="150" height="150" rx="14" stroke="#1E2B3A" stroke-width="1.8" fill="none"/><ellipse cx="362" cy="100" rx="30" ry="5" stroke="#B7840A" stroke-width="1.2" fill="#F6EBCB"/><ellipse cx="362" cy="110" rx="30" ry="5" stroke="#B7840A" stroke-width="1.2" fill="#F6EBCB"/><ellipse cx="362" cy="120" rx="30" ry="5" stroke="#B7840A" stroke-width="1.2" fill="#F6EBCB"/><ellipse cx="362" cy="130" rx="30" ry="5" stroke="#B7840A" stroke-width="1.2" fill="#F6EBCB"/><ellipse cx="362" cy="140" rx="30" ry="5" stroke="#B7840A" stroke-width="1.2" fill="#F6EBCB"/><ellipse cx="362" cy="150" rx="30" ry="5" stroke="#B7840A" stroke-width="1.2" fill="#F6EBCB"/><line x1="362" y1="155" x2="362" y2="185" stroke="#1E2B3A" stroke-width="2"/><polygon points="352,185 372,185 362,197" stroke="#1E2B3A" stroke-width="1.6" fill="#9AA8B8" stroke-linejoin="round"/><rect x="347" y="197" width="30" height="8" rx="0" stroke="#1E2B3A" stroke-width="1.6" fill="#1E2B3A"/><line x1="252" y1="120" x2="285" y2="120" stroke="#D2552B" stroke-width="2" marker-end="url(#aD2552B)"/><text x="255" y="112" font-size="9.5" fill="#D2552B" text-anchor="start">steam + cond.</text><line x1="362" y1="206" x2="362" y2="250" stroke="#0B7C8C" stroke-width="2" marker-end="url(#a0B7C8C)"/><text x="372" y="248" font-size="9.5" fill="#0B7C8C" text-anchor="start">condensate / air</text><text x="262" y="270" font-size="9.5" fill="#1E2B3A" text-anchor="start">fill expands at steam temperature</text><text x="262" y="281.875" font-size="9.5" fill="#1E2B3A" text-anchor="start">and closes the valve; cooler</text><text x="262" y="293.75" font-size="9.5" fill="#1E2B3A" text-anchor="start">condensate and air open it</text><rect x="524" y="110" width="150" height="70" rx="6" stroke="#1E2B3A" stroke-width="1.8" fill="#F3F6F9"/><rect x="544" y="88" width="110" height="22" rx="0" stroke="#1E2B3A" stroke-width="1.6" fill="#FFFFFF"/><text x="599" y="103" font-size="9" fill="#55667D" text-anchor="middle">control chamber</text><rect x="554" y="110" width="90" height="8" rx="0" stroke="#D2552B" stroke-width="1.2" fill="#FBE3D9"/><text x="599" y="135" font-size="10" fill="#D2552B" text-anchor="middle">disc</text><line x1="489" y1="160" x2="522" y2="160" stroke="#D2552B" stroke-width="2" marker-end="url(#aD2552B)"/><text x="492" y="152" font-size="9.5" fill="#D2552B" text-anchor="start">inlet</text><line x1="676" y1="160" x2="706" y2="160" stroke="#0B7C8C" stroke-width="2" marker-end="url(#a0B7C8C)"/><text x="664" y="200" font-size="9.5" fill="#0B7C8C" text-anchor="start">outlet</text><text x="499" y="250" font-size="9.5" fill="#1E2B3A" text-anchor="start">condensate lifts the disc; hot</text><text x="499" y="261.875" font-size="9.5" fill="#1E2B3A" text-anchor="start">condensate flashes, fast vapour</text><text x="499" y="273.75" font-size="9.5" fill="#1E2B3A" text-anchor="start">under the disc lowers p (Bernoulli)</text><text x="499" y="285.625" font-size="9.5" fill="#1E2B3A" text-anchor="start">and chamber pressure snaps it shut</text></svg>