="#FFFFFF" stroke-width="2"/><text x="33.0" y="479.1" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="48.0" y="479.0" font-size="12.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">Go up to the curve.</text><circle cx="33.0" cy="491.5" r="9" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="33.0" y="496.1" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="48.0" y="496.0" font-size="12.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">Go across to the left axis.</text><circle cx="33.0" cy="508.5" r="9" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="33.0" y="513.1" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="48.0" y="513.0" font-size="12.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">Read CD; then Re = √(CD·Re²/CD) and uₜ = Re μ/(Dₚ ρ).</text><text x="360.0" y="534.0" font-size="11" fill="#55667D" text-anchor="middle" font-weight="normal" font-style="italic">Redrawn from the standard sphere drag correlation CD = 24/Re (1 + 0.15 Re^0.687) + 0.42/(1 + 42 500 Re^−1.16),</text><text x="360.0" y="548.0" font-size="11" fill="#55667D" text-anchor="middle" font-weight="normal" font-style="italic">plotted on the axes of the paper's chart; in the exam read the printed chart — values may differ slightly.</text></svg>