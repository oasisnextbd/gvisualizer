<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="Helvetica, Arial, sans-serif"><title>Continuous vacuum crystallizer: flash evaporation gives adiabatic cooling and supersaturation</title><defs><marker id="a1E2B3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="a55667D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="aD2552B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="a0B7C8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="aB7840A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="a6A4FC9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4FC9"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><path d="M190,90 L190,280 L235,360 L265,360 L310,280 L310,90 Q250,60 190,90 Z" stroke="#1E2B3A" stroke-width="1.8" fill="#F4F7FA"/><polyline points="192,170 308,170" stroke="#0B7C8C" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-dasharray="4,3"/><text x="250" y="162" font-size="9" fill="#0B7C8C" text-anchor="middle">boiling surface</text><polyline points="250,74 250,40 420,40" stroke="#55667D" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#a55667D)"/><rect x="420" y="20" width="70" height="90" rx="0" stroke="#1E2B3A" stroke-width="1.6" fill="#FFFFFF"/><text x="455" y="60" font-size="9" fill="#1E2B3A" text-anchor="middle">Barometric</text><text x="455" y="72" font-size="9" fill="#1E2B3A" text-anchor="middle">condenser</text><polyline points="490,40 560,40" stroke="#55667D" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#a55667D)"/><text x="565" y="44" font-size="10" fill="#55667D" text-anchor="start">to steam-jet ejector</text><polyline points="530,70 490,70" stroke="#0B7C8C" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#a0B7C8C)"/><text x="535" y="74" font-size="10" fill="#0B7C8C" text-anchor="start">cooling water</text><polyline points="455,110 455,170" stroke="#0B7C8C" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#a0B7C8C)"/><text x="462" y="140" font-size="10" fill="#0B7C8C" text-anchor="start">water + condensate down</text><text x="462" y="152" font-size="10" fill="#0B7C8C" text-anchor="start">the barometric leg to hot well</text><text x="250" y="230" font-size="11" fill="#1E2B3A" text-anchor="middle" font-style="italic">magma</text><rect x="225" y="220" width="5" height="5" rx="0" stroke="#B7840A" stroke-width="0.8" fill="#B7840A"/><rect x="270" y="250" width="5" height="5" rx="0" stroke="#B7840A" stroke-width="0.8" fill="#B7840A"/><rect x="240" y="270" width="5" height="5" rx="0" stroke="#B7840A" stroke-width="0.8" fill="#B7840A"/><rect x="280" y="215" width="5" height="5" rx="0" stroke="#B7840A" stroke-width="0.8" fill="#B7840A"/><rect x="215" y="255" width="5" height="5" rx="0" stroke="#B7840A" stroke-width="0.8" fill="#B7840A"/><rect x="255" y="300" width="5" height="5" rx="0" stroke="#B7840A" stroke-width="0.8" fill="#B7840A"/><rect x="245" y="330" width="5" height="5" rx="0" stroke="#B7840A" stroke-width="0.8" fill="#B7840A"/><polyline points="250,360 250,400 110,400 110,300" stroke="#1E2B3A" stroke-width="1.8" fill="none" stroke-linejoin="round" marker-end="url(#a1E2B3A)"/><circle cx="110" cy="280" r="16" stroke="#D2552B" stroke-width="1.6" fill="#FBE3D9"/><text x="110" y="284" font-size="11" fill="#D2552B" text-anchor="middle" font-weight="bold">H</text><text x="80" y="260" font-size="10" fill="#D2552B" text-anchor="middle">heater</text><polyline points="110,264 110,130 186,130" stroke="#1E2B3A" stroke-width="1.8" fill="none" stroke-linejoin="round" marker-end="url(#a1E2B3A)"/><circle cx="170" cy="400" r="10" stroke="#1E2B3A" stroke-width="1.4" fill="#FFFFFF"/><text x="170" y="424" font-size="10" fill="#55667D" text-anchor="middle">circulating pump</text><polyline points="30,330 110,330" stroke="#D2552B" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#aD2552B)"/><text x="30" y="322" font-size="11" fill="#D2552B" text-anchor="start" font-weight="bold">Hot feed</text><polyline points="250,400 250,440 380,440" stroke="#1E2B3A" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#a1E2B3A)"/><text x="385" y="444" font-size="11" fill="#1E2B3A" text-anchor="start">Product magma to centrifuge</text><text x="400" y="250" font-size="10" fill="#1E2B3A" text-anchor="start">Feed enters well above the boiling point</text><text x="400" y="264" font-size="10" fill="#1E2B3A" text-anchor="start">at the vessel pressure; it flashes,</text><text x="400" y="278" font-size="10" fill="#1E2B3A" text-anchor="start">cooling itself adiabatically to the</text><text x="400" y="292" font-size="10" fill="#1E2B3A" text-anchor="start">equilibrium temperature. Sensible heat</text><text x="400" y="306" font-size="10" fill="#1E2B3A" text-anchor="start">+ heat of crystallization = latent heat</text><text x="400" y="320" font-size="10" fill="#1E2B3A" text-anchor="start">of the vapour: supersaturation comes</text><text x="400" y="334" font-size="10" fill="#1E2B3A" text-anchor="start">from cooling and evaporation together.</text></svg>