<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="Helvetica, Arial, sans-serif"><title>Total containment system: relief header, knockout drum, catch tank and treatment</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><path d="M30,110.0 A30.0,30.0 0 0 1 90,110.0 L90,190.0 A30.0,30.0 0 0 1 30,190.0 Z" fill="#FBEDE7" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round"/><text x="60.0" y="240.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="normal">Reactor</text><text x="60.0" y="254.0" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">(relief source)</text><line x1="60.0" y1="80.0" x2="60.0" y2="50.0" stroke="#1E2B3A" stroke-width="1.6"/><rect x="50.0" y="52.0" width="20.0" height="8.0" rx="0" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.3"/><text x="40.0" y="50.0" font-size="10" text-anchor="end" fill="#D2552B" font-weight="normal">PSV / RD</text><polyline points="60.0,52.0 60.0,20.0 170.0,20.0 170.0,98.0" fill="none" stroke="#D2552B" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#ar)"/><text x="115.0" y="14.0" font-size="10" text-anchor="middle" fill="#D2552B" font-weight="normal">relief header (two-phase)</text><path d="M170,100 L330,100 A30,30 0 0 1 330,160 L170,160 A30,30 0 0 1 170,100 Z" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round"/><path d="M150,145 L350,145" fill="none" stroke="#0B7C8C" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 3"/><text x="250.0" y="128.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="normal">Knockout / blowdown drum</text><text x="250.0" y="156.0" font-size="10" text-anchor="middle" fill="#0B7C8C" font-weight="normal">liquid</text><line x1="250.0" y1="160.0" x2="250.0" y2="200.0" stroke="#1E2B3A" stroke-width="1.6" marker-end="url(#ar)"/><rect x="205.0" y="200.0" width="90.0" height="50.0" rx="6" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.6"/><text x="250.0" y="222.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="normal">Catch tank</text><text x="250.0" y="238.0" font-size="9" text-anchor="middle" fill="#55667D" font-weight="normal">→ recycle / incinerate</text><line x1="330.0" y1="100.0" x2="330.0" y2="60.0" stroke="#0B7C8C" stroke-width="1.8"/><line x1="330.0" y1="60.0" x2="420.0" y2="60.0" stroke="#0B7C8C" stroke-width="1.8" marker-end="url(#ar)"/><text x="370.0" y="52.0" font-size="10" text-anchor="middle" fill="#0B7C8C" font-weight="normal">vapor</text><rect x="430.0" y="20.0" width="120.0" height="46.0" rx="5" fill="#F7F1E1" stroke="#1E2B3A" stroke-width="1.5"/><text x="490.0" y="40.0" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Condenser</text><text x="490.0" y="56.0" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">high boilers</text><line x1="420.0" y1="60.0" x2="425.0" y2="43.0" stroke="#0B7C8C" stroke-width="1.2" marker-end="url(#ar)"/><rect x="430.0" y="82.0" width="120.0" height="46.0" rx="5" fill="#F7F1E1" stroke="#1E2B3A" stroke-width="1.5"/><text x="490.0" y="102.0" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Scrubber</text><text x="490.0" y="118.0" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">toxic, acid gases</text><line x1="420.0" y1="60.0" x2="425.0" y2="105.0" stroke="#0B7C8C" stroke-width="1.2" marker-end="url(#ar)"/><rect x="430.0" y="144.0" width="120.0" height="46.0" rx="5" fill="#FBEDE7" stroke="#1E2B3A" stroke-width="1.5"/><text x="490.0" y="164.0" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Flare</text><text x="490.0" y="180.0" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">flammable</text><line x1="420.0" y1="60.0" x2="425.0" y2="167.0" stroke="#0B7C8C" stroke-width="1.2" marker-end="url(#ar)"/><rect x="430.0" y="206.0" width="120.0" height="46.0" rx="5" fill="#F7F1E1" stroke="#1E2B3A" stroke-width="1.5"/><text x="490.0" y="226.0" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Incinerator</text><text x="490.0" y="242.0" font-size="10" text-anchor="middle" fill="#55667D" font-weight="normal">combustible/toxic</text><line x1="420.0" y1="60.0" x2="425.0" y2="229.0" stroke="#0B7C8C" stroke-width="1.2" marker-end="url(#ar)"/><text x="625.0" y="60.0" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">Treated gas</text><text x="625.0" y="74.0" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">to atmosphere</text><line x1="552.0" y1="105.0" x2="600.0" y2="85.0" stroke="#55667D" stroke-width="1.2" marker-end="url(#ar)"/><text x="350.0" y="290.0" font-size="11" text-anchor="middle" fill="#55667D" font-weight="normal">Liquid is separated first (drum); vapor goes to the treatment unit that suits its hazard.</text></svg>