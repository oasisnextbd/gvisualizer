<text x="130.0" y="262.0" font-size="10.5" fill="#55667D" text-anchor="middle" font-weight="normal">dome convex toward process,</text>
<text x="130.0" y="276.0" font-size="10.5" fill="#55667D" text-anchor="middle" font-weight="normal">metal in compression</text>
