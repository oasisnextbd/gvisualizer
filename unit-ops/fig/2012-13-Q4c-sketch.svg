<text x="590.0" y="262.0" font-size="10.5" fill="#55667D" text-anchor="middle" font-weight="normal">petals fold back against</text>
<text x="590.0" y="276.0" font-size="10.5" fill="#55667D" text-anchor="middle" font-weight="normal">the holder; full flow</text>
<line x1="590.0" y1="240.0" x2="590.0" y2="214.0" stroke="#0B7C8C" stroke-width="2" marker-end="url(#a0B7C8C)"/>
