<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="Helvetica, Arial, sans-serif"><title>Force balance on a conventional and a balanced-bellows relief valve disc</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="100.0" y="120.0" width="140.0" height="110.0" rx="6" fill="#FAFBFC" stroke="#1E2B3A" stroke-width="1.6"/><rect x="155.0" y="230.0" width="30.0" height="60.0" rx="0" fill="#FBEDE7" stroke="#1E2B3A" stroke-width="1.6"/><text x="170.0" y="306.0" font-size="11" text-anchor="middle" fill="#D2552B" font-weight="normal">inlet  P₁ (nozzle area Aₙ)</text><rect x="240.0" y="160.0" width="60.0" height="28.0" rx="0" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.6"/><text x="270.0" y="205.0" font-size="11" text-anchor="middle" fill="#0B7C8C" font-weight="normal">outlet Pᵦ</text><rect x="140.0" y="218.0" width="60.0" height="10.0" rx="0" fill="#D8DEE6" stroke="#1E2B3A" stroke-width="1.6"/><text x="130.0" y="214.0" font-size="10" text-anchor="end" fill="#55667D" font-weight="normal">disc</text><line x1="170.0" y1="218.0" x2="170.0" y2="60.0" stroke="#1E2B3A" stroke-width="2"/><rect x="130.0" y="40.0" width="80.0" height="80.0" rx="0" fill="none" stroke="#1E2B3A" stroke-width="1.4"/><polyline points="170.0,105.0 180.0,99.0 160.0,93.0 180.0,87.0 160.0,81.0 180.0,75.0 160.0,69.0 180.0,63.0 160.0,57.0 170.0,52.0" fill="none" stroke="#B7840A" stroke-width="1.6" stroke-linejoin="round"/><text x="218.0" y="80.0" font-size="11" text-anchor="start" fill="#B7840A" font-weight="normal">spring Fₛ</text><line x1="170.0" y1="260.0" x2="170.0" y2="236.0" stroke="#D2552B" stroke-width="2" marker-end="url(#ar)"/><text x="124.0" y="40.0" font-size="10" text-anchor="end" fill="#55667D" font-weight="normal">bonnet open to</text><text x="124.0" y="53.0" font-size="10" text-anchor="end" fill="#55667D" font-weight="normal">discharge (Pᵦ)</text><line x1="210.0" y1="150.0" x2="190.0" y2="208.0" stroke="#0B7C8C" stroke-width="1.4" marker-end="url(#ar)"/><text x="214.0" y="145.0" font-size="10" text-anchor="start" fill="#0B7C8C" font-weight="normal">Pᵦ on top</text><rect x="450.0" y="120.0" width="140.0" height="110.0" rx="6" fill="#FAFBFC" stroke="#1E2B3A" stroke-width="1.6"/><rect x="505.0" y="230.0" width="30.0" height="60.0" rx="0" fill="#FBEDE7" stroke="#1E2B3A" stroke-width="1.6"/><text x="520.0" y="306.0" font-size="11" text-anchor="middle" fill="#D2552B" font-weight="normal">inlet  P₁ (nozzle area Aₙ)</text><rect x="590.0" y="160.0" width="60.0" height="28.0" rx="0" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.6"/><text x="620.0" y="205.0" font-size="11" text-anchor="middle" fill="#0B7C8C" font-weight="normal">outlet Pᵦ</text><rect x="490.0" y="218.0" width="60.0" height="10.0" rx="0" fill="#D8DEE6" stroke="#1E2B3A" stroke-width="1.6"/><text x="480.0" y="214.0" font-size="10" text-anchor="end" fill="#55667D" font-weight="normal">disc</text><line x1="520.0" y1="218.0" x2="520.0" y2="60.0" stroke="#1E2B3A" stroke-width="2"/><rect x="480.0" y="40.0" width="80.0" height="80.0" rx="0" fill="none" stroke="#1E2B3A" stroke-width="1.4"/><polyline points="520.0,105.0 530.0,99.0 510.0,93.0 530.0,87.0 510.0,81.0 530.0,75.0 510.0,69.0 530.0,63.0 510.0,57.0 520.0,52.0" fill="none" stroke="#B7840A" stroke-width="1.6" stroke-linejoin="round"/><text x="568.0" y="80.0" font-size="11" text-anchor="start" fill="#B7840A" font-weight="normal">spring Fₛ</text><line x1="520.0" y1="260.0" x2="520.0" y2="236.0" stroke="#D2552B" stroke-width="2" marker-end="url(#ar)"/><rect x="505.0" y="150.0" width="30.0" height="66.0" rx="0" fill="#F0ECFA" stroke="#6A4FC9" stroke-width="1.4" stroke-dasharray="3 2"/><text x="444.0" y="160.0" font-size="10" text-anchor="end" fill="#6A4FC9" font-weight="normal">bellows</text><text x="444.0" y="173.0" font-size="10" text-anchor="end" fill="#6A4FC9" font-weight="normal">(area A_B = Aₙ)</text><line x1="480.0" y1="40.0" x2="460.0" y2="30.0" stroke="#55667D" stroke-width="1"/><text x="458.0" y="26.0" font-size="10" text-anchor="end" fill="#55667D" font-weight="normal">bonnet vented to atm</text><line x1="560.0" y1="208.0" x2="540.0" y2="196.0" stroke="#0B7C8C" stroke-width="1.4" marker-end="url(#ar)"/><text x="566.0" y="224.0" font-size="10" text-anchor="middle" fill="#1E2B3A" font-weight="normal"></text><text x="170.0" y="20.0" font-size="13" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Conventional</text><text x="520.0" y="20.0" font-size="13" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Balanced bellows</text><text x="170.0" y="326.0" font-size="11" text-anchor="middle" fill="#D2552B" font-weight="normal">P₁Aₙ = Fₛ + PᵦAₙ  →  P_set rises with Pᵦ</text><text x="520.0" y="326.0" font-size="11" text-anchor="middle" fill="#6A4FC9" font-weight="normal">P₁Aₙ = Fₛ  →  P_set independent of Pᵦ</text></svg>