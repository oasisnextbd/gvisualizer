<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="Helvetica, Arial, sans-serif"><title>Typical dust-control trains for a cement plant and a coal-fired power plant</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="10.0" y="28.0" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="bold">Cement kiln / raw mill / clinker cooler</text><rect x="10.0" y="40.0" width="125.0" height="54.0" rx="5" fill="#FBEDE7" stroke="#1E2B3A" stroke-width="1.4"/><text x="72.5" y="62.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Kiln gas</text><text x="72.5" y="80.0" font-size="9" text-anchor="middle" fill="#55667D" font-weight="normal">≈ 10–50 gr/ft³, hot</text><line x1="135.0" y1="67.0" x2="153.0" y2="67.0" stroke="#0B7C8C" stroke-width="1.6" marker-end="url(#ar)"/><rect x="153.0" y="40.0" width="125.0" height="54.0" rx="5" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.4"/><text x="215.5" y="62.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Conditioning</text><text x="215.5" y="80.0" font-size="9" text-anchor="middle" fill="#55667D" font-weight="normal">cooling tower / air</text><line x1="278.0" y1="67.0" x2="296.0" y2="67.0" stroke="#0B7C8C" stroke-width="1.6" marker-end="url(#ar)"/><rect x="296.0" y="40.0" width="125.0" height="54.0" rx="5" fill="#F7F1E1" stroke="#1E2B3A" stroke-width="1.4"/><text x="358.5" y="62.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="bold">HE cyclones</text><text x="358.5" y="80.0" font-size="9" text-anchor="middle" fill="#55667D" font-weight="normal">pre-collector</text><line x1="421.0" y1="67.0" x2="439.0" y2="67.0" stroke="#0B7C8C" stroke-width="1.6" marker-end="url(#ar)"/><rect x="439.0" y="40.0" width="125.0" height="54.0" rx="5" fill="#F0ECFA" stroke="#1E2B3A" stroke-width="1.4"/><text x="501.5" y="62.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="bold">ESP or bag filter</text><text x="501.5" y="80.0" font-size="9" text-anchor="middle" fill="#55667D" font-weight="normal">glass/PTFE bags</text><line x1="564.0" y1="67.0" x2="582.0" y2="67.0" stroke="#0B7C8C" stroke-width="1.6" marker-end="url(#ar)"/><rect x="582.0" y="40.0" width="125.0" height="54.0" rx="5" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.4"/><text x="644.5" y="62.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Stack</text><text x="644.5" y="80.0" font-size="9" text-anchor="middle" fill="#55667D" font-weight="normal">&lt; 30–50 mg/Nm³</text><text x="10.0" y="158.0" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="bold">Pulverised-coal boiler</text><rect x="10.0" y="170.0" width="125.0" height="54.0" rx="5" fill="#FBEDE7" stroke="#1E2B3A" stroke-width="1.4"/><text x="72.5" y="192.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Boiler flue gas</text><text x="72.5" y="210.0" font-size="9" text-anchor="middle" fill="#55667D" font-weight="normal">fly ash 5–20 μm</text><line x1="135.0" y1="197.0" x2="153.0" y2="197.0" stroke="#0B7C8C" stroke-width="1.6" marker-end="url(#ar)"/><rect x="153.0" y="170.0" width="125.0" height="54.0" rx="5" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.4"/><text x="215.5" y="192.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Air heater</text><text x="215.5" y="210.0" font-size="9" text-anchor="middle" fill="#55667D" font-weight="normal">≈ 150 °C</text><line x1="278.0" y1="197.0" x2="296.0" y2="197.0" stroke="#0B7C8C" stroke-width="1.6" marker-end="url(#ar)"/><rect x="296.0" y="170.0" width="125.0" height="54.0" rx="5" fill="#F7F1E1" stroke="#1E2B3A" stroke-width="1.4"/><text x="358.5" y="192.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="bold">(Cyclone)</text><text x="358.5" y="210.0" font-size="9" text-anchor="middle" fill="#55667D" font-weight="normal">coarse ash, optional</text><line x1="421.0" y1="197.0" x2="439.0" y2="197.0" stroke="#0B7C8C" stroke-width="1.6" marker-end="url(#ar)"/><rect x="439.0" y="170.0" width="125.0" height="54.0" rx="5" fill="#F0ECFA" stroke="#1E2B3A" stroke-width="1.4"/><text x="501.5" y="192.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="bold">ESP / fabric filter</text><text x="501.5" y="210.0" font-size="9" text-anchor="middle" fill="#55667D" font-weight="normal">99.5–99.9 %</text><line x1="564.0" y1="197.0" x2="582.0" y2="197.0" stroke="#0B7C8C" stroke-width="1.6" marker-end="url(#ar)"/><rect x="582.0" y="170.0" width="125.0" height="54.0" rx="5" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.4"/><text x="644.5" y="192.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="bold">FGD → stack</text><text x="644.5" y="210.0" font-size="9" text-anchor="middle" fill="#55667D" font-weight="normal">wet scrubber for SO₂</text></svg>