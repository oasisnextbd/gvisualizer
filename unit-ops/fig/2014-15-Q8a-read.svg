₄·7H₂O per 100 parts EXCESS water (left scale); use it because the excess water</text><text x="24.0" y="635.0" font-size="12.5" fill="#55667D" text-anchor="start" font-weight="normal">(beyond the 7 H₂O of the hydrate) stays in solution, so it is a conserved basis.</text><circle cx="33.0" cy="647.5" r="9" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="33.0" y="652.1" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="48.0" y="652.0" font-size="12.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">Feed, saturated at 120 °F: up from 120 °F to curve D, across to the left scale: 140 parts.</text><circle cx="33.0" cy="664.5" r="9" fill="#B7840A" stroke="#FFFFFF" stroke-width="2"/><text x="33.0" y="669.1" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="48.0" y="669.0" font-size="12.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">Slurry at 80 °F: up from 80 °F to curve D, across: 74 parts.  Crystals = 140 − 74 = 66 lb per 100 lb excess water.</text><text x="24.0" y="686.0" font-size="12.5" fill="#55667D" text-anchor="start" font-weight="normal">Hollow circles: this redraw (≈ 142 and ≈ 74.4) where it differs visibly from the solution’s readings.</text><text x="360.0" y="707.0" font-size="11" fill="#55667D" text-anchor="middle" font-weight="normal" font-style="italic">Redrawn from the printed chart (digitized); in the exam read the printed chart — values may differ slightly.</text></svg>