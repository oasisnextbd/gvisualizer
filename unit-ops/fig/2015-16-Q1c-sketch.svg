<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" font-family="Helvetica, Arial, sans-serif"><title>Standard six-blade turbine agitated vessel with shape factors</title><defs><marker id="a1E2B3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="s1E2B3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="a55667D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="s55667D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="a9AA8B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><marker id="s9AA8B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><marker id="aD2552B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="sD2552B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="a0B7C8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="s0B7C8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="aB7840A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="sB7840A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="a6A4FC9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4FC9"/></marker><marker id="s6A4FC9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4FC9"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="110.0" y="90.0" width="300.0" height="300.0" rx="0" stroke="none" stroke-width="0" fill="#DCEFF2"/><polyline points="110.0,40.0 110.0,390.0 410.0,390.0 410.0,40.0" stroke="#1E2B3A" stroke-width="2.2" fill="none" stroke-linejoin="round"/><line x1="110.0" y1="90.0" x2="410.0" y2="90.0" stroke="#0B7C8C" stroke-width="1.4"/><text x="320.0" y="84.0" font-size="10" text-anchor="start" fill="#0B7C8C">liquid level</text><rect x="110.0" y="80.0" width="25.0" height="285.0" rx="0" stroke="#55667D" stroke-width="1.2" fill="#E3E8EF"/><rect x="385.0" y="80.0" width="25.0" height="285.0" rx="0" stroke="#55667D" stroke-width="1.2" fill="#E3E8EF"/><rect x="238.0" y="8.0" width="44.0" height="26.0" rx="0" stroke="#1E2B3A" stroke-width="1.4" fill="#F3F6F9"/><text x="260.0" y="26.0" font-size="10" text-anchor="middle" fill="#55667D">motor</text><line x1="260.0" y1="34.0" x2="260.0" y2="290.0" stroke="#1E2B3A" stroke-width="3"/><rect x="210.0" y="280.0" width="25.0" height="20.0" rx="0" stroke="#D2552B" stroke-width="1.6" fill="#FBE7DF"/><rect x="285.0" y="280.0" width="25.0" height="20.0" rx="0" stroke="#D2552B" stroke-width="1.6" fill="#FBE7DF"/><line x1="227.0" y1="290.0" x2="293.0" y2="290.0" stroke="#D2552B" stroke-width="3"/><line x1="110.0" y1="412.0" x2="410.0" y2="412.0" stroke="#55667D" stroke-width="1" marker-end="url(#a55667D)" marker-start="url(#s55667D)"/><text x="260.0" y="428.0" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Dt</text><line x1="440.0" y1="90.0" x2="440.0" y2="390.0" stroke="#55667D" stroke-width="1" marker-end="url(#a55667D)" marker-start="url(#s55667D)"/><text x="446.0" y="240.0" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="bold">H</text><line x1="410.0" y1="90.0" x2="446.0" y2="90.0" stroke="#9AA8B8" stroke-width="0.8" stroke-dasharray="3,3"/><line x1="410.0" y1="390.0" x2="446.0" y2="390.0" stroke="#9AA8B8" stroke-width="0.8" stroke-dasharray="3,3"/><line x1="210.0" y1="256.0" x2="310.0" y2="256.0" stroke="#55667D" stroke-width="1" marker-end="url(#a55667D)" marker-start="url(#s55667D)"/><text x="234.0" y="250.0" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Da</text><line x1="210.0" y1="280.0" x2="210.0" y2="252.0" stroke="#9AA8B8" stroke-width="0.8" stroke-dasharray="3,3"/><line x1="310.0" y1="280.0" x2="310.0" y2="252.0" stroke="#9AA8B8" stroke-width="0.8" stroke-dasharray="3,3"/><line x1="340.0" y1="290.0" x2="340.0" y2="390.0" stroke="#55667D" stroke-width="1" marker-end="url(#a55667D)" marker-start="url(#s55667D)"/><text x="346.0" y="344.0" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="bold">E</text><line x1="310.0" y1="290.0" x2="344.0" y2="290.0" stroke="#9AA8B8" stroke-width="0.8" stroke-dasharray="3,3"/><line x1="198.0" y1="280.0" x2="198.0" y2="300.0" stroke="#55667D" stroke-width="1"/><text x="194.0" y="294.0" font-size="12" text-anchor="end" fill="#1E2B3A" font-weight="bold">W</text><line x1="285.0" y1="312.0" x2="310.0" y2="312.0" stroke="#55667D" stroke-width="1"/><text x="297.0" y="326.0" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">L</text><line x1="110.0" y1="72.0" x2="135.0" y2="72.0" stroke="#55667D" stroke-width="1"/><text x="122.0" y="66.0" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">J</text><text x="126.0" y="210.0" font-size="10" text-anchor="middle" fill="#55667D" transform="rotate(-90 126.0 210.0)">baffle</text><text x="478.0" y="70.0" font-size="13" text-anchor="start" fill="#1E2B3A" font-weight="bold">Standard turbine design</text><text x="478.0" y="88.0" font-size="11" text-anchor="start" fill="#55667D">(Rushton, MSH Sec. 9)</text><text x="478.0" y="118.0" font-size="13" text-anchor="start" fill="#1E2B3A">Da/Dt</text><text x="568.0" y="118.0" font-size="13" text-anchor="start" fill="#D2552B" font-weight="bold">= 1/3</text><text x="478.0" y="144.0" font-size="13" text-anchor="start" fill="#1E2B3A">H/Dt</text><text x="568.0" y="144.0" font-size="13" text-anchor="start" fill="#D2552B" font-weight="bold">= 1</text><text x="478.0" y="170.0" font-size="13" text-anchor="start" fill="#1E2B3A">J/Dt</text><text x="568.0" y="170.0" font-size="13" text-anchor="start" fill="#D2552B" font-weight="bold">= 1/12</text><text x="478.0" y="196.0" font-size="13" text-anchor="start" fill="#1E2B3A">E/Dt</text><text x="568.0" y="196.0" font-size="13" text-anchor="start" fill="#D2552B" font-weight="bold">= 1/3</text><text x="478.0" y="222.0" font-size="13" text-anchor="start" fill="#1E2B3A">W/Da</text><text x="568.0" y="222.0" font-size="13" text-anchor="start" fill="#D2552B" font-weight="bold">= 1/5</text><text x="478.0" y="248.0" font-size="13" text-anchor="start" fill="#1E2B3A">L/Da</text><text x="568.0" y="248.0" font-size="13" text-anchor="start" fill="#D2552B" font-weight="bold">= 1/4</text><text x="478.0" y="290.0" font-size="11" text-anchor="start" fill="#55667D">6 flat blades on a disk;</text><text x="478.0" y="306.0" font-size="11" text-anchor="start" fill="#55667D">4 baffles at 90°;</text><text x="478.0" y="322.0" font-size="11" text-anchor="start" fill="#55667D">S1…S6 = shape factors</text><text x="478.0" y="338.0" font-size="11" text-anchor="start" fill="#55667D">(the ratios above)</text></svg>