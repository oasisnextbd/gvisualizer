<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="Helvetica, Arial, sans-serif"><title>Open-circuit (choke-fed) and closed-circuit (free-crushing) operation of a size-reduction machine</title><defs><marker id="a1E2B3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="a55667D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="aD2552B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="a0B7C8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="aB7840A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="a6A4FC9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4FC9"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="160" y="30" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">(a) Open circuit, choke feeding</text><rect x="90" y="120" width="140" height="60" rx="6" stroke="#1E2B3A" stroke-width="1.6" fill="#F4F7FA"/><text x="160" y="154" font-size="11" fill="#1E2B3A" text-anchor="middle" font-weight="bold">Crusher (kept full)</text><polyline points="160,60 160,118" stroke="#D2552B" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#aD2552B)"/><text x="168" y="80" font-size="10" fill="#D2552B" text-anchor="start">feed (high rate)</text><polyline points="160,180 160,250" stroke="#1E2B3A" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#a1E2B3A)"/><text x="168" y="230" font-size="10" fill="#1E2B3A" text-anchor="start">product: one pass, wide size</text><text x="168" y="244" font-size="10" fill="#1E2B3A" text-anchor="start">range, many fines</text><text x="160" y="290" font-size="10" fill="#55667D" text-anchor="middle">long residence, cushioning, high energy/kg</text><text x="500" y="30" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">(b) Closed circuit, free crushing</text><rect x="420" y="100" width="140" height="50" rx="6" stroke="#1E2B3A" stroke-width="1.6" fill="#F4F7FA"/><text x="490" y="129" font-size="11" fill="#1E2B3A" text-anchor="middle" font-weight="bold">Crusher / mill</text><rect x="420" y="200" width="140" height="50" rx="6" stroke="#0B7C8C" stroke-width="1.6" fill="#E2F1F3"/><text x="490" y="229" font-size="11" fill="#0B7C8C" text-anchor="middle" font-weight="bold">Screen / classifier</text><polyline points="490,60 490,98" stroke="#D2552B" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#aD2552B)"/><text x="498" y="78" font-size="10" fill="#D2552B" text-anchor="start">fresh feed (low rate)</text><polyline points="490,150 490,198" stroke="#1E2B3A" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#a1E2B3A)"/><text x="498" y="178" font-size="10" fill="#1E2B3A" text-anchor="start">discharge escapes quickly</text><polyline points="490,250 490,300" stroke="#1E2B3A" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#a1E2B3A)"/><text x="498" y="296" font-size="10" fill="#1E2B3A" text-anchor="start">undersize = product</text><polyline points="560,225 620,225 620,125 562,125" stroke="#B7840A" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#aB7840A)"/><text x="626" y="180" font-size="10" fill="#B7840A" text-anchor="start">oversize</text><text x="626" y="194" font-size="10" fill="#B7840A" text-anchor="start">recycled</text></svg>