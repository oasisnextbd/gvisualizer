<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="Helvetica, Arial, sans-serif"><title>Steam turbine operating principle: nozzle expansion and moving blades; impulse and reaction stages</title><defs><marker id="a1E2B3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="s1E2B3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="a55667D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="s55667D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="a9AA8B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><marker id="s9AA8B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><marker id="aD2552B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="sD2552B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="a0B7C8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="s0B7C8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="aB7840A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="sB7840A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="a6A4FC9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4FC9"/></marker><marker id="s6A4FC9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4FC9"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="20.0" y="22.0" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="bold">Stage: nozzle → moving blades → shaft</text><polyline points="30.0,60.0 110.0,92.0 170.0,70.0" stroke="#1E2B3A" stroke-width="2" fill="none" stroke-linejoin="round"/><polyline points="30.0,170.0 110.0,138.0 170.0,160.0" stroke="#1E2B3A" stroke-width="2" fill="none" stroke-linejoin="round"/><text x="100.0" y="118.0" font-size="11" text-anchor="middle" fill="#1E2B3A">nozzle</text><line x1="10.0" y1="115.0" x2="40.0" y2="115.0" stroke="#D2552B" stroke-width="2" marker-end="url(#aD2552B)"/><text x="6.0" y="104.0" font-size="10" text-anchor="start" fill="#D2552B">p₁, h₁, V≈0</text><line x1="150.0" y1="115.0" x2="215.0" y2="115.0" stroke="#D2552B" stroke-width="2.4" marker-end="url(#aD2552B)"/><text x="185.0" y="105.0" font-size="10" text-anchor="middle" fill="#D2552B">jet V₁</text><path d="M225,60 Q250,73 225,86" stroke="#0B7C8C" stroke-width="2.2" fill="none" stroke-linejoin="round"/><path d="M225,86 Q250,99 225,112" stroke="#0B7C8C" stroke-width="2.2" fill="none" stroke-linejoin="round"/><path d="M225,112 Q250,125 225,138" stroke="#0B7C8C" stroke-width="2.2" fill="none" stroke-linejoin="round"/><path d="M225,138 Q250,151 225,164" stroke="#0B7C8C" stroke-width="2.2" fill="none" stroke-linejoin="round"/><path d="M225,164 Q250,177 225,190" stroke="#0B7C8C" stroke-width="2.2" fill="none" stroke-linejoin="round"/><rect x="262.0" y="50.0" width="14.0" height="140.0" rx="0" stroke="#1E2B3A" stroke-width="1.2" fill="#E3E8EF"/><text x="269.0" y="206.0" font-size="10" text-anchor="middle" fill="#55667D">rotor disc</text><line x1="276.0" y1="120.0" x2="330.0" y2="120.0" stroke="#1E2B3A" stroke-width="4"/><text x="300.0" y="110.0" font-size="10" text-anchor="middle" fill="#1E2B3A">shaft work</text><line x1="240.0" y1="56.0" x2="240.0" y2="38.0" stroke="#0B7C8C" stroke-width="1.6" marker-end="url(#a0B7C8C)"/><text x="246.0" y="46.0" font-size="10" text-anchor="start" fill="#0B7C8C">U (blade motion)</text><text x="20.0" y="240.0" font-size="10" text-anchor="start" fill="#55667D">Δh in nozzle → kinetic energy (V₁ = 44.72√Δh, Δh in kJ/kg)</text><text x="20.0" y="256.0" font-size="10" text-anchor="start" fill="#55667D">blades turn the jet: force = ṁ ΔVw, power = ṁ U ΔVw</text><text x="20.0" y="272.0" font-size="10" text-anchor="start" fill="#55667D">exhaust → condenser or process header</text><text x="445.0" y="50.0" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Impulse stage</text><line x1="370.0" y1="160.0" x2="520.0" y2="160.0" stroke="#1E2B3A" stroke-width="1.2"/><line x1="370.0" y1="160.0" x2="370.0" y2="60.0" stroke="#1E2B3A" stroke-width="1.2"/><rect x="400.0" y="60.0" width="40.0" height="100.0" rx="0" stroke="none" stroke-width="0" fill="#FBE7DF"/><rect x="450.0" y="60.0" width="40.0" height="100.0" rx="0" stroke="none" stroke-width="0" fill="#DCEFF2"/><line x1="370.0" y1="160.0" x2="520.0" y2="160.0" stroke="#1E2B3A" stroke-width="1.2"/><line x1="370.0" y1="160.0" x2="370.0" y2="60.0" stroke="#1E2B3A" stroke-width="1.2"/><text x="420.0" y="174.0" font-size="9" text-anchor="middle" fill="#D2552B">nozzle</text><text x="470.0" y="174.0" font-size="9" text-anchor="middle" fill="#0B7C8C">blades</text><polyline points="370.0,70.0 400.0,70.0 440.0,135.0 450.0,135.0 490.0,135.0 520.0,135.0" stroke="#1E2B3A" stroke-width="2" fill="none" stroke-linejoin="round"/><polyline points="370.0,152.0 400.0,152.0 440.0,75.0 450.0,75.0 490.0,135.0 520.0,135.0" stroke="#6A4FC9" stroke-width="2" fill="none" stroke-linejoin="round" stroke-dasharray="5,3"/><text x="615.0" y="50.0" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Reaction stage</text><line x1="540.0" y1="160.0" x2="690.0" y2="160.0" stroke="#1E2B3A" stroke-width="1.2"/><line x1="540.0" y1="160.0" x2="540.0" y2="60.0" stroke="#1E2B3A" stroke-width="1.2"/><rect x="570.0" y="60.0" width="40.0" height="100.0" rx="0" stroke="none" stroke-width="0" fill="#FBE7DF"/><rect x="620.0" y="60.0" width="40.0" height="100.0" rx="0" stroke="none" stroke-width="0" fill="#DCEFF2"/><line x1="540.0" y1="160.0" x2="690.0" y2="160.0" stroke="#1E2B3A" stroke-width="1.2"/><line x1="540.0" y1="160.0" x2="540.0" y2="60.0" stroke="#1E2B3A" stroke-width="1.2"/><text x="590.0" y="174.0" font-size="9" text-anchor="middle" fill="#D2552B">nozzle</text><text x="640.0" y="174.0" font-size="9" text-anchor="middle" fill="#0B7C8C">blades</text><polyline points="540.0,70.0 570.0,70.0 610.0,100.0 620.0,100.0 660.0,135.0 690.0,135.0" stroke="#1E2B3A" stroke-width="2" fill="none" stroke-linejoin="round"/><polyline points="540.0,152.0 570.0,152.0 610.0,100.0 620.0,100.0 660.0,130.0 690.0,130.0" stroke="#6A4FC9" stroke-width="2" fill="none" stroke-linejoin="round" stroke-dasharray="5,3"/><line x1="400.0" y1="232.0" x2="430.0" y2="232.0" stroke="#1E2B3A" stroke-width="2"/><text x="436.0" y="236.0" font-size="10" text-anchor="start" fill="#1E2B3A">pressure</text><line x1="510.0" y1="232.0" x2="540.0" y2="232.0" stroke="#6A4FC9" stroke-width="2" stroke-dasharray="5,3"/><text x="546.0" y="236.0" font-size="10" text-anchor="start" fill="#6A4FC9">absolute velocity</text><text x="530.0" y="262.0" font-size="10" text-anchor="middle" fill="#55667D">impulse: all pressure drop in the nozzle;</text><text x="530.0" y="276.0" font-size="10" text-anchor="middle" fill="#55667D">reaction: pressure also falls across the moving blades</text></svg>