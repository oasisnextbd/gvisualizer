<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Helvetica, Arial, sans-serif"><title>Forces on a ball at the top of a rotating mill and the critical speed</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><circle cx="170.0" cy="170.0" r="130.0" fill="#F7F8FA" stroke="#1E2B3A" stroke-width="2.4"/><circle cx="170.0" cy="170.0" r="4.0" fill="#1E2B3A" stroke="#1E2B3A" stroke-width="1.6"/><circle cx="170.0" cy="58.0" r="16.0" fill="#F7F1E1" stroke="#1E2B3A" stroke-width="1.6"/><line x1="170.0" y1="58.0" x2="170.0" y2="118.0" stroke="#D2552B" stroke-width="2" marker-end="url(#ar)"/><text x="178.0" y="114.0" font-size="11" text-anchor="start" fill="#D2552B" font-weight="normal">mg (weight)</text><line x1="170.0" y1="58.0" x2="170.0" y2="8.0" stroke="#6A4FC9" stroke-width="2" marker-end="url(#ar)"/><text x="176.0" y="18.0" font-size="11" text-anchor="start" fill="#6A4FC9" font-weight="normal">m u²/(R−r)  centrifugal</text><line x1="170.0" y1="170.0" x2="170.0" y2="58.0" stroke="#55667D" stroke-width="1" stroke-dasharray="3 3"/><text x="176.0" y="120.0" font-size="10" text-anchor="start" fill="#55667D" font-weight="normal">R − r</text><path d="M290,140 A120,120 0 0 0 200,52" fill="none" stroke="#0B7C8C" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ar)"/><text x="285.0" y="65.0" font-size="14" text-anchor="middle" fill="#0B7C8C" font-weight="normal">ω</text><circle cx="84.2" cy="98.0" r="14.0" fill="#EEF5F7" stroke="#1E2B3A" stroke-width="1.4"/><line x1="170.0" y1="170.0" x2="84.2" y2="98.0" stroke="#55667D" stroke-width="1" stroke-dasharray="3 3"/><line x1="84.2" y1="98.0" x2="84.2" y2="143.0" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ar)"/><line x1="84.2" y1="98.0" x2="55.1" y2="73.6" stroke="#6A4FC9" stroke-width="1.6" marker-end="url(#ar)"/><text x="94.2" y="156.0" font-size="10" text-anchor="start" fill="#55667D" font-weight="normal">ball at angle α</text><text x="170.0" y="322.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="normal">ball held on the wall while  m u²/(R−r) ≥ mg cos α</text><rect x="350.0" y="60.0" width="270.0" height="190.0" rx="6" fill="#F7F1E1" stroke="#1E2B3A" stroke-width="1.2"/><text x="485.0" y="85.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="normal">At the top (α = 0) the ball just</text><text x="485.0" y="102.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="normal">leaves the shell when</text><text x="485.0" y="119.0" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="normal">ω_c² (R − r) = g</text><text x="485.0" y="136.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="normal"></text><text x="485.0" y="153.0" font-size="12" text-anchor="middle" fill="#D2552B" font-weight="bold">n_c = (1/2π) √[ g / (R − r) ]</text><text x="485.0" y="170.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="normal"></text><text x="485.0" y="187.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="normal">SI, D and d in m:  n_c = 42.3/√(D − d) rpm</text><text x="485.0" y="204.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="normal">ft:  n_c = 76.6/√(D − d) rpm</text><text x="485.0" y="221.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="normal"></text><text x="485.0" y="238.0" font-size="11" text-anchor="middle" fill="#1E2B3A" font-weight="normal">Operate at 50–75 % of n_c</text></svg>