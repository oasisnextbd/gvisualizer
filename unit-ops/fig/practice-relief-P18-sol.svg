<line x1="114.0" y1="470.0" x2="120.0" y2="470.0" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="110.0" y="474.0" font-size="12" text-anchor="end" fill="#55667D" font-weight="normal">120</text>
<line x1="114.0" y1="418.8" x2="120.0" y2="418.8" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="110.0" y="422.8" font-size="12" text-anchor="end" fill="#55667D" font-weight="normal">130</text>
<line x1="114.0" y1="367.5" x2="120.0" y2="367.5" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="110.0" y="371.5" font-size="12" text-anchor="end" fill="#55667D" font-weight="normal">140</text>
<line x1="114.0" y1="316.2" x2="120.0" y2="316.2" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="110.0" y="320.2" font-size="12" text-anchor="end" fill="#55667D" font-weight="normal">150</text>
<line x1="114.0" y1="265.0" x2="120.0" y2="265.0" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="110.0" y="269.0" font-size="12" text-anchor="end" fill="#55667D" font-weight="normal">160</text>
<line x1="114.0" y1="213.8" x2="120.0" y2="213.8" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="110.0" y="217.8" font-size="12" text-anchor="end" fill="#55667D" font-weight="normal">170</text>
<line x1="114.0" y1="162.5" x2="120.0" y2="162.5" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="110.0" y="166.5" font-size="12" text-anchor="end" fill="#55667D" font-weight="normal">180</text>
<line x1="114.0" y1="111.2" x2="120.0" y2="111.2" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="110.0" y="115.2" font-size="12" text-anchor="end" fill="#55667D" font-weight="normal">190</text>
<line x1="114.0" y1="60.0" x2="120.0" y2="60.0" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="110.0" y="64.0" font-size="12" text-anchor="end" fill="#55667D" font-weight="normal">200</text>
<text x="40.0" y="265.0" font-size="13" text-anchor="middle" fill="#1E2B3A" font-weight="normal">psig</text>
<line x1="120.0" y1="85.6" x2="420.0" y2="85.6" stroke="#55667D" stroke-width="1.8" stroke-dasharray="4 3"/>
<text x="428.0" y="89.6" font-size="12" text-anchor="start" fill="#55667D" font-weight="normal">hydrostatic test 1.3 × MAWP = 195</text>
<line x1="120.0" y1="154.8" x2="420.0" y2="154.8" stroke="#D2552B" stroke-width="1.8"/>
<text x="428.0" y="158.8" font-size="12" text-anchor="start" fill="#D2552B" font-weight="normal">max. relieving, fire case: 121 % = 181.5</text>
<line x1="120.0" y1="193.2" x2="420.0" y2="193.2" stroke="#B7840A" stroke-width="1.8"/>
<text x="428.0" y="197.2" font-size="12" text-anchor="start" fill="#B7840A" font-weight="normal">max. relieving, multiple valves: 116 % = 174</text>
<line x1="120.0" y1="239.4" x2="420.0" y2="239.4" stroke="#D2552B" stroke-width="1.8"/>
<text x="428.0" y="243.4" font-size="12" text-anchor="start" fill="#D2552B" font-weight="normal">max. relieving, single valve: 110 % = 165</text>
<line x1="120.0" y1="316.2" x2="420.0" y2="316.2" stroke="#1E2B3A" stroke-width="2.2"/>
<text x="428.0" y="320.2" font-size="12" text-anchor="start" fill="#1E2B3A" font-weight="bold">MAWP = set pressure of (first) valve = 150</text>
<line x1="120.0" y1="370.1" x2="420.0" y2="370.1" stroke="#0B7C8C" stroke-width="1.8"/>
<text x="428.0" y="374.1" font-size="12" text-anchor="start" fill="#0B7C8C" font-weight="normal">reseat (blowdown 7 %) = 139.5</text>
<line x1="120.0" y1="393.1" x2="420.0" y2="393.1" stroke="#0B7C8C" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="428.0" y="397.1" font-size="12" text-anchor="start" fill="#0B7C8C" font-weight="normal">max. normal operating ≈ 90 % of set = 135</text>
<line x1="200.0" y1="316.2" x2="200.0" y2="239.4" stroke="#D2552B" stroke-width="1.6" marker-end="url(#mD2552B)"/>
<text x="206.0" y="281.8" font-size="11" text-anchor="start" fill="#D2552B" font-weight="normal">accumulation / overpressure 15 psi</text>
<line x1="300.0" y1="316.2" x2="300.0" y2="370.1" stroke="#0B7C8C" stroke-width="1.6" marker-end="url(#m0B7C8C)"/>
<text x="306.0" y="345.9" font-size="11" text-anchor="start" fill="#0B7C8C" font-weight="normal">blowdown 10.5 psi</text>
<text x="130.0" y="459.8" font-size="11" text-anchor="start" fill="#55667D" font-weight="normal">Conventional valve: built-up back-pressure ≤ 10 % of set (15 psi)</text>
</svg>