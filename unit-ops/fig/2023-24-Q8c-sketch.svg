<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Helvetica, Arial, sans-serif"><title>Forces on a ball in a rotating ball mill</title><defs><marker id="a1E2B3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="a55667D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="aD2552B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="a0B7C8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="aB7840A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="a6A4FC9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A4FC9"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><circle cx="210" cy="210" r="150" stroke="#1E2B3A" stroke-width="2" fill="#F3F6F9"/><circle cx="210" cy="210" r="3" stroke="#1E2B3A" stroke-width="1" fill="#1E2B3A"/><text x="202" y="226" font-size="11" fill="#1E2B3A" text-anchor="end">O</text><circle cx="285.712" cy="101.872" r="18" stroke="#B7840A" stroke-width="1.6" fill="#F6EBCB"/><polyline points="210,210 285.712,101.872" stroke="#55667D" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-dasharray="5 3"/><text x="240" y="188" font-size="11" fill="#55667D" text-anchor="start">R − r</text><polyline points="210,210 210,60" stroke="#9AA8B8" stroke-width="1" fill="none" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M210,160 A50,50 0 0 1 238.679,169.042" stroke="#1E2B3A" stroke-width="1.1" fill="none"/><text x="230" y="148" font-size="12" fill="#1E2B3A" text-anchor="start">α</text><polyline points="285.712,101.872 285.712,171.872" stroke="#D2552B" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#aD2552B)"/><text x="291.712" y="171.872" font-size="12" fill="#D2552B" text-anchor="start" font-weight="bold">mg</text><polyline points="285.712,101.872 325.862,44.5313" stroke="#0B7C8C" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#a0B7C8C)"/><text x="331.862" y="44.5313" font-size="11" fill="#0B7C8C" text-anchor="start" font-weight="bold">m ω²(R − r)</text><path d="M325,325 A165,165 0 0 0 375,190" stroke="#55667D" stroke-width="1.6" fill="none" marker-end="url(#a55667D)"/><text x="350" y="358" font-size="10" fill="#55667D" text-anchor="start">N (rev/s)</text><circle cx="210" cy="78" r="18" stroke="#D2552B" stroke-width="1.2" fill="none"/><text x="186" y="82" font-size="9" fill="#D2552B" text-anchor="end">at Nc</text><text x="400" y="70" font-size="11" fill="#1E2B3A" text-anchor="start">Ball held to the shell while</text><text x="400" y="86" font-size="11" fill="#1E2B3A" text-anchor="start" font-weight="bold">m ω²(R − r) ≥ mg cos α</text><text x="400" y="112" font-size="11" fill="#1E2B3A" text-anchor="start">It leaves the wall where</text><text x="400" y="128" font-size="11" fill="#1E2B3A" text-anchor="start" font-weight="bold">cos α = ω²(R − r)/g</text><text x="400" y="154" font-size="11" fill="#1E2B3A" text-anchor="start">Critical speed: ball just stays</text><text x="400" y="170" font-size="11" fill="#1E2B3A" text-anchor="start">on at the top, α = 0:</text><text x="400" y="192" font-size="12" fill="#D2552B" text-anchor="start" font-weight="bold">ω²c (R − r) = g</text><text x="400" y="216" font-size="12" fill="#D2552B" text-anchor="start" font-weight="bold">Nc = (1/2π) √[g/(R − r)]</text><text x="400" y="250" font-size="10" fill="#55667D" text-anchor="start">R = mill inside radius</text><text x="400" y="265" font-size="10" fill="#55667D" text-anchor="start">r = ball radius</text><text x="400" y="280" font-size="10" fill="#55667D" text-anchor="start">Nc in rev/s (×60 for r/min)</text><text x="400" y="310" font-size="10" fill="#55667D" text-anchor="start">Operate at about 65–80 % of Nc</text><text x="400" y="325" font-size="10" fill="#55667D" text-anchor="start">(cascading/cataracting, not centrifuging)</text></svg>