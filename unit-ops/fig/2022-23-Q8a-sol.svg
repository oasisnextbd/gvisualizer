<circle cx="312.6" cy="102.0" r="16.0" fill="#D5ECEF" stroke="#0B7C8C" stroke-width="1.8"/>
<line x1="230.0" y1="220.0" x2="230.0" y2="60.0" stroke="#55667D" stroke-width="1.6" stroke-dasharray="4,3"/>
<line x1="230.0" y1="220.0" x2="312.6" y2="102.0" stroke="#55667D" stroke-width="1.6" stroke-dasharray="4,3"/>
<path d="M230,160 A60,60 0 0,1 264.4,170.9" fill="none" stroke="#55667D" stroke-width="1.2"/>
<text x="252.0" y="156.0" font-size="14" fill="#55667D" text-anchor="start" font-weight="normal">α</text>
<text x="279.3" y="183.0" font-size="12" fill="#55667D" text-anchor="start" font-weight="normal">R − r</text>
<line x1="312.6" y1="102.0" x2="352.7" y2="44.7" stroke="#D2552B" stroke-width="2.2" marker-end="url(#aD2552B)"/>
<text x="358.7" y="44.7" font-size="12.5" fill="#D2552B" text-anchor="start" font-weight="normal">mω²(R−r)</text>
<line x1="312.6" y1="102.0" x2="312.6" y2="187.0" stroke="#1E2B3A" stroke-width="2.2" marker-end="url(#a1E2B3A)"/>
<text x="318.6" y="194.0" font-size="12.5" fill="#1E2B3A" text-anchor="start" font-weight="normal">mg</text>
<line x1="312.6" y1="102.0" x2="283.9" y2="143.0" stroke="#6A4FC9" stroke-width="2" marker-end="url(#a6A4FC9)"/>
<text x="288.6" y="88.0" font-size="12.5" fill="#6A4FC9" text-anchor="end" font-weight="normal">mg cos α (toward centre)</text>
<path d="M48,260 A182,182 0 0,1 190,43" fill="none" stroke="#0B7C8C" stroke-width="1.6" marker-end="url(#a0B7C8C)"/>
<text x="40.0" y="150.0" font-size="15" fill="#0B7C8C" text-anchor="start" font-weight="normal">ω</text>
<text x="230.0" y="410.0" font-size="12.5" fill="#1E2B3A" text-anchor="middle" font-weight="normal">ball stays on the shell while mω²(R−r) ≥ mg cos α</text>
<text x="230.0" y="428.0" font-size="12.5" fill="#1E2B3A" text-anchor="middle" font-weight="bold">critical speed: α = 0 at the top → n_c = (1/2π)√(g/(R−r))</text>
<text x="380.0" y="370.0" font-size="11" fill="#55667D" text-anchor="start" font-weight="normal">mill radius R, ball radius r</text></svg>