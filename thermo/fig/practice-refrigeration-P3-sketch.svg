<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="Helvetica, Arial, sans-serif">
<title>Two-stage cascade refrigeration system</title>
<rect width="640" height="470" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs>
<rect x="200" y="40" width="240" height="40" rx="6" fill="#F4F7FA" stroke="#1E2B3A" stroke-width="1.5"/>
<text x="320.0" y="64.2" font-size="12" fill="#1E2B3A" text-anchor="middle" >Condenser at T_H</text>
<rect x="200" y="170" width="240" height="40" rx="6" fill="#F4F7FA" stroke="#1E2B3A" stroke-width="1.5"/>
<text x="320.0" y="194.2" font-size="12" fill="#1E2B3A" text-anchor="middle" >Evaporator at T_C′</text>
<path d="M440.0,190.0 L500.0,190.0 L500.0,145.0" fill="none" stroke="#D2552B" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<polygon points="485,145 515,145 508,105 492,105" fill="#FBEDE7" stroke="#D2552B" stroke-width="1.5"/>
<text x="522.0" y="130.0" font-size="11.5" fill="#55667D" text-anchor="start" >compressor</text>
<path d="M500.0,105.0 L500.0,60.0 L442.0,60.0" fill="none" stroke="#D2552B" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<path d="M200.0,60.0 L140.0,60.0 L140.0,115.0" fill="none" stroke="#D2552B" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<path d="M130,115 l20,20 m0,-20 l-20,20" stroke="#D2552B" stroke-width="2"/>
<circle cx="140" cy="125" r="12" fill="none" stroke="#D2552B" stroke-width="1.5"/>
<text x="122.0" y="130.0" font-size="11.5" fill="#55667D" text-anchor="end" >valve</text>
<path d="M140.0,137.0 L140.0,190.0 L198.0,190.0" fill="none" stroke="#D2552B" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="320.0" y="135.0" font-size="13" fill="#D2552B" text-anchor="middle" >Cycle 2 (high stage, e.g. NH₃)</text>
<rect x="200" y="230" width="240" height="40" rx="6" fill="#F4F7FA" stroke="#1E2B3A" stroke-width="1.5"/>
<text x="320.0" y="254.2" font-size="12" fill="#1E2B3A" text-anchor="middle" >Condenser at T_H′</text>
<rect x="200" y="360" width="240" height="40" rx="6" fill="#F4F7FA" stroke="#1E2B3A" stroke-width="1.5"/>
<text x="320.0" y="384.2" font-size="12" fill="#1E2B3A" text-anchor="middle" >Evaporator at T_C</text>
<path d="M440.0,380.0 L500.0,380.0 L500.0,335.0" fill="none" stroke="#0B7C8C" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<polygon points="485,335 515,335 508,295 492,295" fill="#E6F3F5" stroke="#0B7C8C" stroke-width="1.5"/>
<text x="522.0" y="320.0" font-size="11.5" fill="#55667D" text-anchor="start" >compressor</text>
<path d="M500.0,295.0 L500.0,250.0 L442.0,250.0" fill="none" stroke="#0B7C8C" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<path d="M200.0,250.0 L140.0,250.0 L140.0,305.0" fill="none" stroke="#0B7C8C" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<path d="M130,305 l20,20 m0,-20 l-20,20" stroke="#0B7C8C" stroke-width="2"/>
<circle cx="140" cy="315" r="12" fill="none" stroke="#0B7C8C" stroke-width="1.5"/>
<text x="122.0" y="320.0" font-size="11.5" fill="#55667D" text-anchor="end" >valve</text>
<path d="M140.0,327.0 L140.0,380.0 L198.0,380.0" fill="none" stroke="#0B7C8C" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="320.0" y="325.0" font-size="13" fill="#0B7C8C" text-anchor="middle" >Cycle 1 (low stage, e.g. ethane)</text>
<rect x="190" y="160" width="260" height="120" rx="8" fill="none" stroke="#B7840A" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="455.0" y="225.0" font-size="12" fill="#B7840A" text-anchor="start" >interchanger:</text>
<text x="455.0" y="240.0" font-size="12" fill="#B7840A" text-anchor="start" >T_H′ &gt; T_C′</text>
<line x1="320.0" y1="40.0" x2="320.0" y2="12.0" stroke="#D2552B" stroke-width="2" marker-end="url(#ar)"/>
<text x="330.0" y="22.0" font-size="12" fill="#D2552B" text-anchor="start" >Q_H to surroundings at T_H</text>
<line x1="320.0" y1="445.0" x2="320.0" y2="402.0" stroke="#0B7C8C" stroke-width="2" marker-end="url(#ar)"/>
<text x="330.0" y="440.0" font-size="12" fill="#0B7C8C" text-anchor="start" >Q_C from cold space at T_C</text>
<text x="560.0" y="60.0" font-size="13" fill="#D2552B" text-anchor="start" >W₂</text>
<text x="560.0" y="250.0" font-size="13" fill="#0B7C8C" text-anchor="start" >W₁</text>
</svg>