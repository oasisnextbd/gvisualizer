<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Helvetica, Arial, sans-serif">
<title>Alkaline fuel cell (KOH electrolyte)</title>
<rect width="640" height="330" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs>
<rect x="150" y="60" width="60" height="200" fill="#E6F3F5" stroke="#1E2B3A" stroke-width="1.5"/><rect x="430" y="60" width="60" height="200" fill="#FBEDE7" stroke="#1E2B3A" stroke-width="1.5"/>
<rect x="210" y="60" width="220" height="200" fill="#F4F7FA" stroke="#1E2B3A" stroke-width="1.2"/>
<text x="180.0" y="52.0" font-size="12" fill="#1E2B3A" text-anchor="middle" >anode (−)</text>
<text x="460.0" y="52.0" font-size="12" fill="#1E2B3A" text-anchor="middle" >cathode (+)</text>
<text x="320.0" y="80.0" font-size="12" fill="#55667D" text-anchor="middle" >KOH(aq) electrolyte</text>
<path d="M60.0,120.0 L148.0,120.0" fill="none" stroke="#0B7C8C" stroke-width="2" stroke-linejoin="round" marker-end="url(#arc)"/>
<text x="60.0" y="112.0" font-size="12" fill="#0B7C8C" text-anchor="start" >H₂ in</text>
<path d="M580.0,120.0 L492.0,120.0" fill="none" stroke="#D2552B" stroke-width="2" stroke-linejoin="round" marker-end="url(#arh)"/>
<text x="580.0" y="112.0" font-size="12" fill="#D2552B" text-anchor="end" >O₂ (air) in</text>
<path d="M148.0,220.0 L60.0,220.0" fill="none" stroke="#0B7C8C" stroke-width="2" stroke-linejoin="round" marker-end="url(#arc)"/>
<text x="60.0" y="240.0" font-size="12" fill="#0B7C8C" text-anchor="start" >H₂O out</text>
<path d="M400.0,170.0 L240.0,170.0" fill="none" stroke="#6A4FC9" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="320.0" y="162.0" font-size="13" fill="#6A4FC9" text-anchor="middle" >OH⁻</text>
<path d="M180.0,60.0 L180.0,20.0 L300.0,20.0" fill="none" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar)"/>
<path d="M340.0,20.0 L460.0,20.0 L460.0,58.0" fill="none" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar)"/>
<circle cx="320" cy="20" r="14" fill="#fff" stroke="#B7840A" stroke-width="1.8"/>
<text x="320.0" y="25.0" font-size="10" fill="#B7840A" text-anchor="middle" >load</text>
<text x="240.0" y="40.0" font-size="12" fill="#1E2B3A" text-anchor="start" >2e⁻</text>
<text x="320.0" y="288.0" font-size="12.5" fill="#1E2B3A" text-anchor="middle" >Anode: H₂ + 2OH⁻ → 2H₂O + 2e⁻      Cathode: ½O₂ + H₂O + 2e⁻ → 2OH⁻</text>
<text x="320.0" y="310.0" font-size="12.5" fill="#1E2B3A" text-anchor="middle" >Overall: H₂ + ½O₂ → H₂O      E° = −ΔG°/(2F) = 1.229 V at 25 °C</text>
</svg>