<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="Helvetica, Arial, sans-serif">
<title>Absorption refrigeration cycle</title>
<rect width="720" height="430" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs>
<rect x="60" y="40" width="170" height="60" rx="6" fill="#FBEDE7" stroke="#D2552B" stroke-width="1.5"/>
<text x="145.0" y="66.7" font-size="12" fill="#1E2B3A" text-anchor="middle" >Condenser</text>
<text x="145.0" y="81.7" font-size="12" fill="#1E2B3A" text-anchor="middle" >Q rejected to cooling water</text>
<rect x="60" y="320" width="170" height="60" rx="6" fill="#E6F3F5" stroke="#0B7C8C" stroke-width="1.5"/>
<text x="145.0" y="346.7" font-size="12" fill="#1E2B3A" text-anchor="middle" >Evaporator</text>
<text x="145.0" y="361.7" font-size="12" fill="#1E2B3A" text-anchor="middle" >Q_C from cold space</text>
<rect x="430" y="40" width="190" height="60" rx="6" fill="#FBEDE7" stroke="#D2552B" stroke-width="1.5"/>
<text x="525.0" y="66.7" font-size="12" fill="#1E2B3A" text-anchor="middle" >Generator (still)</text>
<text x="525.0" y="81.7" font-size="12" fill="#1E2B3A" text-anchor="middle" >Q_H from heat source</text>
<rect x="430" y="320" width="190" height="60" rx="6" fill="#E6F3F5" stroke="#0B7C8C" stroke-width="1.5"/>
<text x="525.0" y="346.7" font-size="12" fill="#1E2B3A" text-anchor="middle" >Absorber</text>
<text x="525.0" y="361.7" font-size="12" fill="#1E2B3A" text-anchor="middle" >heat removed by water</text>
<path d="M430.0,70.0 L230.0,70.0" fill="none" stroke="#1E2B3A" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="330.0" y="62.0" font-size="12" fill="#1E2B3A" text-anchor="middle" >refrigerant vapour (NH₃)</text>
<path d="M145.0,100.0 L145.0,190.0" fill="none" stroke="#1E2B3A" stroke-width="2" stroke-linejoin="round" />
<polygon points="135,190 155,190 145,205" fill="#fff" stroke="#1E2B3A" stroke-width="1.5"/><polygon points="135,220 155,220 145,205" fill="#fff" stroke="#1E2B3A" stroke-width="1.5"/>
<text x="162.0" y="210.0" font-size="12" fill="#1E2B3A" text-anchor="start" >expansion valve</text>
<path d="M145.0,220.0 L145.0,320.0" fill="none" stroke="#1E2B3A" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="152.0" y="150.0" font-size="12" fill="#55667D" text-anchor="start" >liquid</text>
<text x="152.0" y="280.0" font-size="12" fill="#55667D" text-anchor="start" >liquid + vapour</text>
<path d="M230.0,350.0 L430.0,350.0" fill="none" stroke="#0B7C8C" stroke-width="2" stroke-linejoin="round" marker-end="url(#arc)"/>
<text x="330.0" y="342.0" font-size="12" fill="#0B7C8C" text-anchor="middle" >low-pressure vapour</text>
<path d="M450.0,320.0 L450.0,300.0 L400.0,300.0 L400.0,140.0 L450.0,140.0 L450.0,100.0" fill="none" stroke="#B7840A" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="392.0" y="230.0" font-size="12" fill="#B7840A" text-anchor="end" >pump (strong solution)</text>
<circle cx="400" cy="230" r="11" fill="#fff" stroke="#B7840A" stroke-width="1.8"/>
<path d="M600.0,100.0 L600.0,320.0" fill="none" stroke="#6A4FC9" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="610.0" y="150.0" font-size="12" fill="#6A4FC9" text-anchor="start" >weak solution</text>
<text x="610.0" y="290.0" font-size="12" fill="#6A4FC9" text-anchor="start" >via valve</text>
<text x="360.0" y="408.0" font-size="12" fill="#55667D" text-anchor="middle" >high-pressure side: generator + condenser  |  low-pressure side: evaporator + absorber</text>
<text x="60.0" y="25.0" font-size="12" fill="#D2552B" text-anchor="start" >High P</text>
<text x="60.0" y="312.0" font-size="12" fill="#0B7C8C" text-anchor="start" >Low P</text>
</svg>