<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 556" width="640" height="556" font-family="Helvetica, Arial, sans-serif">
<title>Flash algorithm with the gamma–phi formulation</title>
<rect width="640" height="556" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs>
<rect x="110" y="20" width="420" height="48" rx="6" fill="#E6F3F5" stroke="#0B7C8C" stroke-width="1.5"/>
<text x="320.0" y="48.2" font-size="12" fill="#1E2B3A" text-anchor="middle" >Read T, P, {zᵢ}; constants</text>
<line x1="320.0" y1="70.0" x2="320.0" y2="80.0" stroke="#1E2B3A" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="110" y="82" width="420" height="48" rx="6" fill="#F4F7FA" stroke="#1E2B3A" stroke-width="1.5"/>
<text x="320.0" y="110.2" font-size="12" fill="#1E2B3A" text-anchor="middle" >BUBL P with x = z and DEW P with y = z: is P_dew &lt; P &lt; P_bubl ?</text>
<line x1="320.0" y1="132.0" x2="320.0" y2="142.0" stroke="#1E2B3A" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="110" y="144" width="420" height="48" rx="6" fill="#F4F7FA" stroke="#1E2B3A" stroke-width="1.5"/>
<text x="320.0" y="172.2" font-size="12" fill="#1E2B3A" text-anchor="middle" >Initial γᵢ, Φᵢ, V from the dew and bubble results</text>
<line x1="320.0" y1="194.0" x2="320.0" y2="204.0" stroke="#1E2B3A" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="110" y="206" width="420" height="48" rx="6" fill="#F4F7FA" stroke="#1E2B3A" stroke-width="1.5"/>
<text x="320.0" y="234.2" font-size="12" fill="#1E2B3A" text-anchor="middle" >Kᵢ = γᵢ Pᵢˢᵃᵗ / (Φᵢ P)</text>
<line x1="320.0" y1="256.0" x2="320.0" y2="266.0" stroke="#1E2B3A" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="110" y="268" width="420" height="48" rx="6" fill="#F4F7FA" stroke="#1E2B3A" stroke-width="1.5"/>
<text x="320.0" y="296.2" font-size="12" fill="#1E2B3A" text-anchor="middle" >Solve F(V) = Σ zᵢ(Kᵢ − 1)/[1 + V(Kᵢ − 1)] = 0 by Newton</text>
<line x1="320.0" y1="318.0" x2="320.0" y2="328.0" stroke="#1E2B3A" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="110" y="330" width="420" height="48" rx="6" fill="#F4F7FA" stroke="#1E2B3A" stroke-width="1.5"/>
<text x="320.0" y="358.2" font-size="12" fill="#1E2B3A" text-anchor="middle" >xᵢ = zᵢ / [1 + V(Kᵢ − 1)];  yᵢ = Kᵢ xᵢ</text>
<line x1="320.0" y1="380.0" x2="320.0" y2="390.0" stroke="#1E2B3A" stroke-width="1.5" marker-end="url(#ar)"/>
<polygon points="110,416 320,390 530,416 320,442" fill="#FFF7E6" stroke="#B7840A" stroke-width="1.5"/>
<text x="320.0" y="420.0" font-size="12" fill="#1E2B3A" text-anchor="middle" >New γᵢ(x), φ̂ᵢ(y), Φᵢ;  changes in x, y, V &lt; ε ?</text>
<line x1="320.0" y1="442.0" x2="320.0" y2="452.0" stroke="#1E2B3A" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="110" y="454" width="420" height="48" rx="6" fill="#E6F3F5" stroke="#0B7C8C" stroke-width="1.5"/>
<text x="320.0" y="482.2" font-size="12" fill="#1E2B3A" text-anchor="middle" >Print V, {xᵢ}, {yᵢ}</text>
<path d="M530.0,416.0 L590.0,416.0 L590.0,230.0 L532.0,230.0" fill="none" stroke="#D2552B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arh)"/>
<text x="598.0" y="323.0" font-size="12" fill="#D2552B" text-anchor="start" transform="rotate(90 598 323.0)">no: repeat</text>
</svg>