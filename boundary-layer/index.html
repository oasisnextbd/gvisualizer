<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Boundary Layer Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one-column game. Level map → level (HUD, stage, mission line, tile tray) → formula deck. Single deliberate night-lab theme. */
:root{
  --night:#0C1A2B; --panel:#14263C; --panel-2:#1C3450; --edge:#2A4767; --ink:#EAF3FF; --dim:#8EA6C2;
  --flow:#3FD0E0; --heat:#FF8B5E; --gold:#FFC93F; --gold-deep:#A87B10; --good:#58DE8C; --bad:#FF5C7A; --plate:#C7D5E4;
  --gold-soft:#3A3320; --good-soft:#15392A; --bad-soft:#3D1A27; --shadow:#07111D;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-math:"STIX Two Text",Cambria,Georgia,serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;background:radial-gradient(1200px 600px at 50% -10%,var(--panel-2),var(--night) 70%) fixed,var(--night)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* map */
.brand{text-align:center}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,7vw,56px);line-height:1;margin:6px 0 8px;letter-spacing:.01em;text-wrap:balance}
.brand h1 span{color:var(--flow)}
.brand p{margin:0;color:var(--dim)}
.topstats{display:flex;justify-content:center;gap:10px;margin:16px 0 4px;flex-wrap:wrap}
.pill{font-family:var(--f-display);font-weight:600;padding:7px 14px;border-radius:999px;background:var(--panel);border:2px solid var(--edge);display:inline-flex;gap:6px;align-items:center}
.pill .g{color:var(--gold)}
.pathbox{position:relative;margin:18px auto 0;max-width:520px}
.pathbox svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.nodes{list-style:none;margin:0;padding:0;display:grid;gap:22px;position:relative}
.node{display:flex;align-items:center;gap:14px;transform:translateX(var(--off,0px))}
.node.r{flex-direction:row-reverse;text-align:right}
.orb{width:74px;height:74px;flex:none;border-radius:50%;border:none;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:28px;background:var(--flow);color:var(--night);box-shadow:0 6px 0 #1C7F8A,0 0 0 6px var(--night);position:relative;transition:transform .15s}
.orb:hover{transform:translateY(-2px)}
.orb:active{transform:translateY(4px);box-shadow:0 2px 0 #1C7F8A,0 0 0 6px var(--night)}
.orb.won{background:var(--gold);box-shadow:0 6px 0 var(--gold-deep),0 0 0 6px var(--night)}
.orb.locked{background:var(--panel-2);color:var(--dim);box-shadow:0 6px 0 var(--shadow),0 0 0 6px var(--night);cursor:not-allowed}
.orb.next::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--flow);animation:ping 1.6s ease-out infinite}
@keyframes ping{from{opacity:.9;transform:scale(.9)}to{opacity:0;transform:scale(1.25)}}
.nlabel b{display:block;font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.15}
.nlabel small{color:var(--dim);font-size:13px}
.stars{color:var(--edge);letter-spacing:2px;font-size:15px}
.stars i{font-style:normal;color:var(--gold)}
.decklink{display:block;margin:28px auto 0}

/* buttons */
.tile{font-family:var(--f-display);font-weight:600;font-size:17px;padding:12px 18px;border-radius:14px;background:var(--panel-2);border:2px solid var(--edge);box-shadow:0 4px 0 var(--shadow);cursor:pointer;transition:transform .08s,border-color .15s,background .15s;display:inline-flex;align-items:center;gap:8px;min-height:50px}
.tile:hover{border-color:var(--flow)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.tile.sel{border-color:var(--gold);background:var(--gold-soft)}
.tile.go{background:var(--gold);border-color:var(--gold);color:var(--night);box-shadow:0 4px 0 var(--gold-deep)}
.tile.done{opacity:.35;pointer-events:none}
.tile.math{font-family:var(--f-math);font-weight:400;font-size:20px}
.tile .dots{display:inline-flex;gap:3px}
.tile .dots i{width:7px;height:7px;border-radius:50%;background:var(--flow);display:block}
.tile svg{display:block}

/* level */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hud .back{width:44px;height:44px;border-radius:12px;background:var(--panel);border:2px solid var(--edge);cursor:pointer;font-size:20px;flex:none}
.hud .ttl{flex:1;min-width:0;font-family:var(--f-display);font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .ttl small{color:var(--dim);font-weight:500;margin-right:6px}
.hearts{font-size:22px;letter-spacing:2px;color:var(--bad);flex:none}
.hearts .lost{color:var(--edge)}
.combo{font-family:var(--f-display);font-weight:700;color:var(--gold);font-size:15px;flex:none}
.combo:empty{display:none}
.mute{width:44px;height:44px;border-radius:12px;background:var(--panel);border:2px solid var(--edge);cursor:pointer;flex:none;font-family:var(--f-display);font-size:12px}
.stage{position:relative}
.stage canvas{display:block;width:100%;max-width:100%;aspect-ratio:3/2;background:var(--panel);border:2px solid var(--edge);border-radius:18px;touch-action:manipulation;cursor:pointer}
.stage.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.stage.flash canvas{border-color:var(--good)}
.toast{position:absolute;left:50%;bottom:14px;transform:translate(-50%,8px);padding:8px 16px;border-radius:999px;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--night);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 24px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.good{background:var(--good)} .toast.bad{background:var(--bad)} .toast.info{background:var(--gold)}
.mission{font-family:var(--f-display);font-weight:500;font-size:clamp(17px,2.6vw,20px);text-align:center;margin:16px auto 14px;max-width:40ch;text-wrap:balance}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.slide{display:flex;align-items:center;gap:12px;width:100%;max-width:560px;background:var(--panel);border:2px solid var(--edge);border-radius:14px;padding:10px 14px}
.slide label{font-family:var(--f-display);font-weight:600;color:var(--dim);font-size:14px}
.slide input{flex:1;min-width:0;accent-color:var(--gold);height:28px}
.slide output{font-family:var(--f-display);font-weight:600;color:var(--gold);min-width:64px;text-align:right}

/* modal + cards */
.modal{position:fixed;inset:0;background:rgba(5,12,22,.72);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--panel);border:2px solid var(--edge);border-radius:22px;padding:22px 20px 20px;width:100%;max-width:420px;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85)}to{transform:none}}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:30px;margin:0 0 4px}
.bigstars{font-size:42px;letter-spacing:6px;color:var(--edge);margin:2px 0 10px}
.bigstars i{font-style:normal;color:var(--gold);display:inline-block;animation:pop .4s backwards}
.bigstars i:nth-child(2){animation-delay:.15s} .bigstars i:nth-child(3){animation-delay:.3s}
.sheet .why{color:var(--dim);margin:12px 0 16px;font-size:15px}
.sheet .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fcard{background:linear-gradient(160deg,var(--panel-2),var(--panel));border:2px solid var(--gold);border-radius:16px;padding:14px 16px;text-align:left;min-width:0}
.fcard .kick{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.fcard .nm{font-family:var(--f-display);font-weight:600;font-size:19px;margin:2px 0 8px}
.fcard .f{font-family:var(--f-math);font-size:20px;line-height:1.5;overflow-x:auto;white-space:nowrap;padding-bottom:2px}
.fcard.locked{border-color:var(--edge);border-style:dashed;opacity:.6}
.fcard.locked .f{color:var(--dim);font-family:var(--f-display);font-size:16px}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:18px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.15;margin:0 .1em}
.fr>span:last-child{border-top:1px solid currentColor}
.ov{border-top:1px solid currentColor}
.int{font-size:1.2em}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (max-width:560px){ .stage canvas{aspect-ratio:1/1} .orb{width:62px;height:62px;font-size:24px} .tile{font-size:16px;padding:10px 14px} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<canvas id="fx"></canvas>

<section id="mapScreen" class="wrap">
  <div class="brand">
    <h1>Boundary Layer <span>Quest</span></h1>
    <p>8 levels · 3 hearts each · win the formula cards</p>
  </div>
  <div class="topstats"><span class="pill"><span class="g">★</span><span id="starTotal">0</span> / 24</span><span class="pill">Score <span class="g" id="scoreMap">0</span></span></div>
  <div class="pathbox"><svg id="pathSvg" aria-hidden="true"></svg><ol class="nodes" id="nodes"></ol></div>
  <button class="tile go decklink" id="deckBtn" type="button">Formula deck</button>
</section>

<section id="levelScreen" class="wrap" hidden>
  <div class="hud">
    <button class="back" id="backBtn" type="button" aria-label="Back to map">←</button>
    <div class="ttl" id="ttl"></div>
    <span class="combo" id="combo"></span>
    <span class="hearts" id="hearts" aria-label="Hearts"></span>
    <button class="mute" id="muteBtn" type="button" aria-label="Toggle sound">SOUND</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="toast" id="toast"></div>
  </div>
  <p class="mission" id="mission"></p>
  <div class="tray" id="tray"></div>
</section>

<section id="deckScreen" class="wrap" hidden>
  <div class="hud"><button class="back" id="deckBack" type="button" aria-label="Back to map">←</button><div class="ttl">Formula deck</div></div>
  <p style="color:var(--dim);margin:0">Every card you win lands here. This is your cheat sheet for the flat-plate boundary layer.</p>
  <div class="deck" id="deck"></div>
</section>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const ui='u<sub>∞</sub>';

/* ---------- physics ---------- */
const PROF={
  linear:{label:'Line', f:e=>e, d0:1},
  quad:{label:'Parabola', f:e=>2*e-e*e, d0:2},
  cubic:{label:'Cubic', f:e=>1.5*e-0.5*e*e*e, d0:1.5},
  sine:{label:'Sine', f:e=>Math.sin(Math.PI*e/2), d0:Math.PI/2}
};
function F(k,e){ if(e<=0) return 0; if(e>=1) return 1; return PROF[k].f(e); }
const fq=(e,a)=> e>=1?1:(e<=0?0:1.5*e-0.5*e**3 + a*(0.5*e-1.5*e**3+e**4));
function deficit(k){ const n=400; let s=0; for(let i=0;i<=n;i++){const e=i/n,f=F(k,e),w=(i===0||i===n)?1:(i%2?4:2); s+=w*f*(1-f);} return s/(3*n); }
const COEF={}; for(const k in PROF) COEF[k]=Math.sqrt(2*PROF[k].d0/deficit(k));
const zeta=Pr=>Math.pow(Pr,-1/3)/1.026;

/* ---------- canvas helpers ---------- */
const cv=$('#cv'), ctx=cv.getContext('2d');
let W=0,H=0,dpr=1,FS=14;
function resize(){ const r=cv.getBoundingClientRect(); dpr=window.devicePixelRatio||1; W=r.width; H=r.height; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
new ResizeObserver(resize).observe(cv);
let C={};
(function readC(){ const cs=getComputedStyle(document.documentElement), g=n=>cs.getPropertyValue('--'+n).trim();
  ['night','panel','panel-2','edge','ink','dim','flow','heat','gold','good','bad','plate'].forEach(n=>C[n.replace('-','')]=g(n)); })();
const DISP='"Fredoka", "Trebuchet MS", sans-serif', MATH='"STIX Two Text", Cambria, Georgia, serif';
function rgb(h){ h=h.replace('#',''); const n=parseInt(h,16); return [n>>16&255,n>>8&255,n&255]; }
function mix(a,b,t){ const A=rgb(a),B=rgb(b); return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`; }
function rgba(h,a){ const A=rgb(h); return `rgba(${A[0]},${A[1]},${A[2]},${a})`; }
function line(x1,y1,x2,y2,c,w,dash){ ctx.strokeStyle=c; ctx.lineWidth=w||1; ctx.setLineDash(dash||[]); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.setLineDash([]); }
function arrow(x1,y1,x2,y2,c,w,hs){ hs=hs||8; if(Math.hypot(x2-x1,y2-y1)<1.5) return; line(x1,y1,x2,y2,c,w); const a=Math.atan2(y2-y1,x2-x1); ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2-hs*Math.cos(a-0.45),y2-hs*Math.sin(a-0.45)); ctx.lineTo(x2-hs*Math.cos(a+0.45),y2-hs*Math.sin(a+0.45)); ctx.closePath(); ctx.fill(); }
function text(s,x,y,o){ o=o||{}; ctx.font=(o.italic?'italic ':'')+(o.weight||500)+' '+(o.size||FS)+'px '+(o.fam||DISP); ctx.fillStyle=o.c||C.ink; ctx.textAlign=o.align||'left'; ctx.textBaseline=o.base||'middle'; ctx.fillText(s,x,y); }
function stroke(pts,c,w,dash,glow){ ctx.save(); if(glow&&!RM){ ctx.shadowColor=c; ctx.shadowBlur=glow; } ctx.strokeStyle=c; ctx.lineWidth=w; ctx.setLineDash(dash||[]); ctx.lineJoin='round'; ctx.lineCap='round'; ctx.beginPath(); pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.stroke(); ctx.restore(); }
function circle(x,y,r,fill,strokeC,w){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(strokeC){ ctx.strokeStyle=strokeC; ctx.lineWidth=w||2; ctx.stroke(); } }
function plate(xl,xr,y,c){ ctx.fillStyle=c||C.plate; ctx.beginPath(); ctx.moveTo(xl-16,y+4); ctx.lineTo(xl,y); ctx.lineTo(xr,y); ctx.lineTo(xr,y+9); ctx.lineTo(xl,y+9); ctx.closePath(); ctx.fill(); }
function mkPlot(l,t,w,h,xr,yr){ return {l,t,w,h,X:v=>l+(v-xr[0])/(xr[1]-xr[0])*w,Y:v=>t+h-(v-yr[0])/(yr[1]-yr[0])*h}; }
function axes(p,xl,yl){ line(p.l,p.t+p.h,p.l+p.w,p.t+p.h,C.dim,2); line(p.l,p.t,p.l,p.t+p.h,C.dim,2); if(xl) text(xl,p.l+p.w,p.t+p.h+18,{align:'right',c:C.dim,fam:MATH,italic:1,size:FS+1}); if(yl) text(yl,p.l-8,p.t-12,{c:C.dim,fam:MATH,italic:1,size:FS+1}); }
function profPts(p,f){ const a=[]; for(let i=0;i<=120;i++){ const e=1.25*i/120; a.push([p.X(e>=1?1:f(e)),p.Y(e)]); } return a; }
function profPlot(rm){ const r=Math.min(170,W*(rm||0.3)); return mkPlot(46,44,W-46-r,H-44-46,[0,1.1],[0,1.25]); }
const pulse=t=>RM?0.5:0.5+0.5*Math.sin(t*4);

/* ---------- sound + confetti ---------- */
let AC=null, muted=false;
function sfx(kind){ if(muted) return; try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const seq={good:[660,990],bad:[200,150],win:[523,659,784,1047],tap:[520]}[kind]||[440];
  seq.forEach((f,i)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=kind==='bad'?'square':'triangle'; o.frequency.value=f;
    const t=AC.currentTime+i*(kind==='win'?0.11:0.08), v=kind==='bad'?0.06:(kind==='tap'?0.05:0.16);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.24);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+0.26); });
}catch(e){} }
const fx=$('#fx'), fctx=fx.getContext('2d'); let bits=[];
function confetti(){ if(RM) return; const w=innerWidth,h=innerHeight; fx.width=w*dpr; fx.height=h*dpr;
  const cols=[C.gold,C.flow,C.heat,C.good,C.ink];
  for(let i=0;i<140;i++) bits.push({x:w/2,y:h*0.38,vx:(Math.random()-0.5)*14,vy:-Math.random()*13-3,r:Math.random()*Math.PI,s:4+Math.random()*5,c:cols[i%cols.length],life:1});
}
function drawFx(dt){ if(!bits.length) return; fctx.setTransform(dpr,0,0,dpr,0,0); fctx.clearRect(0,0,innerWidth,innerHeight);
  bits.forEach(b=>{ b.vy+=22*dt; b.x+=b.vx*dt*30; b.y+=b.vy*dt*30; b.r+=dt*8; b.life-=dt*0.45;
    fctx.save(); fctx.globalAlpha=Math.max(0,b.life); fctx.translate(b.x,b.y); fctx.rotate(b.r); fctx.fillStyle=b.c; fctx.fillRect(-b.s/2,-b.s/4,b.s,b.s/2); fctx.restore(); });
  bits=bits.filter(b=>b.life>0&&b.y<innerHeight+20); if(!bits.length) fctx.clearRect(0,0,innerWidth,innerHeight); }

/* ---------- save ---------- */
let SAVE={stars:[0,0,0,0,0,0,0,0],score:0};
try{ const s=JSON.parse(localStorage.getItem('blq-save')||'null'); if(s&&Array.isArray(s.stars)) SAVE=Object.assign(SAVE,s); }catch(e){}
function persist(){ try{ localStorage.setItem('blq-save',JSON.stringify(SAVE)); }catch(e){} }

/* ---------- tray builders ---------- */
function el(tag,cls,html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function tile(html,fn,cls){ const b=el('button','tile'+(cls?' '+cls:''),html); b.type='button'; b.addEventListener('click',()=>{ sfx('tap'); fn(); }); return b; }
function slider(id,label,min,max,step,val,fmt,onInput){
  const w=el('div','slide'); w.innerHTML=`<label for="${id}">${label}</label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><output>${fmt(val)}</output>`;
  const inp=w.querySelector('input'), out=w.querySelector('output');
  inp.addEventListener('input',()=>{ const v=+inp.value; out.textContent=fmt(v); onInput(v); }); return w; }
function sketch(k){ const pts=[]; for(let i=0;i<=24;i++){ const e=i/24; pts.push(`${(F(k,e)*30+3).toFixed(1)},${(33-e*30).toFixed(1)}`); } return `<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><path d="M3 3V33H35" fill="none" stroke="${C.dim}" stroke-width="1.5"/><polyline points="${pts.join(' ')}" fill="none" stroke="${C.flow}" stroke-width="2.5" stroke-linecap="round"/></svg>`; }
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ---------- levels ---------- */
const LEVELS=[
/* 1 */ { name:'Edge Hunter', card:{nm:'Scaling', f:`δ ∝ √<span class="ov">νx/${ui}</span> &nbsp;⇒&nbsp; ${fr('δ','x')} ~ ${fr('1','√Re<sub>x</sub>')}`},
  why:'Inertia (u∞²/x) balances viscosity (νu∞/δ²), so δ² grows like x.',
  init(L){ L.n=1.05; L.parts=null; },
  mission:L=>L.done?'δ grows like √x.':'Bend the gold line until it hugs the edge of the slow orange fluid.',
  tray(L){ return [ slider('nS','bend',0.15,1.5,0.01,L.n,v=>'x^'+v.toFixed(2),v=>L.n=v), tile('Lock in',()=>{
      if(Math.abs(L.n-0.5)<=0.07){ L.n=0.5; L.done=true; right('Nailed it: δ ∝ √x'); later(win,1300); }
      else wrong(L.n>0.5?'Too flat at the front. Bend it more.':'Too steep at the front. Bend it less.'); },'go') ]; },
  draw(L,t,dt){

    const ed=z=>{ const a=[]; for(let i=0;i<=80;i++){ const x=xl+(W-xl)*i/80; a.push([x,plateY-z*del(x)]); } return a; };
    stroke(ed(1),C.flow,2,[6,5]); text('δ',W-10,plateY-del(W)-12,{fam:MATH,italic:1,c:C.flow,align:'right',size:FS+3});
    if(!L.done) stroke(ed(zt),C.gold,3,[8,6],8+6*pulse(t));
    plate(xl,W,plateY,C.heat);
    const P=10**L.lp; text('Pr = '+(P<1?P.toFixed(2):P<10?P.toFixed(1):Math.round(P)),14,24,{weight:700,size:FS+6,c:C.heat});
    text('δt/δ = '+zeta(P).toFixed(2),14,50,{c:C.dim});
    if(!L.done) text('mystery fluid',W-14,24,{align:'right',c:C.gold,weight:600});
    for(let i=0;i<3;i++) circle(W-60+i*20,50,6,i<L.round?C.good:null,C.edge,2);
  } },

/* 8 */ { name:'Boss: Rank the Guesses', card:{nm:'The big idea', f:`any guess → δ ∝ √<span class="ov">νx/${ui}</span><br>only the constant changes`},
  why:'Physics fixes the √(νx/u∞) form. Your guessed shape only sets the number in front.',
  init(L){ L.order=[]; L.tiles=shuffle(['linear','quad','cubic','sine']); },
  mission:L=>L.done?'Linear 3.46 < Cubic 4.64 < Sine 4.80 < Parabola 5.48':'Each guess gives a different δ/x·√Re. Tap them from smallest to largest.',
  tray(L){ const S=['linear','cubic','sine','quad'];
    return L.tiles.map(k=>tile(sketch(k)+PROF[k].label,()=>{ if(L.order.includes(k)) return;
      if(k===S[L.order.length]){ L.order.push(k); right(`${PROF[k].label}: ${COEF[k].toFixed(2)}`); if(L.order.length===4){ L.done=true; later(win,1500); } refresh(); }
      else wrong('Not the next smallest. Gentler slope at the wall → smaller number.'); },L.order.includes(k)?'done':'')); },
  draw(L,t){
    const wide=W>=520, ia=wide?{x:0,w:W*0.38,h:H}:{x:0,w:W,h:H*0.45}, by=wide?0:H*0.45, bxs=wide?W*0.38:0, bwd=wide?W*0.62:W, bh=wide?H:H*0.55;
    const p=mkPlot(ia.x+40,30,ia.w-60,ia.h-70,[0,1.1],[0,1.2]); axes(p,'u','y');
    ['linear','quad','cubic','sine'].forEach(k=>{ const on=L.order.includes(k); stroke(profPts(p,e=>F(k,e)),on?C.flow:C.edge,on?2.6:1.5,on?null:[3,4]); });
    const lx=bxs+92, bw=bwd-92-60, rh=Math.min(46,(bh-70)/4), y0=by+(wide?60:30), S=v=>lx+v/6*bw;
    for(let i=0;i<4;i++){ const y=y0+i*rh, k=L.order[i];
      ctx.fillStyle=rgba(C.edge,0.5); ctx.fillRect(lx,y+rh*0.2,bw,rh*0.6);
      text(String(i+1),lx-70,y+rh/2,{c:C.dim,weight:700});
      if(k){ ctx.fillStyle=C.flow; ctx.fillRect(lx,y+rh*0.2,S(COEF[k])-lx,rh*0.6); text(PROF[k].label,lx-10,y+rh/2,{align:'right',size:FS}); text(COEF[k].toFixed(2),S(COEF[k])+6,y+rh/2,{weight:700}); } }
    if(L.done){ line(S(5),y0-10,S(5),y0+4*rh,C.gold,2.5,[6,4]); text('exact 5.0',S(5),y0-22,{align:'center',c:C.gold,weight:700,size:FS-1}); }
  } }
];

/* ---------- game flow ---------- */
let L=null, LV=null, combo=0, screen='map', timers=[];
function later(fn,ms){ timers.push(setTimeout(fn,ms)); }
function show(s){ screen=s; $('#mapScreen').hidden=s!=='map'; $('#levelScreen').hidden=s!=='level'; $('#deckScreen').hidden=s!=='deck'; window.scrollTo(0,0); if(s==='map') renderMap(); if(s==='deck') renderDeck(); if(s==='level') requestAnimationFrame(resize); }
function unlocked(i){ return i===0||SAVE.stars[i-1]>0; }
function startLevel(i){ timers.forEach(clearTimeout); timers=[]; LV=LEVELS[i]; L={i,hearts:3,t0:performance.now(),done:false}; LV.init(L); combo=0; $('#toast').className='toast'; closeModal(); show('level'); refresh(); }
function refresh(){ $('#ttl').innerHTML=`<small>Level ${L.i+1}</small>${LV.name}`; $('#mission').textContent=LV.mission(L); $('#tray').replaceChildren(...LV.tray(L)); hud(); }
function hud(){ $('#hearts').innerHTML=[0,1,2].map(i=>`<span class="${i<L.hearts?'':'lost'}">♥</span>`).join(''); $('#combo').textContent=combo>=2?'combo ×'+Math.min(combo,5):''; $('#muteBtn').textContent=muted?'MUTED':'SOUND'; }
let toastT=null;
function toast(msg,kind){ const t=$('#toast'); t.textContent=msg; t.className='toast on '+kind; clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',1900); }
function right(msg){ combo++; SAVE.score+=100*Math.min(combo,5); persist(); sfx('good'); toast(msg,'good'); const s=$('#stage'); s.classList.add('flash'); setTimeout(()=>s.classList.remove('flash'),400); hud(); }
function wrong(msg){ if(L.done) return; combo=0; L.hearts=Math.max(0,L.hearts-1); sfx('bad'); toast(msg,'bad'); const s=$('#stage'); s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake'); hud(); if(L.hearts<=0) later(fail,900); }
function cardHTML(i,locked){ const c=LEVELS[i].card; return locked?`<div class="fcard locked"><div class="kick">Card ${i+1}</div><div class="nm">???</div><div class="f">Clear level ${i+1} to unlock</div></div>`:`<div class="fcard"><div class="kick">Card ${i+1} · ${LEVELS[i].name}</div><div class="nm">${c.nm}</div><div class="f">${c.f}</div></div>`; }
function win(){ if(screen!=='level') return; const st=Math.max(1,L.hearts); const first=SAVE.stars[L.i]===0; SAVE.stars[L.i]=Math.max(SAVE.stars[L.i],st); SAVE.score+=st*150; persist(); sfx('win'); confetti();
  const last=L.i===LEVELS.length-1;
  openModal(`<h2>Level clear!</h2><div class="bigstars">${[0,1,2].map(i=>i<st?'<i>★</i>':'★').join('')}</div>${cardHTML(L.i)}<p class="why">${LV.why}</p>
   <div class="row"><button class="tile" type="button" data-a="map">Map</button><button class="tile" type="button" data-a="retry">Replay</button><button class="tile go" type="button" data-a="${last?'deck':'next'}">${last?'See your deck':'Next level →'}</button></div>`);
  if(first) $('#sheet').querySelector('.fcard').insertAdjacentHTML('beforebegin','<p style="margin:0 0 8px;color:var(--gold);font-family:var(--f-display);font-weight:600">New card unlocked</p>'); }
function fail(){ openModal(`<h2>Out of hearts</h2><p class="why">Every wrong move told you something. Try again with that in mind.</p><div class="row"><button class="tile" type="button" data-a="map">Map</button><button class="tile go" type="button" data-a="retry">Try again</button></div>`); }
function openModal(html){ $('#sheet').innerHTML=html; $('#modal').hidden=false; const b=$('#sheet').querySelector('.go'); if(b) b.focus(); }
function closeModal(){ $('#modal').hidden=true; }
$('#sheet').addEventListener('click',e=>{ const a=e.target.closest('[data-a]'); if(!a) return; sfx('tap'); const act=a.dataset.a;
  if(act==='map'){ closeModal(); show('map'); } else if(act==='retry') startLevel(L.i); else if(act==='next') startLevel(L.i+1); else if(act==='deck'){ closeModal(); show('deck'); } });
$('#backBtn').addEventListener('click',()=>{ timers.forEach(clearTimeout); show('map'); });
$('#deckBack').addEventListener('click',()=>show('map'));
$('#deckBtn').addEventListener('click',()=>show('deck'));
$('#muteBtn').addEventListener('click',()=>{ muted=!muted; hud(); });
cv.addEventListener('pointerdown',e=>{ if(!LV||!LV.onTap||L.done) return; const r=cv.getBoundingClientRect(); LV.onTap(L,e.clientX-r.left,e.clientY-r.top); });

function renderMap(){
  const tot=SAVE.stars.reduce((a,b)=>a+b,0); $('#starTotal').textContent=tot; $('#scoreMap').textContent=SAVE.score;
  const won=SAVE.stars.filter(s=>s>0).length; $('#deckBtn').textContent=`Formula deck · ${won}/8 cards`;
  const nextI=SAVE.stars.findIndex(s=>s===0);
  const offs=[0,0.55,0.85,0.55,0,-0.55,-0.85,-0.55], amp=Math.min(110,innerWidth*0.16);
  $('#nodes').innerHTML=LEVELS.map((lv,i)=>{ const u=unlocked(i), s=SAVE.stars[i], cls=s>0?'won':(u?'':'locked'), side=offs[i]<0?' r':'';
    return `<li class="node${side}" style="--off:${(offs[i]*amp).toFixed(0)}px"><button class="orb ${cls}${i===nextI&&u?' next':''}" type="button" data-i="${i}" aria-label="Level ${i+1}: ${lv.name}${u?'':' (locked)'}">${u?i+1:'·'}</button><div class="nlabel"><b>${lv.name}</b><span class="stars">${[0,1,2].map(k=>k<s?'<i>★</i>':'★').join('')}</span></div></li>`; }).join('');
  $('#nodes').querySelectorAll('.orb').forEach(b=>b.addEventListener('click',()=>{ const i=+b.dataset.i; if(!unlocked(i)){ b.animate?.([{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'none'}],{duration:240}); return; } sfx('tap'); startLevel(i); }));
  requestAnimationFrame(drawPath);
}
function drawPath(){ const box=$('.pathbox').getBoundingClientRect(); const pts=[...document.querySelectorAll('.orb')].map(o=>{ const r=o.getBoundingClientRect(); return [r.left-box.left+r.width/2, r.top-box.top+r.height/2]; });
  if(!pts.length) return; let d=`M${pts[0][0]} ${pts[0][1]}`; for(let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; d+=` C${x0} ${(y0+y1)/2} ${x1} ${(y0+y1)/2} ${x1} ${y1}`; }
  $('#pathSvg').innerHTML=`<path d="${d}" fill="none" stroke="${C.edge}" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>`; }
addEventListener('resize',()=>{ if(screen==='map') requestAnimationFrame(drawPath); });
function renderDeck(){ $('#deck').innerHTML=LEVELS.map((_,i)=>cardHTML(i,SAVE.stars[i]===0)).join(''); }

let last=performance.now();
function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(screen==='level'&&W>0&&LV){ ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H); ctx.fillStyle=C.panel; ctx.fillRect(0,0,W,H); FS=Math.max(12,Math.min(15,W/44)); LV.draw(L,RM?3:(now-L.t0)/1000,RM?0:dt); }
  drawFx(dt); requestAnimationFrame(loop); }
show('map'); requestAnimationFrame(loop);
document.fonts&&document.fonts.ready.then(()=>{ if(screen==='map') drawPath(); });
})();
</script>
