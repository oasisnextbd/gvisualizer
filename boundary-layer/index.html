<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Boundary Layer Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: guided hands-on lesson. Progress rail (3 chapters, 12 scenes) → big interactive canvas → one instruction line → live readout → aha + continue, or a checkpoint question with 3 chances. */
:root{
  --night:#0C1A2B; --panel:#14263C; --panel-2:#1C3450; --edge:#2A4767; --ink:#EAF3FF; --dim:#8EA6C2;
  --flow:#3FD0E0; --heat:#FF8B5E; --heat-2:#FFB38F; --gold:#FFC93F; --gold-deep:#A87B10; --good:#58DE8C; --bad:#FF5C7A; --violet:#B79CFF; --plate:#C7D5E4;
  --gold-soft:#3A3320; --good-soft:#15392A; --bad-soft:#3D1A27; --shadow:#07111D;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-math:"STIX Two Text",Cambria,Georgia,serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;background:radial-gradient(1200px 600px at 50% -10%,var(--panel-2),var(--night) 70%) fixed,var(--night)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
button,a{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--flow)}
.iconbtn{height:40px;min-width:40px;padding:0 10px;border-radius:12px;background:var(--panel);border:2px solid var(--edge);cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:13px;flex:none;text-decoration:none;display:inline-grid;place-items:center}
.rail{display:flex;gap:4px;margin-bottom:6px}
.seg{flex:1;height:8px;border-radius:4px;background:var(--panel-2);border:none;padding:0;cursor:pointer}
.seg.done{background:var(--gold)} .seg.cur{background:var(--flow)} .seg:disabled{cursor:default}
.chap{display:flex;justify-content:space-between;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.chap b{color:var(--flow);font-weight:600}
.stage{position:relative}
.stage canvas{display:block;width:100%;max-width:100%;aspect-ratio:3/2;background:var(--panel);border:2px solid var(--edge);border-radius:18px;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.toast{position:absolute;left:50%;bottom:12px;transform:translate(-50%,8px);padding:8px 16px;border-radius:999px;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--night);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 24px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.good{background:var(--good)} .toast.bad{background:var(--bad)} .toast.info{background:var(--gold)}
.instr{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.8vw,22px);text-align:center;margin:16px auto 6px;max-width:36ch;text-wrap:balance}
.instr small{display:block;font-weight:500;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.live{font-family:var(--f-math);font-size:18px;text-align:center;color:var(--dim);min-height:1.6em;overflow-x:auto;white-space:nowrap;padding:2px 0}
.live b{color:var(--gold);font-weight:600} .live .g{color:var(--good)} .live .r{color:var(--bad)}
.aha{margin:12px auto 0;max-width:560px;background:var(--good-soft);border:2px solid var(--good);border-radius:16px;padding:12px 16px;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.aha p{margin:0;font-size:16px}
.aha .m{font-family:var(--f-math);font-size:20px;margin-top:6px;overflow-x:auto;white-space:nowrap}
@keyframes pop{from{transform:scale(.92)}to{transform:none}}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.btn{font-family:var(--f-display);font-weight:600;font-size:17px;padding:12px 20px;border-radius:14px;background:var(--panel-2);border:2px solid var(--edge);box-shadow:0 4px 0 var(--shadow);cursor:pointer;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.btn.go{background:var(--gold);border-color:var(--gold);color:var(--night);box-shadow:0 4px 0 var(--gold-deep)}
.btn.go.pulse{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 4px 0 var(--gold-deep),0 0 0 6px rgba(255,201,63,.25)}}
.quiz{max-width:600px;margin:14px auto 0;background:var(--panel);border:2px solid var(--violet);border-radius:18px;padding:14px}
.quiz .qh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.quiz .qh span{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--violet)}
.chances{display:flex;gap:5px} .chances i{width:12px;height:12px;border-radius:50%;background:var(--violet)} .chances i.used{background:var(--edge)}
.quiz .q{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:11px 14px;border-radius:12px;background:var(--panel-2);border:2px solid var(--edge);cursor:pointer;font-size:16px}
.opt:hover{border-color:var(--violet)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);opacity:.7;cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.qfb{margin-top:10px;font-size:15px;color:var(--dim)} .qfb b{color:var(--ink)}
.count{font-family:var(--f-display);font-weight:600;color:var(--violet);font-size:14px;text-align:center;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(5,12,22,.75);display:grid;place-items:center;padding:16px;z-index:20;overflow-y:auto}
.sheet{background:var(--panel);border:2px solid var(--edge);border-radius:22px;padding:22px 20px;width:100%;max-width:480px;text-align:center}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:28px;margin:0 0 12px}
.fcard{background:linear-gradient(160deg,var(--panel-2),var(--panel));border:2px solid var(--gold);border-radius:14px;padding:10px 14px;text-align:left;margin-bottom:8px}
.fcard .k{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.fcard .f{font-family:var(--f-math);font-size:19px;overflow-x:auto;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.15;margin:0 .1em}
.fr>span:last-child{border-top:1px solid currentColor}
@media (max-width:560px){ .stage canvas{aspect-ratio:1/1} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<main class="wrap">
  <div class="top">
    <div class="brand">Boundary Layer <span>Lab</span></div>
    <button class="iconbtn" id="backBtn" type="button" aria-label="Previous scene">←</button>
    <button class="iconbtn" id="muteBtn" type="button">SOUND</button>
    <a class="iconbtn" id="sandLink" href="sandbox/" target="_top">Sandbox</a>
  </div>
  <div class="rail" id="rail"></div>
  <div class="chap" id="chap"></div>
  <div class="stage"><canvas id="cv"></canvas><div class="toast" id="toast"></div></div>
  <p class="instr" id="instr"></p>
  <div class="live" id="live"></div>
  <div id="aha"></div>
  <div id="quiz"></div>
  <div class="ctrl" id="ctrl"></div>
</main>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SANDBOX_URL='https://claude.ai/artifact/De9Ky5gR1NvWQ91sYC3AT2';
if(!(location.protocol==='file:'||/github\.io$/.test(location.hostname))){ const a=$('#sandLink'); a.href=SANDBOX_URL; a.target='_blank'; a.rel='noopener'; }
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const D=(a,b)=>fr('∂'+a,'∂'+b), D2=(a,b)=>fr('∂²'+a,'∂'+b+'²');

/* ---------- canvas helpers ---------- */
const cv=$('#cv'), ctx=cv.getContext('2d'); let W=0,H=0,dpr=1,FS=14;
function resize(){ const r=cv.getBoundingClientRect(); dpr=devicePixelRatio||1; W=r.width; H=r.height; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
new ResizeObserver(resize).observe(cv);
const cs=getComputedStyle(document.documentElement), C={};
['night','panel','panel-2','edge','ink','dim','flow','heat','heat-2','gold','good','bad','violet','plate'].forEach(n=>C[n.replace('-','')]=cs.getPropertyValue('--'+n).trim());
const DISP='"Fredoka", "Trebuchet MS", sans-serif', MATH='"STIX Two Text", Cambria, Georgia, serif';
const rgbA=h=>{ const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; };
const rgba=(h,a)=>{ const c=rgbA(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
const mix=(a,b,t)=>{ const A=rgbA(a),B=rgbA(b); return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`; };
function line(x1,y1,x2,y2,c,w,dash){ ctx.strokeStyle=c; ctx.lineWidth=w||1; ctx.setLineDash(dash||[]); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.setLineDash([]); }
function arrow(x1,y1,x2,y2,c,w,hs,dash){ hs=hs||9; if(Math.hypot(x2-x1,y2-y1)<2) return; line(x1,y1,x2,y2,c,w,dash); const a=Math.atan2(y2-y1,x2-x1); ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2-hs*Math.cos(a-0.45),y2-hs*Math.sin(a-0.45)); ctx.lineTo(x2-hs*Math.cos(a+0.45),y2-hs*Math.sin(a+0.45)); ctx.closePath(); ctx.fill(); }
function text(s,x,y,o){ o=o||{}; ctx.font=(o.italic?'italic ':'')+(o.weight||500)+' '+(o.size||FS)+'px '+(o.fam||DISP); ctx.fillStyle=o.c||C.ink; ctx.textAlign=o.align||'left'; ctx.textBaseline='middle'; ctx.fillText(s,x,y); }
function circle(x,y,r,fill,sc,w){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); if(fill){ctx.fillStyle=fill;ctx.fill();} if(sc){ctx.strokeStyle=sc;ctx.lineWidth=w||2;ctx.stroke();} }
function rrect(x,y,w,h,r,fill,sc,lw){ ctx.beginPath(); ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h); if(fill){ctx.fillStyle=fill;ctx.fill();} if(sc){ctx.strokeStyle=sc;ctx.lineWidth=lw||2;ctx.stroke();} }
function stroke(pts,c,w,dash,glow){ ctx.save(); if(glow&&!RM){ctx.shadowColor=c;ctx.shadowBlur=glow;} ctx.strokeStyle=c; ctx.lineWidth=w; ctx.setLineDash(dash||[]); ctx.lineJoin='round'; ctx.lineCap='round'; ctx.beginPath(); pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.stroke(); ctx.restore(); }
function plate(xl,xr,y,c){ ctx.fillStyle=c||C.plate; ctx.beginPath(); ctx.moveTo(xl-16,y+4); ctx.lineTo(xl,y); ctx.lineTo(xr,y); ctx.lineTo(xr,y+9); ctx.lineTo(xl,y+9); ctx.closePath(); ctx.fill(); }
function mkPlot(l,t,w,h,xr,yr){ return {l,t,w,h,xr,yr,X:v=>l+(v-xr[0])/(xr[1]-xr[0])*w,Y:v=>t+h-(v-yr[0])/(yr[1]-yr[0])*h,iX:x=>xr[0]+(x-l)/w*(xr[1]-xr[0]),iY:y=>yr[0]+(t+h-y)/h*(yr[1]-yr[0])}; }
function axes(p,xl,yl){ line(p.l,p.t+p.h,p.l+p.w,p.t+p.h,C.dim,2); line(p.l,p.t,p.l,p.t+p.h,C.dim,2); if(xl) text(xl,p.l+p.w,p.t+p.h+18,{align:'right',c:C.dim,fam:MATH,italic:1,size:FS+1}); if(yl) text(yl,p.l-6,p.t-12,{c:C.dim,fam:MATH,italic:1,size:FS+1}); }
const pulse=t=>RM?0.6:0.5+0.5*Math.sin(t*4);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const cubic=e=>e>=1?1:e<=0?0:1.5*e-0.5*e*e*e;
function hint(x,y,t,label){ circle(x,y,14+6*pulse(t),null,C.gold,2.5); if(label) text(label,x,y-26,{align:'center',size:FS-1,c:C.gold,weight:600}); }
/* math expressions on canvas: parts = strings and {n,d} fractions */
function exprW(parts,size){ let w=0; for(const p of parts){ if(typeof p==='string'){ ctx.font=`400 ${size}px ${MATH}`; w+=ctx.measureText(p).width; } else { ctx.font=`400 ${size*0.78}px ${MATH}`; w+=Math.max(ctx.measureText(p.n).width,ctx.measureText(p.d).width)+6; } } return w; }
function expr(parts,x,y,size,col){ let cx=x; ctx.fillStyle=col; ctx.textBaseline='middle';
  for(const p of parts){ if(typeof p==='string'){ ctx.font=`400 ${size}px ${MATH}`; ctx.textAlign='left'; ctx.fillText(p,cx,y); cx+=ctx.measureText(p).width; }
    else { ctx.font=`400 ${size*0.78}px ${MATH}`; const w=Math.max(ctx.measureText(p.n).width,ctx.measureText(p.d).width)+6; ctx.textAlign='center'; ctx.fillText(p.n,cx+w/2,y-size*0.42); ctx.fillText(p.d,cx+w/2,y+size*0.5); ctx.fillRect(cx+2,y+0.5,w-4,Math.max(1,size*0.06)); cx+=w; } }
  ctx.textAlign='left'; return cx-x; }
function exprC(parts,cx,y,size,col){ const w=exprW(parts,size); expr(parts,cx-w/2,y,size,col); return w; }

/* ---------- sound ---------- */
let AC=null, muted=false;
function sfx(kind){ if(muted) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const seq={good:[660,990],bad:[220,170],tap:[520],win:[523,659,784,1047],pop:[880]}[kind]||[440];
  seq.forEach((f,i)=>{ const o=AC.createOscillator(),g=AC.createGain(); o.type=kind==='bad'?'square':'triangle'; o.frequency.value=f; const t=AC.currentTime+i*(kind==='win'?0.1:0.08), v=kind==='bad'?0.05:kind==='tap'||kind==='pop'?0.05:0.14;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+0.24); }); }catch(e){} }
let tT=null; function toast(m,k){ const t=$('#toast'); t.textContent=m; t.className='toast on '+(k||'info'); clearTimeout(tT); tT=setTimeout(()=>t.className='toast',2400); }

/* ---------- shared scene pieces ---------- */
function flowScene(S,dt,o){ o=o||{};
  const plateY=H*0.78, top=H*0.12, avail=plateY-top, xl=W*0.08, dmax=avail*0.6, U=W*0.12;
  const del=x=>x<=xl?0:dmax*Math.sqrt((x-xl)/(W-xl));
  if(!S.parts){ S.parts=[]; for(let i=0;i<200;i++) S.parts.push({x:Math.random()*1.1-0.1,y:Math.random(),a:Math.random()*12}); }
  for(const p of S.parts){ const x=p.x*W, h=p.y*avail, d=del(x), f=d>0?cubic(h/d):1, s=U*Math.max(f,0.03);
    p.x+=s*dt/W; p.a+=dt; if(p.x>1.02||p.a>16){ p.x=-Math.random()*0.12; p.y=Math.random(); p.a=0; }
    line(x-Math.max(3,s*0.1),plateY-h,x,plateY-h,mix(C.heat,C.flow,f*f*f),2.2); }
  return {plateY,top,avail,xl,dmax,del}; }
function elemGeo(cxf,cyf){ const s=Math.min(W*0.28,H*0.4), cx=W*(cxf||0.5), cy=H*(cyf||0.52); return {s,cx,cy,x0:cx-s/2,x1:cx+s/2,y0:cy-s/2,y1:cy+s/2,L:s*0.72}; }
function elemBox(G,t){ ctx.fillStyle=rgba(C.violet,0.13); ctx.fillRect(G.x0,G.y0,G.s,G.s); ctx.strokeStyle=C.violet; ctx.lineWidth=2; ctx.strokeRect(G.x0,G.y0,G.s,G.s);
  text('dx',G.cx,G.y1-12,{align:'center',fam:MATH,italic:1,c:C.dim}); text('dy',G.x0+10,G.cy,{fam:MATH,italic:1,c:C.dim}); }
function dots(x1,y1,x2,y2,t,c,n,speed){ for(let i=0;i<n;i++){ const ph=RM?(i+0.5)/n:((t*(speed||0.5)+i/n)%1); circle(x1+(x2-x1)*ph,y1+(y2-y1)*ph,3.2,c); } }

/* ---------- scenes ---------- */
const TERMS=[
  {id:'T1',parts:['ρ',{n:'∂u',d:'∂t'}],col:'violet'},
  {id:'T2',parts:['ρu',{n:'∂u',d:'∂x'}],col:'flow'},
  {id:'T3',parts:['ρv',{n:'∂u',d:'∂y'}],col:'flow'},
  {id:'T4',parts:['ρu(',{n:'∂u',d:'∂x'},' + ',{n:'∂v',d:'∂y'},')'],col:'flow'},
  {id:'T5',parts:['−',{n:'∂p',d:'∂x'}],col:'gold'},
  {id:'T6',parts:['μ',{n:'∂²u',d:'∂x²'}],col:'heat2'},
  {id:'T7',parts:['μ',{n:'∂²u',d:'∂y²'}],col:'heat'}
];
const FULL_EQ=`ρ${D('u','t')} + ρu${D('u','x')} + ρv${D('u','y')} + ρu(${D('u','x')} + ${D('v','y')}) = −${D('p','x')} + μ${D2('u','x')} + μ${D2('u','y')}`;
const CARDS=[
  {id:'steady',label:'Steady flow',kill:'T1',hint:'Which term changes with time?',why:'Steady: nothing changes in time, so ρ ∂u/∂t = 0.'},
  {id:'cont',label:'Continuity',kill:'T4',hint:'Find the bracket you met in scene 3.',why:'Continuity says ∂u/∂x + ∂v/∂y = 0, so the whole bracket is zero.'},
  {id:'dpdx',label:'Flat plate: dp/dx = 0',kill:'T5',hint:'Which term holds the pressure?',why:'u∞ is constant along a flat plate, so pressure does not change with x.'},
  {id:'thin',label:'Thin layer: δ ≪ x',kill:'T6',hint:'Which second derivative is along the plate?',why:'In a thin layer u changes far faster across y than along x. The next scene proves it.'}
];

const SCENES=[
/* ===== Chapter 1: See it ===== */
{ chap:0, name:'Probe the flow', instr:'Drag along the plate to move the probe.',
  init(S){ S.px=0.22; S.lo=S.hi=0.22; },
  down(S,x){ this.move(S,x,0,true); },
  move(S,x,y,drag){ if(!drag) return; const xl=W*0.08; S.px=clamp((x-xl)/(W-xl),0.03,1); S.moved=true; S.lo=Math.min(S.lo,S.px); S.hi=Math.max(S.hi,S.px);
    if(!S.done&&S.hi-S.lo>0.6) complete('Fluid sticks to the plate. The slowed region, the <b>boundary layer δ(x)</b>, gets thicker the further you go.'); },
  draw(S,t,dt){ const g=flowScene(S,dt); const {plateY,xl,del}=g;
    const ed=[]; for(let i=0;i<=80;i++){ const x=xl+(W-xl)*i/80; ed.push([x,plateY-del(x)]); } stroke(ed,rgba(C.ink,0.35),1.5,[5,6]);
    const px=xl+(W-xl)*S.px, d=del(px), Lm=Math.min(W*0.14,90);
    line(px,plateY,px,plateY-Math.max(d*1.5,30),C.gold,2);
    for(let k=1;k<=7;k++){ const h=k/7*d*1.3; arrow(px,plateY-h,px+cubic(h/d)*Lm,plateY-h,C.gold,2,6); }
    const pts=[]; for(let i=0;i<=40;i++){ const h=i/40*d*1.4; pts.push([px+cubic(h/d)*Lm,plateY-h]); } stroke(pts,C.gold,3,null,10);
    line(px-10,plateY,px-10,plateY-d,C.ink,1.5); text('δ',px-16,plateY-d/2,{align:'right',fam:MATH,italic:1,size:FS+3});
    plate(xl,W,plateY);
    circle(px,plateY+24,11,C.gold); if(!S.moved) hint(px,plateY+24,t,'drag');
    circle(W-96,20,5,C.heat); text('slow',W-86,20,{size:FS-1,c:C.dim}); circle(W-46,20,5,C.flow); text('fast',W-36,20,{size:FS-1,c:C.dim}); },
  live(S){ const x=S.px, d=5*x/Math.sqrt(5*x/1.5e-5)*1000; return `air at 5 m/s, 1 m plate: &nbsp; x = <b>${x.toFixed(2)} m</b> &nbsp; δ = <b>${d.toFixed(1)} mm</b>`; } },

{ chap:0, name:'Sketch the profile', instr:'Draw the speed profile: start at the wall and drag upward.',
  init(S){ S.N=56; S.u=Array(S.N).fill(null); S.last=null; },
  plot(){ return mkPlot(54,28,W-54-30,H-28-46,[0,1.3],[0,1.4]); },
  down(S,x,y){ if(S.evaluated){ S.u.fill(null); S.evaluated=false; } S.last=null; this.move(S,x,y,true); },
  move(S,x,y,drag){ if(!drag) return; const p=this.plot(); const u=clamp(p.iX(x),0,1.3), yy=p.iY(y); const i=Math.round(clamp(yy/1.4,0,1)*(S.N-1));
    if(S.last!=null){ const a=S.last.i, ua=S.last.u; const st=i>a?1:-1; for(let k=a;k!==i;k+=st){ const f=(k-a)/(i-a); S.u[k]=ua+(u-ua)*f; } } S.u[i]=u; S.last={i,u}; },
  up(S){ const n=S.u.filter(v=>v!=null).length; if(n<S.N*0.6){ toast('Keep going: from the wall to above δ.','info'); return; }
    const at=k=>{ for(let d=0;d<S.N;d++){ if(S.u[k+d]!=null) return S.u[k+d]; if(S.u[k-d]!=null) return S.u[k-d]; } return 0; };
    const yb=k=>k/(S.N-1)*1.4; let err=0,c=0; S.u.forEach((v,k)=>{ if(v!=null){ err+=Math.abs(v-cubic(yb(k))); c++; } });
    const top=[]; S.u.forEach((v,k)=>{ if(v!=null&&yb(k)>1.08) top.push(v); });
    S.chk=[at(0)<=0.15, top.length>0&&Math.abs(top.reduce((a,b)=>a+b,0)/top.length-1)<0.15, Math.abs(at(Math.round(1.0/1.4*(S.N-1)))-at(Math.round(0.86/1.4*(S.N-1))))<0.1];
    S.match=Math.max(0,Math.round(100-err/c*130)); S.evaluated=true; sfx(S.match>70?'good':'pop');
    if(!S.done) complete('The real profile is <b>zero at the wall</b> and <b>blends smoothly into u∞ at δ</b>. Any profile we guess must obey those rules.'); },
  draw(S,t){ const p=this.plot(); axes(p,'u','y');
    line(p.X(0),p.Y(1),p.X(1.3),p.Y(1),C.edge,1.5,[5,5]); text('δ',p.l-16,p.Y(1),{fam:MATH,italic:1,c:C.dim,size:FS+2});
    line(p.X(1),p.t,p.X(1),p.t+p.h,C.edge,1.5,[5,5]); text('u∞',p.X(1),p.t-10,{fam:MATH,italic:1,c:C.dim,align:'center'});
    ctx.fillStyle=C.plate; ctx.fillRect(p.l,p.t+p.h,p.w,6); text('wall',p.l+p.w-4,p.t+p.h+18,{align:'right',c:C.dim,size:FS-2});
    const pts=[]; S.u.forEach((v,k)=>{ if(v!=null) pts.push([p.X(v),p.Y(k/(S.N-1)*1.4)]); else if(pts.length&&pts[pts.length-1]) pts.push(null); });
    let seg=[]; pts.forEach(q=>{ if(q) seg.push(q); else { if(seg.length) stroke(seg,C.flow,4,null,10); seg=[]; } }); if(seg.length) stroke(seg,C.flow,4,null,10);
    if(S.evaluated){ const r=[]; for(let i=0;i<=60;i++){ const e=1.4*i/60; r.push([p.X(cubic(e)),p.Y(e)]); } stroke(r,C.gold,3,[7,5],8);
      const marks=[[0,0],[1,1.15],[1,0.93]]; S.chk.forEach((ok,i)=>{ const [u,e]=marks[i]; circle(p.X(u)+(i?16:14),p.Y(e)-(i?0:14),10,ok?C.good:C.bad); text(ok?'✓':'✗',p.X(u)+(i?16:14),p.Y(e)-(i?0:14),{align:'center',c:C.night,weight:700,size:FS-1}); });
      text('real profile',p.X(0.62),p.Y(0.42),{c:C.gold,size:FS-1}); }
    else if(!S.u.some(v=>v!=null)){ hint(p.X(0.02),p.Y(0.03),t,'start here'); } },
  live(S){ if(!S.evaluated) return 'x-axis: speed u &nbsp;·&nbsp; y-axis: height above the wall';
    const L=['starts at 0','reaches u∞','smooth join']; return `match <b>${S.match}%</b> &nbsp; `+S.chk.map((ok,i)=>`<span class="${ok?'g':'r'}">${ok?'✓':'✗'} ${L[i]}</span>`).join(' &nbsp; '); },
  extra(S){ return S.evaluated?[['Redraw',()=>{ S.u.fill(null); S.evaluated=false; render(); }]]:[]; } },

/* ===== Chapter 2: Build it ===== */
{ chap:1, name:'Mass in, mass out', instr:'Zoom into a tiny box of fluid. Drag the right arrow to slow the fluid down.',
  init(S){ S.uR=1.0; S.vin=0.3; },
  down(S,x,y){ this.move(S,x,y,true); },

    if(!S.done&&S.uR<=0.72) complete(`Slower in x means fluid must escape through the top.<div class="m">${D('u','x')} + ${D('v','y')} = 0</div>That is continuity, and it is why v &gt; 0 in a boundary layer.`); },
  draw(S,t){ const G=elemGeo(0.5,0.54), {x0,x1,y0,y1,cx,cy,L}=G; const vout=S.vin+(1-S.uR);
    elemBox(G,t);
    arrow(x0-L,cy,x0-4,cy,C.flow,4); dots(x0-L,cy,x0-4,cy,t,C.flow,3,0.5); text('1.00',x0-L/2,cy-16,{align:'center',c:C.flow});
    arrow(x1+4,cy,x1+4+L*S.uR,cy,C.flow,4); dots(x1+4,cy,x1+4+L*S.uR,cy,t,C.flow,3,0.5*S.uR); text(S.uR.toFixed(2),x1+4+L*S.uR/2,cy-16,{align:'center',c:C.flow});
    circle(x1+4+L*S.uR,cy,11,null,C.gold,3); if(!S.touched) hint(x1+4+L*S.uR,cy,t,'drag');
    arrow(cx,y1+4+L*S.vin,cx,y1+4,C.flow,4); text(S.vin.toFixed(2),cx+12,y1+4+L*S.vin/2,{c:C.flow});
    if(vout>0.01){ arrow(cx,y0-4,cx,y0-4-L*vout,S.uR<1?C.gold:C.flow,4); dots(cx,y0-4,cx,y0-4-L*vout,t,S.uR<1?C.gold:C.flow,3,0.5*vout); } text(vout.toFixed(2),cx+12,y0-4-L*vout/2,{c:S.uR<1?C.gold:C.flow});
    const ins=1+S.vin, outs=S.uR+vout; text(`in ${ins.toFixed(2)}  =  out ${outs.toFixed(2)}`,W/2,18,{align:'center',c:C.good,weight:600,size:FS+2});
    plate(W*0.04,W*0.25,H*0.92); text('the box sits inside the layer, just above the plate',W*0.27,H*0.92+3,{size:FS-3,c:C.dim}); },
  live(S){ const dudx=S.uR-1; return `${D('u','x')} ≈ <b>${dudx.toFixed(2)}</b> &nbsp; ⇒ &nbsp; ${D('v','y')} ≈ <b>${(-dudx).toFixed(2)}</b>`; } },

{ chap:1, name:'What crossing fluid carries', instr:'Drag each glowing parcel into the box. Watch its little sideways arrow.',
  init(S){ S.got={}; S.dragK=null; },
  homes(G){ return {bottom:[G.cx-G.s*0.18,G.y1+G.L*0.75],left:[G.x0-G.L*0.75,G.cy-G.s*0.15]}; },
  down(S,x,y){ const G=elemGeo(0.5,0.5), Hm=this.homes(G); S.pos=S.pos||{bottom:Hm.bottom.slice(),left:Hm.left.slice()};
    for(const k of ['bottom','left']){ const p=S.pos[k]; if(Math.hypot(p[0]-x,p[1]-y)<40){ S.dragK=k; S.off=[p[0]-x,p[1]-y]; return; } } },
  move(S,x,y,drag){ if(!drag||!S.dragK) return; const G=elemGeo(0.5,0.5); const p=S.pos[S.dragK]; p[0]=x+S.off[0]; p[1]=y+S.off[1];
    if(p[0]>G.x0+8&&p[0]<G.x1-8&&p[1]>G.y0+8&&p[1]<G.y1-8){ const k=S.dragK; S.dragK=null; const first=!S.got[k]; S.got[k]=t0(); sfx('good');
      toast(k==='bottom'?'It moved UP, but brought its x-speed u with it.':'It brings speed u, and carries x-speed u.','good');
      setTimeout(()=>{ const Hm=this.homes(elemGeo(0.5,0.5)); S.pos[k]=Hm[k].slice(); },500);
      if(first&&S.got.bottom&&S.got.left&&!S.done) setTimeout(()=>complete(`Every face carries x-momentum: <b>mass flow × x-speed</b>.<div class="m">sides: ρu·u dy &nbsp;&nbsp; top/bottom: ρv·u dx</div>`),700);
      render(); } },
  up(S){ if(S.dragK){ const G=elemGeo(0.5,0.5), Hm=this.homes(G); S.pos[S.dragK]=Hm[S.dragK].slice(); S.dragK=null; } },
  draw(S,t){ const G=elemGeo(0.5,0.5), {x0,x1,y0,y1,cx,cy,s,L}=G, Hm=this.homes(G); S.pos=S.pos||{bottom:Hm.bottom.slice(),left:Hm.left.slice()};
    elemBox(G,t);
    arrow(Hm.bottom[0],y1+L,Hm.bottom[0],y1+4,rgba(C.flow,0.35),3); arrow(Hm.left[0]-20,Hm.left[1],x0-4,Hm.left[1],rgba(C.flow,0.35),3);
    if(S.done){ const ph=RM?0.5:(t*0.5)%1; parcel(x1+10+L*ph,cy-s*0.15,0.9); parcel(cx-s*0.18,y0-10-L*ph,1.1); }
    for(const k of ['bottom','left']){ const p=S.pos[k]; parcel(p[0],p[1],k==='bottom'?0.75:0.9, S.dragK===k?(k==='bottom'?'up':'right'):null); if(!S.got[k]&&S.dragK!==k) hint(p[0],p[1],t,'drag'); }
    const L2=[['bottom','ρv · u dx  in through the bottom'],['left','ρu · u dy  in through the left']]; let yy=18; L2.forEach(([k,s2])=>{ if(S.got[k]){ text('✓ '+s2,14,yy,{fam:MATH,size:FS,c:C.good}); yy+=22; } }); },
  live(S){ return `parcel = a bit of mass &nbsp;·&nbsp; <span style="color:var(--ink)">white arrow</span> = its x-speed u`; } },

{ chap:1, name:'Forces on the box', instr:'Drag each force onto the face where it acts.',
  init(S){ S.placed={}; S.drag=null; },
  toks(){ const narrow=W<560; const L=[['p','p','gold','left'],['pp','p + dp','gold','right'],['sb','τ from below','heat','bottom'],['st','τ from above','heat','top']];
    return L.map(([id,lab,col,face],i)=>{ ctx.font=`600 ${FS}px ${DISP}`; const w=ctx.measureText(lab).width+24, h=32; const x=narrow?12+i*(W-24)/4:12, y=narrow?12:20+i*44; return {id,lab,col,face,w:narrow?Math.min(w,(W-24)/4-6):w,h,x,y}; }); },
  G(){ return W<560?elemGeo(0.5,0.6):elemGeo(0.6,0.52); },
  down(S,x,y){ for(const k of this.toks()){ if(S.placed[k.id]) continue; const p=S.drag&&S.drag.id===k.id?S.drag:k; if(x>=p.x&&x<=p.x+k.w&&y>=p.y&&y<=p.y+k.h){ S.drag={id:k.id,x:k.x,y:k.y,ox:x-k.x,oy:y-k.y}; return; } } },
  move(S,x,y,drag){ if(drag&&S.drag){ S.drag.x=x-S.drag.ox; S.drag.y=y-S.drag.oy; } },
  up(S,x,y){ if(!S.drag) return; const k=this.toks().find(q=>q.id===S.drag.id), G=this.G();
    const d={left:Math.abs(x-G.x0)+(y<G.y0-20||y>G.y1+20?60:0),right:Math.abs(x-G.x1)+(y<G.y0-20||y>G.y1+20?60:0),top:Math.abs(y-G.y0)+(x<G.x0-20||x>G.x1+20?60:0),bottom:Math.abs(y-G.y1)+(x<G.x0-20||x>G.x1+20?60:0)};
    const f=Object.entries(d).sort((a,b)=>a[1]-b[1])[0]; S.drag=null;
    if(f[1]>G.L) return;
    if(f[0]===k.face){ S.placed[k.id]=1; sfx('good'); toast({p:'Pressure on the left pushes it forward.',pp:'Pressure on the right pushes back.',sb:'Slower fluid below drags it back.',st:'Faster fluid above pulls it forward.'}[k.id],'good');
      if(Object.keys(S.placed).length===4&&!S.done) setTimeout(()=>complete(`Net force = net x-momentum flowing out. Add every face, divide by dx·dy:<div class="m">${FULL_EQ}</div>`),600); }
    else { sfx('bad'); toast(k.face==='left'||k.face==='right'?'Pressure pushes on the sides of the box.':'Shear acts along the top and bottom faces.','bad'); } },
  draw(S,t){ const G=this.G(), {x0,x1,y0,y1,cx,cy,s,L}=G; elemBox(G,t);
    arrow(x0-L*0.9,cy-s*0.2,x0-4,cy-s*0.2,rgba(C.flow,0.3),3); arrow(x1+4,cy-s*0.2,x1+L*0.9,cy-s*0.2,rgba(C.flow,0.3),3);
    arrow(cx-s*0.25,y1+L*0.8,cx-s*0.25,y1+4,rgba(C.flow,0.3),3); arrow(cx-s*0.25,y0-4,cx-s*0.25,y0-L*0.8,rgba(C.flow,0.3),3);
    const P=S.placed;
    if(P.p){ arrow(x0-L*0.8,cy+s*0.22,x0-4,cy+s*0.22,C.gold,4); text('p dy',x0-L*0.4,cy+s*0.22+16,{align:'center',fam:MATH,c:C.gold}); }
    if(P.pp){ arrow(x1+L*0.8,cy+s*0.22,x1+4,cy+s*0.22,C.gold,4); text('(p + dp) dy',x1+L*0.42,cy+s*0.22+16,{align:'center',fam:MATH,c:C.gold}); }
    if(P.sb){ arrow(cx+s*0.42,y1+12,cx-s*0.05,y1+12,C.heat,4); text('τ dx',cx+s*0.2,y1+28,{align:'center',fam:MATH,c:C.heat}); }
    if(P.st){ arrow(cx-s*0.05,y0-12,cx+s*0.42,y0-12,C.heat,4); text('(τ + dτ) dx',cx+s*0.2,y0-28,{align:'center',fam:MATH,c:C.heat}); }
    if(S.done){ arrow(x0-4,cy,x0-L*0.45,cy,C.heat2,2.5,7,[5,4]); arrow(x1+4,cy,x1+L*0.45,cy,C.heat2,2.5,7,[5,4]); text('+ small normal viscous stress',W/2,H-14,{align:'center',c:C.heat2,size:FS-2}); }
    if(S.drag){ ['left','right','top','bottom'].forEach(f=>{ const seg={left:[x0,y0,x0,y1],right:[x1,y0,x1,y1],top:[x0,y0,x1,y0],bottom:[x0,y1,x1,y1]}[f]; line(...seg,C.gold,4+2*pulse(t),[6,5]); }); }
    this.toks().forEach((k,i)=>{ if(P[k.id]) return; const p=S.drag&&S.drag.id===k.id?S.drag:k; rrect(p.x,p.y,k.w,k.h,10,C.panel2,C[k.col],2.5); text(k.lab,p.x+k.w/2,p.y+k.h/2+1,{align:'center',size:FS,weight:600,c:C[k.col]}); if(!S.drag&&i===Object.keys(P).length&&!S.done) hint(p.x+k.w-6,p.y+k.h/2,t); }); },
  live(S){ return `<span style="color:var(--gold)">gold</span>: pressure &nbsp;·&nbsp; <span style="color:var(--heat)">orange</span>: shear τ = μ ∂u/∂y`; } },

{ chap:1, name:'Checkpoint: assumptions', check:true, instr:'Drag each assumption onto the term it kills.',
  init(S){ S.k=0; S.dead={}; S.tries=3; S.bits=[]; S.card=null; S.fly=null; },
  layout(){ const size=clamp(W/34,14,22), toks=[]; TERMS.forEach((tm,i)=>{ if(i===4) toks.push({op:'='}); else if(i) toks.push({op:'+'}); toks.push({tm}); });
    const items=toks.map(o=>({o,parts:o.tm?o.tm.parts:[o.op],pad:o.tm?10:4}));
    let x=16,y=H*0.22,rows=[[]]; const maxW=W-32, lh=size*2.9;
    items.forEach(it=>{ it.w=exprW(it.parts,size)+it.pad*2; if(x+it.w>16+maxW&&rows[rows.length-1].length){ rows.push([]); x=16; y+=lh; } it.x=x; it.y=y; rows[rows.length-1].push(it); x+=it.w+6; });
    rows.forEach(r=>{ const last=r[r.length-1], used=last.x+last.w-16, off=(maxW-used)/2; r.forEach(it=>it.x+=off); });
    return {items,size,lh}; },
  cardPos(){ return {x:W/2,y:H*0.82}; },
  down(S,x,y){ if(S.k>=4||S.fly) return; const c=S.card||this.cardPos(); ctx.font=`600 ${FS+1}px ${DISP}`; const w=ctx.measureText(CARDS[S.k].label).width+36;
    if(Math.abs(x-c.x)<w/2+10&&Math.abs(y-c.y)<26){ S.card={x:c.x,y:c.y,ox:x-c.x,oy:y-c.y}; } },
  move(S,x,y,drag){ if(drag&&S.card&&S.card.ox!=null){ S.card.x=x-S.card.ox; S.card.y=y-S.card.oy; } },
  up(S,x,y){ if(!S.card||S.card.ox==null) return; const L=this.layout(); const hit=L.items.find(it=>it.o.tm&&!S.dead[it.o.tm.id]&&x>=it.x-6&&x<=it.x+it.w+6&&Math.abs(y-it.y)<L.size*1.4);
    const cd=CARDS[S.k]; S.card=null; if(!hit) return;
    if(hit.o.tm.id===cd.kill) this.kill(S,hit,true);
    else { S.tries--; sfx('bad'); if(S.tries>0) toast(`Not that one. ${cd.hint}`,'bad'); else this.auto(S); render(); } },
  auto(S){ const L=this.layout(); const it=L.items.find(q=>q.o.tm&&q.o.tm.id===CARDS[S.k].kill); const c=this.cardPos(); S.fly={x0:c.x,y0:c.y,x1:it.x+it.w/2,y1:it.y,t:performance.now(),it}; toast('Here it goes →','info'); },
  kill(S,it,earned){ const cd=CARDS[S.k]; S.dead[cd.kill]=1; sfx(earned?'good':'pop');
    for(let i=0;i<26;i++) S.bits.push({x:it.x+Math.random()*it.w,y:it.y+(Math.random()-0.5)*20,vx:(Math.random()-0.5)*4,vy:-Math.random()*3,life:1,c:C[TERMS.find(q=>q.id===cd.kill).col]});
    S.msg=cd.why; toast(cd.why,earned?'good':'info'); S.k++; S.tries=3; S.fly=null; render();
    if(S.k>=4&&!S.done) setTimeout(()=>complete(`What is left, divided by ρ, is Prandtl’s boundary-layer equation:<div class="m">u${D('u','x')} + v${D('u','y')} = ν${D2('u','y')}</div>`),900); },
  draw(S,t,dt){ const L=this.layout();
    L.items.forEach(it=>{ const tm=it.o.tm; if(!tm){ text(it.o.op,it.x+it.w/2,it.y,{align:'center',fam:MATH,size:L.size,c:C.dim}); return; }
      const dead=S.dead[tm.id], col=C[tm.col]; ctx.globalAlpha=dead?0.2:1; rrect(it.x,it.y-L.size*1.15,it.w,L.size*2.3,10,C.panel2,col,2); expr(tm.parts,it.x+it.pad,it.y,L.size,col);
      if(dead) line(it.x+4,it.y+L.size*0.9,it.x+it.w-4,it.y-L.size*0.9,C.bad,2.5); ctx.globalAlpha=1; });
    S.bits.forEach(b=>{ b.vy+=0.15; b.x+=b.vx; b.y+=b.vy; b.life-=dt*1.2; ctx.globalAlpha=Math.max(0,b.life); ctx.fillStyle=b.c; ctx.fillRect(b.x,b.y,4,4); }); ctx.globalAlpha=1; S.bits=S.bits.filter(b=>b.life>0);
    if(S.k<4){ const cd=CARDS[S.k]; let c=S.card||this.cardPos();
      if(S.fly){ const f=Math.min(1,(performance.now()-S.fly.t)/900); c={x:S.fly.x0+(S.fly.x1-S.fly.x0)*f,y:S.fly.y0+(S.fly.y1-S.fly.y0)*f}; if(f>=1) this.kill(S,S.fly.it,false); }
      ctx.font=`600 ${FS+1}px ${DISP}`; const w=ctx.measureText(cd.label).width+36;
      rrect(c.x-w/2,c.y-22,w,44,14,C.gold,null); text(cd.label,c.x,c.y+1,{align:'center',weight:600,size:FS+1,c:C.night});
      if(!S.card&&!S.fly) hint(c.x+w/2-4,c.y,t);
      const cp=this.cardPos(); for(let i=0;i<3;i++) circle(cp.x-16+i*16,cp.y+38,5,i<S.tries?C.violet:C.edge);
      text(`card ${S.k+1} of 4`,cp.x,cp.y-40,{align:'center',size:FS-2,c:C.dim}); }
    else { text('÷ ρ  →',W/2,H*0.8-26,{align:'center',c:C.dim}); exprC(['u',{n:'∂u',d:'∂x'},' + v',{n:'∂u',d:'∂y'},' = ν',{n:'∂²u',d:'∂y²'}],W/2,H*0.84,clamp(W/28,16,26),C.gold); } },
  live(S){ return S.k<4?`3 chances per card &nbsp;·&nbsp; then I place it for you`:'4 assumptions, 4 terms gone'; } },

{ chap:1, name:'Is the layer really thin?', instr:'Drag the Re knob until the dropped term is under 1%.',
  init(S){ S.re=1.6; },
  track(){ return {x0:W*0.12,x1:W*0.88,y:H*0.86}; },
  down(S,x,y){ this.move(S,x,y,true); },
  move(S,x,y,drag){ if(!drag) return; const T=this.track(); S.re=1+5*clamp((x-T.x0)/(T.x1-T.x0),0,1); S.touched=true; },
  up(S){ if(25/10**S.re<0.01&&!S.done) complete(`At ordinary Reₓ the layer is so thin that ∂²u/∂x² is tiny next to ∂²u/∂y². Dropping it was safe.<div class="m">${fr('∂²u/∂x²','∂²u/∂y²')} ~ (δ/x)² ≈ 25/Reₓ</div>`); },

    text('δ/x ≈ '+(dx<1?dx.toFixed(dx<0.1?3:2):'> 1'),px1,py-hmax-8,{align:'right',fam:MATH,size:FS+2,c:C.flow});
    const bars=[['kept: u ∂u/∂x',1,C.flow],['kept: ν ∂²u/∂y²',1,C.heat],['dropped: ν ∂²u/∂x²',Math.min(ratio,1.5),C.heat2]];
    const bx=W*0.42,bw=W*0.48,by=py+30,bh=Math.min(28,H*0.07);
    bars.forEach(([l,v,c],i)=>{ const y=by+i*bh*1.35; text(l,bx-10,y+bh/2,{align:'right',fam:MATH,size:FS-1}); ctx.fillStyle=rgba(C.edge,0.6); ctx.fillRect(bx,y,bw,bh); ctx.fillStyle=c; ctx.fillRect(bx,y,Math.max(2,bw*v/1.5),bh);
      if(i===2) text((ratio*100<0.1?'< 0.1':(ratio*100).toPrecision(2))+'%',bx+Math.max(2,bw*v/1.5)+8,y+bh/2,{weight:700,c:ratio<0.01?C.good:C.heat2}); });
    const T=this.track(), kx=T.x0+(T.x1-T.x0)*(S.re-1)/5; line(T.x0,T.y,T.x1,T.y,C.edge,8); line(T.x0,T.y,kx,T.y,C.gold,8);
    [1,2,3,4,5,6].forEach(v=>text('10'+'⁰¹²³⁴⁵⁶'[v],T.x0+(T.x1-T.x0)*(v-1)/5,T.y+22,{align:'center',size:FS-2,c:C.dim}));
    circle(kx,T.y,14,C.gold); text('Re',kx,T.y,{align:'center',size:FS-3,weight:700,c:C.night}); if(!S.touched) hint(kx,T.y,t); },

/* ===== Chapter 3: Solve it ===== */
{ chap:2, name:'Fit the cubic', instr:'Drag the knob on the pad until every lamp lights.',
  init(S){ S.b=0.9; S.c=0.7; S.t0=performance.now(); },
  lay(){ const wide=W>=560; return wide?{plot:mkPlot(48,46,W*0.46-60,H-46-44,[0,1.15],[0,1.25]),pad:{x:W*0.56,y:46,w:Math.min(W*0.4,H-90),h:Math.min(W*0.4,H-90)}}:{plot:mkPlot(44,44,W-44-20,H*0.48-44,[0,1.15],[0,1.25]),pad:{x:W/2-Math.min(W*0.7,H*0.42)/2,y:H*0.53,w:Math.min(W*0.7,H*0.42),h:Math.min(W*0.7,H*0.42)}}; },
  coef(S){ return {a:1-S.b-S.c,b:S.b,c:S.c}; },
  down(S,x,y){ this.move(S,x,y,true); },
  move(S,x,y,drag){ if(!drag||S.done) return; const P=this.lay().pad; if(x<P.x-20||x>P.x+P.w+20||y<P.y-20||y>P.y+P.h+20) return;
    S.b=clamp(-1.5+3*(x-P.x)/P.w,-1.5,1.5); S.c=clamp(1.5-3*(y-P.y)/P.h,-1.5,1.5); S.touched=true; this.lamps(S); },
  lamps(S){ const lc=Math.abs(1+S.b+2*S.c)<0.09, ld=Math.abs(S.b)<0.08; if(lc&&!S.seenC){ S.seenC=1; sfx('pop'); toast('Lamp c: it joins u∞ smoothly.','good'); } if(ld&&!S.seenD){ S.seenD=1; sfx('pop'); toast('Lamp d: no curvature at the wall.','good'); }
    if(lc&&ld&&!S.done){ S.b=0; S.c=-0.5; complete(`Four rules fixed four constants: C₁ = 0, C₃ = 0.<div class="m">${fr('u','u∞')} = ${fr('3','2')}η − ${fr('1','2')}η³, &nbsp; η = y/δ</div>`); } },
  draw(S,t){ const {plot:p,pad:P}=this.lay(), k=this.coef(S); axes(p,'u','y'); line(p.X(0),p.Y(1),p.X(1.15),p.Y(1),C.edge,1.5,[5,5]);
    const f=e=>e>=1?1:k.a*e+k.b*e*e+k.c*e*e*e; const pts=[]; for(let i=0;i<=80;i++){ const e=1.25*i/80; pts.push([p.X(clamp(f(e),-0.2,1.6)),p.Y(e)]); } stroke(pts,S.done?C.gold:C.flow,3.5,null,10);
    const lamps=[['a',1],['b',1],['c',Math.abs(1+S.b+2*S.c)<0.09],['d',Math.abs(S.b)<0.08]];
    lamps.forEach(([l,on],i)=>{ const x=p.l+12+i*34, y=p.t-24; if(on&&!RM){ ctx.save(); ctx.shadowColor=C.good; ctx.shadowBlur=14; circle(x,y,12,C.good); ctx.restore(); } else circle(x,y,12,on?C.good:C.edge); text(l,x,y,{align:'center',weight:700,c:C.night}); });
    rrect(P.x,P.y,P.w,P.h,14,C.panel2,C.edge,2);
    const PX=b=>P.x+(b+1.5)/3*P.w, PY=c=>P.y+(1.5-c)/3*P.h;
    line(PX(0),P.y,PX(0),P.y+P.h,rgba(C.dim,0.25),1); line(P.x,PY(0),P.x+P.w,PY(0),rgba(C.dim,0.25),1);
    const showHint=S.seenC||S.seenD||(performance.now()-S.t0>14000);
    if(showHint||S.seenD){ line(PX(0),P.y,PX(0),P.y+P.h,rgba(C.good,0.6),2,[5,5]); text('d',PX(0)+6,P.y+12,{c:C.good,weight:700}); }
    if(showHint||S.seenC){ line(PX(-1.5),PY(0.25),PX(1.5),PY(-1.25),rgba(C.good,0.6),2,[5,5]); text('c',PX(1.3)+4,PY(-1.15)-10,{c:C.good,weight:700}); }
    text('C₃ →',P.x+P.w-4,P.y+P.h+14,{align:'right',size:FS-2,c:C.dim}); text('↑ C₄',P.x+2,P.y-10,{size:FS-2,c:C.dim});
    circle(PX(S.b),PY(S.c),13,C.gold); if(!S.touched) hint(PX(S.b),PY(S.c),t,'drag'); },
  live(S){ const k=this.coef(S), sg=v=>(v<0?'− ':'+ ')+Math.abs(v).toFixed(2); return `u/u∞ = <b>${k.a.toFixed(2)}</b>η ${sg(k.b)}η² ${sg(k.c)}η³ &nbsp;·&nbsp; lamps a, b are built in`; } },

{ chap:2, name:'Checkpoint: the curvature rule', check:true, instr:'Why does lamp d hold at the wall?',
  init(S){ ask(S,{q:'At the wall, why must ∂²u/∂y² = 0?',
    opts:['u = v = 0 there, so the left side vanishes, and dp/dx = 0','The shear stress is zero at the wall','The profile is straight near the wall by assumption','Viscosity vanishes at the wall'],
    correct:0, hints:[null,'Shear is largest at the wall, not zero.','That is circular. The straight start is the result, not the reason.','μ is a property of the fluid. It does not vanish.'],
    explain:'Put y = 0 into the momentum equation. u = v = 0 kills the left side and dp/dx = 0 on a flat plate, so μ ∂²u/∂y² = 0.',
    onDone(S){ S.revT=performance.now(); setTimeout(()=>complete('The curvature rule is the momentum equation itself, read at the wall.'),2800); } }); },
  draw(S,t){ const size=clamp(W/32,14,22), y0=H*0.2;
    exprC(['ρ(u',{n:'∂u',d:'∂x'},' + v',{n:'∂u',d:'∂y'},') = −',{n:'dp',d:'dx'},' + μ',{n:'∂²u',d:'∂y²'}],W/2,y0,size,C.ink);
    const wy=H*0.86; ctx.fillStyle=C.plate; ctx.fillRect(W*0.08,wy,W*0.84,7); text('wall, y = 0',W*0.08,wy+22,{c:C.dim,size:FS-1});
    for(let k=1;k<=5;k++){ const h=k*H*0.05; arrow(W*0.16,wy-h,W*0.16+cubic(h/(H*0.3))*W*0.22,wy-h,C.flow,2,6); }
    circle(W*0.16,wy,8,C.gold); hint(W*0.16,wy,t);
    if(S.revT){ const st=Math.min(3,Math.floor((performance.now()-S.revT)/900));
      if(st>=1) text('at y = 0:   u = 0,   v = 0,   dp/dx = 0',W/2,y0+size*2.6,{align:'center',fam:MATH,size:size*0.9,c:C.gold});
      if(st>=2) exprC(['0 = 0 + μ',{n:'∂²u',d:'∂y²'}],W/2,y0+size*4.8,size,C.ink);
      if(st>=3){ const w=exprW([{n:'∂²u',d:'∂y²'},' = 0 at the wall'],size); rrect(W/2-w/2-12,y0+size*6.2,w+24,size*2.6,12,null,C.good,2.5); exprC([{n:'∂²u',d:'∂y²'},' = 0 at the wall'],W/2,y0+size*7.5,size,C.good); } } },
  live(){ return ''; } },

{ chap:2, name:'Sweep the area', instr:'Drag across the plot to sweep out the momentum-deficit area.',
  init(S){ S.e=0; S.max=0; },
  plot(){ return mkPlot(50,34,W-50-24,H-34-50,[0,1],[0,1.05]); },
  down(S,x,y){ this.move(S,x,y,true); },
  move(S,x,y,drag){ if(!drag) return; const p=this.plot(); S.e=clamp(p.iX(x),0,1); S.max=Math.max(S.max,S.e); S.touched=true;
    if(S.max>=0.995&&!S.done) complete(`The area is a pure number, the same for every x:<div class="m">∫₀¹ f(1 − f) dη = 39/280</div>so the momentum integral becomes &nbsp;${fr('39','280')}ρu∞² dδ/dx = ${fr('3','2')}μu∞/δ`); },
  area(m){ let s=0,n=200; for(let i=0;i<n;i++){ const e=(i+0.5)/n*m, f=cubic(e); s+=f*(1-f)*m/n; } return s; },
  draw(S,t){ const p=this.plot(); axes(p,'η = y/δ',''); const g=e=>cubic(e)*(1-cubic(e));
    ctx.fillStyle=rgba(C.flow,0.35); ctx.beginPath(); ctx.moveTo(p.X(0),p.Y(0)); for(let i=0;i<=100;i++){ const e=S.max*i/100; ctx.lineTo(p.X(e),p.Y(g(e))); } ctx.lineTo(p.X(S.max),p.Y(0)); ctx.fill();
    const c=fn=>{ const a=[]; for(let i=0;i<=100;i++){ const e=i/100; a.push([p.X(e),p.Y(fn(e))]); } return a; };
    stroke(c(cubic),rgba(C.flow,0.5),2,[5,4]); stroke(c(e=>1-cubic(e)),rgba(C.heat,0.6),2,[5,4]); stroke(c(g),C.ink,3);
    text('f = u/u∞',p.X(0.72),p.Y(cubic(0.72))-14,{fam:MATH,italic:1,c:C.flow}); text('1 − f',p.X(0.16),p.Y(1-cubic(0.16))-12,{fam:MATH,italic:1,c:C.heat}); text('f(1 − f)',p.X(0.4),p.Y(g(0.4))-16,{fam:MATH,italic:1,align:'center'});
    const sx=p.X(S.e); line(sx,p.t,sx,p.t+p.h,C.gold,2.5); circle(sx,p.t+p.h,11,C.gold); if(!S.touched) hint(sx,p.t+p.h,t,'drag →');
    const fe=cubic(S.e); circle(sx,p.Y(fe),5,C.flow); circle(sx,p.Y(1-fe),5,C.heat); circle(sx,p.Y(fe*(1-fe)),5,C.ink);
    text('area = '+this.area(S.max).toFixed(4),p.l+p.w,p.t+4,{align:'right',weight:700,c:C.gold,size:FS+3}); if(S.done) text('= 39/280',p.l+p.w,p.t+30,{align:'right',weight:700,c:C.flow,size:FS+6}); },
  live(S){ const f=cubic(S.e); return `at η = <b>${S.e.toFixed(2)}</b>: &nbsp; f = ${f.toFixed(2)} (speed kept) &nbsp; 1 − f = ${(1-f).toFixed(2)} (speed lost)`; } },

{ chap:2, name:'Solve for the thickness', instr:S=>['Drag the red δ across the = sign.','Drag the gold dot down to where the layer starts.','Watch your answer race the exact one.'][S.ph||0],
  init(S){ S.ph=0; S.d0=2.2; },
  geo(){ const size=clamp(W/28,15,26); return {size,y:H*0.2}; },
  plot(){ return mkPlot(52,H*0.36,W-52-130,H*0.64-46,[0,1],[0,6]); },
  delta(S){ const g=this.geo(); const parts=[{n:'39',d:'280'},' ρu∞² ',{n:'dδ',d:'dx'},' = ',{n:'3',d:'2'},' ',{n:'μu∞',d:'  '}]; const w=exprW(parts,g.size); const x0=W/2-w/2; const last=exprW(parts.slice(0,-1),g.size);
    ctx.font=`400 ${g.size*0.78}px ${MATH}`; const fw=Math.max(ctx.measureText('μu∞').width,ctx.measureText('  ').width)+6; return {parts,x0,dx:x0+last+fw/2,dy:g.y+g.size*0.5,eqX:x0+exprW(parts.slice(0,3),g.size)}; },
  down(S,x,y){ if(S.ph===0){ const d=S.drag||this.delta(S); const p=S.drag?{x:S.drag.x,y:S.drag.y}:{x:this.delta(S).dx,y:this.delta(S).dy}; if(Math.hypot(x-p.x,y-p.y)<34) S.drag={x:p.x,y:p.y,ox:x-p.x,oy:y-p.y}; }
    else if(S.ph===1){ const p=this.plot(); if(Math.hypot(x-p.X(0),y-p.Y(S.d0))<40) S.grab=true; } },
  move(S,x,y,drag){ if(!drag) return; if(S.ph===0&&S.drag){ S.drag.x=x-S.drag.ox; S.drag.y=y-S.drag.oy; } if(S.ph===1&&S.grab){ const p=this.plot(); S.d0=clamp(p.iY(y),0,5); if(S.d0<0.15){ S.d0=0; S.grab=false; S.ph=2; S.raceT=performance.now(); sfx('good'); render(); toast('δ = 0 at the leading edge, so C = 0','good'); render();
      setTimeout(()=>{ if(!S.done) complete(`<div class="m">δ = √(280/13) √(νx/u∞) = 4.64 √(νx/u∞) &nbsp;⇒&nbsp; ${fr('δ','x')} = ${fr('4.64','√Reₓ')}</div>The exact Blasius answer is 5.0. A guessed cubic lands within 7%.`); },1900); } } },
  up(S,x){ if(S.ph===0&&S.drag){ const d=this.delta(S); if(x<d.eqX-10){ S.ph=1; sfx('good'); toast('Multiply both sides by δ: δ dδ = (140/13)(ν/u∞) dx','good'); render(); } S.drag=null; } S.grab=false; },
  draw(S,t){ const g=this.geo();
    if(S.ph===0){ const d=this.delta(S); expr(d.parts,d.x0,g.y,g.size,C.ink); const p=S.drag?{x:S.drag.x,y:S.drag.y}:{x:d.dx,y:d.dy};
      text('δ',p.x,p.y,{align:'center',fam:MATH,italic:1,size:g.size*0.95,weight:600,c:C.bad}); circle(p.x,p.y,g.size*0.7,null,C.bad,2); if(!S.drag) hint(p.x,p.y,t,'drag ←');
      text('ρ, u∞ are constants',W/2,g.y+g.size*2.4,{align:'center',c:C.dim,size:FS-1}); return; }
    exprC(['δ dδ = ',{n:'140',d:'13'},' ',{n:'ν',d:'u∞'},' dx',S.ph>=2?'   ⇒   δ = 4.64 √(νx/u∞)':'   ⇒   δ² = (280/13) νx/u∞ + 2C'],W/2,g.y,g.size*0.85,C.ink);
    const p=this.plot(); axes(p,'x','δ');
    const cur=x=>Math.sqrt(4.64*4.64*x+S.d0*S.d0); const prog=S.ph>=2?(RM?1:Math.min(1,(performance.now()-S.raceT)/1600)):1;
    const a=[]; for(let i=0;i<=80;i++){ const x=prog*i/80; a.push([p.X(x),p.Y(cur(x))]); } stroke(a,C.flow,3.5,null,10);
    if(S.ph>=2){ const b=[]; for(let i=0;i<=80;i++){ const x=prog*i/80; b.push([p.X(x),p.Y(5*Math.sqrt(x))]); } stroke(b,C.ink,2,[6,5]); if(prog>=1){ text('exact 5.0',p.X(1)+8,p.Y(5)-6,{c:C.dim,size:FS-1}); text('yours 4.64',p.X(1)+8,p.Y(4.64)+12,{c:C.flow,weight:700,size:FS-1}); } }
    else { circle(p.X(0),p.Y(S.d0),12,C.gold); hint(p.X(0),p.Y(S.d0),t,'drag ↓'); text('start of the plate, x = 0',p.X(0)+16,p.Y(S.d0)+2,{c:C.dim,size:FS-2}); } },
  live(S){ return S.ph===0?'Get every δ on the left, every x on the right.':S.ph===1?`δ at the leading edge: <b>${S.d0.toFixed(2)}</b> &nbsp;·&nbsp; drag it to where the layer really starts`:'C = 0 &nbsp;·&nbsp; δ ∝ √x, just as the probe showed'; } },

{ chap:2, name:'Heat joins in', check:true, instr:'Drag the Pr knob from liquid metal to oil.',
  init(S){ S.lp=-0.15; S.lo=S.hi=-0.15; },
  track(){ return {x0:W*0.1,x1:W*0.9,y:H*0.9}; },
  down(S,x,y){ this.move(S,x,y,true); },
  move(S,x,y,drag){ if(!drag) return; const T=this.track(); S.lp=-2+5*clamp((x-T.x0)/(T.x1-T.x0),0,1); S.touched=true; S.lo=Math.min(S.lo,S.lp); S.hi=Math.max(S.hi,S.lp);
    if(S.hi-S.lo>=2&&!S.asked){ S.asked=true; setTimeout(()=>ask(S,{q:'Engine oil (Pr ≈ 500) or air (Pr ≈ 0.7): which has the thinner thermal layer?',opts:['Engine oil','Air','About the same'],correct:0,
      hints:[null,'Watch the orange layer as Pr grows.','Slide to each end and compare the orange layer.'],
      explain:'δt/δ = Pr^(−1/3)/1.026: oil ≈ 0.12, air ≈ 1.1. In oil heat spreads far slower than momentum, so the hot layer stays thin.',
      onDone(S){ complete(`Same cubic, same recipe, now for temperature:<div class="m">${fr('δₜ','δ')} = ${fr('1','1.026')} Pr<sup>−1/3</sup></div>`); } }),400); } },
  draw(S,t){ const Pr=10**S.lp, z=Math.pow(Pr,-1/3)/1.026, zc=Math.min(z,2), plateY=H*0.74, top=H*0.16, xl=W*0.08, dmax=(plateY-top)*0.55;
    const del=x=>x<=xl?0:dmax*Math.sqrt((x-xl)/(W-xl));
    const gr=ctx.createLinearGradient(0,plateY,0,plateY-Math.max(6,dmax*zc)); gr.addColorStop(0,rgba(C.heat,0.75)); gr.addColorStop(1,rgba(C.heat,0.05));
    ctx.fillStyle=gr; ctx.beginPath(); ctx.moveTo(xl,plateY); for(let i=0;i<=80;i++){ const x=xl+(W-xl)*i/80; ctx.lineTo(x,plateY-zc*del(x)); } ctx.lineTo(W,plateY); ctx.fill();
    const ed=[]; for(let i=0;i<=80;i++){ const x=xl+(W-xl)*i/80; ed.push([x,plateY-del(x)]); } stroke(ed,C.flow,2,[6,5]); text('δ',W-10,plateY-del(W)-12,{align:'right',fam:MATH,italic:1,c:C.flow,size:FS+2});
    plate(xl,W,plateY,C.heat); text('hot plate',xl+4,plateY+22,{c:C.heat,size:FS-1});
    const T=this.track(), kx=T.x0+(T.x1-T.x0)*(S.lp+2)/5; line(T.x0,T.y,T.x1,T.y,C.edge,8); line(T.x0,T.y,kx,T.y,C.heat,8);
    [['mercury',0.025],['air',0.7],['water',7],['oil',500]].forEach(([n,v])=>{ const x=T.x0+(T.x1-T.x0)*(Math.log10(v)+2)/5; line(x,T.y-10,x,T.y+10,C.dim,1.5); text(n,x,T.y-20,{align:'center',size:FS-2,c:C.dim}); });
    circle(kx,T.y,14,C.gold); text('Pr',kx,T.y,{align:'center',size:FS-3,weight:700,c:C.night}); if(!S.touched) hint(kx,T.y,t);
    text('Pr = '+(Pr<1?Pr.toPrecision(2):Pr<10?Pr.toFixed(1):Math.round(Pr)),14,22,{weight:700,c:C.heat,size:FS+4}); text('δₜ/δ = '+z.toFixed(2),14,46,{c:C.dim}); },
  live(S){ return `orange = hot fluid &nbsp;·&nbsp; dashed = edge of the velocity layer`; } }
];
function parcel(x,y,u,motion){ if(motion==='up') arrow(x,y+22,x,y-22,rgba(C.ink,0.35),2,6); circle(x,y,13,C.flow); arrow(x-2,y,x+20+u*16,y,C.ink,2.5,7); text('u',x+24+u*16,y-10,{fam:MATH,italic:1,size:FS-1}); }

/* ---------- engine ---------- */
let cur=0, S=null, best=0, auto=null;
const t0=()=>performance.now();
try{ const s=JSON.parse(localStorage.getItem('bll-save')||'null'); if(s){ best=s.best||0; cur=Math.min(s.cur||0,SCENES.length-1); } }catch(e){}
function save(){ try{ localStorage.setItem('bll-save',JSON.stringify({best,cur})); }catch(e){} }
function SC(){ return SCENES[cur]; }
function go(i){ clearInterval(auto); auto=null; cur=clamp(i,0,SCENES.length-1); S={t0:t0(),done:false}; SC().init&&SC().init(S); best=Math.max(best,cur); save(); $('#toast').className='toast'; render(); window.scrollTo({top:0,behavior:RM?'auto':'smooth'}); }
function complete(html){ if(S.done) return; S.done=true; S.aha=html; sfx('win'); render(); }
function ask(Sx,q){ Sx.q=Object.assign({tries:3,picked:[],state:'open'},q); render(); }
const CH=['See it','Build it','Solve it'];
function render(){
  const sc=SC();
  $('#rail').innerHTML=SCENES.map((s,i)=>`<button type="button" class="seg ${i<cur||(i===cur&&S.done)?'done':''} ${i===cur?'cur':''}" data-i="${i}" ${i>best?'disabled':''} aria-label="Scene ${i+1}: ${s.name}"></button>`).join('');
  $('#rail').querySelectorAll('.seg').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.i)));
  $('#chap').innerHTML=`<span><b>${CH[sc.chap]}</b> · ${sc.name}</span><span>${cur+1} / ${SCENES.length}</span>`;
  $('#instr').innerHTML=(sc.check?'<small>Checkpoint</small>':'')+(typeof sc.instr==='function'?sc.instr(S):sc.instr);
  $('#aha').innerHTML=S.done?`<div class="aha"><p>${S.aha}</p></div>`:'';
  const q=S.q; let qh='';
  if(q){ qh=`<div class="quiz"><div class="qh"><span>Checkpoint question</span><div class="chances">${[0,1,2].map(i=>`<i class="${i<q.tries?'':'used'}"></i>`).join('')}</div></div><p class="q">${q.q}</p><div class="opts">${q.opts.map((o,i)=>`<button type="button" class="opt ${q.picked.includes(i)?'no':''} ${q.state!=='open'&&i===q.correct?'ok':''}" data-o="${i}">${o}</button>`).join('')}</div>`;
    if(q.fb) qh+=`<div class="qfb">${q.fb}</div>`; if(q.state==='revealed') qh+=`<div class="count" id="count"></div>`; qh+='</div>'; }
  $('#quiz').innerHTML=qh;
  $('#quiz').querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.o,b)));
  const ctrl=$('#ctrl'); ctrl.innerHTML='';
  (sc.extra?sc.extra(S):[]).forEach(([l,fn])=>{ const b=document.createElement('button'); b.type='button'; b.className='btn'; b.textContent=l; b.addEventListener('click',fn); ctrl.appendChild(b); });
  if(S.done){ const b=document.createElement('button'); b.type='button'; b.className='btn go pulse'; b.textContent=cur===SCENES.length-1?'Finish':'Continue →'; b.addEventListener('click',next); ctrl.appendChild(b); }
  liveCache=null;
}
function answer(i,btn){ const q=S.q; if(!q||q.state!=='open'||q.picked.includes(i)) return;
  if(i===q.correct){ q.state='right'; q.fb=`<b>Right.</b> ${q.explain}`; sfx('good'); render(); q.onDone&&q.onDone(S); }
  else { q.tries--; q.picked.push(i); sfx('bad'); btn.classList.add('shake');
    if(q.tries>0){ q.fb=q.hints&&q.hints[i]?q.hints[i]:'Not quite. Try again.'; render(); }
    else { q.state='revealed'; q.fb=`<b>The answer:</b> ${q.explain}`; render(); q.onDone&&q.onDone(S); let n=6; const tick=()=>{ const c=$('#count'); if(c) c.textContent=`Moving on in ${n}…`; if(n--<=0){ clearInterval(auto); next(); } }; tick(); auto=setInterval(tick,1000); } } }
function next(){ if(cur>=SCENES.length-1){ finish(); return; } go(cur+1); }
function finish(){ clearInterval(auto); best=SCENES.length-1; save();
  $('#sheet').innerHTML=`<h2>Lab complete!</h2>
   <div class="fcard"><div class="k">Continuity</div><div class="f">${D('u','x')} + ${D('v','y')} = 0</div></div>
   <div class="fcard"><div class="k">Boundary-layer momentum</div><div class="f">u${D('u','x')} + v${D('u','y')} = ν${D2('u','y')}</div></div>
   <div class="fcard"><div class="k">Cubic profile</div><div class="f">${fr('u','u∞')} = ${fr('3','2')}${fr('y','δ')} − ${fr('1','2')}(${fr('y','δ')})³</div></div>
   <div class="fcard"><div class="k">Thickness</div><div class="f">${fr('δ','x')} = ${fr('4.64','√Reₓ')} &nbsp; (exact 5.0)</div></div>
   <div class="fcard"><div class="k">Thermal layer</div><div class="f">${fr('δₜ','δ')} = ${fr('1','1.026')} Pr<sup>−1/3</sup></div></div>
   <div class="ctrl"><button class="btn" type="button" id="again">Start over</button><a class="btn go" id="toSand" href="sandbox/" target="_top">Try the real flow →</a></div>`;
  if(!(location.protocol==='file:'||/github\.io$/.test(location.hostname))){ const a=$('#toSand'); a.href=SANDBOX_URL; a.target='_blank'; a.rel='noopener'; }
  $('#modal').hidden=false; sfx('win');
  $('#again').addEventListener('click',()=>{ $('#modal').hidden=true; go(0); }); }
$('#backBtn').addEventListener('click',()=>{ if(cur>0) go(cur-1); });
$('#muteBtn').addEventListener('click',()=>{ muted=!muted; $('#muteBtn').textContent=muted?'MUTED':'SOUND'; });
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') $('#modal').hidden=true; });

let drag=false;
const pos=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; };
cv.addEventListener('pointerdown',e=>{ if(S.q&&S.q.state==='open'&&!SC().move) return; drag=true; cv.setPointerCapture(e.pointerId); const [x,y]=pos(e); SC().down&&SC().down(S,x,y); });
cv.addEventListener('pointermove',e=>{ const [x,y]=pos(e); SC().move&&SC().move(S,x,y,drag); });
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,e=>{ if(!drag) return; drag=false; const [x,y]=pos(e); SC().up&&SC().up(S,x,y); }));

let last=t0(), liveCache='', liveT=0;
function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(W>0){ ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H); ctx.fillStyle=C.panel; ctx.fillRect(0,0,W,H); FS=Math.max(12,Math.min(15,W/46));
    SC().draw(S,RM?2:(now-S.t0)/1000,RM?0:dt); }
  if(now-liveT>120){ liveT=now; const l=SC().live?SC().live(S):''; if(l!==liveCache){ $('#live').innerHTML=l; liveCache=l; } }
  requestAnimationFrame(loop); }

go(cur); requestAnimationFrame(loop);
document.fonts&&document.fonts.ready.then(()=>render());
})();
</script>
</body>
</html>
