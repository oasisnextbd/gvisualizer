<text x="68.3" y="151.9" font-size="11.5" fill="#0B7C8C" text-anchor="middle" >C′</text>
<text x="58.3" y="164.9" font-size="11" fill="#0B7C8C" text-anchor="end" >v = 1/√2</text>
<circle cx="278.9" cy="215.9" r="3.5" fill="#D2552B"/>
<text x="282.9" y="207.9" font-size="11.5" fill="#D2552B" text-anchor="start" >B″ (2)</text>
