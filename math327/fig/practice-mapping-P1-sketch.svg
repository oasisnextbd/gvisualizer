<path d="M68.3,160.9 L123.3,215.9" fill="none" stroke="#0B7C8C" stroke-width="2.2" stroke-linejoin="round" />
<line x1="30.0" y1="215.9" x2="320.0" y2="215.9" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="318.0" y="231.9" font-size="12" fill="#1E2B3A" text-anchor="end" >Re w</text>
