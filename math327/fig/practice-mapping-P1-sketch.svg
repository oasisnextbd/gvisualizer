<text x="306.2" y="224.9" font-size="12" fill="#1E2B3A" text-anchor="end" >Re z</text>
<line x1="93.7" y1="260.0" x2="93.7" y2="20.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="99.7" y="28.0" font-size="12" fill="#1E2B3A" text-anchor="start" >Im z</text>
<circle cx="93.7" cy="208.9" r="3.5" fill="#1E2B3A"/>
<text x="87.7" y="222.9" font-size="11.5" fill="#1E2B3A" text-anchor="end" >A (0)</text>
<circle cx="221.5" cy="208.9" r="3.5" fill="#1E2B3A"/>
<text x="225.5" y="224.9" font-size="11.5" fill="#1E2B3A" text-anchor="start" >B (1)</text>
<circle cx="93.7" cy="81.1" r="3.5" fill="#1E2B3A"/>
<text x="101.7" y="79.1" font-size="11.5" fill="#1E2B3A" text-anchor="start" >C (i)</text>
<text x="165.6" y="139.0" font-size="11.5" fill="#0B7C8C" text-anchor="start" >x + y = 1</text>
<text x="164.0" y="280.0" font-size="11.5" fill="#55667D" text-anchor="middle" >triangle x = 0, y = 0, x + y = 1</text>
</g>
<g transform="translate(0.0,296)">
<polygon points="123.3,215.9 178.3,160.9 68.3,160.9" fill="#E6F3F5" stroke="none"/>
<polygon points="123.3,215.9 278.9,215.9 123.3,60.3" fill="#FBEAE3" stroke="none"/>
