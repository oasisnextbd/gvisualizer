<text x="131.3" y="58.3" font-size="11.5" fill="#D2552B" text-anchor="start" >C″ (2i)</text>
<text x="207.1" y="134.1" font-size="11.5" fill="#D2552B" text-anchor="start" >u + v = 2</text>
<text x="170.0" y="267.0" font-size="11.5" fill="#55667D" text-anchor="middle" >teal: w = e<tspan baseline-shift="super" font-size="72%">iπ/4</tspan>z (rotation); orange: w = 2z</text>
