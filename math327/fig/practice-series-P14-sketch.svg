<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 305" width="380" height="305" font-family="Helvetica, Arial, sans-serif">
<title>sin z/(z − π)²: simple pole at π, residue −1; series valid for 0 &lt; |z − π| &lt; ∞</title>
<rect width="380" height="305" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs>
<polygon points="40.0,265.0 340.0,265.0 340.0,40.0 40.0,40.0" fill="#E6F3F5" stroke="none"/>
<line x1="40.0" y1="152.5" x2="350.0" y2="152.5" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="348.0" y="168.5" font-size="12" fill="#1E2B3A" text-anchor="end" >Re z</text>
<line x1="77.5" y1="265.0" x2="77.5" y2="30.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="83.5" y="38.0" font-size="12" fill="#1E2B3A" text-anchor="start" >Im z</text>
<text x="72.5" y="166.5" font-size="11" fill="#55667D" text-anchor="end" >O</text>
<circle cx="224.8" cy="152.5" r="5" fill="#D2552B" stroke="#D2552B" stroke-width="2"/>
<text x="224.8" y="140.5" font-size="11.5" fill="#D2552B" text-anchor="middle" >z = π, Res = −1</text>
<text x="224.8" y="222.8" font-size="12" fill="#0B7C8C" text-anchor="middle" >0 &lt; |z − π| &lt; ∞</text>
<text x="190.0" y="295.0" font-size="11.5" fill="#55667D" text-anchor="middle" >only singularity: z = π</text>
</svg>