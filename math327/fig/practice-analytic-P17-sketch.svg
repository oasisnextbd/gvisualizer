<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 345 520" width="345" height="520" font-family="Helvetica, Arial, sans-serif">
<title>Solutions of e^{z} = −1: z = (2n + 1)πi</title>
<rect width="345" height="520" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs>
<line x1="46.0" y1="266.1" x2="309.0" y2="266.1" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="307.0" y="282.1" font-size="12" fill="#1E2B3A" text-anchor="end" >Re z</text>
<line x1="172.5" y1="474.0" x2="172.5" y2="36.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="178.5" y="44.0" font-size="12" fill="#1E2B3A" text-anchor="start" >Im z</text>
<text x="167.5" y="280.1" font-size="11" fill="#55667D" text-anchor="end" >O</text>
<circle cx="172.5" cy="449.5" r="5" fill="#D2552B" stroke="#D2552B" stroke-width="2"/>
<text x="182.5" y="453.5" font-size="12" fill="#D2552B" text-anchor="start" >−3πi</text>
<circle cx="172.5" cy="327.3" r="5" fill="#D2552B" stroke="#D2552B" stroke-width="2"/>
<text x="182.5" y="331.3" font-size="12" fill="#D2552B" text-anchor="start" >−πi</text>
<circle cx="172.5" cy="205.0" r="5" fill="#D2552B" stroke="#D2552B" stroke-width="2"/>
<text x="182.5" y="209.0" font-size="12" fill="#D2552B" text-anchor="start" >πi</text>
<circle cx="172.5" cy="82.7" r="5" fill="#D2552B" stroke="#D2552B" stroke-width="2"/>
<text x="182.5" y="86.7" font-size="12" fill="#D2552B" text-anchor="start" >3πi</text>
<text x="172.5" y="494.0" font-size="11.5" fill="#55667D" text-anchor="middle" >|e<tspan baseline-shift="super" font-size="72%">z</tspan>| = e<tspan baseline-shift="super" font-size="72%">x</tspan> = 1 forces x = 0; arg e<tspan baseline-shift="super" font-size="72%">z</tspan> = y = π + 2nπ</text>
<text x="172.5" y="511.0" font-size="11.5" fill="#55667D" text-anchor="middle" >one root in each horizontal strip of height 2π</text>
</svg>