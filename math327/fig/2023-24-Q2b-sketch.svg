<text x="227.0" y="32.0" font-size="12.5" fill="#1E2B3A" text-anchor="start">Im z</text>
<text x="40.0" y="214.0" font-size="10.5" fill="#55667D" text-anchor="middle">−2</text>
<text x="130.0" y="214.0" font-size="10.5" fill="#55667D" text-anchor="middle">−1</text>
<text x="310.0" y="214.0" font-size="10.5" fill="#55667D" text-anchor="middle">1</text>
<text x="215.0" y="384.0" font-size="10.5" fill="#55667D" text-anchor="end">−2</text>
<text x="215.0" y="294.0" font-size="10.5" fill="#55667D" text-anchor="end">−1</text>
<text x="215.0" y="114.0" font-size="10.5" fill="#55667D" text-anchor="end">1</text>
