<text x="150.4" y="106.7" font-size="12" fill="#1E2B3A" text-anchor="end">z = re<tspan baseline-shift="super" font-size="70%">iθ</tspan></text>
<path d="M400.0,20.0 L40.0,20.0 L40.0,380.0 L400.0,380.0 Z " fill="#0B7C8C" fill-opacity="0.06" fill-rule="evenodd" stroke="none"/>
<text x="220.0" y="402.0" font-size="11.5" fill="#55667D" text-anchor="middle">Draw the domain: all points with r &gt; 0 and 0 &lt; θ &lt; 2π; the C–R</text>
<text x="220.0" y="417.0" font-size="11.5" fill="#55667D" text-anchor="middle">equations hold and the partials are continuous everywhere in it, so f</text>
<text x="220.0" y="432.0" font-size="11.5" fill="#55667D" text-anchor="middle">= z⁻⁴ is analytic there.</text>
</svg>