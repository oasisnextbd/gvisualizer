<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Helvetica, Arial, sans-serif">
<title>Bilinear map w = (iz+2)/(4z+i): the real axis of the z-plane goes to the circle |w + 7i/8| = 9/8</title>
<rect width="640" height="330" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs>
<line x1="20.0" y1="165.0" x2="300.0" y2="165.0" stroke="#1E2B3A" stroke-width="1.3" marker-end="url(#ar)"/>
<line x1="160.0" y1="305.0" x2="160.0" y2="25.0" stroke="#1E2B3A" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="296.0" y="181.0" font-size="12" fill="#1E2B3A" text-anchor="end" >x</text>
<text x="166.0" y="35.0" font-size="12" fill="#1E2B3A" text-anchor="start" >y</text>
<text x="24.0" y="37.0" font-size="13" fill="#1E2B3A" text-anchor="start" >z-plane</text>
<line x1="22.0" y1="165.0" x2="298.0" y2="165.0" stroke="#D2552B" stroke-width="3" />
<text x="40.0" y="152.0" font-size="12" fill="#D2552B" text-anchor="start" >real axis (y = 0)</text>
<circle cx="160" cy="187.5" r="4" fill="#6A4FC9"/>
<text x="168.0" y="191.5" font-size="11.5" fill="#6A4FC9" text-anchor="start" >pole z = −i/4</text>
<line x1="330.0" y1="135.0" x2="610.0" y2="135.0" stroke="#1E2B3A" stroke-width="1.3" marker-end="url(#ar)"/>
<line x1="470.0" y1="255.0" x2="470.0" y2="15.0" stroke="#1E2B3A" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="606.0" y="151.0" font-size="12" fill="#1E2B3A" text-anchor="end" >u</text>
<text x="476.0" y="25.0" font-size="12" fill="#1E2B3A" text-anchor="start" >v</text>
<text x="334.0" y="27.0" font-size="13" fill="#1E2B3A" text-anchor="start" >w-plane</text>
<circle cx="470" cy="198.0" r="81.0" fill="none" stroke="#D2552B" stroke-width="3"/>
<circle cx="470" cy="198.0" r="3.5" fill="#1E2B3A"/>
<text x="478.0" y="202.0" font-size="11.5" fill="#1E2B3A" text-anchor="start" >centre −7i/8</text>
<circle cx="470.0" cy="279.0" r="3.5" fill="#0B7C8C"/>
<text x="477.0" y="273.0" font-size="11.5" fill="#0B7C8C" text-anchor="start" >w(0) = −2i</text>
<circle cx="470.0" cy="117.0" r="3.5" fill="#0B7C8C"/>
<text x="477.0" y="111.0" font-size="11.5" fill="#0B7C8C" text-anchor="start" >w(∞) = i/4</text>
<circle cx="508.1" cy="126.5" r="3.5" fill="#0B7C8C"/>
<text x="515.1" y="120.5" font-size="11.5" fill="#0B7C8C" text-anchor="start" >w(1) = (9 + 2i)/17</text>
<text x="470.0" y="301.0" font-size="11.5" fill="#D2552B" text-anchor="middle" >radius 9/8</text>
<path d="M300.0,120.0 L340.0,120.0" fill="none" stroke="#1E2B3A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="320.0" y="110.0" font-size="11.5" fill="#1E2B3A" text-anchor="middle" >w = (iz+2)/(4z+i)</text>
</svg>