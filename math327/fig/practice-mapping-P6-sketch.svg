<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" font-family="Helvetica, Arial, sans-serif">
<title>Bilinear map as a chain of elementary maps</title>
<rect width="360" height="470" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs>
<rect x="70" y="20" width="220" height="50" rx="6" fill="#F4F7FA" stroke="#1E2B3A" stroke-width="1.5"/>
<text x="180.0" y="49.9" font-size="14" fill="#1E2B3A" text-anchor="middle" >z</text>
<line x1="180.0" y1="70.0" x2="180.0" y2="106.0" stroke="#1E2B3A" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="70" y="110" width="220" height="50" rx="6" fill="#F4F7FA" stroke="#0B7C8C" stroke-width="1.5"/>
<text x="180.0" y="139.9" font-size="14" fill="#1E2B3A" text-anchor="middle" >t = z + d/c</text>
<line x1="180.0" y1="160.0" x2="180.0" y2="196.0" stroke="#1E2B3A" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="190.0" y="96.0" font-size="11.5" fill="#D2552B" text-anchor="start" >translation</text>
<rect x="70" y="200" width="220" height="50" rx="6" fill="#F4F7FA" stroke="#0B7C8C" stroke-width="1.5"/>
<text x="180.0" y="229.9" font-size="14" fill="#1E2B3A" text-anchor="middle" >s = 1/t</text>
<line x1="180.0" y1="250.0" x2="180.0" y2="286.0" stroke="#1E2B3A" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="190.0" y="186.0" font-size="11.5" fill="#D2552B" text-anchor="start" >inversion + reflection</text>
<rect x="70" y="290" width="220" height="50" rx="6" fill="#F4F7FA" stroke="#0B7C8C" stroke-width="1.5"/>
<text x="180.0" y="319.9" font-size="14" fill="#1E2B3A" text-anchor="middle" >r = ((bc − ad)/c²) s</text>
<line x1="180.0" y1="340.0" x2="180.0" y2="376.0" stroke="#1E2B3A" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="190.0" y="276.0" font-size="11.5" fill="#D2552B" text-anchor="start" >rotation + magnification</text>
<rect x="70" y="380" width="220" height="50" rx="6" fill="#F4F7FA" stroke="#0B7C8C" stroke-width="1.5"/>
<text x="180.0" y="409.9" font-size="14" fill="#1E2B3A" text-anchor="middle" >w = r + a/c</text>
<text x="190.0" y="366.0" font-size="11.5" fill="#D2552B" text-anchor="start" >translation</text>
<text x="180.0" y="462.0" font-size="11.5" fill="#55667D" text-anchor="middle" >(c ≠ 0); for c = 0: w = (a/d)z + b/d only</text>
</svg>