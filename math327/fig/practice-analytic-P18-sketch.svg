<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 420" width="324" height="420" font-family="Helvetica, Arial, sans-serif">
<title>exp(z̄): cos y = 0 (orange) and sin y = 0 (teal) are disjoint sets of lines</title>
<rect width="324" height="420" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs>
<line x1="45.5" y1="222.6" x2="288.5" y2="222.6" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="286.5" y="238.6" font-size="12" fill="#1E2B3A" text-anchor="end" >Re z</text>
<line x1="145.9" y1="374.0" x2="145.9" y2="36.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="151.9" y="44.0" font-size="12" fill="#1E2B3A" text-anchor="start" >Im z</text>
<text x="140.9" y="236.6" font-size="11" fill="#55667D" text-anchor="end" >O</text>
<path d="M45.5,348.8 L246.3,348.8" fill="none" stroke="#0B7C8C" stroke-width="2.2" stroke-linejoin="round" />
<path d="M45.5,222.6 L246.3,222.6" fill="none" stroke="#0B7C8C" stroke-width="2.2" stroke-linejoin="round" />
<path d="M45.5,96.5 L246.3,96.5" fill="none" stroke="#0B7C8C" stroke-width="2.2" stroke-linejoin="round" />
<path d="M45.5,285.7 L246.3,285.7" fill="none" stroke="#D2552B" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 4"/>
<path d="M45.5,159.5 L246.3,159.5" fill="none" stroke="#D2552B" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 4"/>
<text x="250.3" y="163.5" font-size="11.5" fill="#D2552B" text-anchor="start" >y = π/2</text>
<text x="250.3" y="289.7" font-size="11.5" fill="#D2552B" text-anchor="start" >y = −π/2</text>
<text x="250.3" y="100.5" font-size="11.5" fill="#0B7C8C" text-anchor="start" >y = π</text>
<text x="250.3" y="352.8" font-size="11.5" fill="#0B7C8C" text-anchor="start" >y = −π</text>
<text x="162.0" y="394.0" font-size="11.5" fill="#55667D" text-anchor="middle" >u<tspan baseline-shift="sub" font-size="72%">x</tspan> = v<tspan baseline-shift="sub" font-size="72%">y</tspan> needs cos y = 0; u<tspan baseline-shift="sub" font-size="72%">y</tspan> = −v<tspan baseline-shift="sub" font-size="72%">x</tspan> needs sin y = 0</text>
<text x="162.0" y="411.0" font-size="11.5" fill="#55667D" text-anchor="middle" >no point lies on both kinds of line</text>
</svg>