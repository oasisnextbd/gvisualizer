<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Helvetica, Arial, sans-serif">
<title>The four fourth roots of −8 − 8√3 i on the circle |z| = 2</title>
<rect width="640" height="400" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs>
<line x1="120.0" y1="200.0" x2="520.0" y2="200.0" stroke="#1E2B3A" stroke-width="1.3" marker-end="url(#ar)"/>
<line x1="320.0" y1="380.0" x2="320.0" y2="20.0" stroke="#1E2B3A" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="516.0" y="216.0" font-size="12" fill="#1E2B3A" text-anchor="end" >x</text>
<text x="326.0" y="30.0" font-size="12" fill="#1E2B3A" text-anchor="start" >y</text>
<text x="124.0" y="32.0" font-size="13" fill="#1E2B3A" text-anchor="start" >z-plane</text>
<circle cx="320" cy="200" r="150" fill="none" stroke="#55667D" stroke-width="1.2" stroke-dasharray="5 4"/>
<path d="M449.9,275.0 L395.0,70.1 L190.1,125.0 L245.0,329.9 Z" fill="none" stroke="#0B7C8C" stroke-width="1.8" stroke-linejoin="round" />
<line x1="320.0" y1="200.0" x2="449.9" y2="275.0" stroke="#55667D" stroke-width="1" />
<circle cx="449.9" cy="275.0" r="5" fill="#D2552B"/>
<text x="459.9" y="293.0" font-size="12" fill="#D2552B" text-anchor="start" >√3 − i (principal)</text>
<line x1="320.0" y1="200.0" x2="395.0" y2="70.1" stroke="#55667D" stroke-width="1" />
<circle cx="395.0" cy="70.1" r="5" fill="#D2552B"/>
<text x="405.0" y="62.1" font-size="12" fill="#D2552B" text-anchor="start" >1 + √3 i</text>
<line x1="320.0" y1="200.0" x2="190.1" y2="125.0" stroke="#55667D" stroke-width="1" />
<circle cx="190.1" cy="125.0" r="5" fill="#D2552B"/>
<text x="180.1" y="117.0" font-size="12" fill="#D2552B" text-anchor="end" >−√3 + i</text>
<line x1="320.0" y1="200.0" x2="245.0" y2="329.9" stroke="#55667D" stroke-width="1" />
<circle cx="245.0" cy="329.9" r="5" fill="#D2552B"/>
<text x="235.0" y="347.9" font-size="12" fill="#D2552B" text-anchor="end" >−1 − √3 i</text>
<text x="428.0" y="84.0" font-size="12" fill="#55667D" text-anchor="start" >|z| = 2</text>
<text x="320.0" y="380.0" font-size="11.5" fill="#55667D" text-anchor="middle" >roots 90° apart, starting at arg = −π/6</text>
</svg>