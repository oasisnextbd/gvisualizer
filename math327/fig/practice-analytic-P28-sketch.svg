<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 439 520" width="439" height="520" font-family="Helvetica, Arial, sans-serif">
<title>sinh z = i (orange) and cosh z = ½ (teal): all roots on the imaginary axis</title>
<rect width="439" height="520" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs>
<line x1="45.9" y1="289.4" x2="403.1" y2="289.4" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="401.1" y="305.4" font-size="12" fill="#1E2B3A" text-anchor="end" >Re z</text>
<line x1="219.5" y1="474.0" x2="219.5" y2="36.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="225.5" y="44.0" font-size="12" fill="#1E2B3A" text-anchor="start" >Im z</text>
<text x="214.5" y="303.4" font-size="11" fill="#55667D" text-anchor="end" >O</text>
<circle cx="219.5" cy="415.3" r="5" fill="#D2552B" stroke="#D2552B" stroke-width="2"/>
<text x="209.5" y="419.3" font-size="11.5" fill="#D2552B" text-anchor="end" >−3πi/2</text>
<circle cx="219.5" cy="247.4" r="5" fill="#D2552B" stroke="#D2552B" stroke-width="2"/>
<text x="209.5" y="251.4" font-size="11.5" fill="#D2552B" text-anchor="end" >πi/2</text>
<circle cx="219.5" cy="79.6" r="5" fill="#D2552B" stroke="#D2552B" stroke-width="2"/>
<text x="209.5" y="83.6" font-size="11.5" fill="#D2552B" text-anchor="end" >5πi/2</text>
<circle cx="219.5" cy="261.4" r="5" fill="#0B7C8C" stroke="#0B7C8C" stroke-width="2"/>
<text x="229.5" y="265.4" font-size="11.5" fill="#0B7C8C" text-anchor="start" >πi/3</text>
<circle cx="219.5" cy="317.3" r="5" fill="#0B7C8C" stroke="#0B7C8C" stroke-width="2"/>
<text x="229.5" y="321.3" font-size="11.5" fill="#0B7C8C" text-anchor="start" >−πi/3</text>
<circle cx="219.5" cy="149.5" r="5" fill="#0B7C8C" stroke="#0B7C8C" stroke-width="2"/>
<text x="229.5" y="153.5" font-size="11.5" fill="#0B7C8C" text-anchor="start" >5πi/3</text>
<circle cx="219.5" cy="93.6" r="5" fill="#0B7C8C" stroke="#0B7C8C" stroke-width="2"/>
<text x="229.5" y="97.6" font-size="11.5" fill="#0B7C8C" text-anchor="start" >7πi/3</text>
<circle cx="219.5" cy="429.2" r="5" fill="#0B7C8C" stroke="#0B7C8C" stroke-width="2"/>
<text x="229.5" y="433.2" font-size="11.5" fill="#0B7C8C" text-anchor="start" >−5πi/3</text>
<text x="219.5" y="494.0" font-size="11.5" fill="#55667D" text-anchor="middle" >sinh z = i: z = (2n + ½)πi; cosh z = ½: z = (2n ± ⅓)πi</text>
<text x="219.5" y="511.0" font-size="11.5" fill="#55667D" text-anchor="middle" >(both reduce to x = 0 because cosh x ≥ 1)</text>
</svg>