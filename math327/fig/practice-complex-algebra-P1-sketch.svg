<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420" font-family="Helvetica, Arial, sans-serif">
<title>Seven numbers on the Argand diagram with |z| and principal Arg z</title>
<rect width="300" height="420" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs>
<line x1="46.4" y1="178.4" x2="263.6" y2="178.4" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="261.6" y="194.4" font-size="12" fill="#1E2B3A" text-anchor="end" >Re z</text>
<line x1="150.0" y1="374.0" x2="150.0" y2="36.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="156.0" y="44.0" font-size="12" fill="#1E2B3A" text-anchor="start" >Im z</text>
<text x="145.0" y="192.4" font-size="11" fill="#55667D" text-anchor="end" >O</text>
<path d="M150.0,178.4 L92.5,235.9" fill="none" stroke="#55667D" stroke-width="1" stroke-linejoin="round" />
<circle cx="92.5" cy="235.9" r="3.5" fill="#D2552B"/>
<text x="84.5" y="249.9" font-size="11.5" fill="#D2552B" text-anchor="end" >−1 − i: √2, −3π/4</text>
<path d="M150.0,178.4 L92.5,178.4" fill="none" stroke="#55667D" stroke-width="1" stroke-linejoin="round" />
<circle cx="92.5" cy="178.4" r="3.5" fill="#D2552B"/>
<text x="84.5" y="170.4" font-size="11.5" fill="#D2552B" text-anchor="end" >−1: 1, π</text>
<path d="M150.0,178.4 L207.5,78.7" fill="none" stroke="#55667D" stroke-width="1" stroke-linejoin="round" />
<circle cx="207.5" cy="78.7" r="3.5" fill="#D2552B"/>
<text x="215.5" y="74.7" font-size="11.5" fill="#D2552B" text-anchor="start" >1 + i√3: 2, π/3</text>
<path d="M150.0,178.4 L150.0,235.9" fill="none" stroke="#55667D" stroke-width="1" stroke-linejoin="round" />
<circle cx="150.0" cy="235.9" r="3.5" fill="#D2552B"/>
<text x="158.0" y="239.9" font-size="11.5" fill="#D2552B" text-anchor="start" >(1−i)/(1+i) = −i: 1, −π/2</text>
<path d="M150.0,178.4 L150.0,149.6" fill="none" stroke="#55667D" stroke-width="1" stroke-linejoin="round" />
<circle cx="150.0" cy="149.6" r="3.5" fill="#D2552B"/>
<text x="158.0" y="145.6" font-size="11.5" fill="#D2552B" text-anchor="start" >((2+i)/(3−i))² = i/2: ½, π/2</text>
<path d="M150.0,178.4 L150.0,351.0" fill="none" stroke="#55667D" stroke-width="1" stroke-linejoin="round" />
<circle cx="150.0" cy="351.0" r="3.5" fill="#D2552B"/>
<text x="158.0" y="355.0" font-size="11.5" fill="#D2552B" text-anchor="start" >−3i: 3, −π/2</text>
<path d="M150.0,178.4 L92.5,120.8" fill="none" stroke="#55667D" stroke-width="1" stroke-linejoin="round" />
<circle cx="92.5" cy="120.8" r="3.5" fill="#D2552B"/>
<text x="84.5" y="114.8" font-size="11.5" fill="#D2552B" text-anchor="end" >−1 + i: √2, 3π/4</text>
</svg>