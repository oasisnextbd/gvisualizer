<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" width="380" height="320" font-family="Helvetica, Arial, sans-serif">
<title>Punctured plane 0 &lt; |z| &lt; ∞ for z² sin(1/z²); essential singularity at 0</title>
<rect width="380" height="320" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs>
<polygon points="40.0,280.0 340.0,280.0 340.0,40.0 40.0,40.0" fill="#E6F3F5" stroke="none"/>
<line x1="40.0" y1="160.0" x2="350.0" y2="160.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="348.0" y="176.0" font-size="12" fill="#1E2B3A" text-anchor="end" >Re z</text>
<line x1="190.0" y1="280.0" x2="190.0" y2="30.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="196.0" y="38.0" font-size="12" fill="#1E2B3A" text-anchor="start" >Im z</text>
<text x="185.0" y="174.0" font-size="11" fill="#55667D" text-anchor="end" >O</text>
<circle cx="190.0" cy="160.0" r="5" fill="#fff" stroke="#55667D" stroke-width="2"/>
<text x="198.0" y="150.0" font-size="11.5" fill="#D2552B" text-anchor="start" >z = 0: essential</text>
<text x="265.0" y="81.2" font-size="12" fill="#0B7C8C" text-anchor="middle" >0 &lt; |z| &lt; ∞</text>
<text x="190.0" y="310.0" font-size="11.5" fill="#55667D" text-anchor="middle" >infinitely many negative powers z<tspan baseline-shift="super" font-size="72%">−4n</tspan></text>
</svg>