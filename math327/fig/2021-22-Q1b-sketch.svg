<line x1="520.0" y1="300.0" x2="520.0" y2="20.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="527.0" y="32.0" font-size="12.5" fill="#1E2B3A" text-anchor="start">Im z</text>
<text x="380.0" y="174.0" font-size="10.5" fill="#55667D" text-anchor="middle">−2</text>
<text x="450.0" y="174.0" font-size="10.5" fill="#55667D" text-anchor="middle">−1</text>
<text x="590.0" y="174.0" font-size="10.5" fill="#55667D" text-anchor="middle">1</text>
<text x="515.0" y="304.0" font-size="10.5" fill="#55667D" text-anchor="end">−2</text>
<text x="515.0" y="234.0" font-size="10.5" fill="#55667D" text-anchor="end">−1</text>
<text x="515.0" y="94.0" font-size="10.5" fill="#55667D" text-anchor="end">1</text>
<path d="M40.0,300.0 L320.0,300.0 L320.0,20.0 L40.0,20.0 Z " fill="#0B7C8C" fill-opacity="0.14" fill-rule="evenodd" stroke="none"/>
<text x="47.0" y="44.5" font-size="12.5" fill="#1E2B3A" text-anchor="start" font-weight="bold">(i) cosh 5z: entire</text>
<text x="110.0" y="268.5" font-size="12" fill="#0B7C8C" text-anchor="middle">analytic everywhere</text>
<path d="M380.0,300.0 L660.0,300.0 L660.0,20.0 L380.0,20.0 Z " fill="#0B7C8C" fill-opacity="0.14" fill-rule="evenodd" stroke="none"/>
<text x="387.0" y="44.5" font-size="12.5" fill="#1E2B3A" text-anchor="start" font-weight="bold">(ii) ln√z = ½ ln z</text>
<path d="M380.0,160.0 L520.0,160.0" fill="none" stroke="#D2552B" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 4"/>
<circle cx="520.0" cy="160.0" r="4.6" fill="#fff" stroke="#D2552B" stroke-width="1.8"/>
<line x1="450.0" y1="160.0" x2="450.0" y2="230.0" stroke="#D2552B" stroke-width="0.9"/>
<text x="450.0" y="244.0" font-size="11.5" fill="#D2552B" text-anchor="middle">branch cut θ = ±π</text>
<line x1="520.0" y1="160.0" x2="457.0" y2="97.0" stroke="#D2552B" stroke-width="0.9"/>
<text x="457.0" y="93.0" font-size="11.5" fill="#D2552B" text-anchor="middle">z = 0 (branch point)</text>
<text x="350.0" y="322.0" font-size="11.5" fill="#55667D" text-anchor="middle">Draw the region of analyticity: cosh 5z is analytic in the whole plane; ln√z (principal branch) is analytic</text>
<text x="350.0" y="337.0" font-size="11.5" fill="#55667D" text-anchor="middle">everywhere except z = 0 and the negative real axis.</text>
</svg>