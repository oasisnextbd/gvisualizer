<text x="175.0" y="234.0" font-size="10.5" fill="#55667D" text-anchor="end">−1</text>
<text x="175.0" y="94.0" font-size="10.5" fill="#55667D" text-anchor="end">1</text>
<line x1="380.0" y1="300.0" x2="380.0" y2="20.0" stroke="#D5DCE4" stroke-width="0.6"/>
<line x1="450.0" y1="300.0" x2="450.0" y2="20.0" stroke="#D5DCE4" stroke-width="0.6"/>
<line x1="520.0" y1="300.0" x2="520.0" y2="20.0" stroke="#D5DCE4" stroke-width="0.6"/>
<line x1="590.0" y1="300.0" x2="590.0" y2="20.0" stroke="#D5DCE4" stroke-width="0.6"/>
<line x1="660.0" y1="300.0" x2="660.0" y2="20.0" stroke="#D5DCE4" stroke-width="0.6"/>
<line x1="380.0" y1="300.0" x2="660.0" y2="300.0" stroke="#D5DCE4" stroke-width="0.6"/>
<line x1="380.0" y1="230.0" x2="660.0" y2="230.0" stroke="#D5DCE4" stroke-width="0.6"/>
<line x1="380.0" y1="160.0" x2="660.0" y2="160.0" stroke="#D5DCE4" stroke-width="0.6"/>
<line x1="380.0" y1="90.0" x2="660.0" y2="90.0" stroke="#D5DCE4" stroke-width="0.6"/>
