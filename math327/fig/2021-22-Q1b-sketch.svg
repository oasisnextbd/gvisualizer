<text x="318.0" y="153.0" font-size="12.5" fill="#1E2B3A" text-anchor="end">Re z</text>
<line x1="180.0" y1="300.0" x2="180.0" y2="20.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
