<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 321 580" width="321" height="580" font-family="Helvetica, Arial, sans-serif">
<title>log(i²) versus 2 log i on two branches</title>
<rect width="321" height="580" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs>
<g transform="translate(0.0,0)">
<line x1="45.6" y1="160.9" x2="285.4" y2="160.9" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="283.4" y="176.9" font-size="12" fill="#1E2B3A" text-anchor="end" >Re z</text>
<line x1="160.5" y1="234.0" x2="160.5" y2="36.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="166.5" y="44.0" font-size="12" fill="#1E2B3A" text-anchor="start" >Im z</text>
<text x="155.5" y="174.9" font-size="11" fill="#55667D" text-anchor="end" >O</text>
<path d="M160.5,160.9 L230.7,90.7" fill="none" stroke="#D2552B" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="6 4"/>
<text x="236.7" y="94.7" font-size="11.5" fill="#D2552B" text-anchor="start" >cut θ = π/4</text>
<circle cx="160.5" cy="108.7" r="3.5" fill="#0B7C8C"/>
<text x="168.5" y="104.7" font-size="11.5" fill="#0B7C8C" text-anchor="start" >i: θ = π/2</text>
<circle cx="108.3" cy="160.9" r="3.5" fill="#6A4FC9"/>
<text x="108.3" y="150.9" font-size="11.5" fill="#6A4FC9" text-anchor="middle" >−1 = i²: θ = π</text>
</g>
<g transform="translate(0.0,300)">
<line x1="45.6" y1="160.9" x2="285.4" y2="160.9" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="283.4" y="176.9" font-size="12" fill="#1E2B3A" text-anchor="end" >Re z</text>
<line x1="160.5" y1="234.0" x2="160.5" y2="36.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="166.5" y="44.0" font-size="12" fill="#1E2B3A" text-anchor="start" >Im z</text>
<text x="155.5" y="174.9" font-size="11" fill="#55667D" text-anchor="end" >O</text>
<path d="M160.5,160.9 L90.3,90.7" fill="none" stroke="#D2552B" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="6 4"/>
<text x="84.3" y="94.7" font-size="11.5" fill="#D2552B" text-anchor="end" >cut θ = 3π/4</text>
<circle cx="160.5" cy="108.7" r="3.5" fill="#0B7C8C"/>
<text x="168.5" y="104.7" font-size="11.5" fill="#0B7C8C" text-anchor="start" >i: θ = 5π/2</text>
<circle cx="108.3" cy="160.9" r="3.5" fill="#6A4FC9"/>
<text x="108.3" y="176.9" font-size="11.5" fill="#6A4FC9" text-anchor="middle" >−1: θ = π</text>
</g>
</svg>