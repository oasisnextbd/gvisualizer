<text x="387.0" y="152.0" font-size="11.5" fill="#0B7C8C" text-anchor="start">y = 0</text>
<text x="526.0" y="272.0" font-size="11.5" fill="#6A4FC9" text-anchor="start">x = 0</text>
<text x="350.0" y="322.0" font-size="11.5" fill="#55667D" text-anchor="middle">Draw the set where the C–R equations hold: a line (i) or a single point (ii). Neither contains an open disc, so</text>
<text x="350.0" y="337.0" font-size="11.5" fill="#55667D" text-anchor="middle">both functions are nowhere analytic.</text>
