<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 348 540" width="348" height="540" font-family="Helvetica, Arial, sans-serif">
<title>0 &lt; Re(iz) &lt; 1 (horizontal strip) and π/3 ≤ arg z ≤ π/2 (wedge, origin excluded)</title>
<rect width="348" height="540" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs>
<g transform="translate(0.0,0)">
<polygon points="46.0,88.7 302.0,88.7 302.0,131.3 46.0,131.3" fill="#E6F3F5" stroke="none"/>
<line x1="46.0" y1="88.7" x2="312.0" y2="88.7" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="310.0" y="104.7" font-size="12" fill="#1E2B3A" text-anchor="end" >Re z</text>
<line x1="174.0" y1="174.0" x2="174.0" y2="36.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="180.0" y="44.0" font-size="12" fill="#1E2B3A" text-anchor="start" >Im z</text>
<text x="169.0" y="102.7" font-size="11" fill="#55667D" text-anchor="end" >O</text>
<path d="M46.0,131.3 L302.0,131.3" fill="none" stroke="#D2552B" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
<text x="50.3" y="58.8" font-size="12" fill="#1E2B3A" text-anchor="start" >(i) strip −1 &lt; y &lt; 0</text>
<text x="297.7" y="147.3" font-size="11" fill="#D2552B" text-anchor="end" >y = −1</text>
</g>
<g transform="translate(9.5,240)">
<polygon points="134.8,224.3 221.0,75.0 134.8,51.9" fill="#E6F3F5" stroke="none"/>
<line x1="45.6" y1="224.3" x2="293.4" y2="224.3" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="291.4" y="240.3" font-size="12" fill="#1E2B3A" text-anchor="end" >Re z</text>
<line x1="134.8" y1="254.0" x2="134.8" y2="36.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="140.8" y="44.0" font-size="12" fill="#1E2B3A" text-anchor="start" >Im z</text>
<text x="129.8" y="238.3" font-size="11" fill="#55667D" text-anchor="end" >O</text>
<path d="M134.8,224.3 L221.0,75.0" fill="none" stroke="#D2552B" stroke-width="2" stroke-linejoin="round" />
<path d="M134.8,224.3 L134.8,51.9" fill="none" stroke="#D2552B" stroke-width="2" stroke-linejoin="round" />
<circle cx="134.8" cy="224.3" r="5" fill="#fff" stroke="#55667D" stroke-width="2"/>
<text x="208.2" y="111.1" font-size="11" fill="#D2552B" text-anchor="start" >θ = π/3</text>
<text x="126.8" y="75.7" font-size="11" fill="#D2552B" text-anchor="end" >θ = π/2</text>
<text x="51.6" y="63.8" font-size="12" fill="#1E2B3A" text-anchor="start" >(ii) wedge</text>
</g>
</svg>