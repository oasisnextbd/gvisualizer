<text x="220.0" y="402.0" font-size="11.5" fill="#55667D" text-anchor="middle">Draw the domain: the plane minus the origin and the ray θ = α. There</text>
<text x="220.0" y="417.0" font-size="11.5" fill="#55667D" text-anchor="middle">u = √r cos(θ/2), v = √r sin(θ/2) satisfy the polar C–R equations, so</text>
<text x="220.0" y="432.0" font-size="11.5" fill="#55667D" text-anchor="middle">f is analytic and f′ = 1/(2f).</text>
