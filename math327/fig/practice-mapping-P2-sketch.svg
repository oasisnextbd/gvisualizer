<line x1="51.4" y1="227.1" x2="258.6" y2="227.1" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="256.6" y="243.1" font-size="12" fill="#1E2B3A" text-anchor="end" >Re z</text>
<line x1="95.2" y1="260.0" x2="95.2" y2="20.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="101.2" y="28.0" font-size="12" fill="#1E2B3A" text-anchor="start" >Im z</text>
<circle cx="95.2" cy="227.1" r="3.5" fill="#1E2B3A"/>
<text x="89.2" y="241.1" font-size="11.5" fill="#1E2B3A" text-anchor="end" >A (0)</text>
<circle cx="204.8" cy="227.1" r="3.5" fill="#1E2B3A"/>
<text x="198.8" y="243.1" font-size="11.5" fill="#1E2B3A" text-anchor="end" >B (2)</text>
<circle cx="204.8" cy="62.9" r="3.5" fill="#1E2B3A"/>
<text x="212.8" y="62.9" font-size="11.5" fill="#1E2B3A" text-anchor="start" >C (2 + 3i)</text>
<circle cx="95.2" cy="62.9" r="3.5" fill="#1E2B3A"/>
<text x="87.2" y="62.9" font-size="11.5" fill="#1E2B3A" text-anchor="end" >D (3i)</text>
<text x="150.0" y="280.0" font-size="11.5" fill="#55667D" text-anchor="middle" >rectangle 0 ≤ x ≤ 2, 0 ≤ y ≤ 3</text>
</g>
<g transform="translate(0.0,296)">
<polygon points="187.9,237.5 259.7,165.7 152.1,58.0 80.3,129.8" fill="#FBEAE3" stroke="none"/>
<path d="M187.9,237.5 L259.7,165.7" fill="none" stroke="#D2552B" stroke-width="2.2" stroke-linejoin="round" />
<path d="M259.7,165.7 L152.1,58.0" fill="none" stroke="#D2552B" stroke-width="2.2" stroke-linejoin="round" />
<path d="M152.1,58.0 L80.3,129.8" fill="none" stroke="#D2552B" stroke-width="2.2" stroke-linejoin="round" />
<path d="M80.3,129.8 L187.9,237.5" fill="none" stroke="#D2552B" stroke-width="2.2" stroke-linejoin="round" />
<line x1="30.0" y1="237.5" x2="320.0" y2="237.5" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="318.0" y="253.5" font-size="12" fill="#1E2B3A" text-anchor="end" >Re w</text>
