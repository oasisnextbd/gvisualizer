<text x="195.9" y="251.5" font-size="11.5" fill="#1E2B3A" text-anchor="start" >A′ (0)</text>
<circle cx="259.7" cy="165.7" r="3.5" fill="#1E2B3A"/>
<text x="267.7" y="169.7" font-size="11.5" fill="#1E2B3A" text-anchor="start" >B′ (2 + 2i)</text>
<circle cx="152.1" cy="58.0" r="3.5" fill="#1E2B3A"/>
<text x="160.1" y="54.0" font-size="11.5" fill="#1E2B3A" text-anchor="start" >C′ (−1 + 5i)</text>
<circle cx="80.3" cy="129.8" r="3.5" fill="#1E2B3A"/>
<text x="72.3" y="133.8" font-size="11.5" fill="#1E2B3A" text-anchor="end" >D′ (−3 + 3i)</text>
<text x="231.8" y="209.6" font-size="11" fill="#D2552B" text-anchor="start" >v = u</text>
<text x="128.1" y="193.6" font-size="11" fill="#D2552B" text-anchor="end" >v = −u</text>
<text x="213.9" y="111.8" font-size="11" fill="#D2552B" text-anchor="start" >u + v = 4</text>
<text x="108.2" y="87.9" font-size="11" fill="#D2552B" text-anchor="end" >v − u = 6</text>
<text x="170.0" y="279.0" font-size="11.5" fill="#55667D" text-anchor="middle" >w = √2 e<tspan baseline-shift="super" font-size="72%">iπ/4</tspan> z = (1 + i)z: rotate π/4, stretch √2</text>
