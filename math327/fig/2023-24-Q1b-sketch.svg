<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 453" width="440" height="453" font-family="Helvetica, Arial, sans-serif">
<title>z Im z: Cauchy–Riemann equations hold only at z = 0</title>
<rect width="440" height="453" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker></defs>
<line x1="40.0" y1="380.0" x2="40.0" y2="20.0" stroke="#D5DCE4" stroke-width="0.6"/>
<line x1="130.0" y1="380.0" x2="130.0" y2="20.0" stroke="#D5DCE4" stroke-width="0.6"/>
<line x1="220.0" y1="380.0" x2="220.0" y2="20.0" stroke="#D5DCE4" stroke-width="0.6"/>
<line x1="310.0" y1="380.0" x2="310.0" y2="20.0" stroke="#D5DCE4" stroke-width="0.6"/>
<line x1="400.0" y1="380.0" x2="400.0" y2="20.0" stroke="#D5DCE4" stroke-width="0.6"/>
<line x1="40.0" y1="380.0" x2="400.0" y2="380.0" stroke="#D5DCE4" stroke-width="0.6"/>
<line x1="40.0" y1="290.0" x2="400.0" y2="290.0" stroke="#D5DCE4" stroke-width="0.6"/>
<line x1="40.0" y1="200.0" x2="400.0" y2="200.0" stroke="#D5DCE4" stroke-width="0.6"/>
<line x1="40.0" y1="110.0" x2="400.0" y2="110.0" stroke="#D5DCE4" stroke-width="0.6"/>
<line x1="40.0" y1="20.0" x2="400.0" y2="20.0" stroke="#D5DCE4" stroke-width="0.6"/>
<line x1="40.0" y1="200.0" x2="400.0" y2="200.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="398.0" y="193.0" font-size="12.5" fill="#1E2B3A" text-anchor="end">Re z</text>
<line x1="220.0" y1="380.0" x2="220.0" y2="20.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="227.0" y="32.0" font-size="12.5" fill="#1E2B3A" text-anchor="start">Im z</text>
<text x="40.0" y="214.0" font-size="10.5" fill="#55667D" text-anchor="middle">−2</text>
<text x="130.0" y="214.0" font-size="10.5" fill="#55667D" text-anchor="middle">−1</text>
<text x="310.0" y="214.0" font-size="10.5" fill="#55667D" text-anchor="middle">1</text>
<text x="215.0" y="384.0" font-size="10.5" fill="#55667D" text-anchor="end">−2</text>
<text x="215.0" y="294.0" font-size="10.5" fill="#55667D" text-anchor="end">−1</text>
<text x="215.0" y="114.0" font-size="10.5" fill="#55667D" text-anchor="end">1</text>
<path d="M40.0,200.0 L400.0,200.0" fill="none" stroke="#0B7C8C" stroke-width="2.6" stroke-linejoin="round"/>
<path d="M220.0,380.0 L220.0,20.0" fill="none" stroke="#6A4FC9" stroke-width="2.6" stroke-linejoin="round"/>
<text x="310.0" y="192.0" font-size="11.5" fill="#0B7C8C" text-anchor="middle">u<tspan baseline-shift="sub" font-size="70%">x</tspan> = v<tspan baseline-shift="sub" font-size="70%">y</tspan>  ⇔  y = 0</text>
<text x="226.0" y="74.0" font-size="11.5" fill="#6A4FC9" text-anchor="start">u<tspan baseline-shift="sub" font-size="70%">y</tspan> = −v<tspan baseline-shift="sub" font-size="70%">x</tspan>  ⇔  x = 0</text>
<circle cx="220.0" cy="200.0" r="4.6" fill="#D2552B" stroke="#fff" stroke-width="1.2"/>
<line x1="220.0" y1="200.0" x2="130.0" y2="263.0" stroke="#D2552B" stroke-width="0.9"/>
<text x="130.0" y="277.0" font-size="11.5" fill="#D2552B" text-anchor="middle">z = 0: both hold</text>
<text x="220.0" y="402.0" font-size="11.5" fill="#55667D" text-anchor="middle">Draw the two sets where each C–R equation holds; f = z Im z is</text>
<text x="220.0" y="417.0" font-size="11.5" fill="#55667D" text-anchor="middle">differentiable only where they meet (z = 0), so it is analytic</text>
<text x="220.0" y="432.0" font-size="11.5" fill="#55667D" text-anchor="middle">nowhere.</text>
</svg>