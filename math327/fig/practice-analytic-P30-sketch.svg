<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 170" width="420" height="170" font-family="Helvetica, Arial, sans-serif">
<title>tan z = 2i: z = (2n + 1)π/2 + (i/2) ln 3</title>
<rect width="420" height="170" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs>
<line x1="46.0" y1="87.6" x2="384.0" y2="87.6" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="382.0" y="103.6" font-size="12" fill="#1E2B3A" text-anchor="end" >Re z</text>
<line x1="203.9" y1="124.0" x2="203.9" y2="35.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="209.9" y="43.0" font-size="12" fill="#1E2B3A" text-anchor="start" >Im z</text>
<text x="198.9" y="101.6" font-size="11" fill="#55667D" text-anchor="end" >O</text>
<circle cx="60.8" cy="70.9" r="5" fill="#D2552B" stroke="#D2552B" stroke-width="2"/>
<circle cx="60.8" cy="87.6" r="5" fill="#fff" stroke="#55667D" stroke-width="2"/>
<circle cx="156.2" cy="70.9" r="5" fill="#D2552B" stroke="#D2552B" stroke-width="2"/>
<circle cx="156.2" cy="87.6" r="5" fill="#fff" stroke="#55667D" stroke-width="2"/>
<circle cx="251.6" cy="70.9" r="5" fill="#D2552B" stroke="#D2552B" stroke-width="2"/>
<circle cx="251.6" cy="87.6" r="5" fill="#fff" stroke="#55667D" stroke-width="2"/>
<circle cx="347.0" cy="70.9" r="5" fill="#D2552B" stroke="#D2552B" stroke-width="2"/>
