<text x="259.6" y="62.9" font-size="11.5" fill="#D2552B" text-anchor="start" >π/2 + 0.549i</text>
<text x="156.2" y="105.6" font-size="11" fill="#55667D" text-anchor="middle" >−π/2</text>
<text x="251.6" y="105.6" font-size="11" fill="#55667D" text-anchor="middle" >π/2</text>
<text x="210.0" y="144.0" font-size="11.5" fill="#55667D" text-anchor="middle" >orange: roots, height ½ ln 3 ≈ 0.549 above the poles of tan z (hollow)</text>
<text x="210.0" y="161.0" font-size="11.5" fill="#55667D" text-anchor="middle" >e<tspan baseline-shift="super" font-size="72%">2iz</tspan> = −1/3 ⇒ 2iz = −ln 3 + (2n + 1)πi</text>
</svg>