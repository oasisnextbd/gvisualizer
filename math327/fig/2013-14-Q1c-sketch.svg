<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 364" width="560" height="364" font-family="Helvetica, Arial, sans-serif">
<title>Approaching 0 along rays: (z̄/z)² = e^{−4iθ} depends on θ</title>
<rect width="560" height="364" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs>
<line x1="46.0" y1="191.2" x2="524.0" y2="191.2" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="522.0" y="207.2" font-size="12" fill="#1E2B3A" text-anchor="end" >Re z</text>
<line x1="202.0" y1="318.0" x2="202.0" y2="35.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="208.0" y="43.0" font-size="12" fill="#1E2B3A" text-anchor="start" >Im z</text>
<text x="197.0" y="205.2" font-size="11" fill="#55667D" text-anchor="end" >O</text>
<path d="M358.0,191.2 L207.8,191.2" fill="none" stroke="#0B7C8C" stroke-width="2.4" stroke-linejoin="round" />
<path d="M288.9,191.2 L278.9,191.2" fill="none" stroke="#0B7C8C" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arc)"/>
<path d="M314.1,79.1 L206.9,186.4" fill="none" stroke="#D2552B" stroke-width="2.4" stroke-linejoin="round" />
<path d="M264.7,128.5 L257.7,135.6" fill="none" stroke="#D2552B" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arh)"/>
<path d="M202.0,54.8 L202.0,185.4" fill="none" stroke="#6A4FC9" stroke-width="2.4" stroke-linejoin="round" />
<path d="M202.0,114.1 L202.0,124.1" fill="none" stroke="#6A4FC9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="323.9" y="209.2" font-size="11" fill="#0B7C8C" text-anchor="middle" >θ = 0: quotient 1</text>
<text x="320.1" y="75.1" font-size="11" fill="#D2552B" text-anchor="start" >θ = π/4: quotient −1</text>
<text x="194.0" y="74.3" font-size="11" fill="#6A4FC9" text-anchor="end" >θ = π/2: 1</text>
<circle cx="202.0" cy="191.2" r="3.5" fill="#1E2B3A"/>
<text x="280.0" y="354.0" font-size="11.5" fill="#55667D" text-anchor="middle" >different limits ⇒ f′(0) does not exist (f is continuous: |f| = |z|)</text>
</svg>