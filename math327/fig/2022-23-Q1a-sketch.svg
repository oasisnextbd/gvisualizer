<text x="133.0" y="119.0" font-size="12" fill="#6A4FC9" text-anchor="end">z<tspan baseline-shift="sub" font-size="70%">2</tspan></text>
<text x="220.0" y="357.0" font-size="11.5" fill="#55667D" text-anchor="middle">Draw the triangle 0, z₁, z₁ + z₂: one side (|z₁ + z₂|) is never</text>
<text x="220.0" y="372.0" font-size="11.5" fill="#55667D" text-anchor="middle">longer than the sum of the other two, and never shorter than their</text>
<text x="220.0" y="387.0" font-size="11.5" fill="#55667D" text-anchor="middle">difference.</text>
