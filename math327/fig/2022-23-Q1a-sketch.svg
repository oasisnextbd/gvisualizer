<text x="318.0" y="159.5" font-size="12.5" fill="#6A4FC9" text-anchor="start">|z<tspan baseline-shift="sub" font-size="70%">2</tspan>|</text>
<text x="203.0" y="178.0" font-size="12.5" fill="#D2552B" text-anchor="end">|z<tspan baseline-shift="sub" font-size="70%">1</tspan> + z<tspan baseline-shift="sub" font-size="70%">2</tspan>|</text>
