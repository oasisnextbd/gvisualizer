<text x="398.0" y="283.0" font-size="12.5" fill="#1E2B3A" text-anchor="end">Re z</text>
<line x1="85.0" y1="335.0" x2="85.0" y2="20.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="92.0" y="32.0" font-size="12.5" fill="#1E2B3A" text-anchor="start">Im z</text>
