<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 517 420" width="517" height="420" font-family="Helvetica, Arial, sans-serif">
<title>Approaching z₀ = 2 + i: f = z/(z + 2i) is continuous there</title>
<rect width="517" height="420" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker></defs>
<line x1="45.9" y1="210.0" x2="481.1" y2="210.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="479.1" y="226.0" font-size="12" fill="#1E2B3A" text-anchor="end" >Re z</text>
<line x1="252.4" y1="374.0" x2="252.4" y2="36.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="258.4" y="44.0" font-size="12" fill="#1E2B3A" text-anchor="start" >Im z</text>
<text x="247.4" y="224.0" font-size="11" fill="#55667D" text-anchor="end" >O</text>
<path d="M458.9,149.3 L378.8,149.3" fill="none" stroke="#0B7C8C" stroke-width="2.4" stroke-linejoin="round" />
<path d="M424.9,149.3 L414.9,149.3" fill="none" stroke="#0B7C8C" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arc)"/>
<path d="M373.9,58.1 L373.9,144.4" fill="none" stroke="#0B7C8C" stroke-width="2.4" stroke-linejoin="round" />
<path d="M373.9,95.3 L373.9,105.3" fill="none" stroke="#0B7C8C" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arc)"/>
<path d="M288.9,234.3 L370.3,152.9" fill="none" stroke="#0B7C8C" stroke-width="2.4" stroke-linejoin="round" />
<path d="M325.3,197.8 L332.4,190.8" fill="none" stroke="#0B7C8C" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arc)"/>
<circle cx="373.9" cy="149.3" r="3.5" fill="#1E2B3A"/>
<text x="381.9" y="141.3" font-size="11.5" fill="#1E2B3A" text-anchor="start" >z₀ = 2 + i</text>
<circle cx="252.4" cy="88.5" r="5" fill="#fff" stroke="#55667D" stroke-width="2"/>
<text x="244.4" y="82.5" font-size="11.5" fill="#55667D" text-anchor="end" >2i: removable (cancels)</text>
<circle cx="252.4" cy="331.5" r="5" fill="#fff" stroke="#D2552B" stroke-width="2"/>
<text x="260.4" y="335.5" font-size="11.5" fill="#D2552B" text-anchor="start" >−2i: pole of f</text>
<text x="258.5" y="410.0" font-size="11.5" fill="#55667D" text-anchor="middle" >every path gives the same limit (2 + i)/(2 + 3i) = (7 − 4i)/13</text>
</svg>