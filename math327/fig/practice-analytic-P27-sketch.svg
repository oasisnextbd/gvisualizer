<text x="231.0" y="79.7" font-size="11.5" fill="#D2552B" text-anchor="start" >π/2 + 4i</text>
<text x="231.0" y="300.0" font-size="11.5" fill="#D2552B" text-anchor="start" >π/2 − 4i</text>
<text x="388.3" y="79.7" font-size="11.5" fill="#D2552B" text-anchor="start" >5π/2 + 4i</text>
<text x="230.0" y="341.0" font-size="11.5" fill="#55667D" text-anchor="middle" >cos x sinh y = 0 and sin x cosh y = cosh 4 &gt; 1 force cos x = 0, sin x = 1</text>
<text x="230.0" y="358.0" font-size="11.5" fill="#55667D" text-anchor="middle" >so x = π/2 + 2nπ (dotted lines) and cosh y = cosh 4, y = ±4</text>
</svg>