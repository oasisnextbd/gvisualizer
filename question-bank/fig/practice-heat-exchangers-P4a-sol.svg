<marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#1E2B3A"/></marker>
<marker id="ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#D2552B"/></marker>
<marker id="as-hot" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#D2552B"/></marker>
<marker id="ah-cold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#0B7C8C"/></marker>
<marker id="as-cold" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#0B7C8C"/></marker>
<marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#9AA8B8"/></marker>
<marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#9AA8B8"/></marker>
<marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#B7840A"/></marker>
<marker id="as-acc" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#B7840A"/></marker>
<marker id="ah-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#55667D"/></marker>
<marker id="as-sec" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#55667D"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern>
<pattern id="mhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9AA8B8" stroke-width="1"/></pattern>
</defs>
<rect width="680" height="330" fill="#FFFFFF"/>
<circle cx="140" cy="150" r="95" fill="#FBE2D6" stroke="#1E2B3A" stroke-width="1.2"/>
<circle cx="140" cy="150" r="62" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.6"/>
<circle cx="140" cy="150" r="46" fill="#D9F0F2" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="140" y="154" font-size="12" text-anchor="middle" fill="#0B7C8C">fluid A</text>
<text x="140" y="168" font-size="11" text-anchor="middle" fill="#0B7C8C">(inside, h<tspan dy="3.3" font-size="7.9">i</tspan><tspan dy="-3.3">​</tspan>)</text>
<text x="140" y="76" font-size="11.5" text-anchor="middle" fill="#D2552B">fluid B (annulus, h<tspan dy="3.4" font-size="8.3">o</tspan><tspan dy="-3.4">​</tspan>)</text>
<line x1="140" y1="150" x2="172.2" y2="182.2" stroke="#1E2B3A" stroke-width="1.2"/>
<text x="154" y="194" font-size="12" text-anchor="middle" fill="#1E2B3A">r<tspan dy="3.6" font-size="8.6">i</tspan><tspan dy="-3.6">​</tspan></text>
<line x1="140" y1="150" x2="90.4" y2="187.2" stroke="#1E2B3A" stroke-width="1.2"/>
<text x="106" y="198" font-size="12" text-anchor="middle" fill="#1E2B3A">r<tspan dy="3.6" font-size="8.6">o</tspan><tspan dy="-3.6">​</tspan></text>
<text x="206" y="100" font-size="11.5" fill="#1E2B3A">wall k</text>
<circle cx="290" cy="120" r="4" fill="#1E2B3A" stroke="#1E2B3A" stroke-width="1.5"/>
<text x="290" y="108" font-size="12.5" text-anchor="middle" fill="#1E2B3A">T<tspan dy="3.8" font-size="9.0">A</tspan><tspan dy="-3.8">​</tspan></text>
<line x1="290" y1="120" x2="304" y2="120" stroke="#1E2B3A" stroke-width="1.5"/>
<path d="M304,120 L308,112 L316,128 L324,112 L332,128 L340,112 L344,120" fill="none" stroke="#1E2B3A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="344" y1="120" x2="360" y2="120" stroke="#1E2B3A" stroke-width="1.5"/>
<text x="324" y="150" font-size="12" text-anchor="middle" fill="#1E2B3A">1/(h<tspan dy="3.6" font-size="8.6">i</tspan><tspan dy="-3.6">​</tspan>A<tspan dy="3.6" font-size="8.6">i</tspan><tspan dy="-3.6">​</tspan>)</text>
<text x="324" y="166" font-size="10.5" text-anchor="middle" fill="#55667D">inside film</text>
<line x1="366" y1="120" x2="380" y2="120" stroke="#1E2B3A" stroke-width="1.5"/>
<path d="M380,120 L384,112 L392,128 L400,112 L408,128 L416,112 L420,120" fill="none" stroke="#1E2B3A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="420" y1="120" x2="436" y2="120" stroke="#1E2B3A" stroke-width="1.5"/>
<text x="400" y="150" font-size="12" text-anchor="middle" fill="#1E2B3A">ln(r<tspan dy="3.6" font-size="8.6">o</tspan><tspan dy="-3.6">​</tspan>/r<tspan dy="3.6" font-size="8.6">i</tspan><tspan dy="-3.6">​</tspan>)/(2πkL)</text>
<text x="400" y="166" font-size="10.5" text-anchor="middle" fill="#55667D">wall</text>
<line x1="442" y1="120" x2="456" y2="120" stroke="#1E2B3A" stroke-width="1.5"/>
<path d="M456,120 L460,112 L468,128 L476,112 L484,128 L492,112 L496,120" fill="none" stroke="#1E2B3A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="496" y1="120" x2="512" y2="120" stroke="#1E2B3A" stroke-width="1.5"/>
<text x="476" y="150" font-size="12" text-anchor="middle" fill="#1E2B3A">1/(h<tspan dy="3.6" font-size="8.6">o</tspan><tspan dy="-3.6">​</tspan>A<tspan dy="3.6" font-size="8.6">o</tspan><tspan dy="-3.6">​</tspan>)</text>
<text x="476" y="166" font-size="10.5" text-anchor="middle" fill="#55667D">outside film</text>
<circle cx="512" cy="120" r="4" fill="#1E2B3A" stroke="#1E2B3A" stroke-width="1.5"/>
<text x="512" y="108" font-size="12.5" text-anchor="middle" fill="#1E2B3A">T<tspan dy="3.8" font-size="9.0">B</tspan><tspan dy="-3.8">​</tspan></text>
<line x1="310" y1="86" x2="492" y2="86" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ah-hot)"/>
<text x="401" y="78" font-size="11" text-anchor="middle" fill="#D2552B">q (or reverse)</text>
<text x="290" y="220" font-size="12.5" fill="#1E2B3A">1/(U<tspan dy="3.8" font-size="9.0">o</tspan><tspan dy="-3.8">​</tspan>A<tspan dy="3.8" font-size="9.0">o</tspan><tspan dy="-3.8">​</tspan>) = 1/(U<tspan dy="3.8" font-size="9.0">i</tspan><tspan dy="-3.8">​</tspan>A<tspan dy="3.8" font-size="9.0">i</tspan><tspan dy="-3.8">​</tspan>) = Σ R</text>
<text x="290" y="240" font-size="12.5" fill="#1E2B3A">Kern (thin wall): h<tspan dy="3.8" font-size="9.0">io</tspan><tspan dy="-3.8">​</tspan> = h<tspan dy="3.8" font-size="9.0">i</tspan><tspan dy="-3.8">​</tspan>(ID/OD),  1/U<tspan dy="3.8" font-size="9.0">C</tspan><tspan dy="-3.8">​</tspan> = 1/h<tspan dy="3.8" font-size="9.0">io</tspan><tspan dy="-3.8">​</tspan> + 1/h<tspan dy="3.8" font-size="9.0">o</tspan><tspan dy="-3.8">​</tspan></text>
<text x="290" y="260" font-size="12.5" fill="#1E2B3A">fouling: 1/U<tspan dy="3.8" font-size="9.0">D</tspan><tspan dy="-3.8">​</tspan> = 1/U<tspan dy="3.8" font-size="9.0">C</tspan><tspan dy="-3.8">​</tspan> + R<tspan dy="3.8" font-size="9.0">d</tspan><tspan dy="-3.8">​</tspan>,  R<tspan dy="3.8" font-size="9.0">d</tspan><tspan dy="-3.8">​</tspan> = R<tspan dy="3.8" font-size="9.0">di</tspan><tspan dy="-3.8">​</tspan> + R<tspan dy="3.8" font-size="9.0">do</tspan><tspan dy="-3.8">​</tspan></text>
</svg>
