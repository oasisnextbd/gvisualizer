<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" font-family="Helvetica, Arial, sans-serif">
<title>Figure for Q2(a): composite surface A1,2 viewing A3</title>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="a-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="a-cold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="a-vap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><pattern id="ins" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="metal" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA8B8" stroke-width="0.8"/></pattern></defs>
<rect width="560" height="330" fill="#FFFFFF"/>
<path d="M60,80 L100,40 L220,110 L180,150 Z" stroke="#1E2B3A" stroke-width="2" fill="#EEF1F5"/>
<text x="140" y="102" font-size="18" fill="#1E2B3A" text-anchor="middle" font-weight="bold">A₃</text>
<path d="M70,200 L80,193 L300,193 L290,200 Z" stroke="#1E2B3A" stroke-width="1.4" fill="#DCE3EC"/>
<path d="M70,200 L290,200 L290,320 L70,320 Z" stroke="#1E2B3A" stroke-width="2" fill="#F4F6F9"/>
<path d="M290,200 L300,193 L300,313 L290,320 Z" stroke="#1E2B3A" stroke-width="1.4" fill="#DCE3EC"/>
<line x1="125" y1="200" x2="125" y2="320" stroke="#1E2B3A" stroke-width="2"/>
<text x="97" y="268" font-size="18" fill="#1E2B3A" text-anchor="middle" font-weight="bold">A₁</text>
<text x="205" y="268" font-size="18" fill="#1E2B3A" text-anchor="middle" font-weight="bold">A₂</text>
<text x="400" y="220" font-size="14" fill="#1E2B3A">A<tspan dy="4.5" font-size="10.1">1,2</tspan><tspan dy="-4.5"> </tspan> = A₁ + A₂</text>
<text x="400" y="244" font-size="12" fill="#55667D">(one plane surface)</text>
<line x1="150" y1="196" x2="145" y2="140" stroke="#D2552B" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a-hot)"/>
<line x1="220" y1="196" x2="175" y2="140" stroke="#D2552B" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a-hot)"/>
<text x="400" y="100" font-size="12" fill="#55667D">A₃: separate surface</text>
<text x="400" y="116" font-size="12" fill="#55667D">facing A<tspan dy="3.8" font-size="8.6">1,2</tspan><tspan dy="-3.8"> </tspan></text>
</svg>
