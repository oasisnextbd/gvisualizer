<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="Helvetica, Arial, sans-serif">
<title>Thermal circuit for the split insulation: two parallel branches</title>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="a-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="a-cold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="a-vap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><pattern id="ins" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="metal" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA8B8" stroke-width="0.8"/></pattern></defs>
<rect width="640" height="250" fill="#FFFFFF"/>
<circle cx="120" cy="125" r="3.5" fill="#1E2B3A"/>
<text x="112" y="129" font-size="13" fill="#1E2B3A" text-anchor="end">T₁ = 500 K</text>
<circle cx="540" cy="125" r="3.5" fill="#1E2B3A"/>
<text x="548" y="129" font-size="13" fill="#1E2B3A">T<tspan dy="4.2" font-size="9.4">∞</tspan><tspan dy="-4.2"> </tspan> = 300 K</text>
<line x1="120" y1="125" x2="150" y2="125" stroke="#1E2B3A" stroke-width="1.5"/>
<line x1="150" y1="70" x2="150" y2="180" stroke="#1E2B3A" stroke-width="1.5"/>
<line x1="510" y1="125" x2="540" y2="125" stroke="#1E2B3A" stroke-width="1.5"/>
<line x1="510" y1="70" x2="510" y2="180" stroke="#1E2B3A" stroke-width="1.5"/>
<path d="M150,70 L218.0,70 L221.7,63 L229.0,77 L236.3,63 L243.7,77 L251.0,63 L258.3,77 L262.0,70 L330,70" stroke="#1E2B3A" stroke-width="1.6" fill="none"/><text x="240.0" y="57" font-size="12" fill="#1E2B3A" text-anchor="middle">R′<tspan dy="3.8" font-size="8.6">cond,A</tspan><tspan dy="-3.8"> </tspan> = ln(r₂/r₁)/(πk<tspan dy="3.8" font-size="8.6">A</tspan><tspan dy="-3.8"> </tspan>)</text><text x="240.0" y="94" font-size="11" fill="#55667D" text-anchor="middle">= 0.110 m·K/W</text>
<circle cx="330" cy="70" r="3.5" fill="#1E2B3A"/>
<text x="330" y="36" font-size="12" fill="#D2552B" text-anchor="middle" font-weight="bold">T<tspan dy="3.8" font-size="8.6">s,A</tspan><tspan dy="-3.8"> </tspan> ≈ 407 K</text>
<path d="M330,70 L398.0,70 L401.7,63 L409.0,77 L416.3,63 L423.7,77 L431.0,63 L438.3,77 L442.0,70 L510,70" stroke="#1E2B3A" stroke-width="1.6" fill="none"/><text x="420.0" y="57" font-size="12" fill="#1E2B3A" text-anchor="middle">R′<tspan dy="3.8" font-size="8.6">conv,A</tspan><tspan dy="-3.8"> </tspan> = 1/(hπr₂)</text><text x="420.0" y="94" font-size="11" fill="#55667D" text-anchor="middle">= 0.127 m·K/W</text>
<path d="M150,180 L218.0,180 L221.7,173 L229.0,187 L236.3,173 L243.7,187 L251.0,173 L258.3,187 L262.0,180 L330,180" stroke="#1E2B3A" stroke-width="1.6" fill="none"/><text x="240.0" y="167" font-size="12" fill="#1E2B3A" text-anchor="middle">R′<tspan dy="3.8" font-size="8.6">cond,B</tspan><tspan dy="-3.8"> </tspan> = ln(r₂/r₁)/(πk<tspan dy="3.8" font-size="8.6">B</tspan><tspan dy="-3.8"> </tspan>)</text><text x="240.0" y="204" font-size="11" fill="#55667D" text-anchor="middle">= 0.883 m·K/W</text>
<circle cx="330" cy="180" r="3.5" fill="#1E2B3A"/>
<text x="330" y="206" font-size="12" fill="#0B7C8C" text-anchor="middle" font-weight="bold">T<tspan dy="3.8" font-size="8.6">s,B</tspan><tspan dy="-3.8"> </tspan> ≈ 325 K</text>
<path d="M330,180 L398.0,180 L401.7,173 L409.0,187 L416.3,173 L423.7,187 L431.0,173 L438.3,187 L442.0,180 L510,180" stroke="#1E2B3A" stroke-width="1.6" fill="none"/><text x="420.0" y="167" font-size="12" fill="#1E2B3A" text-anchor="middle">R′<tspan dy="3.8" font-size="8.6">conv,B</tspan><tspan dy="-3.8"> </tspan> = 1/(hπr₂)</text><text x="420.0" y="204" font-size="11" fill="#55667D" text-anchor="middle">= 0.127 m·K/W</text>
<text x="320.0" y="242" font-size="11" fill="#55667D" text-anchor="middle">two parallel branches (no heat crosses the A/B interface): q′ = q′<tspan dy="3.5" font-size="7.9">A</tspan><tspan dy="-3.5"> </tspan> + q′<tspan dy="3.5" font-size="7.9">B</tspan><tspan dy="-3.5"> </tspan> ≈ 842 + 198 = 1040 W/m</text>
</svg>
