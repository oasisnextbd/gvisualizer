<text x="510" y="306" text-anchor="middle" fill="#55667D" font-size="11">Re<tspan dy="4" font-size="75%">x</tspan><tspan dy="-4">​</tspan> ≈ 50 900</text>
<line x1="70" y1="260" x2="286" y2="260" stroke="#9AA8B8" stroke-width="1" marker-end="url(#ag)"/>
<text x="70" y="280" text-anchor="middle" fill="#55667D" font-size="11">leading edge</text>
<text x="250" y="338" fill="#55667D" font-size="11">Laminar (Re<tspan dy="4" font-size="75%">x</tspan><tspan dy="-4">​</tspan> &lt; 5 × 10⁵): δ = 4.64x/√Re<tspan dy="4" font-size="75%">x</tspan><tspan dy="-4">​</tspan>;  vertical scale exaggerated</text>
</svg>
