<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" width="600" height="290" font-family="Helvetica, Arial, sans-serif"><title>Plate absorbing a solar flux on the left face and losing heat by convection on the right</title><defs><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><marker id="dg" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#9AA8B8"/></marker><marker id="dg0" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#9AA8B8"/></marker><pattern id="ins" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="gen" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#FBE2D6"/><circle cx="6" cy="6" r="1.3" fill="#D2552B"/></pattern><pattern id="wtr" width="16" height="8" patternUnits="userSpaceOnUse"><rect width="16" height="8" fill="#D9F0F2"/><path d="M0,4 q4,-3 8,0 t8,0" stroke="#0B7C8C" stroke-width="0.7" fill="none"/></pattern></defs><rect width="600" height="290" fill="white"/>
<rect x="220.0" y="40.0" width="140.0" height="190.0" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.4"/>
<line x1="110.0" y1="80.0" x2="216.0" y2="80.0" stroke="#D2552B" stroke-width="2" marker-end="url(#ah)"/>
<line x1="110.0" y1="130.0" x2="216.0" y2="130.0" stroke="#D2552B" stroke-width="2" marker-end="url(#ah)"/>
<line x1="110.0" y1="180.0" x2="216.0" y2="180.0" stroke="#D2552B" stroke-width="2" marker-end="url(#ah)"/>
<text x="40.0" y="60.0" font-size="12" text-anchor="start" fill="#D2552B" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke" font-weight="bold">absorbed solar</text>
<text x="40.0" y="76.0" font-size="12" text-anchor="start" fill="#D2552B" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">flux 600 W/m²</text>
<text x="40.0" y="214.0" font-size="11" text-anchor="start" fill="#55667D" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">(no other loss</text>
<text x="40.0" y="228.0" font-size="11" text-anchor="start" fill="#55667D" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">from this face)</text>
<path d="M364,90 C400,90 410,70 450,66" stroke="#0B7C8C" stroke-width="1.8" fill="none" marker-end="url(#ac)"/>
<path d="M364,160 C400,160 410,140 450,136" stroke="#0B7C8C" stroke-width="1.8" fill="none" marker-end="url(#ac)"/>
<text x="390.0" y="200.0" font-size="12" text-anchor="start" fill="#0B7C8C" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke" font-weight="bold">air 25°C</text>
<text x="390.0" y="216.0" font-size="11.5" text-anchor="start" fill="#55667D" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">h = 10 W/m²·°C</text>
<line x1="220.0" y1="110.0" x2="360.0" y2="170.0" stroke="#D2552B" stroke-width="2.4"/>
<circle cx="220.0" cy="110.0" r="3.2" fill="white" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="228.0" y="102.0" font-size="12" text-anchor="start" fill="#D2552B" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke" font-weight="bold">T(0) = 100°C</text>
<circle cx="360.0" cy="170.0" r="3.2" fill="white" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="352.0" y="190.0" font-size="12" text-anchor="end" fill="#D2552B" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke" font-weight="bold">T(L) = 85°C</text>
<text x="290.0" y="58.0" font-size="12" text-anchor="middle" fill="#55667D" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">k = 0.8 W/m·°C</text>
<line x1="220.0" y1="246.0" x2="360.0" y2="246.0" stroke="#9AA8B8" stroke-width="1" marker-end="url(#dg)" marker-start="url(#dg0)"/>
<text x="290.0" y="261.0" font-size="12" text-anchor="middle" fill="#55667D" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">L = 2 cm</text>
<line x1="220.0" y1="274.0" x2="270.0" y2="274.0" stroke="#1E2B3A" stroke-width="1.2" marker-end="url(#ai)"/>
<text x="276.0" y="278.0" font-size="12" text-anchor="start" fill="#1E2B3A" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">x</text>
<text x="300.0" y="24.0" font-size="12" text-anchor="middle" fill="#55667D" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">−k dT/dx = 600 at x = 0;  −k dT/dx = h[T(L) − 25] at x = L</text>
</svg>
