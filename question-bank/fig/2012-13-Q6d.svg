<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="Helvetica, Arial, sans-serif">
<title>Isothermal copper block cooling in room air</title>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="a-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="a-cold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="a-vap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><pattern id="ins" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="metal" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA8B8" stroke-width="0.8"/></pattern></defs>
<rect width="640" height="340" fill="#FFFFFF"/>
<path d="M230,120 L280,84 L370,84 L320,120 Z" stroke="#1E2B3A" stroke-width="1.5" fill="#F2B79C"/>
<path d="M320,120 L370,84 L370,264 L320,300 Z" stroke="#1E2B3A" stroke-width="1.5" fill="#E9A27E"/>
<rect x="230" y="120" width="90" height="180" rx="0" fill="#F6C4AA" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="275.0" y="210.0" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">Cu block</text>
<text x="275.0" y="228.0" font-size="12" fill="#1E2B3A" text-anchor="middle">T<tspan dy="3.8" font-size="8.6">s</tspan><tspan dy="-3.8"> </tspan> = 93°C</text>
<line x1="210" y1="120" x2="210" y2="300" stroke="#55667D" stroke-width="1" marker-end="url(#a-dim)" marker-start="url(#a-dim)"/><line x1="205" y1="120" x2="215" y2="120" stroke="#55667D" stroke-width="1"/><line x1="205" y1="300" x2="215" y2="300" stroke="#55667D" stroke-width="1"/><text x="203" y="214.0" font-size="12" fill="#55667D" text-anchor="end">H = 5 cm</text>
<line x1="230" y1="322" x2="320" y2="322" stroke="#55667D" stroke-width="1" marker-end="url(#a-dim)" marker-start="url(#a-dim)"/><line x1="230" y1="317" x2="230" y2="327" stroke="#55667D" stroke-width="1"/><line x1="320" y1="317" x2="320" y2="327" stroke="#55667D" stroke-width="1"/><text x="275.0" y="338" font-size="12" fill="#55667D" text-anchor="middle">2.5 cm</text>
<line x1="334" y1="304" x2="384" y2="268" stroke="#55667D" stroke-width="1" marker-end="url(#a-dim)" marker-start="url(#a-dim)"/>
<text x="388" y="282" font-size="12" fill="#55667D">2.5 cm</text>
<line x1="80" y1="280" x2="80" y2="150" stroke="#0B7C8C" stroke-width="1.4" marker-end="url(#a-cold)"/>
<line x1="100" y1="280" x2="100" y2="150" stroke="#0B7C8C" stroke-width="1.4" marker-end="url(#a-cold)"/>
<path d="M300.0,98.0 C292.0,62.0 308.0,52.0 300.0,22.0" stroke="#D2552B" stroke-width="1.8" fill="none" marker-end="url(#a-hot)"/>
<text x="400" y="40" font-size="12" fill="#D2552B" font-weight="bold">Top: hot face up</text>
<text x="400" y="56" font-size="11" fill="#55667D">(heated plate facing up), L = A/P</text>
<text x="400" y="150" font-size="12" fill="#D2552B" font-weight="bold">4 vertical sides</text>
<text x="400" y="166" font-size="11" fill="#55667D">vertical plates, L = 5 cm</text>
<line x1="376" y1="160" x2="396" y2="160" stroke="#9AA8B8" stroke-width="0.8"/>
<text x="400" y="300" font-size="12" fill="#D2552B" font-weight="bold">Bottom: hot face down</text>
<text x="400" y="316" font-size="11" fill="#55667D">(weaker flow), L = A/P</text>
<line x1="320" y1="300" x2="396" y2="304" stroke="#9AA8B8" stroke-width="0.8"/>
<text x="30" y="30" font-size="13" fill="#0B7C8C" font-weight="bold">Room air, 1 bar, T<tspan dy="4.2" font-size="9.4">∞</tspan><tspan dy="-4.2"> </tspan> = 20°C</text>
</svg>
