<text x="370" y="194" font-size="12" fill="#D2552B">common edge</text>
<text x="360" y="60" font-size="12" fill="#55667D">Vertical surface: A₁ (top) above A₂</text>
<text x="340" y="280" font-size="12" fill="#55667D">Perpendicular surface: A₃ next to</text>
