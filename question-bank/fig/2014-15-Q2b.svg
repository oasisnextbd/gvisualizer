<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="Helvetica, Arial, sans-serif">
<title>Aluminium sphere with cast insulation shell: geometry and series circuit</title>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="a-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="a-cold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="a-vap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><pattern id="ins" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="metal" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA8B8" stroke-width="0.8"/></pattern></defs>
<rect width="680" height="330" fill="#FFFFFF"/>
<circle cx="170" cy="165" r="135.0" fill="url(#ins)" stroke="#C98A00" stroke-width="1.6"/>
<circle cx="170" cy="165" r="81.0" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.6"/>
<circle cx="170" cy="165" r="67.5" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.6"/>
<path d="M156,165 l5,-8 l5,16 l5,-16 l5,16 l5,-8" stroke="#D2552B" stroke-width="1.8" fill="none"/>
<text x="170" y="189" font-size="11" fill="#D2552B" text-anchor="middle" font-weight="bold">heater 80 W</text>
<text x="170" y="125" font-size="10" fill="#D2552B" text-anchor="middle">T₁ = 250°C</text>
<line x1="170" y1="165" x2="141.9100885330679" y2="103.62242368926648" stroke="#1E2B3A" stroke-width="1" marker-end="url(#a-ink)"/>
<line x1="170" y1="165" x2="247.3822556191741" y2="141.0628632604315" stroke="#1E2B3A" stroke-width="1" marker-end="url(#a-ink)"/>
<line x1="170" y1="165" x2="273.25369528340593" y2="251.9693877770883" stroke="#1E2B3A" stroke-width="1" marker-end="url(#a-ink)"/>
<text x="100" y="89" font-size="11" fill="#1E2B3A" text-anchor="end">r₁ = 0.15 m</text>
<text x="254" y="137" font-size="11" fill="#1E2B3A">r₂ = 0.18 m</text>
<text x="278" y="269" font-size="11" fill="#1E2B3A">r₃ = 0.30 m</text>
<text x="170" y="18" font-size="12" fill="#0B7C8C" text-anchor="middle" font-weight="bold">air T<tspan dy="3.8" font-size="8.6">∞</tspan><tspan dy="-3.8"> </tspan> = 20°C, h = 30 W/m²K</text>
<text x="14" y="320" font-size="11" fill="#C98A00" font-weight="bold">insulation shell 0.12 m thick, k = ?</text>
<text x="170" y="229" font-size="10" fill="#55667D" text-anchor="middle">Al, k = 230</text>
<circle cx="360" cy="180" r="3.5" fill="#1E2B3A"/><text x="360" y="168" font-size="12" fill="#1E2B3A" text-anchor="middle">T₁ = 250°C</text>
<path d="M360,180 L383.0,180 L386.7,173 L394.0,187 L401.3,173 L408.7,187 L416.0,173 L423.3,187 L427.0,180 L450,180" stroke="#1E2B3A" stroke-width="1.6" fill="none"/><text x="405.0" y="204" font-size="11" fill="#55667D" text-anchor="middle">R<tspan dy="3.5" font-size="7.9">Al</tspan><tspan dy="-3.5"> </tspan></text>
<circle cx="450" cy="180" r="3.5" fill="#1E2B3A"/>
<path d="M450,180 L480.5,180 L484.2,173 L491.5,187 L498.8,173 L506.2,187 L513.5,173 L520.8,187 L524.5,180 L555,180" stroke="#1E2B3A" stroke-width="1.6" fill="none"/><text x="502.5" y="204" font-size="11" fill="#55667D" text-anchor="middle">R<tspan dy="3.5" font-size="7.9">ins</tspan><tspan dy="-3.5"> </tspan> (unknown k)</text>
<circle cx="555" cy="180" r="3.5" fill="#1E2B3A"/>
<path d="M555,180 L578.0,180 L581.7,173 L589.0,187 L596.3,173 L603.7,187 L611.0,173 L618.3,187 L622.0,180 L645,180" stroke="#1E2B3A" stroke-width="1.6" fill="none"/><text x="600.0" y="204" font-size="11" fill="#55667D" text-anchor="middle">1/(h 4πr₃²)</text>
<circle cx="645" cy="180" r="3.5" fill="#1E2B3A"/><text x="645" y="168" font-size="12" fill="#1E2B3A" text-anchor="middle">T<tspan dy="3.8" font-size="8.6">∞</tspan><tspan dy="-3.8"> </tspan></text>
<line x1="370" y1="140" x2="440" y2="140" stroke="#D2552B" stroke-width="2" marker-end="url(#a-hot)"/>
<text x="446" y="144" font-size="12" fill="#D2552B">q = 80 W</text>
<text x="340" y="260" font-size="11" fill="#55667D">R<tspan dy="3.5" font-size="7.9">tot</tspan><tspan dy="-3.5"> </tspan> = (T₁ − T<tspan dy="3.5" font-size="7.9">∞</tspan><tspan dy="-3.5"> </tspan>)/q = 2.875 K/W;  R<tspan dy="3.5" font-size="7.9">sph</tspan><tspan dy="-3.5"> </tspan> = (1/r<tspan dy="3.5" font-size="7.9">a</tspan><tspan dy="-3.5"> </tspan> − 1/r<tspan dy="3.5" font-size="7.9">b</tspan><tspan dy="-3.5"> </tspan>)/(4πk)</text>
</svg>
