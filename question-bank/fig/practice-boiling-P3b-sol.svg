<text x="295.357" y="248" font-size="11.5" fill="#D2552B">heating</text>
<text x="373" y="24" font-size="13" text-anchor="middle" font-weight="bold" fill="#1E2B3A">Heat-flux-controlled heater (electric wire): q″ is set, T<tspan dy="3.9" font-size="9.4">s</tspan><tspan dy="-3.9">​</tspan> follows</text>
