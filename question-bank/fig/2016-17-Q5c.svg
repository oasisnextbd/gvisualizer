<path d="M420,345 L424,345 L429.2,339 L439.5,351 L449.8,339 L460.2,351 L470.5,339 L480.8,351 L486,345 L490,345" fill="none" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="455" y="371" text-anchor="middle" font-size="12">1/(h<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan>A)</text>
<text x="455" y="387" text-anchor="middle" fill="#55667D" font-size="11">0.0208 °C/W</text>
