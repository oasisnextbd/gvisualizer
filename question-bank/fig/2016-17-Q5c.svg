<text x="110" y="140" text-anchor="middle" font-weight="bold" fill="#D2552B">Room</text>
<text x="110" y="158" text-anchor="middle" fill="#D2552B" font-size="12">T<tspan dy="4" font-size="75%">∞1</tspan><tspan dy="-4">​</tspan> = 20°C</text>
<text x="110" y="174" text-anchor="middle" fill="#D2552B" font-size="12">h<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">​</tspan> = 10 W/m²·°C</text>
<text x="560" y="90" text-anchor="middle" font-weight="bold" fill="#0B7C8C">Outdoors</text>
<text x="560" y="108" text-anchor="middle" fill="#0B7C8C" font-size="12">T<tspan dy="4" font-size="75%">∞2</tspan><tspan dy="-4">​</tspan> = −10°C</text>
<text x="560" y="124" text-anchor="middle" fill="#0B7C8C" font-size="12">h<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan> = 40 W/m²·°C</text>
<text x="320" y="40" text-anchor="middle" font-weight="bold" font-size="12">Glass, k = 0.78 W/m·°C</text>
<text x="320" y="300" text-anchor="middle" fill="#55667D" font-size="11.5">A = 0.8 m × 1.5 m = 1.2 m²</text>
