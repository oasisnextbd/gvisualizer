<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="Helvetica, Arial, sans-serif">
<title>Parallel-flow temperature profiles with phase change</title>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="a-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="a-cold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="a-vap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><pattern id="ins" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="metal" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA8B8" stroke-width="0.8"/></pattern></defs>
<rect width="700" height="330" fill="#FFFFFF"/>
<line x1="60" y1="270" x2="320" y2="270" stroke="#1E2B3A" stroke-width="1.5" marker-end="url(#a-ink)"/><line x1="60" y1="270" x2="60" y2="50" stroke="#1E2B3A" stroke-width="1.5" marker-end="url(#a-ink)"/><text x="320" y="290" font-size="12" fill="#1E2B3A" text-anchor="end">Length (inlet → outlet)</text><text x="52" y="54" font-size="12" fill="#1E2B3A" text-anchor="end">T</text>
<text x="190.0" y="30" font-size="14" fill="#1E2B3A" text-anchor="middle" font-weight="bold">(i) Both fluids change phase</text>
<line x1="60" y1="100" x2="300" y2="100" stroke="#D2552B" stroke-width="2.6"/>
<line x1="60" y1="200" x2="300" y2="200" stroke="#0B7C8C" stroke-width="2.6"/>
<text x="180" y="92" font-size="11" fill="#D2552B" text-anchor="middle">hot fluid condenses at T<tspan dy="3.5" font-size="7.9">sat,h</tspan><tspan dy="-3.5"> </tspan></text>
<text x="180" y="222" font-size="11" fill="#0B7C8C" text-anchor="middle">cold fluid boils at t<tspan dy="3.5" font-size="7.9">sat,c</tspan><tspan dy="-3.5"> </tspan></text>
<line x1="84" y1="104" x2="84" y2="196" stroke="#55667D" stroke-width="1" marker-end="url(#a-dim)" marker-start="url(#a-dim)"/>
<text x="90" y="154" font-size="12" fill="#55667D">ΔT<tspan dy="3.8" font-size="8.6">1</tspan><tspan dy="-3.8"> </tspan></text>
<line x1="276" y1="104" x2="276" y2="196" stroke="#55667D" stroke-width="1" marker-end="url(#a-dim)" marker-start="url(#a-dim)"/>
<text x="282" y="154" font-size="12" fill="#55667D">ΔT<tspan dy="3.8" font-size="8.6">2</tspan><tspan dy="-3.8"> </tspan></text>
<text x="180" y="154" font-size="12" fill="#1E2B3A" text-anchor="middle">ΔT<tspan dy="3.8" font-size="8.6">1</tspan><tspan dy="-3.8"> </tspan> = ΔT<tspan dy="3.8" font-size="8.6">2</tspan><tspan dy="-3.8"> </tspan> = const</text>
<text x="54" y="104" font-size="11" fill="#D2552B" text-anchor="end">T<tspan dy="3.5" font-size="7.9">1</tspan><tspan dy="-3.5"> </tspan> = T<tspan dy="3.5" font-size="7.9">2</tspan><tspan dy="-3.5"> </tspan></text>
<text x="54" y="204" font-size="11" fill="#0B7C8C" text-anchor="end">t<tspan dy="3.5" font-size="7.9">1</tspan><tspan dy="-3.5"> </tspan> = t<tspan dy="3.5" font-size="7.9">2</tspan><tspan dy="-3.5"> </tspan></text>
<line x1="130" y1="308" x2="190" y2="308" stroke="#D2552B" stroke-width="2" marker-end="url(#a-hot)"/>
<text x="126" y="312" font-size="11" fill="#D2552B" text-anchor="end">hot</text>
<line x1="230" y1="308" x2="290" y2="308" stroke="#0B7C8C" stroke-width="2" marker-end="url(#a-cold)"/>
<text x="226" y="312" font-size="11" fill="#0B7C8C" text-anchor="end">cold</text>
<line x1="410" y1="270" x2="670" y2="270" stroke="#1E2B3A" stroke-width="1.5" marker-end="url(#a-ink)"/><line x1="410" y1="270" x2="410" y2="50" stroke="#1E2B3A" stroke-width="1.5" marker-end="url(#a-ink)"/><text x="670" y="290" font-size="12" fill="#1E2B3A" text-anchor="end">Length (inlet → outlet)</text><text x="402" y="54" font-size="12" fill="#1E2B3A" text-anchor="end">T</text>
<text x="540.0" y="30" font-size="14" fill="#1E2B3A" text-anchor="middle" font-weight="bold">(ii) One fluid partially condensed</text>
<line x1="410" y1="90" x2="650" y2="90" stroke="#D2552B" stroke-width="2.6"/>
<path d="M410,90 C490,96 580,108 650,118" stroke="#D2552B" stroke-width="1.6" fill="none" stroke-dasharray="6 4"/>
<text x="414" y="80" font-size="11" fill="#D2552B">pure vapour: T<tspan dy="3.5" font-size="7.9">1</tspan><tspan dy="-3.5"> </tspan> = T<tspan dy="3.5" font-size="7.9">2</tspan><tspan dy="-3.5"> </tspan> = T<tspan dy="3.5" font-size="7.9">sat</tspan><tspan dy="-3.5"> </tspan></text>
<text x="470" y="124" font-size="10" fill="#D2552B">mixture (dashed): dew → bubble point</text>
