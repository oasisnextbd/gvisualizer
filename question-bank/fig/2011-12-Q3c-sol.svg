<text x="530" y="236" font-size="11" fill="#0B7C8C">cold fluid heated (sensible)</text>
<text x="404" y="254" font-size="12" fill="#0B7C8C" text-anchor="end">t<tspan dy="3.8" font-size="8.6">1</tspan><tspan dy="-3.8"> </tspan></text>
<text x="654" y="150" font-size="12" fill="#0B7C8C">t<tspan dy="3.8" font-size="8.6">2</tspan><tspan dy="-3.8"> </tspan></text>
<text x="404" y="94" font-size="12" fill="#D2552B" text-anchor="end">T<tspan dy="3.8" font-size="8.6">1</tspan><tspan dy="-3.8"> </tspan></text>
<line x1="422" y1="94" x2="422" y2="246" stroke="#55667D" stroke-width="1" marker-end="url(#a-dim)" marker-start="url(#a-dim)"/>
<text x="427" y="180" font-size="12" fill="#55667D">ΔT<tspan dy="3.8" font-size="8.6">1</tspan><tspan dy="-3.8"> </tspan></text>
<line x1="646" y1="94" x2="646" y2="128" stroke="#55667D" stroke-width="1" marker-end="url(#a-dim)" marker-start="url(#a-dim)"/>
<text x="652" y="108" font-size="12" fill="#55667D">ΔT<tspan dy="3.8" font-size="8.6">2</tspan><tspan dy="-3.8"> </tspan></text>
<line x1="480" y1="308" x2="540" y2="308" stroke="#D2552B" stroke-width="2" marker-end="url(#a-hot)"/>
<text x="476" y="312" font-size="11" fill="#D2552B" text-anchor="end">hot</text>
<line x1="580" y1="308" x2="640" y2="308" stroke="#0B7C8C" stroke-width="2" marker-end="url(#a-cold)"/>
<text x="576" y="312" font-size="11" fill="#0B7C8C" text-anchor="end">cold</text>
</svg>
