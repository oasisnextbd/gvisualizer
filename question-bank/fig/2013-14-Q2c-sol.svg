<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="Helvetica, Arial, sans-serif">
<title>Radiation shield between two parallel planes and its resistance network</title>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="a-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="a-cold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="a-vap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><pattern id="ins" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="metal" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA8B8" stroke-width="0.8"/></pattern></defs>
<rect width="700" height="330" fill="#FFFFFF"/>
<rect x="144" y="30" width="12" height="150" rx="0" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="150" y="200" font-size="12" fill="#D2552B" text-anchor="middle" font-weight="bold">plane 1</text>
<text x="150" y="216" font-size="12" fill="#55667D" text-anchor="middle">T₁, ε</text>
<rect x="344" y="30" width="12" height="150" rx="0" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="350" y="200" font-size="12" fill="#B7840A" text-anchor="middle" font-weight="bold">plane 3 (shield)</text>
<text x="350" y="216" font-size="12" fill="#55667D" text-anchor="middle">T₃, ε</text>
<rect x="544" y="30" width="12" height="150" rx="0" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="550" y="200" font-size="12" fill="#0B7C8C" text-anchor="middle" font-weight="bold">plane 2</text>
<text x="550" y="216" font-size="12" fill="#55667D" text-anchor="middle">T₂, ε</text>
<line x1="164" y1="100" x2="336" y2="100" stroke="#D2552B" stroke-width="2" marker-end="url(#a-hot)"/>
<text x="250.0" y="92" font-size="12" fill="#D2552B" text-anchor="middle">q/A</text>
<line x1="364" y1="100" x2="536" y2="100" stroke="#D2552B" stroke-width="2" marker-end="url(#a-hot)"/>
<text x="450.0" y="92" font-size="12" fill="#D2552B" text-anchor="middle">q/A</text>
<path d="M30,280 L58.0,280 L61.7,273 L69.0,287 L76.3,273 L83.7,287 L91.0,273 L98.3,287 L102.0,280 L130,280" stroke="#1E2B3A" stroke-width="1.6" fill="none"/><text x="80.0" y="304" font-size="11" fill="#55667D" text-anchor="middle">(1−ε)/ε</text>
<path d="M130,280 L158.0,280 L161.7,273 L169.0,287 L176.3,273 L183.7,287 L191.0,273 L198.3,287 L202.0,280 L230,280" stroke="#1E2B3A" stroke-width="1.6" fill="none"/><text x="180.0" y="304" font-size="11" fill="#55667D" text-anchor="middle">1/F₁₃ = 1</text>
<path d="M230,280 L258.0,280 L261.7,273 L269.0,287 L276.3,273 L283.7,287 L291.0,273 L298.3,287 L302.0,280 L330,280" stroke="#1E2B3A" stroke-width="1.6" fill="none"/><text x="280.0" y="304" font-size="11" fill="#55667D" text-anchor="middle">(1−ε)/ε</text>
<path d="M330,280 L358.0,280 L361.7,273 L369.0,287 L376.3,273 L383.7,287 L391.0,273 L398.3,287 L402.0,280 L430,280" stroke="#1E2B3A" stroke-width="1.6" fill="none"/><text x="380.0" y="304" font-size="11" fill="#55667D" text-anchor="middle">(1−ε)/ε</text>
<path d="M430,280 L458.0,280 L461.7,273 L469.0,287 L476.3,273 L483.7,287 L491.0,273 L498.3,287 L502.0,280 L530,280" stroke="#1E2B3A" stroke-width="1.6" fill="none"/><text x="480.0" y="304" font-size="11" fill="#55667D" text-anchor="middle">1/F₃₂ = 1</text>
<path d="M530,280 L558.0,280 L561.7,273 L569.0,287 L576.3,273 L583.7,287 L591.0,273 L598.3,287 L602.0,280 L630,280" stroke="#1E2B3A" stroke-width="1.6" fill="none"/><text x="580.0" y="304" font-size="11" fill="#55667D" text-anchor="middle">(1−ε)/ε</text>
<circle cx="30" cy="280" r="3.5" fill="#1E2B3A"/><text x="30" y="266" font-size="12" fill="#1E2B3A" text-anchor="middle">E<tspan dy="3.8" font-size="8.6">b1</tspan><tspan dy="-3.8"> </tspan></text>
<circle cx="130" cy="280" r="3.5" fill="#1E2B3A"/><text x="130" y="266" font-size="12" fill="#1E2B3A" text-anchor="middle">J₁</text>
<circle cx="230" cy="280" r="3.5" fill="#1E2B3A"/><text x="230" y="266" font-size="12" fill="#1E2B3A" text-anchor="middle">J₃</text>
<circle cx="330" cy="280" r="3.5" fill="#1E2B3A"/><text x="330" y="266" font-size="12" fill="#1E2B3A" text-anchor="middle">E<tspan dy="3.8" font-size="8.6">b3</tspan><tspan dy="-3.8"> </tspan></text>
<circle cx="430" cy="280" r="3.5" fill="#1E2B3A"/><text x="430" y="266" font-size="12" fill="#1E2B3A" text-anchor="middle">J₃′</text>
<circle cx="530" cy="280" r="3.5" fill="#1E2B3A"/><text x="530" y="266" font-size="12" fill="#1E2B3A" text-anchor="middle">J₂</text>
<circle cx="630" cy="280" r="3.5" fill="#1E2B3A"/><text x="630" y="266" font-size="12" fill="#1E2B3A" text-anchor="middle">E<tspan dy="3.8" font-size="8.6">b2</tspan><tspan dy="-3.8"> </tspan></text>
<text x="350.0" y="246" font-size="11" fill="#B7840A" text-anchor="middle">per unit area: total = 2(2/ε − 1) = twice the resistance without the shield → q halves</text>
</svg>
