<line x1="130" y1="106" x2="560" y2="106" stroke="#1E2B3A" stroke-width="1.4"/>
<line x1="40" y1="78" x2="170" y2="78" stroke="#0B7C8C" stroke-width="2.4" marker-end="url(#a-cold)"/>
<line x1="520" y1="78" x2="650" y2="78" stroke="#0B7C8C" stroke-width="2.4" marker-end="url(#a-cold)"/>
<text x="38" y="66" font-size="12" fill="#0B7C8C" font-weight="bold">Water, 0.181 kg/s</text>
<text x="38" y="100" font-size="11" fill="#0B7C8C">T<tspan dy="3.5" font-size="7.9">m,i</tspan><tspan dy="-3.5"> </tspan> = 15°C</text>
<text x="564" y="66" font-size="12" fill="#0B7C8C" font-weight="bold">out</text>
<text x="564" y="100" font-size="11" fill="#0B7C8C">T<tspan dy="3.5" font-size="7.9">m,o</tspan><tspan dy="-3.5"> </tspan> = 60°C</text>
<text x="345.0" y="36" font-size="12" fill="#D2552B" text-anchor="middle" font-weight="bold">wall held at T<tspan dy="3.8" font-size="8.6">s</tspan><tspan dy="-3.8"> </tspan> = 121°C</text>
<line x1="200" y1="50" x2="200" y2="106" stroke="#55667D" stroke-width="1" marker-end="url(#a-dim)" marker-start="url(#a-dim)"/><line x1="195" y1="50" x2="205" y2="50" stroke="#55667D" stroke-width="1"/><line x1="195" y1="106" x2="205" y2="106" stroke="#55667D" stroke-width="1"/><text x="207" y="82.0" font-size="12" fill="#55667D">D = 1.91 cm</text>
<line x1="130" y1="136" x2="560" y2="136" stroke="#55667D" stroke-width="1" marker-end="url(#a-dim)" marker-start="url(#a-dim)"/><line x1="130" y1="131" x2="130" y2="141" stroke="#55667D" stroke-width="1"/><line x1="560" y1="131" x2="560" y2="141" stroke="#55667D" stroke-width="1"/><text x="345.0" y="152" font-size="12" fill="#55667D" text-anchor="middle">L = ? (answer ≈ 2.0 m)</text>
