<line x1="570.0" y1="145.0" x2="600.0" y2="145.0" stroke="#1E2B3A" stroke-width="1.4"/>
<circle cx="600.0" cy="145.0" r="3.2" fill="white" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="600.0" y="136.0" font-size="12" text-anchor="middle" fill="#1E2B3A" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">T<tspan dy="3.6" font-size="8.6">∞</tspan><tspan dy="-3.6"> </tspan> = T<tspan dy="3.6" font-size="8.6">surr</tspan><tspan dy="-3.6"> </tspan></text>
<text x="465.0" y="260.0" font-size="13" text-anchor="middle" fill="#B7840A" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke" font-weight="bold">h<tspan dy="3.9" font-size="9.4">combined</tspan><tspan dy="-3.9"> </tspan> = h<tspan dy="3.9" font-size="9.4">conv</tspan><tspan dy="-3.9"> </tspan> + h<tspan dy="3.9" font-size="9.4">rad</tspan><tspan dy="-3.9"> </tspan></text>
<text x="465.0" y="280.0" font-size="12" text-anchor="middle" fill="#55667D" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">h<tspan dy="3.6" font-size="8.6">rad</tspan><tspan dy="-3.6"> </tspan> = εσ(T<tspan dy="3.6" font-size="8.6">s</tspan><tspan dy="-3.6"> </tspan>² + T<tspan dy="3.6" font-size="8.6">surr</tspan><tspan dy="-3.6"> </tspan>²)(T<tspan dy="3.6" font-size="8.6">s</tspan><tspan dy="-3.6"> </tspan> + T<tspan dy="3.6" font-size="8.6">surr</tspan><tspan dy="-3.6"> </tspan>)</text>
</svg>
