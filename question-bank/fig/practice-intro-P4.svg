<path d="M410.0,105.0 L414.6,99.0 L423.8,111.0 L432.9,99.0 L442.1,111.0 L451.2,99.0 L460.4,111.0 L469.6,99.0 L478.8,111.0 L487.9,99.0 L497.1,111.0 L506.2,99.0 L515.4,111.0 L520.0,105.0" stroke="#D2552B" stroke-width="1.6" fill="none"/>
