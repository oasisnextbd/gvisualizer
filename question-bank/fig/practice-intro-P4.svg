<text x="165.0" y="166.0" font-size="12" text-anchor="middle" fill="#D2552B" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">radiation to walls</text>
<text x="165.0" y="236.0" font-size="11.5" text-anchor="middle" fill="#55667D" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">T<tspan dy="3.4" font-size="8.3">surr</tspan><tspan dy="-3.4"> </tspan> = 25°C</text>
