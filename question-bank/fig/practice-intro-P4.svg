<line x1="330.0" y1="145.0" x2="360.0" y2="145.0" stroke="#1E2B3A" stroke-width="1.4"/>
<line x1="360.0" y1="105.0" x2="360.0" y2="185.0" stroke="#1E2B3A" stroke-width="1.4"/>
<line x1="570.0" y1="105.0" x2="570.0" y2="185.0" stroke="#1E2B3A" stroke-width="1.4"/>
