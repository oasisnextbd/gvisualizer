<text x="160.0" y="46.0" font-size="12" text-anchor="middle" fill="#0B7C8C" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">convection to air</text>
<text x="160.0" y="130.0" font-size="11.5" text-anchor="middle" fill="#55667D" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">T<tspan dy="3.4" font-size="8.3">∞</tspan><tspan dy="-3.4"> </tspan> = 25°C, h<tspan dy="3.4" font-size="8.3">conv</tspan><tspan dy="-3.4"> </tspan> = 8</text>
