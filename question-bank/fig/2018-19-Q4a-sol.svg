<rect x="150" y="345" width="340" height="24" fill="#F4F6F9" stroke="#9AA8B8" stroke-width="1" rx="4"/>
<text x="320" y="362" text-anchor="middle" font-size="11.5">LMTD = (200 − 25)/ln(200/25) = 84.2°F, same for parallel flow</text>
</svg>
