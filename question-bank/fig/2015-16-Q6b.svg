<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2B3A">
<title>Insulated cast-iron steam pipe with its resistance network</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1E2B3A"/></marker>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#D2552B"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#0B7C8C"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#55667D"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#B7840A"/></marker>
<pattern id="ins" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern>
<pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#FBE2D6"/><path d="M0,0.5 H24 M0,6.5 H24 M12,0.5 V6.5 M0.5,6.5 V12 M24,6.5 V12" stroke="#D2552B" stroke-width="0.8" fill="none" opacity="0.7"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#FFF3D6"/><circle cx="2" cy="2" r="0.9" fill="#C98A00"/><circle cx="5.5" cy="5.5" r="0.9" fill="#C98A00"/></pattern>
<pattern id="dense" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#E9D3A6"/><circle cx="1" cy="1" r="0.8" fill="#8A6200"/><circle cx="3" cy="3" r="0.8" fill="#8A6200"/></pattern>
</defs>
<rect width="700" height="470" fill="#FFFFFF"/>
<circle cx="165" cy="165" r="136" fill="#D9F0F2" opacity="0.55"/>
<circle cx="165" cy="165" r="110" fill="url(#ins)" stroke="#1E2B3A" stroke-width="1.3"/>
<circle cx="165" cy="165" r="56" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.3"/>
<circle cx="165" cy="165" r="48" fill="#FBE2D6" stroke="#1E2B3A" stroke-width="1.3"/>
<text x="165" y="181" text-anchor="middle" font-size="10.5">Steam</text>
<text x="165" y="193" text-anchor="middle" font-size="10.5">320°C</text>
<text x="165" y="205" text-anchor="middle" font-size="10.5">h<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4"> = 60</tspan></text>
<line x1="165" y1="165" x2="142.5" y2="122.6" stroke="#1E2B3A" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="142.5" y1="122.6" x2="94.6" y2="32.6" stroke="#9AA8B8" stroke-width="0.9" stroke-dasharray="3 2"/>
<text x="90.6" y="28.6" text-anchor="end" font-size="12">r<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4"> = 2.5 cm</tspan></text>
<line x1="165" y1="165" x2="191.3" y2="115.6" stroke="#1E2B3A" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="191.3" y1="115.6" x2="235.4" y2="32.6" stroke="#9AA8B8" stroke-width="0.9" stroke-dasharray="3 2"/>
<text x="239.4" y="28.6" font-size="12">r<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4"> = 2.75 cm</tspan></text>
<line x1="165" y1="165" x2="267" y2="123.8" stroke="#1E2B3A" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="267" y1="123.8" x2="304.1" y2="108.8" stroke="#9AA8B8" stroke-width="0.9" stroke-dasharray="3 2"/>
<text x="308.1" y="112.8" font-size="12">r<tspan dy="4" font-size="75%">3</tspan><tspan dy="-4"> = 5.75 cm</tspan></text>
<circle cx="165" cy="165" r="2" fill="#1E2B3A"/>
<text x="35" y="305" fill="#0B7C8C" font-size="12">Surroundings 5°C</text>
<text x="35" y="320" fill="#0B7C8C" font-size="12">h<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4"> = 18 W/m²·°C (conv. + rad.)</tspan></text>
<rect x="410" y="48" width="22" height="16" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1"/>
<text x="440" y="60" font-size="12.5">Cast-iron pipe</text>
<text x="440" y="75" fill="#55667D" font-size="12">k = 80 W/m·°C, D = 5 / 5.5 cm</text>
<rect x="410" y="94" width="22" height="16" fill="url(#ins)" stroke="#1E2B3A" stroke-width="1"/>
<text x="440" y="106" font-size="12.5">Glass wool, 3 cm thick</text>
<text x="440" y="121" fill="#55667D" font-size="12">k = 0.05 W/m·°C</text>
<rect x="410" y="140" width="22" height="16" fill="#FBE2D6" stroke="#1E2B3A" stroke-width="1"/>
<text x="440" y="152" font-size="12.5">Steam inside</text>
<text x="440" y="167" fill="#55667D" font-size="12">h<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4"> = 60 W/m²·°C</tspan></text>
<circle cx="150" cy="370" r="3.2" fill="#1E2B3A"/>
<text x="150" y="361" text-anchor="middle" font-size="12">T<tspan dy="4" font-size="75%">∞1</tspan><tspan dy="-4">​</tspan></text>
<line x1="150" y1="370" x2="172" y2="370" stroke="#1E2B3A" stroke-width="1.6"/>
<path d="M172,370 L176,370 L180,364 L188,376 L196,364 L204,376 L212,364 L220,376 L224,370 L228,370" fill="none" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="200" y="396" text-anchor="middle" font-size="12">R<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan></text>
<text x="200" y="412" text-anchor="middle" fill="#55667D" font-size="11">0.1061</text>
<line x1="228" y1="370" x2="250" y2="370" stroke="#1E2B3A" stroke-width="1.6"/>
<circle cx="250" cy="370" r="3.2" fill="#1E2B3A"/>
<text x="250" y="361" text-anchor="middle" font-size="12">T<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">​</tspan></text>
<line x1="250" y1="370" x2="272" y2="370" stroke="#1E2B3A" stroke-width="1.6"/>
<path d="M272,370 L276,370 L280,364 L288,376 L296,364 L304,376 L312,364 L320,376 L324,370 L328,370" fill="none" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="300" y="396" text-anchor="middle" font-size="12">R<tspan dy="4" font-size="75%">pipe</tspan><tspan dy="-4">​</tspan></text>
<text x="300" y="412" text-anchor="middle" fill="#55667D" font-size="11">0.00019</text>
<line x1="328" y1="370" x2="350" y2="370" stroke="#1E2B3A" stroke-width="1.6"/>
<circle cx="350" cy="370" r="3.2" fill="#1E2B3A"/>
<text x="350" y="361" text-anchor="middle" font-size="12">T<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan></text>
<line x1="350" y1="370" x2="372" y2="370" stroke="#1E2B3A" stroke-width="1.6"/>
<path d="M372,370 L376,370 L380,364 L388,376 L396,364 L404,376 L412,364 L420,376 L424,370 L428,370" fill="none" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="400" y="396" text-anchor="middle" font-size="12">R<tspan dy="4" font-size="75%">ins</tspan><tspan dy="-4">​</tspan></text>
<text x="400" y="412" text-anchor="middle" fill="#55667D" font-size="11">2.348</text>
<line x1="428" y1="370" x2="450" y2="370" stroke="#1E2B3A" stroke-width="1.6"/>
<circle cx="450" cy="370" r="3.2" fill="#1E2B3A"/>
<text x="450" y="361" text-anchor="middle" font-size="12">T<tspan dy="4" font-size="75%">3</tspan><tspan dy="-4">​</tspan></text>
<line x1="450" y1="370" x2="472" y2="370" stroke="#1E2B3A" stroke-width="1.6"/>
<path d="M472,370 L476,370 L480,364 L488,376 L496,364 L504,376 L512,364 L520,376 L524,370 L528,370" fill="none" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="500" y="396" text-anchor="middle" font-size="12">R<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan></text>
<text x="500" y="412" text-anchor="middle" fill="#55667D" font-size="11">0.1538</text>
<line x1="528" y1="370" x2="550" y2="370" stroke="#1E2B3A" stroke-width="1.6"/>
<circle cx="550" cy="370" r="3.2" fill="#1E2B3A"/>
<text x="550" y="361" text-anchor="middle" font-size="12">T<tspan dy="4" font-size="75%">∞2</tspan><tspan dy="-4">​</tspan></text>
<text x="560" y="400" fill="#55667D" font-size="11">per metre, °C/W</text>
<text x="150" y="440" fill="#55667D" font-size="11">R<tspan dy="4" font-size="75%">pipe</tspan><tspan dy="-4">​</tspan> = ln(r<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan>/r<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">​</tspan>)/(2πk<tspan dy="4" font-size="75%">p</tspan><tspan dy="-4">​</tspan>L),  R<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan> = 1/(h<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan>2πr<tspan dy="4" font-size="75%">3</tspan><tspan dy="-4">​</tspan>L)</text>
<text x="20" y="462" fill="#55667D" font-size="10">Not to scale</text>
</svg>
