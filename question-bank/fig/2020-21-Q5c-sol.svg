<line x1="201" y1="256" x2="267" y2="207" stroke="#D2552B" stroke-width="2.2" marker-end="url(#aH)"/>
<text x="197" y="268" font-size="13" text-anchor="end" fill="#D2552B">q<tspan dy="3.9" font-size="9.4">z</tspan><tspan dy="-3.9">​</tspan></text>
<line x1="406.5" y1="105" x2="453.5" y2="70" stroke="#D2552B" stroke-width="2.2" marker-end="url(#aH)"/>
<text x="457.5" y="68" font-size="13" text-anchor="start" fill="#D2552B">q<tspan dy="3.9" font-size="9.4">z+dz</tspan><tspan dy="-3.9">​</tspan></text>
