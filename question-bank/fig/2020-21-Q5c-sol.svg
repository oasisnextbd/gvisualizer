<text x="305" y="174" font-size="12" text-anchor="middle" fill="#D2552B">q̇ dx dy dz generated</text>
<text x="305" y="192" font-size="12" text-anchor="middle" fill="#55667D">ρc (∂T/∂τ) dx dy dz stored</text>
