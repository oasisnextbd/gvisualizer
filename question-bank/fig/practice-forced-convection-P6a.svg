<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" font-family="Helvetica, Arial, sans-serif"><title>Rectangular duct 1 cm by 2 cm, 2 m long, walls at 80°C, air entering at 20°C</title><defs><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><marker id="dg" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#9AA8B8"/></marker><marker id="dg0" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#9AA8B8"/></marker><pattern id="ins" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="gen" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#FBE2D6"/><circle cx="6" cy="6" r="1.3" fill="#D2552B"/></pattern><pattern id="wtr" width="16" height="8" patternUnits="userSpaceOnUse"><rect width="16" height="8" fill="#D9F0F2"/><path d="M0,4 q4,-3 8,0 t8,0" stroke="#0B7C8C" stroke-width="0.7" fill="none"/></pattern></defs><rect width="640" height="290" fill="white"/>
<path d="M120.0,110.0 L480.0,110.0 L520.0,80.0 L160.0,80.0 Z" stroke="#1E2B3A" stroke-width="1.3" fill="#DCE3EC"/>
<path d="M480.0,110.0 L520.0,80.0 L520.0,140.0 L480.0,170.0 Z" stroke="#1E2B3A" stroke-width="1.3" fill="#D9F0F2"/>
<path d="M120.0,110.0 L480.0,110.0 L480.0,170.0 L120.0,170.0 Z" stroke="#1E2B3A" stroke-width="1.3" fill="#E9EEF4"/>
<text x="300.0" y="144.0" font-size="12" text-anchor="middle" fill="#D2552B" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke" font-weight="bold">walls at 80°C</text>
<line x1="30.0" y1="140.0" x2="114.0" y2="140.0" stroke="#0B7C8C" stroke-width="2" marker-end="url(#ac)"/>
<text x="30.0" y="130.0" font-size="11.5" text-anchor="start" fill="#0B7C8C" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke" font-weight="bold">air 20°C, 2 m/s</text>
<line x1="526.0" y1="140.0" x2="590.0" y2="140.0" stroke="#0B7C8C" stroke-width="2" marker-end="url(#ac)"/>
<text x="590.0" y="130.0" font-size="11.5" text-anchor="end" fill="#0B7C8C" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke" font-weight="bold">T<tspan dy="3.4" font-size="8.3">e</tspan><tspan dy="-3.4"> </tspan> = ?</text>
<line x1="120.0" y1="186.0" x2="480.0" y2="186.0" stroke="#9AA8B8" stroke-width="1" marker-end="url(#dg)" marker-start="url(#dg0)"/>
<text x="300.0" y="201.0" font-size="12" text-anchor="middle" fill="#55667D" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">L = 2 m</text>
<rect x="120.0" y="233.0" width="48.0" height="24.0" fill="#D9F0F2" stroke="#1E2B3A" stroke-width="2"/>
<text x="144.0" y="275.0" font-size="11" text-anchor="middle" fill="#55667D" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">a = 2 cm</text>
<text x="176.0" y="249.0" font-size="11" text-anchor="start" fill="#55667D" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">b = 1 cm</text>
<text x="260.0" y="240.0" font-size="12.5" text-anchor="start" fill="#B7840A" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke" font-weight="bold">D<tspan dy="3.8" font-size="9.0">h</tspan><tspan dy="-3.8"> </tspan> = 4A/P = 4ab/(2(a + b)) = 1.333 cm</text>
<text x="260.0" y="260.0" font-size="11.5" text-anchor="start" fill="#55667D" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">cross-section (wetted perimeter = whole boundary)</text>
</svg>
