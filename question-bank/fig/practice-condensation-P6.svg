<text x="385.5" y="118" font-size="12.5" fill="#1E2B3A">Steam at 50 kPa, T<tspan dy="3.8" font-size="9.0">sat</tspan><tspan dy="-3.8">​</tspan> = 81.3°C</text>
<text x="385.5" y="137" font-size="12.5" fill="#1E2B3A">Tube walls T<tspan dy="3.8" font-size="9.0">s</tspan><tspan dy="-3.8">​</tspan> = 65°C</text>
<text x="385.5" y="156" font-size="12.5" fill="#1E2B3A"></text>
<text x="385.5" y="175" font-size="12.5" fill="#1E2B3A">Top tube: h̄<tspan dy="3.8" font-size="9.0">1</tspan><tspan dy="-3.8">​</tspan>;</text>
<text x="385.5" y="194" font-size="12.5" fill="#1E2B3A">bank average: h̄<tspan dy="3.8" font-size="9.0">1</tspan><tspan dy="-3.8">​</tspan> × 16<tspan dy="-4.8" font-size="9.0">−1/4</tspan><tspan dy="4.8">​</tspan></text>
