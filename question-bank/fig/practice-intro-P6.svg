<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" font-family="Helvetica, Arial, sans-serif"><title>Guarded hot-plate apparatus: heater below the sample, cold plate above, guard heater around</title><defs><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><marker id="dg" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#9AA8B8"/></marker><marker id="dg0" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#9AA8B8"/></marker><pattern id="ins" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="gen" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#FBE2D6"/><circle cx="6" cy="6" r="1.3" fill="#D2552B"/></pattern><pattern id="wtr" width="16" height="8" patternUnits="userSpaceOnUse"><rect width="16" height="8" fill="#D9F0F2"/><path d="M0,4 q4,-3 8,0 t8,0" stroke="#0B7C8C" stroke-width="0.7" fill="none"/></pattern></defs><rect width="680" height="280" fill="white"/>
<rect x="120.0" y="50.0" width="440.0" height="26.0" fill="#D9F0F2" stroke="#0B7C8C" stroke-width="1.4"/>
<text x="340.0" y="68.0" font-size="12" text-anchor="middle" fill="#0B7C8C" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">cold plate (coolant)</text>
<rect x="120.0" y="76.0" width="440.0" height="60.0" fill="#EFE6D8" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="270.0" y="102.0" font-size="13" text-anchor="middle" fill="#1E2B3A" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">fibre-board sample, 30 cm × 30 cm</text>
<text x="270.0" y="122.0" font-size="12" text-anchor="middle" fill="#55667D" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">k = ?</text>
<rect x="120.0" y="136.0" width="110.0" height="22.0" fill="#FBE2D6" stroke="#D2552B" stroke-width="1.2"/>
<rect x="450.0" y="136.0" width="110.0" height="22.0" fill="#FBE2D6" stroke="#D2552B" stroke-width="1.2"/>
<rect x="230.0" y="136.0" width="220.0" height="22.0" fill="#D2552B" stroke="#D2552B" stroke-width="1.2"/>
<text x="340.0" y="152.0" font-size="12" text-anchor="middle" fill="white" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke" font-weight="bold">main heater, 9 W</text>
<text x="175.0" y="152.0" font-size="11" text-anchor="middle" fill="#D2552B" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">guard heater</text>
<text x="505.0" y="152.0" font-size="11" text-anchor="middle" fill="#D2552B" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">guard heater</text>
<rect x="120.0" y="158.0" width="440.0" height="34.0" fill="url(#ins)" stroke="#1E2B3A" stroke-width="1.2"/>
<text x="340.0" y="180.0" font-size="11.5" text-anchor="middle" fill="#C98A00" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">insulation (no back loss)</text>
<line x1="574.0" y1="76.0" x2="574.0" y2="136.0" stroke="#9AA8B8" stroke-width="1" marker-end="url(#dg)" marker-start="url(#dg0)"/>
<text x="580.0" y="110.0" font-size="12" text-anchor="start" fill="#55667D" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">L = 2.5 cm</text>
<circle cx="132.0" cy="136.0" r="4.0" fill="#1E2B3A" stroke="#1E2B3A" stroke-width="1.5"/>
<text x="112.0" y="140.0" font-size="12" text-anchor="end" fill="#D2552B" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">T<tspan dy="3.6" font-size="8.6">1</tspan><tspan dy="-3.6"> </tspan> = 38°C</text>
<circle cx="132.0" cy="76.0" r="4.0" fill="#1E2B3A" stroke="#1E2B3A" stroke-width="1.5"/>
<text x="112.0" y="80.0" font-size="12" text-anchor="end" fill="#0B7C8C" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">T<tspan dy="3.6" font-size="8.6">2</tspan><tspan dy="-3.6"> </tspan> = 22°C</text>
<line x1="460.0" y1="132.0" x2="460.0" y2="82.0" stroke="#D2552B" stroke-width="2" marker-end="url(#ah)"/>
<line x1="500.0" y1="132.0" x2="500.0" y2="82.0" stroke="#D2552B" stroke-width="2" marker-end="url(#ah)"/>
<line x1="540.0" y1="132.0" x2="540.0" y2="82.0" stroke="#D2552B" stroke-width="2" marker-end="url(#ah)"/>
<text x="448.0" y="112.0" font-size="13" text-anchor="end" fill="#D2552B" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke" font-weight="bold">Q̇ = 9 W</text>
<text x="320.0" y="230.0" font-size="12" text-anchor="middle" fill="#55667D" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Guard at the same temperature as the main heater: no side or back loss,</text>
<text x="320.0" y="248.0" font-size="12" text-anchor="middle" fill="#55667D" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">so all 9 W flows 1-D through the sample:  k = Q̇L / (A ΔT)</text>
</svg>
