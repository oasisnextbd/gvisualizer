<text x="625" y="284" font-size="11" text-anchor="middle" fill="#55667D">between D<tspan dy="3.3" font-size="7.9">1</tspan><tspan dy="-3.3">​</tspan> and D<tspan dy="3.3" font-size="7.9">2</tspan><tspan dy="-3.3">​</tspan></text>
<text x="625" y="298" font-size="11" text-anchor="middle" fill="#55667D">D<tspan dy="3.3" font-size="7.9">e</tspan><tspan dy="-3.3">​</tspan> = (D<tspan dy="3.3" font-size="7.9">2</tspan><tspan dy="-3.3">​</tspan>² − D<tspan dy="3.3" font-size="7.9">1</tspan><tspan dy="-3.3">​</tspan>²)/D<tspan dy="3.3" font-size="7.9">1</tspan><tspan dy="-3.3">​</tspan></text>
