<text x="333" y="54" font-size="13" text-anchor="start" fill="#1E2B3A">PCB, T<tspan dy="3.9" font-size="9.4">s</tspan><tspan dy="-3.9">​</tspan> = 80°C</text>
<text x="333" y="70" font-size="13" text-anchor="start" fill="#1E2B3A">100 chips × 0.05 W</text>
<text x="333" y="88" font-size="12" text-anchor="start" fill="#55667D">(back face insulated)</text>
<text x="333" y="106" font-size="12" text-anchor="start" fill="#55667D">width 20 cm (into page)</text>
