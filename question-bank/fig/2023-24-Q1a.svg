<text x="189" y="174" font-size="13" text-anchor="end" fill="#55667D">L = 12 cm</text>
<text x="300" y="235" font-size="13" text-anchor="start" fill="#1E2B3A">Air</text>
<text x="300" y="253" font-size="13" text-anchor="start" fill="#1E2B3A">T<tspan dy="3.9" font-size="9.4">∞</tspan><tspan dy="-3.9">​</tspan> = 35°C</text>
<text x="300" y="271" font-size="13" text-anchor="start" fill="#1E2B3A">V = 0.85 m/s</text>
