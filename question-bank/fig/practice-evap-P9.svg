<text x="168" y="110" font-size="10.5" text-anchor="middle" fill="#1E2B3A">U<tspan dy="3.1" font-size="7.6">D</tspan><tspan dy="-3.1">​</tspan> = 450</text>
<line x1="20" y1="160" x2="123" y2="160" stroke="#D2552B" stroke-width="2.2" marker-end="url(#ah-hot)"/>
