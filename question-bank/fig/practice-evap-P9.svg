<text x="133" y="298" font-size="10.5" text-anchor="middle" fill="#D2552B">W<tspan dy="3.1" font-size="7.6">s</tspan><tspan dy="-3.1">​</tspan></text>
<text x="360" y="333" font-size="11.5" text-anchor="middle" fill="#55667D">Feed 8% solids at 80°F; condenser water 80 → 145°F</text>
