<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" font-family="Helvetica, Arial, sans-serif">
<title>Pan bottom: 4 mm aluminium versus Al/Cu/Al sandwich</title>
<defs><marker id="aI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="aIs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1E2B3A"/></marker><marker id="aH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="aHs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#D2552B"/></marker><marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="aCs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0B7C8C"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><marker id="aGs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9AA8B8"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="aAs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#B7840A"/></marker><marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="aSs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#55667D"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="mhatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA8B8" stroke-width="0.9"/></pattern></defs>
<rect width="640" height="270" fill="#FFFFFF"/>
<text x="150" y="36" font-size="13" text-anchor="middle" fill="#1E2B3A" font-weight="bold">(a) Original</text>
<line x1="150" y1="62" x2="150" y2="60" stroke="#D2552B" stroke-width="0.1" marker-end="url(#aH)"/>
<rect x="60" y="60" width="180" height="56" fill="#E1E6EC" stroke="#1E2B3A" stroke-width="1.3"/>
<text x="150" y="92" font-size="12" text-anchor="middle" fill="#1E2B3A">Al 4 mm</text>
<line x1="90" y1="156" x2="90" y2="122" stroke="#D2552B" stroke-width="1.8" marker-end="url(#aH)"/>
<line x1="130" y1="156" x2="130" y2="122" stroke="#D2552B" stroke-width="1.8" marker-end="url(#aH)"/>
<line x1="170" y1="156" x2="170" y2="122" stroke="#D2552B" stroke-width="1.8" marker-end="url(#aH)"/>
<line x1="210" y1="156" x2="210" y2="122" stroke="#D2552B" stroke-width="1.8" marker-end="url(#aH)"/>
<text x="150" y="172" font-size="11" text-anchor="middle" fill="#D2552B">heat from the burner</text>
<text x="150" y="194" font-size="12" text-anchor="middle" fill="#B7840A" font-weight="bold">R″ = 1.69×10<tspan dy="-4.6" font-size="8.6">−5</tspan><tspan dy="4.6">​</tspan> m²K/W</text>
<text x="480" y="36" font-size="13" text-anchor="middle" fill="#1E2B3A" font-weight="bold">(b) Proposed</text>
<line x1="480" y1="62" x2="480" y2="60" stroke="#D2552B" stroke-width="0.1" marker-end="url(#aH)"/>
<rect x="390" y="60" width="180" height="28" fill="#E1E6EC" stroke="#1E2B3A" stroke-width="1.3"/>
<text x="480" y="78" font-size="12" text-anchor="middle" fill="#1E2B3A">Al 2 mm</text>
<rect x="390" y="88" width="180" height="42" fill="#F0C9A8" stroke="#1E2B3A" stroke-width="1.3"/>
<text x="480" y="113" font-size="12" text-anchor="middle" fill="#1E2B3A">Cu 3 mm</text>
<rect x="390" y="130" width="180" height="28" fill="#E1E6EC" stroke="#1E2B3A" stroke-width="1.3"/>
<text x="480" y="148" font-size="12" text-anchor="middle" fill="#1E2B3A">Al 2 mm</text>
<line x1="420" y1="198" x2="420" y2="164" stroke="#D2552B" stroke-width="1.8" marker-end="url(#aH)"/>
<line x1="460" y1="198" x2="460" y2="164" stroke="#D2552B" stroke-width="1.8" marker-end="url(#aH)"/>
<line x1="500" y1="198" x2="500" y2="164" stroke="#D2552B" stroke-width="1.8" marker-end="url(#aH)"/>
<line x1="540" y1="198" x2="540" y2="164" stroke="#D2552B" stroke-width="1.8" marker-end="url(#aH)"/>
<text x="480" y="214" font-size="11" text-anchor="middle" fill="#D2552B">heat from the burner</text>
<text x="480" y="236" font-size="12" text-anchor="middle" fill="#B7840A" font-weight="bold">R″ = 2.44×10<tspan dy="-4.6" font-size="8.6">−5</tspan><tspan dy="4.6">​</tspan> m²K/W (+44%)</text>
<text x="320" y="262" font-size="12" text-anchor="middle" fill="#55667D">Layers in series add resistance: the copper is added, not substituted</text>
</svg>
