</defs>
<rect width="600" height="380" fill="#FFFFFF"/>
<line x1="70" y1="290" x2="540" y2="290" stroke="#1E2B3A" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<line x1="70" y1="290" x2="70" y2="70" stroke="#1E2B3A" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<text x="520" y="310" font-size="12" text-anchor="middle" fill="#1E2B3A">1</text>
<text x="70" y="310" font-size="12" text-anchor="middle" fill="#1E2B3A">0</text>
<text x="295" y="328" font-size="13" text-anchor="middle" font-style="italic" fill="#1E2B3A">y/δ</text>
<text x="62" y="94" font-size="12" text-anchor="end" fill="#1E2B3A">1</text>
