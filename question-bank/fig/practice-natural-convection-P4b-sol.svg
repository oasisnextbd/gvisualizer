<circle cx="220" cy="90" r="4" fill="#B7840A" stroke="#B7840A" stroke-width="1.5"/>
<text x="220" y="310" font-size="12" text-anchor="middle" fill="#B7840A">1/3</text>
<text x="230" y="78" font-size="12" fill="#B7840A">u<tspan dy="3.6" font-size="8.6">max</tspan><tspan dy="-3.6">​</tspan> at y = δ/3, where η(1 − η)² = 4/27</text>
<line x1="90" y1="345" x2="120" y2="345" stroke="#D2552B" stroke-width="2.6"/>
<text x="128" y="349" font-size="12" fill="#1E2B3A">θ = (T − T<tspan dy="3.6" font-size="8.6">∞</tspan><tspan dy="-3.6">​</tspan>)/(T<tspan dy="3.6" font-size="8.6">w</tspan><tspan dy="-3.6">​</tspan> − T<tspan dy="3.6" font-size="8.6">∞</tspan><tspan dy="-3.6">​</tspan>) = (1 − y/δ)²  (monotone, zero slope at δ)</text>
<line x1="90" y1="367" x2="120" y2="367" stroke="#0B7C8C" stroke-width="2.6"/>
<text x="128" y="371" font-size="12" fill="#1E2B3A">u/u<tspan dy="3.6" font-size="8.6">max</tspan><tspan dy="-3.6">​</tspan> = (27/4)(y/δ)(1 − y/δ)²  (zero at the wall and at the edge)</text>
<text x="300" y="22" font-size="13" text-anchor="middle" font-weight="bold" fill="#1E2B3A">Free convection on a hot vertical plate (δ<tspan dy="3.9" font-size="9.4">t</tspan><tspan dy="-3.9">​</tspan> = δ)</text>
</svg>
