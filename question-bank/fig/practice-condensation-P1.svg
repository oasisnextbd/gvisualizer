<text x="364" y="99" font-size="12.5" fill="#1E2B3A">D = 1.27 cm</text>
<text x="364" y="118" font-size="12.5" fill="#1E2B3A">Atmospheric steam, T<tspan dy="3.8" font-size="9.0">sat</tspan><tspan dy="-3.8">​</tspan> = 100°C</text>
<text x="364" y="137" font-size="12.5" fill="#1E2B3A">Tube walls T<tspan dy="3.8" font-size="9.0">w</tspan><tspan dy="-3.8">​</tspan> = 98°C</text>
<text x="364" y="156" font-size="12.5" fill="#1E2B3A"></text>
<text x="364" y="175" font-size="12.5" fill="#1E2B3A">Condensate from upper tubes</text>
<text x="364" y="194" font-size="12.5" fill="#1E2B3A">falls onto lower ones:</text>
<text x="364" y="213" font-size="12.5" fill="#1E2B3A">h̄<tspan dy="3.8" font-size="9.0">N</tspan><tspan dy="-3.8">​</tspan> = h̄<tspan dy="3.8" font-size="9.0">1</tspan><tspan dy="-3.8">​</tspan> N<tspan dy="-4.8" font-size="9.0">−1/4</tspan><tspan dy="4.8">​</tspan>, N = 10</text>
<text x="340" y="34" font-size="11.5" fill="#55667D">steam</text>
