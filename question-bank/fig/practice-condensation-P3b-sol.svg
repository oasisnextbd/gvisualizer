<text x="286" y="208" font-size="12" fill="#55667D">Re = 1800</text>
<text x="200" y="68.8" font-size="12.5" fill="#1E2B3A">laminar (smooth)</text>
<text x="200" y="158.7" font-size="12.5" fill="#1E2B3A">wavy laminar</text>
<text x="220" y="266" font-size="12.5" fill="#1E2B3A">turbulent</text>
<line x1="100" y1="40" x2="100" y2="100" stroke="#1E2B3A" stroke-width="1.4" marker-end="url(#ah-ink)"/>
