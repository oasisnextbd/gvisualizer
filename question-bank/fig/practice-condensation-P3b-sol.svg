<text x="625" y="105.2" font-size="12" fill="#55667D">δ</text>
<text x="420" y="160" font-size="12.5" fill="#1E2B3A">A<tspan dy="3.8" font-size="9.0">c</tspan><tspan dy="-3.8">​</tspan> = pδ,  D<tspan dy="3.8" font-size="9.0">h</tspan><tspan dy="-3.8">​</tspan> = 4A<tspan dy="3.8" font-size="9.0">c</tspan><tspan dy="-3.8">​</tspan>/p = 4δ</text>
<text x="420" y="179" font-size="12.5" fill="#1E2B3A">Re = 4ṁ/(pμ<tspan dy="3.8" font-size="9.0">l</tspan><tspan dy="-3.8">​</tspan>) = 4ρ<tspan dy="3.8" font-size="9.0">l</tspan><tspan dy="-3.8">​</tspan>V<tspan dy="3.8" font-size="9.0">l</tspan><tspan dy="-3.8">​</tspan>δ/μ<tspan dy="3.8" font-size="9.0">l</tspan><tspan dy="-3.8">​</tspan></text>
<text x="420" y="198" font-size="12.5" fill="#1E2B3A"></text>
<text x="420" y="217" font-size="12.5" fill="#1E2B3A">laminar:  Re &lt; 30</text>
<text x="420" y="236" font-size="12.5" fill="#1E2B3A">wavy laminar:  30 &lt; Re &lt; 1800</text>
<text x="420" y="255" font-size="12.5" fill="#1E2B3A">turbulent:  Re &gt; 1800</text>
