<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="700" height="430" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2B3A">
<title>Composite furnace wall: fire brick and block insulation</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1E2B3A"/></marker>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#D2552B"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#0B7C8C"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#55667D"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#B7840A"/></marker>
<pattern id="ins" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern>
<pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#FBE2D6"/><path d="M0,0.5 H24 M0,6.5 H24 M12,0.5 V6.5 M0.5,6.5 V12 M24,6.5 V12" stroke="#D2552B" stroke-width="0.8" fill="none" opacity="0.7"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#FFF3D6"/><circle cx="2" cy="2" r="0.9" fill="#C98A00"/><circle cx="5.5" cy="5.5" r="0.9" fill="#C98A00"/></pattern>
<pattern id="dense" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#E9D3A6"/><circle cx="1" cy="1" r="0.8" fill="#8A6200"/><circle cx="3" cy="3" r="0.8" fill="#8A6200"/></pattern>
</defs>
<rect width="700" height="430" fill="#FFFFFF"/>
<rect x="40" y="60" width="190" height="200" fill="#FBE2D6"/>
<text x="130" y="150" text-anchor="middle" font-weight="bold" fill="#D2552B">Furnace</text>
<text x="130" y="168" text-anchor="middle" font-weight="bold" fill="#D2552B">interior</text>
<rect x="230" y="60" width="100" height="200" fill="url(#brick)" stroke="#1E2B3A" stroke-width="1.4"/>
<rect x="330" y="60" width="70" height="200" fill="url(#ins)" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="280" y="38" text-anchor="middle" font-weight="bold" font-size="12.5">Fire brick</text>
<text x="280" y="53" text-anchor="middle" font-size="11.5">k<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">​</tspan> = 1.0 W/m·°C</text>
<text x="395" y="38" text-anchor="middle" font-weight="bold" font-size="12.5">Block insulation</text>
<text x="395" y="53" text-anchor="middle" font-size="11.5">k<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan> = 0.1 W/m·°C</text>
<text x="470" y="160" text-anchor="middle" font-weight="bold" fill="#0B7C8C">Outside</text>
<line x1="230" y1="80" x2="330" y2="101.2" stroke="#D2552B" stroke-width="2.6"/>
<line x1="330" y1="101.2" x2="400" y2="235.1" stroke="#D2552B" stroke-width="2.6"/>
<circle cx="230" cy="80" r="3.5" fill="#D2552B"/>
<text x="224" y="74" text-anchor="end" fill="#D2552B" font-size="12">T<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">​</tspan> = 800°C</text>
<circle cx="330" cy="101.2" r="3.5" fill="#D2552B"/>
<text x="336" y="95.2" fill="#D2552B" font-size="12">T<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan> = 700°C</text>
<circle cx="400" cy="235.1" r="3.5" fill="#D2552B"/>
<text x="406" y="229.1" fill="#D2552B" font-size="12">T<tspan dy="4" font-size="75%">3</tspan><tspan dy="-4">​</tspan> = 70°C</text>
<line x1="230" y1="278" x2="330" y2="278" stroke="#55667D" stroke-width="1" marker-end="url(#ag)" marker-start="url(#ag)"/>
<text x="280" y="293" text-anchor="middle" fill="#55667D" font-size="12">L<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">​</tspan> = 6 cm</text>
<line x1="330" y1="278" x2="400" y2="278" stroke="#55667D" stroke-width="1" marker-end="url(#ag)" marker-start="url(#ag)"/>
<text x="365" y="293" text-anchor="middle" fill="#55667D" font-size="12">L<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan> = ?</text>
<line x1="150" y1="130" x2="210" y2="130" stroke="#D2552B" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="160" y="120" font-style="italic" fill="#D2552B">q''</text>
<circle cx="120" cy="345" r="3.2" fill="#1E2B3A"/>
<text x="120" y="336" text-anchor="middle" font-size="12">T<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">​</tspan></text>
<line x1="120" y1="345" x2="150" y2="345" stroke="#1E2B3A" stroke-width="1.6"/>
<path d="M150,345 L154,345 L159.2,339 L169.5,351 L179.8,339 L190.2,351 L200.5,339 L210.8,351 L216,345 L220,345" fill="none" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="185" y="371" text-anchor="middle" font-size="12">L<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">​</tspan>/k<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">​</tspan> = 0.06</text>
<text x="185" y="387" text-anchor="middle" fill="#55667D" font-size="11">m²·°C/W</text>
<line x1="220" y1="345" x2="250" y2="345" stroke="#1E2B3A" stroke-width="1.6"/>
<circle cx="250" cy="345" r="3.2" fill="#1E2B3A"/>
<text x="250" y="336" text-anchor="middle" font-size="12">T<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan></text>
<line x1="250" y1="345" x2="280" y2="345" stroke="#1E2B3A" stroke-width="1.6"/>
<path d="M280,345 L284,345 L289.2,339 L299.5,351 L309.8,339 L320.2,351 L330.5,339 L340.8,351 L346,345 L350,345" fill="none" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="315" y="371" text-anchor="middle" font-size="12">L<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan>/k<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan></text>
<text x="315" y="387" text-anchor="middle" fill="#55667D" font-size="11">m²·°C/W</text>
<line x1="350" y1="345" x2="380" y2="345" stroke="#1E2B3A" stroke-width="1.6"/>
<circle cx="380" cy="345" r="3.2" fill="#1E2B3A"/>
<text x="380" y="336" text-anchor="middle" font-size="12">T<tspan dy="4" font-size="75%">3</tspan><tspan dy="-4">​</tspan></text>
<text x="60" y="410" font-size="12">q'' = (T<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">​</tspan> − T<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan>)/(L<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">​</tspan>/k<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">​</tspan>) = (T<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan> − T<tspan dy="4" font-size="75%">3</tspan><tspan dy="-4">​</tspan>)/(L<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan>/k<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan>)</text>
<text x="440" y="410" fill="#55667D" font-size="11.5">same flux through both layers (series)</text>
</svg>
