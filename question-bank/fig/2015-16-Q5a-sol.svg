<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2B3A">
<title>Control volume dx dy dz for the 3-D heat conduction equation</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1E2B3A"/></marker>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#D2552B"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#0B7C8C"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#55667D"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#B7840A"/></marker>
<pattern id="ins" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern>
<pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#FBE2D6"/><path d="M0,0.5 H24 M0,6.5 H24 M12,0.5 V6.5 M0.5,6.5 V12 M24,6.5 V12" stroke="#D2552B" stroke-width="0.8" fill="none" opacity="0.7"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#FFF3D6"/><circle cx="2" cy="2" r="0.9" fill="#C98A00"/><circle cx="5.5" cy="5.5" r="0.9" fill="#C98A00"/></pattern>
<pattern id="dense" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#E9D3A6"/><circle cx="1" cy="1" r="0.8" fill="#8A6200"/><circle cx="3" cy="3" r="0.8" fill="#8A6200"/></pattern>
</defs>
<rect width="700" height="380" fill="#FFFFFF"/>
<path d="M200,270 L360,270 L360,140 L200,140 Z" fill="#EEF2F7" stroke="#1E2B3A" stroke-width="1.4"/>
<path d="M200,140 L360,140 L430,90 L270,90 Z" fill="#E2E8F0" stroke="#1E2B3A" stroke-width="1.4"/>
<path d="M360,270 L430,220 L430,90 L360,140 Z" fill="#D5DDE8" stroke="#1E2B3A" stroke-width="1.4"/>
<path d="M200,270 L270,220 L270,90 M270,220 L430,220" fill="none" stroke="#9AA8B8" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="110" y1="170" x2="194" y2="170" stroke="#D2552B" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="108" y="162" fill="#D2552B" font-size="14">q<tspan dy="4" font-size="75%">x</tspan><tspan dy="-4">​</tspan></text>
<line x1="399" y1="145" x2="475" y2="145" stroke="#D2552B" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="409" y="137" fill="#D2552B" font-size="14">q<tspan dy="4" font-size="75%">x+dx</tspan><tspan dy="-4">​</tspan></text>
<line x1="315" y1="340" x2="315" y2="251" stroke="#D2552B" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="323" y="336" fill="#D2552B" font-size="14">q<tspan dy="4" font-size="75%">y</tspan><tspan dy="-4">​</tspan></text>
<line x1="315" y1="111" x2="315" y2="41" stroke="#D2552B" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="323" y="55" fill="#D2552B" font-size="14">q<tspan dy="4" font-size="75%">y+dy</tspan><tspan dy="-4">​</tspan></text>
<line x1="170" y1="292" x2="236" y2="244" stroke="#D2552B" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="166" y="304" text-anchor="end" fill="#D2552B">q<tspan dy="4" font-size="75%">z</tspan><tspan dy="-4">​</tspan></text>
<line x1="416" y1="112" x2="460" y2="80" stroke="#D2552B" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="464" y="78" fill="#D2552B">q<tspan dy="4" font-size="75%">z+dz</tspan><tspan dy="-4">​</tspan></text>
<text x="286" y="197" text-anchor="middle" font-weight="bold" fill="#B7840A">ġ dx dy dz</text>
<text x="286" y="215" text-anchor="middle" fill="#55667D" font-size="12">E<tspan dy="4" font-size="75%">st</tspan><tspan dy="-4">​</tspan> = ρc(∂T/∂t)dV</text>
<line x1="200" y1="286" x2="360" y2="286" stroke="#55667D" stroke-width="1" marker-end="url(#ag)" marker-start="url(#ag)"/>
<text x="280" y="301" text-anchor="middle" fill="#55667D" font-size="12">dx</text>
<line x1="186" y1="140" x2="186" y2="270" stroke="#55667D" stroke-width="1" marker-end="url(#ag)" marker-start="url(#ag)"/>
<text x="180" y="209" text-anchor="end" fill="#55667D" font-size="12">dy</text>
<line x1="372" y1="278" x2="442" y2="228" stroke="#55667D" stroke-width="1" marker-end="url(#ag)" marker-start="url(#ag)"/>
<text x="413" y="267" fill="#55667D" font-size="12">dz</text>
<line x1="50" y1="350" x2="90" y2="350" stroke="#1E2B3A" stroke-width="1.3" marker-end="url(#a)"/>
<text x="94" y="354" font-size="12">x</text>
<line x1="50" y1="350" x2="50" y2="310" stroke="#1E2B3A" stroke-width="1.3" marker-end="url(#a)"/>
<text x="47" y="306" font-size="12">y</text>
<line x1="50" y1="350" x2="76" y2="330" stroke="#1E2B3A" stroke-width="1.3" marker-end="url(#a)"/>
<text x="80" y="328" font-size="12">z</text>
<text x="505" y="60" font-size="12.5">Fourier: q<tspan dy="4" font-size="75%">x</tspan><tspan dy="-4">​</tspan> = −k dy dz ∂T/∂x</text>
<text x="505" y="82" font-size="12.5">q<tspan dy="4" font-size="75%">x+dx</tspan><tspan dy="-4">​</tspan> = q<tspan dy="4" font-size="75%">x</tspan><tspan dy="-4">​</tspan> + (∂q<tspan dy="4" font-size="75%">x</tspan><tspan dy="-4">​</tspan>/∂x)dx</text>
<text x="505" y="112" fill="#55667D" font-size="12.5">in − out + generated = stored</text>
<text x="505" y="150" font-size="12.5">∂/∂x(k∂T/∂x) + ∂/∂y(k∂T/∂y)</text>
<text x="505" y="170" font-size="12.5">+ ∂/∂z(k∂T/∂z) + ġ = ρc ∂T/∂t</text>
</svg>
