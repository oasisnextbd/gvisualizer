<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" height="270" font-family="Helvetica, Arial, sans-serif">
<title>Square plate in three orientations</title>
<defs>
<marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#1E2B3A"/></marker>
<marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#1E2B3A"/></marker>
<marker id="ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#D2552B"/></marker>
<marker id="as-hot" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#D2552B"/></marker>
<marker id="ah-cold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#0B7C8C"/></marker>
<marker id="as-cold" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#0B7C8C"/></marker>
<marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#9AA8B8"/></marker>
<marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#9AA8B8"/></marker>
<marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#B7840A"/></marker>
<marker id="as-acc" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#B7840A"/></marker>
<marker id="ah-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#55667D"/></marker>
<marker id="as-sec" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#55667D"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern>
<pattern id="mhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9AA8B8" stroke-width="1"/></pattern>
</defs>
<rect width="700" height="270" fill="#FFFFFF"/>
<text x="115" y="24" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1E2B3A">(a) Vertical</text>
<rect x="109" y="60" width="10" height="140" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.4"/>
<line x1="119" y1="60" x2="119" y2="200" stroke="#D2552B" stroke-width="4"/>
<rect x="100" y="60" width="9" height="140" fill="url(#hatch)" stroke="#C98A00" stroke-width="1"/>
<path d="M121,200 Q137,130 155,58" fill="none" stroke="#9AA8B8" stroke-width="1" stroke-dasharray="4 3" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="131" y1="180" x2="131" y2="150" stroke="#D2552B" stroke-width="1.5" marker-end="url(#ah-hot)"/>
<line x1="131" y1="140" x2="131" y2="110" stroke="#D2552B" stroke-width="1.5" marker-end="url(#ah-hot)"/>
<line x1="131" y1="100" x2="131" y2="70" stroke="#D2552B" stroke-width="1.5" marker-end="url(#ah-hot)"/>
<line x1="85" y1="60" x2="85" y2="200" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#ah-grey)" marker-start="url(#as-grey)"/>
<text x="76" y="134.2" font-size="12" text-anchor="end" fill="#55667D">L = 0.6 m</text>
<text x="350" y="24" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1E2B3A">(b) Hot face up</text>
<rect x="285" y="145" width="130" height="10" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.5"/>
<line x1="285" y1="145" x2="415" y2="145" stroke="#D2552B" stroke-width="4"/>
<rect x="285" y="155" width="130" height="9" fill="url(#hatch)" stroke="#C98A00" stroke-width="1"/>
<path d="M271.0,131.0 L334,135.0" fill="none" stroke="#D2552B" stroke-width="1.8" marker-end="url(#ah-hot)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M429.0,131.0 L366,135.0" fill="none" stroke="#D2552B" stroke-width="1.8" marker-end="url(#ah-hot)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M350,135.0 L350,75.0" fill="none" stroke="#D2552B" stroke-width="2.2" marker-end="url(#ah-hot)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M313.6,131.0 Q313.6,105.0 318.8,83.0" fill="none" stroke="#D2552B" stroke-width="1.5" marker-end="url(#ah-hot)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M386.4,131.0 Q386.4,105.0 381.2,83.0" fill="none" stroke="#D2552B" stroke-width="1.5" marker-end="url(#ah-hot)" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="285" y1="184" x2="415" y2="184" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#ah-grey)" marker-start="url(#as-grey)"/>
<text x="350" y="202.6" font-size="12" text-anchor="middle" fill="#55667D">0.6 m × 0.6 m</text>
<text x="585" y="24" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1E2B3A">(c) Hot face down</text>
<rect x="520" y="105" width="130" height="10" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.5"/>
<line x1="520" y1="115" x2="650" y2="115" stroke="#D2552B" stroke-width="4"/>
<rect x="520" y="96" width="130" height="9" fill="url(#hatch)" stroke="#C98A00" stroke-width="1"/>
<path d="M575,125.0 L526.0,125.0 Q504.0,125.0 504.0,97.0" fill="none" stroke="#D2552B" stroke-width="1.8" marker-end="url(#ah-hot)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M595,125.0 L644.0,125.0 Q666.0,125.0 666.0,97.0" fill="none" stroke="#D2552B" stroke-width="1.8" marker-end="url(#ah-hot)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M526.0,115.0 Q585,145.0 644.0,115.0" fill="none" stroke="#D2552B" stroke-width="1" stroke-dasharray="3 3" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="520" y1="74" x2="650" y2="74" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#ah-grey)" marker-start="url(#as-grey)"/>
<text x="585" y="65" font-size="12" text-anchor="middle" fill="#55667D">0.6 m × 0.6 m</text>
<text x="350" y="240" font-size="12" text-anchor="middle" fill="#55667D">Hot face at T<tspan dy="3.6" font-size="8.6">s</tspan><tspan dy="-3.6">​</tspan> = 90°C (red), back face insulated (hatched); room air T<tspan dy="3.6" font-size="8.6">∞</tspan><tspan dy="-3.6">​</tspan> = 30°C.</text>
<text x="350" y="258" font-size="12" text-anchor="middle" fill="#55667D">Horizontal plates: L<tspan dy="3.6" font-size="8.6">c</tspan><tspan dy="-3.6">​</tspan> = A<tspan dy="3.6" font-size="8.6">s</tspan><tspan dy="-3.6">​</tspan>/p = 0.15 m. Strong plume in (b); slow edge flow in (c).</text>
</svg>
