<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="Helvetica, Arial, sans-serif">
<title>Natural convection from a hot plate in three orientations</title>
<defs><marker id="aI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="aIs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1E2B3A"/></marker><marker id="aH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="aHs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#D2552B"/></marker><marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="aCs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0B7C8C"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><marker id="aGs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9AA8B8"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="aAs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#B7840A"/></marker><marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="aSs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#55667D"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="mhatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA8B8" stroke-width="0.9"/></pattern></defs>
<rect width="700" height="330" fill="#FFFFFF"/>
<rect x="70" y="60" width="14" height="190" fill="#FBE2D6" stroke="#D2552B" stroke-width="1.5"/>
<path d="M84.0,250.0 C86.7,241.7 95.7,218.3 100.0,200.0 C104.3,181.7 107.0,163.3 110.0,140.0 C113.0,116.7 116.7,73.3 118.0,60.0" stroke="#9AA8B8" stroke-width="1.3" fill="none" stroke-dasharray="5 3"/>
<line x1="94" y1="230" x2="94" y2="196" stroke="#D2552B" stroke-width="1.6" marker-end="url(#aH)"/>
<line x1="94" y1="170" x2="94" y2="136" stroke="#D2552B" stroke-width="1.6" marker-end="url(#aH)"/>
<line x1="94" y1="110" x2="94" y2="76" stroke="#D2552B" stroke-width="1.6" marker-end="url(#aH)"/>
<line x1="100" y1="55" x2="114" y2="25" stroke="#D2552B" stroke-width="1.6" marker-end="url(#aH)"/>
<line x1="160" y1="240" x2="130" y2="240" stroke="#0B7C8C" stroke-width="1.4" marker-end="url(#aC)"/>
<line x1="160" y1="180" x2="134" y2="180" stroke="#0B7C8C" stroke-width="1.4" marker-end="url(#aC)"/>
<text x="100" y="280" font-size="13" text-anchor="middle" fill="#1E2B3A" font-weight="bold">(a) Vertical</text>
<text x="100" y="298" font-size="12" text-anchor="middle" fill="#1E2B3A">Nu = 0.59 Ra<tspan dy="-4.6" font-size="8.6">1/4</tspan><tspan dy="4.6">​</tspan></text>
<text x="100" y="315" font-size="11" text-anchor="middle" fill="#55667D">layer grows upward</text>
<rect x="240" y="200" width="200" height="14" fill="#FBE2D6" stroke="#D2552B" stroke-width="1.5"/>
<text x="340" y="211" font-size="10" text-anchor="middle" fill="#D2552B">hot surface up</text>
<line x1="220" y1="192" x2="300" y2="192" stroke="#0B7C8C" stroke-width="1.5" marker-end="url(#aC)"/>
<line x1="460" y1="192" x2="380" y2="192" stroke="#0B7C8C" stroke-width="1.5" marker-end="url(#aC)"/>
<path d="M310.0,194.0 C313.3,186.7 327.3,167.3 330.0,150.0 C332.7,132.7 325.3,106.7 326.0,90.0 C326.7,73.3 332.7,56.7 334.0,50.0" stroke="#D2552B" stroke-width="1.8" fill="none" marker-end="url(#aH)"/>
<path d="M370.0,194.0 C366.7,186.7 352.7,167.3 350.0,150.0 C347.3,132.7 354.7,106.7 354.0,90.0 C353.3,73.3 347.3,56.7 346.0,50.0" stroke="#D2552B" stroke-width="1.8" fill="none" marker-end="url(#aH)"/>
<line x1="340" y1="190" x2="340" y2="50" stroke="#D2552B" stroke-width="2.2" marker-end="url(#aH)"/>
<text x="370" y="80" font-size="11" text-anchor="start" fill="#D2552B">warm plume</text>
<text x="340" y="280" font-size="13" text-anchor="middle" fill="#1E2B3A" font-weight="bold">(b) Horizontal, hot face up</text>
<text x="340" y="298" font-size="12" text-anchor="middle" fill="#1E2B3A">Nu = 0.54 Ra<tspan dy="-4.6" font-size="8.6">1/4</tspan><tspan dy="4.6">​</tspan> — highest</text>
<text x="340" y="315" font-size="11" text-anchor="middle" fill="#55667D">free rise, fresh air drawn in</text>
<path d="M480,104 C520,148 640,148 680,104 Z" stroke="#9AA8B8" stroke-width="1" fill="#FDF0EA" stroke-dasharray="4 3"/>
<rect x="480" y="90" width="200" height="14" fill="#FBE2D6" stroke="#D2552B" stroke-width="1.5"/>
<text x="580" y="101" font-size="10" text-anchor="middle" fill="#D2552B">hot surface down</text>
<text x="580" y="130" font-size="10" text-anchor="middle" fill="#55667D">trapped warm layer</text>
<line x1="560" y1="142" x2="490" y2="120" stroke="#D2552B" stroke-width="1.5" marker-end="url(#aH)"/>
<line x1="600" y1="142" x2="670" y2="120" stroke="#D2552B" stroke-width="1.5" marker-end="url(#aH)"/>
<path d="M476,108 C462,94 468,60 472,30" stroke="#D2552B" stroke-width="1.6" fill="none" marker-end="url(#aH)"/>
<path d="M684,108 C698,94 692,60 688,30" stroke="#D2552B" stroke-width="1.6" fill="none" marker-end="url(#aH)"/>
<line x1="550" y1="240" x2="560" y2="165" stroke="#0B7C8C" stroke-width="1.4" marker-end="url(#aC)"/>
<line x1="610" y1="240" x2="600" y2="165" stroke="#0B7C8C" stroke-width="1.4" marker-end="url(#aC)"/>
<text x="580" y="258" font-size="11" text-anchor="middle" fill="#0B7C8C">slow inflow</text>
<text x="580" y="280" font-size="13" text-anchor="middle" fill="#1E2B3A" font-weight="bold">(c) Horizontal, hot face down</text>
<text x="580" y="298" font-size="12" text-anchor="middle" fill="#B7840A" font-weight="bold">Nu = 0.27 Ra<tspan dy="-4.6" font-size="8.6">1/4</tspan><tspan dy="4.6">​</tspan> — lowest</text>
<text x="580" y="315" font-size="11" text-anchor="middle" fill="#55667D">plate blocks the rising air</text>
</svg>
