<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2B3A">
<title>Thermal circuit for the split insulation: two parallel branches</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1E2B3A"/></marker>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#D2552B"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#0B7C8C"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#55667D"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#B7840A"/></marker>
<pattern id="ins" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern>
<pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#FBE2D6"/><path d="M0,0.5 H24 M0,6.5 H24 M12,0.5 V6.5 M0.5,6.5 V12 M24,6.5 V12" stroke="#D2552B" stroke-width="0.8" fill="none" opacity="0.7"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#FFF3D6"/><circle cx="2" cy="2" r="0.9" fill="#C98A00"/><circle cx="5.5" cy="5.5" r="0.9" fill="#C98A00"/></pattern>
<pattern id="dense" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#E9D3A6"/><circle cx="1" cy="1" r="0.8" fill="#8A6200"/><circle cx="3" cy="3" r="0.8" fill="#8A6200"/></pattern>
</defs>
<rect width="640" height="260" fill="#FFFFFF"/>
<circle cx="80" cy="125" r="3.2" fill="#1E2B3A"/>
<text x="80" y="116" text-anchor="middle" font-size="12">T<tspan dy="4" font-size="75%">s</tspan><tspan dy="-4">​</tspan> = 500 K</text>
<circle cx="560" cy="125" r="3.2" fill="#1E2B3A"/>
<text x="560" y="116" text-anchor="middle" font-size="12">T<tspan dy="4" font-size="75%">∞</tspan><tspan dy="-4">​</tspan> = 300 K</text>
<line x1="80" y1="125" x2="110" y2="125" stroke="#1E2B3A" stroke-width="1.6"/>
<line x1="110" y1="80" x2="110" y2="170" stroke="#1E2B3A" stroke-width="1.6"/>
<line x1="530" y1="125" x2="560" y2="125" stroke="#1E2B3A" stroke-width="1.6"/>
<line x1="530" y1="80" x2="530" y2="170" stroke="#1E2B3A" stroke-width="1.6"/>
<line x1="110" y1="80" x2="150" y2="80" stroke="#1E2B3A" stroke-width="1.6"/>
<path d="M150,80 L154,80 L160,74 L172,86 L184,74 L196,86 L208,74 L220,86 L226,80 L230,80" fill="none" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="190" y="66" text-anchor="middle" font-size="12">R<tspan dy="4" font-size="75%">A</tspan><tspan dy="-4">​</tspan> = ln(r<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan>/r<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">​</tspan>)/(πk<tspan dy="4" font-size="75%">A</tspan><tspan dy="-4">​</tspan>)</text>
<text x="190" y="106" text-anchor="middle" fill="#55667D" font-size="11">0.1103 m·K/W</text>
<line x1="230" y1="80" x2="330" y2="80" stroke="#1E2B3A" stroke-width="1.6"/>
<path d="M330,80 L334,80 L340,74 L352,86 L364,74 L376,86 L388,74 L400,86 L406,80 L410,80" fill="none" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="370" y="66" text-anchor="middle" font-size="12">R<tspan dy="4" font-size="75%">conv,A</tspan><tspan dy="-4">​</tspan> = 1/(hπr<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan>)</text>
<text x="370" y="106" text-anchor="middle" fill="#55667D" font-size="11">0.1273 m·K/W</text>
<line x1="410" y1="80" x2="530" y2="80" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="280" y="74" text-anchor="middle" fill="#55667D" font-size="10.5">half A</text>
<line x1="255" y1="86" x2="305" y2="86" stroke="#C98A00" stroke-width="0"/>
<line x1="110" y1="170" x2="150" y2="170" stroke="#1E2B3A" stroke-width="1.6"/>
<path d="M150,170 L154,170 L160,164 L172,176 L184,164 L196,176 L208,164 L220,176 L226,170 L230,170" fill="none" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="190" y="156" text-anchor="middle" font-size="12">R<tspan dy="4" font-size="75%">B</tspan><tspan dy="-4">​</tspan> = ln(r<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan>/r<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">​</tspan>)/(πk<tspan dy="4" font-size="75%">B</tspan><tspan dy="-4">​</tspan>)</text>
<text x="190" y="196" text-anchor="middle" fill="#55667D" font-size="11">0.8825 m·K/W</text>
<line x1="230" y1="170" x2="330" y2="170" stroke="#1E2B3A" stroke-width="1.6"/>
<path d="M330,170 L334,170 L340,164 L352,176 L364,164 L376,176 L388,164 L400,176 L406,170 L410,170" fill="none" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="370" y="156" text-anchor="middle" font-size="12">R<tspan dy="4" font-size="75%">conv,B</tspan><tspan dy="-4">​</tspan> = 1/(hπr<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan>)</text>
<text x="370" y="196" text-anchor="middle" fill="#55667D" font-size="11">0.1273 m·K/W</text>
<line x1="410" y1="170" x2="530" y2="170" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="280" y="164" text-anchor="middle" fill="#55667D" font-size="10.5">half B</text>
<line x1="255" y1="176" x2="305" y2="176" stroke="#8A6200" stroke-width="0"/>
<text x="320" y="230" text-anchor="middle" fill="#55667D" font-size="12">Two parallel branches (A and B halves), each conduction + convection in series</text>
<text x="320" y="250" text-anchor="middle" font-size="12">q' = q'_A + q'_B = 200/(0.1103 + 0.1273) + 200/(0.8825 + 0.1273)</text>
</svg>
