<text x="95" y="184.2" font-size="12" text-anchor="end" fill="#55667D">L = 1.2 m</text>
<text x="140" y="348" font-size="12" text-anchor="middle" fill="#1E2B3A">T<tspan dy="3.6" font-size="8.6">s</tspan><tspan dy="-3.6">​</tspan> = 80°C</text>
<text x="210" y="50" font-size="12" fill="#55667D">saturated steam, 1 atm (100°C)</text>
<text x="196" y="322" font-size="11.5" fill="#0B7C8C">condensate film</text>
<text x="300" y="110" font-size="12.5" fill="#1E2B3A">width b = 1 m</text>
<text x="300" y="129" font-size="12.5" fill="#1E2B3A">ΔT = T<tspan dy="3.8" font-size="9.0">sat</tspan><tspan dy="-3.8">​</tspan> − T<tspan dy="3.8" font-size="9.0">s</tspan><tspan dy="-3.8">​</tspan> = 20 K</text>
<text x="300" y="148" font-size="12.5" fill="#1E2B3A"></text>
<text x="300" y="167" font-size="12.5" fill="#1E2B3A">Check the regime with</text>
<text x="300" y="186" font-size="12.5" fill="#1E2B3A">Re = 4ṁ/(bμ<tspan dy="3.8" font-size="9.0">l</tspan><tspan dy="-3.8">​</tspan>):</text>
<text x="300" y="205" font-size="12.5" fill="#1E2B3A">laminar / wavy / turbulent</text>
</svg>
