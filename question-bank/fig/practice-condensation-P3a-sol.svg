</defs>
<rect width="680" height="420" fill="#FFFFFF"/>
<rect x="98" y="50" width="22" height="330" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="109" y="398" font-size="12" text-anchor="middle" fill="#1E2B3A">T<tspan dy="3.6" font-size="8.6">s</tspan><tspan dy="-3.6">​</tspan></text>
