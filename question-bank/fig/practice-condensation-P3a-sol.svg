<text x="74" y="134" font-size="13" text-anchor="end" font-style="italic" fill="#1E2B3A">x</text>
<line x1="124" y1="36" x2="190" y2="36" stroke="#1E2B3A" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<text x="194" y="40" font-size="13" font-style="italic" fill="#1E2B3A">y</text>
<text x="196" y="80" font-size="12" fill="#55667D">vapour at T<tspan dy="3.6" font-size="8.6">sat</tspan><tspan dy="-3.6">​</tspan></text>
<text x="178" y="370" font-size="12.5" fill="#0B7C8C">δ(x) ∝ x<tspan dy="-4.8" font-size="9.0">1/4</tspan><tspan dy="4.8">​</tspan></text>
<rect x="132" y="200" width="32.3392" height="40" fill="none" stroke="#B7840A" stroke-width="1.4" stroke-dasharray="4 2"/>
<text x="440" y="48" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1E2B3A">Velocity u(y)</text>
<line x1="380" y1="60" x2="380" y2="190" stroke="#1E2B3A" stroke-width="1.6"/>
<line x1="470" y1="60" x2="470" y2="190" stroke="#0B7C8C" stroke-width="1" stroke-dasharray="4 3"/>
<text x="472" y="204" font-size="11" text-anchor="middle" fill="#0B7C8C">y = δ</text>
<path d="M380.0,70.0 L383.0,77.7 L386.0,85.1 L389.0,92.2 L392.0,99.1 L395.0,105.8 L398.0,112.1 L401.0,118.2 L404.0,124.1 L407.0,129.7 L410.0,135.0 L413.0,140.1 L416.0,144.9 L419.0,149.4 L422.0,153.7 L425.0,157.8 L428.0,161.5 L431.0,165.0 L434.0,168.3 L437.0,171.3 L440.0,174.0 L443.0,176.5 L446.0,178.7 L449.0,180.6 L452.0,182.3 L455.0,183.8 L458.0,184.9 L461.0,185.8 L464.0,186.5 L467.0,186.9 L470.0,187.0" fill="none" stroke="#0B7C8C" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="402.5" y1="70" x2="402.5" y2="119.188" stroke="#0B7C8C" stroke-width="1.1" marker-end="url(#ah-cold)"/>
<line x1="425" y1="70" x2="425" y2="155.75" stroke="#0B7C8C" stroke-width="1.1" marker-end="url(#ah-cold)"/>
<line x1="447.5" y1="70" x2="447.5" y2="177.688" stroke="#0B7C8C" stroke-width="1.1" marker-end="url(#ah-cold)"/>
<line x1="470" y1="70" x2="470" y2="185" stroke="#0B7C8C" stroke-width="1.1" marker-end="url(#ah-cold)"/>
<text x="480" y="120" font-size="11.5" fill="#55667D">u = 0 at wall;</text>
<text x="480" y="134.375" font-size="11.5" fill="#55667D">∂u/∂y = 0 at y = δ</text>
<text x="480" y="148.75" font-size="11.5" fill="#55667D">(no shear from</text>
<text x="480" y="163.125" font-size="11.5" fill="#55667D">the slow vapour)</text>
<text x="480" y="177.5" font-size="11.5" fill="#55667D">half-parabola</text>
<text x="440" y="246" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1E2B3A">Temperature T(y)</text>
<line x1="380" y1="260" x2="380" y2="370" stroke="#1E2B3A" stroke-width="1.6"/>
<line x1="470" y1="260" x2="470" y2="370" stroke="#0B7C8C" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="380" y1="360" x2="470" y2="270" stroke="#D2552B" stroke-width="2.4"/>
<text x="376" y="364" font-size="12" text-anchor="end" fill="#D2552B">T<tspan dy="3.6" font-size="8.6">s</tspan><tspan dy="-3.6">​</tspan></text>
<text x="476" y="274" font-size="12" fill="#D2552B">T<tspan dy="3.6" font-size="8.6">sat</tspan><tspan dy="-3.6">​</tspan></text>
<text x="480" y="310" font-size="11.5" fill="#55667D">linear across the film</text>
<text x="480" y="324.375" font-size="11.5" fill="#55667D">(conduction only):</text>
<text x="480" y="338.75" font-size="11.5" fill="#55667D">q″ = k<tspan dy="3.4" font-size="8.3">l</tspan><tspan dy="-3.4">​</tspan>(T<tspan dy="3.4" font-size="8.3">sat</tspan><tspan dy="-3.4">​</tspan> − T<tspan dy="3.4" font-size="8.3">s</tspan><tspan dy="-3.4">​</tspan>)/δ</text>
<text x="176.339" y="210" font-size="11.5" fill="#B7840A">element dx:</text>
<text x="176.339" y="224.375" font-size="11.5" fill="#B7840A">gravity − buoyancy</text>
<text x="176.339" y="238.75" font-size="11.5" fill="#B7840A">= viscous shear</text>
<text x="340" y="410" font-size="12" text-anchor="middle" fill="#1E2B3A">Energy: d(ṁ)h*<tspan dy="3.6" font-size="8.6">fg</tspan><tspan dy="-3.6">​</tspan> = k<tspan dy="3.6" font-size="8.6">l</tspan><tspan dy="-3.6">​</tspan>(T<tspan dy="3.6" font-size="8.6">sat</tspan><tspan dy="-3.6">​</tspan> − T<tspan dy="3.6" font-size="8.6">s</tspan><tspan dy="-3.6">​</tspan>)dx/δ  →  δ⁴ ∝ x,  h<tspan dy="3.6" font-size="8.6">x</tspan><tspan dy="-3.6">​</tspan> = k<tspan dy="3.6" font-size="8.6">l</tspan><tspan dy="-3.6">​</tspan>/δ,  h̄ = (4/3)h<tspan dy="3.6" font-size="8.6">L</tspan><tspan dy="-3.6">​</tspan></text>
</svg>
