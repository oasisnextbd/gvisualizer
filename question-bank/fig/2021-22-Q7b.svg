<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" font-family="Helvetica, Arial, sans-serif">
<title>Plastered brick wall with a glass window: parallel heat-flow paths</title>
<defs><marker id="aI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="aIs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1E2B3A"/></marker><marker id="aH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="aHs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#D2552B"/></marker><marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="aCs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0B7C8C"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><marker id="aGs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9AA8B8"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="aAs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#B7840A"/></marker><marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="aSs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#55667D"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="mhatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA8B8" stroke-width="0.9"/></pattern></defs>
<rect width="700" height="340" fill="#FFFFFF"/>
<rect x="40" y="60" width="170" height="102" fill="#F1D9CE" stroke="#1E2B3A" stroke-width="1.6"/>
<rect x="108" y="80.4" width="34" height="68" fill="#DFF1F7" stroke="#0B7C8C" stroke-width="1.6"/>
<text x="125" y="117.8" font-size="10" text-anchor="middle" fill="#0B7C8C">glass</text>
<line x1="40" y1="46" x2="210" y2="46" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#aG)" marker-start="url(#aGs)"/>
<text x="125" y="41" font-size="12" text-anchor="middle" fill="#55667D">5 m</text>
<line x1="28" y1="60" x2="28" y2="162" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#aG)" marker-start="url(#aGs)"/>
<text x="22" y="115" font-size="12" text-anchor="end" fill="#55667D">3 m</text>
<text x="125" y="184" font-size="11" text-anchor="middle" fill="#55667D">window 1 m × 2 m</text>
<text x="125" y="200" font-size="11" text-anchor="middle" fill="#55667D">net wall area 13 m²</text>
<text x="125" y="22" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Elevation</text>
<text x="330" y="22" font-size="12" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Section through the wall</text>
<rect x="260" y="60" width="10" height="100" fill="#EDE7DA" stroke="#1E2B3A" stroke-width="1.2"/>
<rect x="270" y="60" width="120" height="100" fill="#F1D9CE" stroke="#1E2B3A" stroke-width="1.2"/>
<rect x="390" y="60" width="10" height="100" fill="#EDE7DA" stroke="#1E2B3A" stroke-width="1.2"/>
<text x="330" y="110" font-size="11" text-anchor="middle" fill="#1E2B3A">brick 30 cm</text>
<text x="330" y="125" font-size="11" text-anchor="middle" fill="#55667D">k = 0.35</text>
<text x="265" y="176" font-size="10" text-anchor="start" fill="#55667D">plaster 2 cm, k = 0.6 (both sides)</text>
<rect x="326" y="190" width="6" height="50" fill="#DFF1F7" stroke="#0B7C8C" stroke-width="1.2"/>
<text x="342" y="216" font-size="10" text-anchor="start" fill="#0B7C8C">glass 12 mm, k = 1.2</text>
<text x="254" y="72" font-size="11" text-anchor="end" fill="#0B7C8C">10°C</text>
<text x="406" y="72" font-size="11" text-anchor="start" fill="#D2552B">40°C</text>
<circle cx="470" cy="170" r="3.2" fill="#1E2B3A" stroke="none" stroke-width="0"/>
<text x="470" y="194" font-size="11" text-anchor="middle" fill="#1E2B3A">T<tspan dy="3.3" font-size="7.9">1</tspan><tspan dy="-3.3">​</tspan> = 10°C</text>
<circle cx="680" cy="170" r="3.2" fill="#1E2B3A" stroke="none" stroke-width="0"/>
<text x="680" y="194" font-size="11" text-anchor="end" fill="#1E2B3A">T<tspan dy="3.3" font-size="7.9">2</tspan><tspan dy="-3.3">​</tspan> = 40°C</text>
<line x1="470" y1="170" x2="480" y2="170" stroke="#1E2B3A" stroke-width="1.6"/>
<line x1="670" y1="170" x2="680" y2="170" stroke="#1E2B3A" stroke-width="1.6"/>
<line x1="480" y1="120" x2="480" y2="220" stroke="#1E2B3A" stroke-width="1.6"/>
<line x1="670" y1="120" x2="670" y2="220" stroke="#1E2B3A" stroke-width="1.6"/>
<polyline points="480,120 492.6,120 495.75,114 502.05,126 508.35,114 514.65,126 520.95,114 527.25,126 530.4,120 543,120" fill="none" stroke="#1E2B3A" stroke-width="1.6" stroke-linejoin="round"/>
<text x="511.5" y="108" font-size="11" text-anchor="middle" fill="#1E2B3A">R<tspan dy="3.3" font-size="7.9">p</tspan><tspan dy="-3.3">​</tspan></text>
<polyline points="543,120 555.8,120 559,114 565.4,126 571.8,114 578.2,126 584.6,114 591,126 594.2,120 607,120" fill="none" stroke="#1E2B3A" stroke-width="1.6" stroke-linejoin="round"/>
<text x="575" y="108" font-size="11" text-anchor="middle" fill="#1E2B3A">R<tspan dy="3.3" font-size="7.9">b</tspan><tspan dy="-3.3">​</tspan></text>
<polyline points="607,120 619.6,120 622.75,114 629.05,126 635.35,114 641.65,126 647.95,114 654.25,126 657.4,120 670,120" fill="none" stroke="#1E2B3A" stroke-width="1.6" stroke-linejoin="round"/>
<text x="638.5" y="108" font-size="11" text-anchor="middle" fill="#1E2B3A">R<tspan dy="3.3" font-size="7.9">p</tspan><tspan dy="-3.3">​</tspan></text>
<text x="575" y="146" font-size="10" text-anchor="middle" fill="#55667D">wall: 0.924 m²K/W ÷ 13 m²</text>
<polyline points="480,220 552,220 555.833,214 563.5,226 571.167,214 578.833,226 586.5,214 594.167,226 598,220 670,220" fill="none" stroke="#0B7C8C" stroke-width="1.6" stroke-linejoin="round"/>
<text x="575" y="208" font-size="11" text-anchor="middle" fill="#0B7C8C">R<tspan dy="3.3" font-size="7.9">glass</tspan><tspan dy="-3.3">​</tspan> = L/(kA)</text>
<text x="575" y="246" font-size="10" text-anchor="middle" fill="#55667D">0.010 m²K/W ÷ 2 m²</text>
<text x="575" y="290" font-size="12" text-anchor="middle" fill="#B7840A" font-weight="bold">q = 422 W (wall) + 6000 W (glass)</text>
<text x="575" y="308" font-size="12" text-anchor="middle" fill="#B7840A" font-weight="bold">≈ 6.4 kW</text>
</svg>
