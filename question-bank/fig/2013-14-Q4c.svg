<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="Helvetica, Arial, sans-serif">
<title>Water-water double-pipe exchanger: dimensions and flows</title>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="a-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="a-cold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="a-vap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><pattern id="ins" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="metal" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA8B8" stroke-width="0.8"/></pattern></defs>
<rect width="700" height="330" fill="#FFFFFF"/>
<circle cx="140" cy="165" r="72.5" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.6"/>
<circle cx="140" cy="165" r="67.5" fill="#D9F0F2" stroke="#1E2B3A" stroke-width="1.4"/>
<circle cx="140" cy="165" r="47.88" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.4"/>
<circle cx="140" cy="165" r="45.0" fill="#FBE2D6" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="140" y="169" font-size="12" fill="#D2552B" text-anchor="middle" font-weight="bold">hot</text>
<text x="140" y="221" font-size="11" fill="#0B7C8C" text-anchor="middle">annulus</text>
<line x1="95.0" y1="151" x2="185.0" y2="151" stroke="#55667D" stroke-width="1" marker-end="url(#a-dim)" marker-start="url(#a-dim)"/><line x1="95.0" y1="146" x2="95.0" y2="156" stroke="#55667D" stroke-width="1"/><line x1="185.0" y1="146" x2="185.0" y2="156" stroke="#55667D" stroke-width="1"/><text x="140.0" y="145" font-size="11" fill="#55667D" text-anchor="middle">d<tspan dy="3.5" font-size="7.9">i</tspan><tspan dy="-3.5"> </tspan> = 2.5 cm</text>
<line x1="72.5" y1="247" x2="207.5" y2="247" stroke="#55667D" stroke-width="1" marker-end="url(#a-dim)" marker-start="url(#a-dim)"/>
<text x="140" y="265" font-size="11" fill="#55667D" text-anchor="middle">D₂ = 3.75 cm (outer pipe ID)</text>
<line x1="197.5" y1="95" x2="175.91" y2="133.3992" stroke="#1E2B3A" stroke-width="1" marker-end="url(#a-ink)"/>
<text x="190" y="91" font-size="11" fill="#1E2B3A">wall 0.8 mm → D₁ = 2.66 cm</text>
<text x="140" y="28" font-size="12" fill="#55667D" text-anchor="middle" font-weight="bold">Cross-section</text>
<rect x="330" y="98" width="340" height="5" rx="0" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1"/>
<rect x="330" y="227" width="340" height="5" rx="0" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1"/>
<rect x="330" y="103" width="340" height="124" rx="0" fill="#D9F0F2"/>
<rect x="330" y="121" width="340" height="88" rx="0" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1"/>
<rect x="330" y="124" width="340" height="82" rx="0" fill="#FBE2D6"/>
<line x1="360" y1="165" x2="460" y2="165" stroke="#D2552B" stroke-width="2.4" marker-end="url(#a-hot)"/>
<text x="470" y="169" font-size="12" fill="#D2552B" font-weight="bold">hot water, 90°C, V = 4 m/s</text>
<line x1="640" y1="112" x2="550" y2="112" stroke="#0B7C8C" stroke-width="2" marker-end="url(#a-cold)"/>
<line x1="640" y1="218" x2="550" y2="218" stroke="#0B7C8C" stroke-width="2" marker-end="url(#a-cold)"/>
<text x="340" y="87" font-size="12" fill="#0B7C8C" font-weight="bold">water 20°C in the annulus, V = 6 m/s</text>
<line x1="330" y1="257" x2="670" y2="257" stroke="#55667D" stroke-width="1" marker-end="url(#a-dim)" marker-start="url(#a-dim)"/><line x1="330" y1="252" x2="330" y2="262" stroke="#55667D" stroke-width="1"/><line x1="670" y1="252" x2="670" y2="262" stroke="#55667D" stroke-width="1"/><text x="500.0" y="273" font-size="12" fill="#55667D" text-anchor="middle">L = 6.0 m</text>
<text x="340" y="28" font-size="12" fill="#55667D" font-weight="bold">Side view (direction of annulus flow does not affect U)</text>
</svg>
