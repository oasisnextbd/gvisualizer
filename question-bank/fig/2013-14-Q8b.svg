<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Helvetica, Arial, sans-serif">
<title>Concentric-pipe oil cooler cross-section</title>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="a-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="a-cold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="a-vap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><pattern id="ins" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="metal" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA8B8" stroke-width="0.8"/></pattern></defs>
<rect width="640" height="300" fill="#FFFFFF"/>
<circle cx="150" cy="150" r="126.0" fill="url(#ins)" stroke="#C98A00" stroke-width="1.2"/>
<circle cx="150" cy="150" r="120.0" fill="#FBE2D6" stroke="#1E2B3A" stroke-width="1.6"/>
<circle cx="150" cy="150" r="72.0" fill="#D9F0F2" stroke="#1E2B3A" stroke-width="2.2"/>
<text x="150" y="172" font-size="12" fill="#0B7C8C" text-anchor="middle" font-weight="bold">water</text>
<text x="150" y="188" font-size="11" fill="#0B7C8C" text-anchor="middle">0.3 kg/s, 35°C</text>
<text x="150" y="246.0" font-size="11" fill="#D2552B" text-anchor="middle" font-weight="bold">oil 0.15 kg/s, 80°C</text>
<line x1="150" y1="150" x2="102.02812646785267" y2="96.30922472327615" stroke="#1E2B3A" stroke-width="1.1" marker-end="url(#a-ink)"/>
<line x1="150" y1="150" x2="255.30990742684475" y2="92.46893536749565" stroke="#1E2B3A" stroke-width="1.1" marker-end="url(#a-ink)"/>
<text x="100" y="88" font-size="11" fill="#1E2B3A" text-anchor="end">r<tspan dy="3.5" font-size="7.9">i</tspan><tspan dy="-3.5"> </tspan> = 3 cm</text>
<text x="264" y="78" font-size="11" fill="#1E2B3A">r<tspan dy="3.5" font-size="7.9">o</tspan><tspan dy="-3.5"> </tspan> = 5 cm</text>
<text x="310" y="60" font-size="12" fill="#0B7C8C">Inner pipe (thin wall): water, D<tspan dy="3.8" font-size="8.6">i</tspan><tspan dy="-3.8"> </tspan> = 6 cm, turbulent</text>
<text x="310" y="90" font-size="12" fill="#D2552B">Annulus: oil, D<tspan dy="3.8" font-size="8.6">h</tspan><tspan dy="-3.8"> </tspan> = D<tspan dy="3.8" font-size="8.6">o</tspan><tspan dy="-3.8"> </tspan> − D<tspan dy="3.8" font-size="8.6">i</tspan><tspan dy="-3.8"> </tspan> = 4 cm, laminar</text>
<text x="310" y="120" font-size="12" fill="#55667D">Outer pipe insulated: heat leaves the oil</text>
<text x="310" y="136" font-size="12" fill="#55667D">through the inner surface only</text>
<text x="310" y="166" font-size="12" fill="#1E2B3A">Nu<tspan dy="3.8" font-size="8.6">i</tspan><tspan dy="-3.8"> </tspan> for D<tspan dy="3.8" font-size="8.6">i</tspan><tspan dy="-3.8"> </tspan>/D<tspan dy="3.8" font-size="8.6">o</tspan><tspan dy="-3.8"> </tspan> = 0.6 from the annulus table</text>
<line x1="246.0" y1="159.6" x2="224.39999999999998" y2="152" stroke="#D2552B" stroke-width="1.8" marker-end="url(#a-hot)"/>
</svg>
