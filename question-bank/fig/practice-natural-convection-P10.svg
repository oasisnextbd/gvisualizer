<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 255" width="640" height="255" font-family="Helvetica, Arial, sans-serif">
<title>Cold horizontal plate facing up or down</title>
<defs>
<marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#1E2B3A"/></marker>
<marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#1E2B3A"/></marker>
<marker id="ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#D2552B"/></marker>
<marker id="as-hot" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#D2552B"/></marker>
<marker id="ah-cold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#0B7C8C"/></marker>
<marker id="as-cold" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#0B7C8C"/></marker>
<marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#9AA8B8"/></marker>
<marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#9AA8B8"/></marker>
<marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#B7840A"/></marker>
<marker id="as-acc" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#B7840A"/></marker>
<marker id="ah-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#55667D"/></marker>
<marker id="as-sec" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#55667D"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern>
<pattern id="mhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9AA8B8" stroke-width="1"/></pattern>
</defs>
<rect width="640" height="255" fill="#FFFFFF"/>
<text x="160" y="24" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1E2B3A">(i) Cold face up: weak</text>
<rect x="70" y="135" width="180" height="10" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.5"/>
<line x1="70" y1="135" x2="250" y2="135" stroke="#0B7C8C" stroke-width="4"/>
<rect x="70" y="145" width="180" height="9" fill="url(#hatch)" stroke="#C98A00" stroke-width="1"/>
<path d="M150,125.0 L76.0,125.0 Q54.0,125.0 54.0,153.0" fill="none" stroke="#0B7C8C" stroke-width="1.8" marker-end="url(#ah-cold)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M170,125.0 L244.0,125.0 Q266.0,125.0 266.0,153.0" fill="none" stroke="#0B7C8C" stroke-width="1.8" marker-end="url(#ah-cold)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M76.0,135.0 Q160,105.0 244.0,135.0" fill="none" stroke="#0B7C8C" stroke-width="1" stroke-dasharray="3 3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="480" y="24" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1E2B3A">(ii) Cold face down: strong</text>
<rect x="390" y="65" width="180" height="10" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.5"/>
<line x1="390" y1="75" x2="570" y2="75" stroke="#0B7C8C" stroke-width="4"/>
<rect x="390" y="56" width="180" height="9" fill="url(#hatch)" stroke="#C98A00" stroke-width="1"/>
<path d="M376.0,89.0 L464,85.0" fill="none" stroke="#0B7C8C" stroke-width="1.8" marker-end="url(#ah-cold)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M584.0,89.0 L496,85.0" fill="none" stroke="#0B7C8C" stroke-width="1.8" marker-end="url(#ah-cold)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M480,85.0 L480,145.0" fill="none" stroke="#0B7C8C" stroke-width="2.2" marker-end="url(#ah-cold)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M429.6,89.0 Q429.6,115.0 436.8,137.0" fill="none" stroke="#0B7C8C" stroke-width="1.5" marker-end="url(#ah-cold)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M530.4,89.0 Q530.4,115.0 523.2,137.0" fill="none" stroke="#0B7C8C" stroke-width="1.5" marker-end="url(#ah-cold)" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="70" y1="196" x2="250" y2="196" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#ah-grey)" marker-start="url(#as-grey)"/>
<text x="160" y="214.6" font-size="12" text-anchor="middle" fill="#55667D">1.0 m × 0.6 m,  L<tspan dy="3.6" font-size="8.6">c</tspan><tspan dy="-3.6">​</tspan> = A/p = 0.1875 m</text>
<text x="320" y="240" font-size="12" text-anchor="middle" fill="#55667D">Exposed face T<tspan dy="3.6" font-size="8.6">s</tspan><tspan dy="-3.6">​</tspan> = 4°C (teal), other face insulated; room air T<tspan dy="3.6" font-size="8.6">∞</tspan><tspan dy="-3.6">​</tspan> = 26°C.</text>
<line x1="320" y1="40" x2="320" y2="200" stroke="#9AA8B8" stroke-width="1" stroke-dasharray="3 4"/>
</svg>
