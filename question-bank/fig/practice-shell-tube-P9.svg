<text x="330" y="238" font-size="12" text-anchor="middle" fill="#1E2B3A">h<tspan dy="3.6" font-size="8.6">o</tspan><tspan dy="-3.6">​</tspan> ∝ Re<tspan dy="-4.6" font-size="8.6">0.55</tspan><tspan dy="4.6">​</tspan> → ×2<tspan dy="-4.6" font-size="8.6">0.55</tspan><tspan dy="4.6">​</tspan>;  ΔP<tspan dy="3.6" font-size="8.6">s</tspan><tspan dy="-3.6">​</tspan> ∝ f G<tspan dy="3.6" font-size="8.6">s</tspan><tspan dy="-3.6">​</tspan>² (N + 1) → roughly ×2<tspan dy="-4.6" font-size="8.6">1.81</tspan><tspan dy="4.6">​</tspan>×2 ≈ ×7</text>
