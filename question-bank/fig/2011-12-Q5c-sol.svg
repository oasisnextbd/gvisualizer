<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="Helvetica, Arial, sans-serif">
<title>Control volume for the 3-D heat conduction equation</title>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="a-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="a-cold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="a-vap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><pattern id="ins" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="metal" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA8B8" stroke-width="0.8"/></pattern></defs>
<rect width="640" height="380" fill="#FFFFFF"/>
<path d="M230,150 L300,95 L470,95 L400,150 Z" stroke="#1E2B3A" stroke-width="1.4" fill="#EEF1F5"/>
<path d="M400,150 L470,95 L470,235 L400,290 Z" stroke="#1E2B3A" stroke-width="1.4" fill="#DCE3EC"/>
<path d="M230,150 L400,150 L400,290 L230,290 Z" stroke="#1E2B3A" stroke-width="1.6" fill="#F6F8FB"/>
<path d="M230,290 L300,235 L300,95" stroke="#9AA8B8" stroke-width="1" fill="none" stroke-dasharray="4 3"/>
<path d="M300,235 L470,235" stroke="#9AA8B8" stroke-width="1" fill="none" stroke-dasharray="4 3"/>
<line x1="230" y1="312" x2="400" y2="312" stroke="#55667D" stroke-width="1" marker-end="url(#a-dim)" marker-start="url(#a-dim)"/><line x1="230" y1="307" x2="230" y2="317" stroke="#55667D" stroke-width="1"/><line x1="400" y1="307" x2="400" y2="317" stroke="#55667D" stroke-width="1"/><text x="315.0" y="328" font-size="13" fill="#55667D" text-anchor="middle">Δx</text>
<line x1="212" y1="150" x2="212" y2="290" stroke="#55667D" stroke-width="1" marker-end="url(#a-dim)" marker-start="url(#a-dim)"/><line x1="207" y1="150" x2="217" y2="150" stroke="#55667D" stroke-width="1"/><line x1="207" y1="290" x2="217" y2="290" stroke="#55667D" stroke-width="1"/><text x="205" y="224.0" font-size="13" fill="#55667D" text-anchor="end">Δz</text>
<line x1="414" y1="296" x2="484" y2="241" stroke="#55667D" stroke-width="1" marker-end="url(#a-dim)" marker-start="url(#a-dim)"/>
<text x="461.0" y="274.5" font-size="13" fill="#55667D">Δy</text>
<line x1="110" y1="190.0" x2="226" y2="190.0" stroke="#D2552B" stroke-width="2.4" marker-end="url(#a-hot)"/>
<text x="108" y="182.0" font-size="14" fill="#D2552B">Q<tspan dy="4.5" font-size="10.1">x</tspan><tspan dy="-4.5"> </tspan></text>
<line x1="440" y1="200.0" x2="540" y2="200.0" stroke="#D2552B" stroke-width="2.4" marker-end="url(#a-hot)"/>
<text x="490" y="190.0" font-size="14" fill="#D2552B" text-anchor="middle">Q<tspan dy="4.5" font-size="10.1">x+Δx</tspan><tspan dy="-4.5"> </tspan></text>
<line x1="335.0" y1="360" x2="335.0" y2="284" stroke="#D2552B" stroke-width="2.4" marker-end="url(#a-hot)"/>
<text x="343.0" y="354" font-size="14" fill="#D2552B">Q<tspan dy="4.5" font-size="10.1">z</tspan><tspan dy="-4.5"> </tspan></text>
<line x1="350.0" y1="122.5" x2="350.0" y2="52.5" stroke="#D2552B" stroke-width="2.4" marker-end="url(#a-hot)"/>
<text x="358.0" y="64.5" font-size="14" fill="#D2552B">Q<tspan dy="4.5" font-size="10.1">z+Δz</tspan><tspan dy="-4.5"> </tspan></text>
<line x1="190" y1="333" x2="258" y2="280" stroke="#D2552B" stroke-width="2.4" marker-end="url(#a-hot)"/>
<text x="190" y="330" font-size="14" fill="#D2552B" text-anchor="end">Q<tspan dy="4.5" font-size="10.1">y</tspan><tspan dy="-4.5"> </tspan></text>
<line x1="440" y1="135" x2="510" y2="80" stroke="#D2552B" stroke-width="2.4" marker-end="url(#a-hot)"/>
<text x="514" y="77" font-size="14" fill="#D2552B">Q<tspan dy="4.5" font-size="10.1">y+Δy</tspan><tspan dy="-4.5"> </tspan></text>
<text x="315.0" y="214.0" font-size="13" fill="#1E2B3A" text-anchor="middle">q̇ Δx Δy Δz</text>
<text x="315.0" y="234.0" font-size="11" fill="#55667D" text-anchor="middle">(generation)</text>
<text x="315.0" y="254.0" font-size="11" fill="#55667D" text-anchor="middle">stored: ρc (∂T/∂t) ΔV</text>
<line x1="40" y1="340" x2="90" y2="340" stroke="#1E2B3A" stroke-width="1.4" marker-end="url(#a-ink)"/>
<text x="94" y="344" font-size="13" fill="#1E2B3A">x</text>
<line x1="40" y1="340" x2="40" y2="290" stroke="#1E2B3A" stroke-width="1.4" marker-end="url(#a-ink)"/>
<text x="36" y="284" font-size="13" fill="#1E2B3A">z</text>
<line x1="40" y1="340" x2="72" y2="314" stroke="#1E2B3A" stroke-width="1.4" marker-end="url(#a-ink)"/>
<text x="76" y="312" font-size="13" fill="#1E2B3A">y</text>
<text x="620" y="30" font-size="12" fill="#55667D" text-anchor="end">Energy balance: Σ in − Σ out + generation = storage</text>
</svg>
