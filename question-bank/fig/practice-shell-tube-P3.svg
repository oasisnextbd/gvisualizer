<line x1="200" y1="107.5" x2="200" y2="220" stroke="#1E2B3A" stroke-width="3"/>
<line x1="280" y1="70" x2="280" y2="182.5" stroke="#1E2B3A" stroke-width="3"/>
<line x1="360" y1="107.5" x2="360" y2="220" stroke="#1E2B3A" stroke-width="3"/>
<line x1="120" y1="52" x2="200" y2="52" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#ah-grey)" marker-start="url(#as-grey)"/>
<text x="160" y="43" font-size="12" text-anchor="middle" fill="#55667D">B = 10 in</text>
<line x1="436" y1="70" x2="436" y2="220" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#ah-grey)" marker-start="url(#as-grey)"/>
<text x="445" y="149.2" font-size="12" fill="#55667D">ID = 25 in</text>
<path d="M80,90 C120,240 160,230 160,145.0 S200,50 240,145.0 S280,240 320,145.0" fill="none" stroke="#D2552B" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="240" y="244" font-size="12" text-anchor="middle" fill="#55667D">16 ft tubes; N + 1 = 12L/B crossings</text>
<text x="565" y="40" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1E2B3A">Pitch detail</text>
<circle cx="520" cy="110" r="30" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.4"/>
<circle cx="610" cy="110" r="30" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.4"/>
<line x1="520" y1="162" x2="610" y2="162" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#ah-grey)" marker-start="url(#as-grey)"/>
<text x="565" y="180.6" font-size="12" text-anchor="middle" fill="#55667D">P<tspan dy="3.6" font-size="8.6">T</tspan><tspan dy="-3.6">​</tspan> = 1¼ in</text>
<line x1="550" y1="110" x2="580" y2="110" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#ah-grey)" marker-start="url(#as-grey)"/>
<text x="565" y="101" font-size="12" text-anchor="middle" fill="#55667D"></text>
<text x="565" y="102" font-size="12" text-anchor="middle" fill="#B7840A">C′</text>
<text x="520" y="114" font-size="11" text-anchor="middle" fill="#1E2B3A">d<tspan dy="3.3" font-size="7.9">o</tspan><tspan dy="-3.3">​</tspan></text>
<text x="470" y="210" font-size="12" fill="#1E2B3A">C′ = P<tspan dy="3.6" font-size="8.6">T</tspan><tspan dy="-3.6">​</tspan> − d<tspan dy="3.6" font-size="8.6">o</tspan><tspan dy="-3.6">​</tspan> = ¼ in</text>
<text x="470" y="228" font-size="12" fill="#1E2B3A">a<tspan dy="3.6" font-size="8.6">s</tspan><tspan dy="-3.6">​</tspan> = ID·C′B/(144P<tspan dy="3.6" font-size="8.6">T</tspan><tspan dy="-3.6">​</tspan>)  ft²</text>
<text x="470" y="246" font-size="12" fill="#1E2B3A">D<tspan dy="3.6" font-size="8.6">e</tspan><tspan dy="-3.6">​</tspan> from the pitch (Kern Fig. 28)</text>
<text x="470" y="264" font-size="12" fill="#1E2B3A"></text>
<text x="470" y="282" font-size="12" fill="#1E2B3A">tube side: a<tspan dy="3.6" font-size="8.6">t</tspan><tspan dy="-3.6">​</tspan> = N<tspan dy="3.6" font-size="8.6">t</tspan><tspan dy="-3.6">​</tspan>a′<tspan dy="3.6" font-size="8.6">t</tspan><tspan dy="-3.6">​</tspan>/(144n)</text>
<text x="470" y="300" font-size="12" fill="#1E2B3A">238 tubes, 4 passes</text>
</svg>
