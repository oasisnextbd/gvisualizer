<line x1="60" y1="129.25" x2="420" y2="129.25" stroke="#9AA8B8" stroke-width="1"/>
<line x1="60" y1="145" x2="420" y2="145" stroke="#9AA8B8" stroke-width="1"/>
<line x1="60" y1="160.75" x2="420" y2="160.75" stroke="#9AA8B8" stroke-width="1"/>
<line x1="60" y1="176.5" x2="420" y2="176.5" stroke="#9AA8B8" stroke-width="1"/>
<line x1="60" y1="192.25" x2="420" y2="192.25" stroke="#9AA8B8" stroke-width="1"/>
