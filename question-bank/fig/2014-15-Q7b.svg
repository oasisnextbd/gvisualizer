<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" font-family="Helvetica, Arial, sans-serif">
<title>Film boiling on a horizontal polished bar</title>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="a-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="a-cold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="a-vap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><pattern id="ins" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="metal" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA8B8" stroke-width="0.8"/></pattern></defs>
<rect width="620" height="330" fill="#FFFFFF"/>
<rect x="20" y="20" width="340" height="280" rx="8" fill="#D9F0F2"/>
<text x="30" y="290" font-size="12" fill="#0B7C8C" font-weight="bold">water, 1 atm (T<tspan dy="3.8" font-size="8.6">sat</tspan><tspan dy="-3.8"> </tspan> = 100°C, bulk 25°C)</text>
<path d="M110,180 C110,55 270,55 270,180 C270,263 110,263 110,180 Z" stroke="#9AA8B8" stroke-width="1.4" fill="#EEF1F5" stroke-dasharray="4 3"/>
<circle cx="190" cy="180" r="75" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="2"/>
<text x="190" y="176" font-size="12" fill="#1E2B3A" text-anchor="middle" font-weight="bold">stainless bar</text>
<text x="190" y="194" font-size="11" fill="#55667D" text-anchor="middle">d = 50 mm, ε = 0.1</text>
<text x="190" y="210" font-size="11" fill="#D2552B" text-anchor="middle">T<tspan dy="3.5" font-size="7.9">s</tspan><tspan dy="-3.5"> </tspan> = 250°C</text>
<circle cx="176" cy="41" r="6" fill="#EEF1F5" stroke="#9AA8B8" stroke-width="1.2"/>
<circle cx="190" cy="55" r="6" fill="#EEF1F5" stroke="#9AA8B8" stroke-width="1.2"/>
<circle cx="204" cy="41" r="6" fill="#EEF1F5" stroke="#9AA8B8" stroke-width="1.2"/>
<text x="220" y="51" font-size="10" fill="#55667D">vapour leaves the top</text>
<line x1="271" y1="150" x2="380" y2="120" stroke="#9AA8B8" stroke-width="0.8"/>
<text x="384" y="112" font-size="12" fill="#9AA8B8" font-weight="bold">stable vapour film</text>
<text x="384" y="128" font-size="11" fill="#55667D">(ΔT<tspan dy="3.5" font-size="7.9">e</tspan><tspan dy="-3.5"> </tspan> = 150 K: film boiling)</text>
<text x="384" y="170" font-size="11" fill="#1E2B3A">conduction through the film:</text>
<text x="384" y="186" font-size="11" fill="#1E2B3A">h̄<tspan dy="3.5" font-size="7.9">conv</tspan><tspan dy="-3.5"> </tspan> from Nu<tspan dy="3.5" font-size="7.9">d</tspan><tspan dy="-3.5"> </tspan> = 0.62[…]<tspan dy="-4.4" font-size="7.9">1/4</tspan><tspan dy="4.4"> </tspan></text>
<text x="384" y="210" font-size="11" fill="#D2552B">radiation across the film:</text>
<text x="384" y="226" font-size="11" fill="#D2552B">h̄<tspan dy="3.5" font-size="7.9">rad</tspan><tspan dy="-3.5"> </tspan> = εσ(T<tspan dy="3.5" font-size="7.9">s</tspan><tspan dy="-3.5"> </tspan>⁴ − T<tspan dy="3.5" font-size="7.9">sat</tspan><tspan dy="-3.5"> </tspan>⁴)/(T<tspan dy="3.5" font-size="7.9">s</tspan><tspan dy="-3.5"> </tspan> − T<tspan dy="3.5" font-size="7.9">sat</tspan><tspan dy="-3.5"> </tspan>)</text>
<text x="384" y="256" font-size="12" fill="#B7840A" font-weight="bold">q′ = h̄ πd (T<tspan dy="3.8" font-size="8.6">s</tspan><tspan dy="-3.8"> </tspan> − T<tspan dy="3.8" font-size="8.6">sat</tspan><tspan dy="-3.8"> </tspan>)</text>
<line x1="263.56090966267163" y1="202.75505591292315" x2="290.31033135818865" y2="211.02962169944067" stroke="#D2552B" stroke-width="1.6" marker-end="url(#a-hot)"/>
<line x1="217.90154709470386" y1="251.76700961947643" x2="228.04756422005073" y2="277.8641040265588" stroke="#D2552B" stroke-width="1.6" marker-end="url(#a-hot)"/>
<line x1="144.68541397133836" y1="242.25422309410845" x2="128.2073826881887" y2="264.89212240105695" stroke="#D2552B" stroke-width="1.6" marker-end="url(#a-hot)"/>
<line x1="115.23622128348153" y1="198.42219834947664" x2="88.04939265929299" y2="205.12117956746815" stroke="#D2552B" stroke-width="1.6" marker-end="url(#a-hot)"/>
</svg>
