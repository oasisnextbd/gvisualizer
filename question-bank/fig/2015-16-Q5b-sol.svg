<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2B3A">
<title>Hollow sphere: radial conduction and its thermal resistance</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1E2B3A"/></marker>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#D2552B"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#0B7C8C"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#55667D"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#B7840A"/></marker>
<pattern id="ins" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern>
<pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#FBE2D6"/><path d="M0,0.5 H24 M0,6.5 H24 M12,0.5 V6.5 M0.5,6.5 V12 M24,6.5 V12" stroke="#D2552B" stroke-width="0.8" fill="none" opacity="0.7"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#FFF3D6"/><circle cx="2" cy="2" r="0.9" fill="#C98A00"/><circle cx="5.5" cy="5.5" r="0.9" fill="#C98A00"/></pattern>
<pattern id="dense" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#E9D3A6"/><circle cx="1" cy="1" r="0.8" fill="#8A6200"/><circle cx="3" cy="3" r="0.8" fill="#8A6200"/></pattern>
</defs>
<rect width="700" height="360" fill="#FFFFFF"/>
<circle cx="190" cy="190" r="140" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.4"/>
<circle cx="190" cy="190" r="60" fill="#FBE2D6" stroke="#1E2B3A" stroke-width="1.4"/>
<circle cx="190" cy="190" r="92" fill="none" stroke="#B7840A" stroke-width="1.2" stroke-dasharray="5 3"/>
<circle cx="190" cy="190" r="104" fill="none" stroke="#B7840A" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="190" y="218" text-anchor="middle" font-size="12">T<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan> at r<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan></text>
<line x1="250.1" y1="168.1" x2="310.3" y2="146.2" stroke="#D2552B" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="211.9" y1="129.9" x2="233.8" y2="69.7" stroke="#D2552B" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="129.9" y1="168.1" x2="69.7" y2="146.2" stroke="#D2552B" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="129.9" y1="211.9" x2="69.7" y2="233.8" stroke="#D2552B" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="168.1" y1="250.1" x2="146.2" y2="310.3" stroke="#D2552B" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="222" y1="245.4" x2="254" y2="300.9" stroke="#D2552B" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="190" y1="190" x2="160" y2="138" stroke="#1E2B3A" stroke-width="1" marker-end="url(#a)"/>
<text x="140" y="160" text-anchor="middle" font-size="12">r<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan></text>
<line x1="190" y1="190" x2="304.7" y2="270.3" stroke="#1E2B3A" stroke-width="1" marker-end="url(#a)"/>
<text x="290" y="285" font-size="12">r<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan></text>
<text x="380" y="252" font-size="12">Inner surface T<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan> at r<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan>, outer surface T<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan> at r<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan></text>
<text x="380" y="270" fill="#55667D" font-size="12">Conductivity k (constant)</text>
<text x="380" y="288" fill="#B7840A" font-size="12">Dashed: thin shell at radius r, thickness dr</text>
<text x="380" y="60">q = −k(4πr<tspan dy="-5" font-size="70%">2</tspan><tspan dy="5">​</tspan>) dT/dr = constant</text>
<text x="380" y="92" fill="#55667D" font-size="12">Separate and integrate from r<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan> to r<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan>:</text>
<text x="380" y="122">q = 4πk(T<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan> − T<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan>) / (1/r<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan> − 1/r<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan>)</text>
<text x="380" y="150">  = 4πkr<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan>r<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan>(T<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan> − T<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan>) / (r<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan> − r<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan>)</text>
<circle cx="390" cy="185" r="3.2" fill="#1E2B3A"/>
<text x="390" y="176" text-anchor="middle" font-size="12">T<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan></text>
<line x1="390" y1="185" x2="430" y2="185" stroke="#1E2B3A" stroke-width="1.6"/>
<path d="M430,185 L434,185 L440,179 L452,191 L464,179 L476,191 L488,179 L500,191 L506,185 L510,185" fill="none" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="470" y="211" text-anchor="middle" font-size="12">R<tspan dy="4" font-size="75%">sph</tspan><tspan dy="-4">​</tspan> = (r<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan> − r<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan>)/(4πkr<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan>r<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan>)</text>
<line x1="510" y1="185" x2="550" y2="185" stroke="#1E2B3A" stroke-width="1.6"/>
<circle cx="550" cy="185" r="3.2" fill="#1E2B3A"/>
<text x="550" y="176" text-anchor="middle" font-size="12">T<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan></text>
<text x="380" y="315" fill="#D2552B" font-size="12">Heat flows radially outward</text>
<text x="380" y="333" fill="#55667D" font-size="12">(T<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan> > T<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan>); the area 4πr<tspan dy="-5" font-size="70%">2</tspan><tspan dy="5">​</tspan> grows with r</text>
</svg>
