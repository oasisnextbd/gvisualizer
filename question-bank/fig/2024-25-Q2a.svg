<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2B3A">
<title>Hollow sphere: radial conduction through a thin shell dr</title>
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1E2B3A"/></marker>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#D2552B"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#0B7C8C"/></marker>
<pattern id="hA" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#EEF1F5"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA8B8" stroke-width="1.2"/></pattern>
<pattern id="hB" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#E4EEF0"/><line x1="0" y1="0" x2="0" y2="7" stroke="#7FA9AF" stroke-width="1.2"/></pattern>
</defs>
<rect width="700" height="330" fill="#FFFFFF"/>
<circle cx="165" cy="160" r="115" fill="#F3E3D9" stroke="#1E2B3A" stroke-width="2"/>
<circle cx="165" cy="160" r="58" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="2"/>
<circle cx="165" cy="160" r="88" fill="none" stroke="#D2552B" stroke-width="7" stroke-opacity="0.35"/>
<circle cx="165" cy="160" r="88" fill="none" stroke="#D2552B" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="165" y1="160" x2="124.0" y2="201.0" stroke="#1E2B3A" stroke-width="1.3" marker-end="url(#ai)"/>
<text x="125" y="182" font-size="14" text-anchor="middle" fill="#1E2B3A" font-style="italic">rᵢ</text>
<line x1="165" y1="160" x2="246.3" y2="241.3" stroke="#1E2B3A" stroke-width="1.3" marker-end="url(#ai)"/>
<text x="229" y="212" font-size="14" text-anchor="middle" fill="#1E2B3A" font-style="italic">rₒ</text>
<line x1="165" y1="160" x2="165" y2="72" stroke="#D2552B" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="173" y="116.0" font-size="14" text-anchor="start" fill="#D2552B" font-style="italic">r</text>
<text x="165" y="156" font-size="14" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Tᵢ</text>
<text x="165" y="202" font-size="12" text-anchor="start" fill="#1E2B3A"></text>
<text x="251.8" y="71.2" font-size="14" text-anchor="start" fill="#1E2B3A" font-weight="bold">Tₒ</text>
<text x="101.4" y="90.4" font-size="12.5" text-anchor="end" fill="#D2552B">shell dr</text>
<line x1="197.0" y1="104.6" x2="236.5" y2="36.2" stroke="#D2552B" stroke-width="2" marker-end="url(#ah)"/>
<line x1="225.1" y1="138.1" x2="299.4" y2="111.1" stroke="#D2552B" stroke-width="2" marker-end="url(#ah)"/>
<line x1="225.1" y1="181.9" x2="299.4" y2="208.9" stroke="#D2552B" stroke-width="2" marker-end="url(#ah)"/>
<text x="165" y="318" font-size="13" text-anchor="middle" fill="#D2552B">q radial outward (same q at every r)</text>
<text x="360" y="40" font-size="13" text-anchor="start" fill="#1E2B3A" font-weight="bold">Fourier's law on the shell (area 4πr²):</text>
<text x="360" y="64" font-size="13" text-anchor="start" fill="#1E2B3A">q = −k (4πr²) dT/dr = constant</text>
<text x="360" y="96" font-size="13" text-anchor="start" fill="#1E2B3A" font-weight="bold">Separate and integrate rᵢ → rₒ, Tᵢ → Tₒ:</text>
<text x="360" y="120" font-size="13" text-anchor="start" fill="#1E2B3A">q = 4πk (Tᵢ − Tₒ) rᵢ rₒ / (rₒ − rᵢ)</text>
<text x="360" y="152" font-size="13" text-anchor="start" fill="#1E2B3A" font-weight="bold">Thermal resistance:</text>
<text x="360" y="176" font-size="13" text-anchor="start" fill="#1E2B3A">R = (rₒ − rᵢ) / (4πk rᵢ rₒ)</text>
<text x="360" y="208" font-size="13" text-anchor="start" fill="#1E2B3A" font-weight="bold">Temperature profile (hyperbolic in r):</text>
<text x="360" y="232" font-size="13" text-anchor="start" fill="#1E2B3A">(T − Tᵢ)/(Tₒ − Tᵢ) = (1/rᵢ − 1/r)/(1/rᵢ − 1/rₒ)</text>
<circle cx="370" cy="285" r="3.5" fill="#1E2B3A"/><text x="370" y="307" font-size="13" text-anchor="middle" fill="#1E2B3A">Tᵢ</text>
<path d="M370,285 L460.0,285.0 L465.0,278.0 L475.0,292.0 L485.0,278.0 L495.0,292.0 L505.0,278.0 L515.0,292.0 L520.0,285.0 L610,285" fill="none" stroke="#1E2B3A" stroke-width="1.8"/>
<text x="490.0" y="272" font-size="12.5" text-anchor="middle" fill="#1E2B3A">R = (rₒ − rᵢ)/(4πk rᵢrₒ)</text>
<circle cx="610" cy="285" r="3.5" fill="#1E2B3A"/><text x="610" y="307" font-size="13" text-anchor="middle" fill="#1E2B3A">Tₒ</text>
</svg>
