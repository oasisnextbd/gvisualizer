<text x="96" y="140.156" font-size="11" text-anchor="start" fill="#55667D">ΔT<tspan dy="3.3" font-size="7.9">1</tspan><tspan dy="-3.3">​</tspan> = 230</text>
<line x1="280" y1="139.25" x2="280" y2="228.188" stroke="#9AA8B8" stroke-width="1" marker-end="url(#aG)" marker-start="url(#aGs)"/>
<text x="274" y="181.719" font-size="11" text-anchor="end" fill="#55667D">ΔT<tspan dy="3.3" font-size="7.9">2</tspan><tspan dy="-3.3">​</tspan> = 170</text>
<text x="185" y="290" font-size="12" text-anchor="middle" fill="#B7840A" font-weight="bold">LMTD = 198.5°F → A<tspan dy="3.6" font-size="8.6">o</tspan><tspan dy="-3.6">​</tspan> = 199 ft²</text>
<line x1="390" y1="250" x2="650" y2="250" stroke="#1E2B3A" stroke-width="1.5" marker-end="url(#aI)"/>
