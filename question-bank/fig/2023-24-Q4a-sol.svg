<text x="426" y="152.031" font-size="11" text-anchor="start" fill="#55667D">ΔT<tspan dy="3.3" font-size="7.9">1</tspan><tspan dy="-3.3">​</tspan> = 270</text>
<line x1="610" y1="139.25" x2="610" y2="204.438" stroke="#9AA8B8" stroke-width="1" marker-end="url(#aG)" marker-start="url(#aGs)"/>
<text x="604" y="169.844" font-size="11" text-anchor="end" fill="#55667D">ΔT<tspan dy="3.3" font-size="7.9">2</tspan><tspan dy="-3.3">​</tspan> = 130</text>
<text x="515" y="290" font-size="12" text-anchor="middle" fill="#B7840A" font-weight="bold">LMTD = 191.5°F → A<tspan dy="3.6" font-size="8.6">o</tspan><tspan dy="-3.6">​</tspan> = 206 ft²</text>
