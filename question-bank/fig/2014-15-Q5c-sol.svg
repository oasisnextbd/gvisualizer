<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Helvetica, Arial, sans-serif">
<title>Unit cells for the shell-side equivalent diameter: square and triangular pitch</title>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="a-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="a-cold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="a-vap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><pattern id="ins" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="metal" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA8B8" stroke-width="0.8"/></pattern></defs>
<rect width="680" height="380" fill="#FFFFFF"/>
<text x="165.0" y="30" font-size="14" fill="#1E2B3A" text-anchor="middle" font-weight="bold">Square pitch</text>
<rect x="90" y="100" width="150" height="150" rx="0" fill="#D9F0F2" stroke="#0B7C8C" stroke-width="1.6"/>
<circle cx="90" cy="100" r="40.0" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.6"/>
<circle cx="240" cy="100" r="40.0" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.6"/>
<circle cx="90" cy="250" r="40.0" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.6"/>
<circle cx="240" cy="250" r="40.0" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.6"/>
<rect x="90" y="100" width="150" height="150" rx="0" fill="none" stroke="#0B7C8C" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="165.0" y="179.0" font-size="11" fill="#0B7C8C" text-anchor="middle" font-weight="bold">free area</text>
<line x1="90" y1="306" x2="240" y2="306" stroke="#55667D" stroke-width="1" marker-end="url(#a-dim)" marker-start="url(#a-dim)"/><line x1="90" y1="301" x2="90" y2="311" stroke="#55667D" stroke-width="1"/><line x1="240" y1="301" x2="240" y2="311" stroke="#55667D" stroke-width="1"/><text x="165.0" y="322" font-size="13" fill="#55667D" text-anchor="middle">P<tspan dy="4.2" font-size="9.4">T</tspan><tspan dy="-4.2"> </tspan></text>
<line x1="200.0" y1="50.0" x2="280.0" y2="50.0" stroke="#55667D" stroke-width="1" marker-end="url(#a-dim)" marker-start="url(#a-dim)"/><line x1="200.0" y1="45.0" x2="200.0" y2="55.0" stroke="#55667D" stroke-width="1"/><line x1="280.0" y1="45.0" x2="280.0" y2="55.0" stroke="#55667D" stroke-width="1"/><text x="240.0" y="44.0" font-size="13" fill="#55667D" text-anchor="middle">d<tspan dy="4.2" font-size="9.4">o</tspan><tspan dy="-4.2"> </tspan></text>
<text x="165.0" y="346" font-size="12" fill="#55667D" text-anchor="middle">4 quarter tubes = 1 tube per cell</text>
<text x="470.0" y="30" font-size="14" fill="#1E2B3A" text-anchor="middle" font-weight="bold">Triangular pitch</text>
<path d="M395,250 L545,250 L470.0,120.1 Z" stroke="#0B7C8C" stroke-width="1.6" fill="#D9F0F2"/>
<circle cx="395" cy="250" r="40.0" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.6"/>
<circle cx="545" cy="250" r="40.0" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.6"/>
<circle cx="470.0" cy="120.0961894323342" r="40.0" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.6"/>
<path d="M395,250 L545,250 L470.0,120.1 Z" stroke="#0B7C8C" stroke-width="1.6" fill="none" stroke-dasharray="5 3"/>
<text x="470.0" y="210.69872981077808" font-size="11" fill="#0B7C8C" text-anchor="middle" font-weight="bold">free</text>
<line x1="395" y1="306" x2="545" y2="306" stroke="#55667D" stroke-width="1" marker-end="url(#a-dim)" marker-start="url(#a-dim)"/><line x1="395" y1="301" x2="395" y2="311" stroke="#55667D" stroke-width="1"/><line x1="545" y1="301" x2="545" y2="311" stroke="#55667D" stroke-width="1"/><text x="470.0" y="322" font-size="13" fill="#55667D" text-anchor="middle">P<tspan dy="4.2" font-size="9.4">T</tspan><tspan dy="-4.2"> </tspan></text>
<line x1="615" y1="120.0961894323342" x2="615" y2="250" stroke="#55667D" stroke-width="1" marker-end="url(#a-dim)" marker-start="url(#a-dim)"/><line x1="610" y1="120.0961894323342" x2="620" y2="120.0961894323342" stroke="#55667D" stroke-width="1"/><line x1="610" y1="250" x2="620" y2="250" stroke="#55667D" stroke-width="1"/><line x1="470.0" y1="120.0961894323342" x2="615" y2="120.0961894323342" stroke="#9AA8B8" stroke-width="0.8" stroke-dasharray="3 3"/><line x1="470.0" y1="250" x2="615" y2="250" stroke="#9AA8B8" stroke-width="0.8" stroke-dasharray="3 3"/><text x="622" y="189.0480947161671" font-size="12" fill="#55667D">0.86 P<tspan dy="3.8" font-size="8.6">T</tspan><tspan dy="-3.8"> </tspan></text>
<text x="470.0" y="346" font-size="12" fill="#55667D" text-anchor="middle">3 × 60° sectors = ½ tube per cell</text>
<text x="340.0" y="364" font-size="13" fill="#1E2B3A" text-anchor="middle" font-weight="bold">D<tspan dy="4.2" font-size="9.4">e</tspan><tspan dy="-4.2"> </tspan> = 4 × (free flow area) / (wetted perimeter)</text>
</svg>
