<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2B3A">
<title>Electric wire with a plastic cover and its resistance network</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1E2B3A"/></marker>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#D2552B"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#0B7C8C"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#55667D"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#B7840A"/></marker>
<pattern id="ins" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern>
<pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#FBE2D6"/><path d="M0,0.5 H24 M0,6.5 H24 M12,0.5 V6.5 M0.5,6.5 V12 M24,6.5 V12" stroke="#D2552B" stroke-width="0.8" fill="none" opacity="0.7"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#FFF3D6"/><circle cx="2" cy="2" r="0.9" fill="#C98A00"/><circle cx="5.5" cy="5.5" r="0.9" fill="#C98A00"/></pattern>
<pattern id="dense" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#E9D3A6"/><circle cx="1" cy="1" r="0.8" fill="#8A6200"/><circle cx="3" cy="3" r="0.8" fill="#8A6200"/></pattern>
</defs>
<rect width="680" height="450" fill="#FFFFFF"/>
<circle cx="160" cy="165" r="138" fill="#D9F0F2" opacity="0.55"/>
<circle cx="160" cy="165" r="112" fill="url(#ins)" stroke="#1E2B3A" stroke-width="1.3"/>
<circle cx="160" cy="165" r="52" fill="#FBE2D6" stroke="#1E2B3A" stroke-width="1.3"/>
<text x="160" y="181" text-anchor="middle" font-size="10.5">Wire</text>
<text x="160" y="193" text-anchor="middle" font-size="10.5">Q̇ = VI</text>
<text x="160" y="205" text-anchor="middle" font-size="10.5">= 80 W</text>
<line x1="160" y1="165" x2="135.6" y2="119.1" stroke="#1E2B3A" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="135.6" y1="119.1" x2="88.6" y2="30.8" stroke="#9AA8B8" stroke-width="0.9" stroke-dasharray="3 2"/>
<text x="84.6" y="26.8" text-anchor="end" font-size="12">r<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4"> = 1.5 mm</tspan></text>
<line x1="160" y1="165" x2="257" y2="109" stroke="#1E2B3A" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="257" y1="109" x2="291.6" y2="89" stroke="#9AA8B8" stroke-width="0.9" stroke-dasharray="3 2"/>
<text x="295.6" y="93" font-size="12">r<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4"> = 3.5 mm</tspan></text>
<circle cx="160" cy="165" r="2" fill="#1E2B3A"/>
<text x="28" y="307" fill="#0B7C8C" font-size="12">Medium T<tspan dy="4" font-size="75%">∞</tspan><tspan dy="-4"> = 30°C</tspan></text>
<text x="28" y="322" fill="#0B7C8C" font-size="12">h = 12 W/m²·°C</text>
<rect x="400" y="48" width="22" height="16" fill="#FBE2D6" stroke="#1E2B3A" stroke-width="1"/>
<text x="430" y="60" font-size="12.5">Wire, D = 3 mm, L = 5 m</text>
<text x="430" y="75" fill="#55667D" font-size="12">I = 10 A, V = 8 V</text>
<rect x="400" y="94" width="22" height="16" fill="url(#ins)" stroke="#1E2B3A" stroke-width="1"/>
<text x="430" y="106" font-size="12.5">Plastic cover, 2 mm thick</text>
<text x="430" y="121" fill="#55667D" font-size="12">k = 0.15 W/m·°C</text>
<circle cx="400" cy="200" r="3.2" fill="#1E2B3A"/>
<text x="400" y="191" text-anchor="middle" font-size="12">T<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">​</tspan> (interface)</text>
<line x1="400" y1="200" x2="420" y2="200" stroke="#1E2B3A" stroke-width="1.6"/>
<path d="M420,200 L424,200 L428.3,194 L437,206 L445.7,194 L454.3,206 L463,194 L471.7,206 L476,200 L480,200" fill="none" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="450" y="226" text-anchor="middle" font-size="12">R<tspan dy="4" font-size="75%">plastic</tspan><tspan dy="-4">​</tspan></text>
<text x="450" y="242" text-anchor="middle" fill="#55667D" font-size="11">0.1798 °C/W</text>
<line x1="480" y1="200" x2="500" y2="200" stroke="#1E2B3A" stroke-width="1.6"/>
<circle cx="500" cy="200" r="3.2" fill="#1E2B3A"/>
<text x="500" y="191" text-anchor="middle" font-size="12">T<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan></text>
<line x1="500" y1="200" x2="520" y2="200" stroke="#1E2B3A" stroke-width="1.6"/>
<path d="M520,200 L524,200 L528.3,194 L537,206 L545.7,194 L554.3,206 L563,194 L571.7,206 L576,200 L580,200" fill="none" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="550" y="226" text-anchor="middle" font-size="12">R<tspan dy="4" font-size="75%">conv</tspan><tspan dy="-4">​</tspan></text>
<text x="550" y="242" text-anchor="middle" fill="#55667D" font-size="11">0.7579 °C/W</text>
<line x1="580" y1="200" x2="600" y2="200" stroke="#1E2B3A" stroke-width="1.6"/>
<circle cx="600" cy="200" r="3.2" fill="#1E2B3A"/>
<text x="600" y="191" text-anchor="middle" font-size="12">T<tspan dy="4" font-size="75%">∞</tspan><tspan dy="-4">​</tspan></text>
<text x="400" y="270" fill="#55667D" font-size="11.5">R<tspan dy="4" font-size="75%">plastic</tspan><tspan dy="-4">​</tspan> = ln(r<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan>/r<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">​</tspan>)/(2πkL)</text>
<text x="400" y="288" fill="#55667D" font-size="11.5">R<tspan dy="4" font-size="75%">conv</tspan><tspan dy="-4">​</tspan> = 1/(h·2πr<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan>L)</text>
<text x="400" y="306" fill="#55667D" font-size="11.5">Doubling the cover: r<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan> → 5.5 mm</text>
<text x="20" y="435" fill="#55667D" font-size="10">Not to scale</text>
</svg>
