<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2B3A">
<title>Pipe with a two-material insulation blanket, A on top and B below (Fig. for Q7(a))</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1E2B3A"/></marker>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#D2552B"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#0B7C8C"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#55667D"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#B7840A"/></marker>
<pattern id="ins" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern>
<pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#FBE2D6"/><path d="M0,0.5 H24 M0,6.5 H24 M12,0.5 V6.5 M0.5,6.5 V12 M24,6.5 V12" stroke="#D2552B" stroke-width="0.8" fill="none" opacity="0.7"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#FFF3D6"/><circle cx="2" cy="2" r="0.9" fill="#C98A00"/><circle cx="5.5" cy="5.5" r="0.9" fill="#C98A00"/></pattern>
<pattern id="dense" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#E9D3A6"/><circle cx="1" cy="1" r="0.8" fill="#8A6200"/><circle cx="3" cy="3" r="0.8" fill="#8A6200"/></pattern>
</defs>
<rect width="600" height="320" fill="#FFFFFF"/>
<path d="M180,160 A120,120 0 0 1 420,160 L360,160 A60,60 0 0 0 240,160 Z" fill="url(#dots)" stroke="#1E2B3A" stroke-width="1.6"/>
<path d="M180,160 A120,120 0 0 0 420,160 L360,160 A60,60 0 0 1 240,160 Z" fill="url(#dense)" stroke="#1E2B3A" stroke-width="1.6"/>
<line x1="180" y1="160" x2="240" y2="160" stroke="#1E2B3A" stroke-width="2.4"/>
<line x1="360" y1="160" x2="420" y2="160" stroke="#1E2B3A" stroke-width="2.4"/>
<circle cx="300" cy="160" r="60" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="2"/>
<text x="300" y="74" text-anchor="middle" font-weight="bold" font-size="18">A</text>
<text x="300" y="260" text-anchor="middle" font-weight="bold" font-size="18">B</text>
<line x1="300" y1="160" x2="338.6" y2="114" stroke="#1E2B3A" stroke-width="1.4" marker-end="url(#a)"/>
<text x="318" y="140" font-size="12">1</text>
<line x1="300" y1="160" x2="412.8" y2="201" stroke="#1E2B3A" stroke-width="1.4" marker-end="url(#a)"/>
<text x="350" y="192" font-size="12">2</text>
<circle cx="300" cy="160" r="2.5" fill="#1E2B3A"/>
<line x1="338.6" y1="114" x2="450" y2="60" stroke="#1E2B3A" stroke-width="1.2"/>
<text x="455" y="66" font-size="17">r<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4"> = 50 mm</tspan></text>
<line x1="412.8" y1="201" x2="450" y2="210" stroke="#1E2B3A" stroke-width="1.2"/>
<text x="455" y="216" font-size="17">r<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4"> = 100 mm</tspan></text>
<line x1="260" y1="55" x2="200" y2="50" stroke="#1E2B3A" stroke-width="1.2"/>
<text x="195" y="50" text-anchor="end" font-size="17">k<tspan dy="4" font-size="75%">A</tspan><tspan dy="-4"> = 2 W/m·K</tspan></text>
<line x1="240" y1="250" x2="200" y2="250" stroke="#1E2B3A" stroke-width="1.2"/>
<text x="195" y="258" text-anchor="end" font-size="17">k<tspan dy="4" font-size="75%">B</tspan><tspan dy="-4"> = 0.25 W/m·K</tspan></text>
<text x="300" y="308" text-anchor="middle" fill="#55667D">Fig. for Q 7(a)</text>
</svg>
