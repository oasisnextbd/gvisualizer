<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2B3A">
<title>Two slabs with a rough contact zone and the resistance circuit</title>
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1E2B3A"/></marker>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#D2552B"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#0B7C8C"/></marker>
<pattern id="hA" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#EEF1F5"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA8B8" stroke-width="1.2"/></pattern>
<pattern id="hB" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#E4EEF0"/><line x1="0" y1="0" x2="0" y2="7" stroke="#7FA9AF" stroke-width="1.2"/></pattern>
</defs>
<rect width="720" height="420" fill="#FFFFFF"/>
<rect x="120" y="50" width="180" height="200" fill="url(#hA)" stroke="#1E2B3A" stroke-width="1.5"/>
<rect x="360" y="50" width="180" height="200" fill="url(#hB)" stroke="#1E2B3A" stroke-width="1.5"/>
<rect x="300" y="50" width="60" height="30.0" fill="url(#hA)" stroke="#1E2B3A" stroke-width="1.2"/>
<rect x="300" y="80.0" width="60" height="140.0" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.2"/>
<rect x="300" y="220.0" width="60" height="30.0" fill="url(#hB)" stroke="#1E2B3A" stroke-width="1.2"/>
<text x="330.0" y="70.0" font-size="11.5" text-anchor="middle" fill="#1E2B3A" font-weight="bold">A₁ 15%</text>
<text x="330.0" y="146.0" font-size="12" text-anchor="middle" fill="#0B7C8C" font-weight="bold">air</text>
<text x="330.0" y="162.0" font-size="12" text-anchor="middle" fill="#0B7C8C" font-weight="bold">gap C</text>
<text x="330.0" y="178.0" font-size="12" text-anchor="middle" fill="#0B7C8C" font-weight="bold">70%</text>
<text x="330.0" y="240.0" font-size="11.5" text-anchor="middle" fill="#1E2B3A" font-weight="bold">B₁ 15%</text>
<text x="210.0" y="144.0" font-size="14" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Slab A</text>
<text x="210.0" y="163.0" font-size="12.5" text-anchor="middle" fill="#1E2B3A">k = 14.5 W/m°C</text>
<text x="450.0" y="144.0" font-size="14" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Slab B</text>
<text x="450.0" y="163.0" font-size="12.5" text-anchor="middle" fill="#1E2B3A">k = 210 W/m°C</text>
<text x="112" y="146.0" font-size="13" text-anchor="end" fill="#D2552B" font-weight="bold">t₁ =</text>
<text x="112" y="163.0" font-size="13" text-anchor="end" fill="#D2552B" font-weight="bold">220°C</text>
<text x="548" y="146.0" font-size="13" text-anchor="start" fill="#0B7C8C" font-weight="bold">t₂ =</text>
<text x="548" y="163.0" font-size="13" text-anchor="start" fill="#0B7C8C" font-weight="bold">30°C</text>
<line x1="120" y1="264" x2="300" y2="264" stroke="#55667D" stroke-width="1" marker-start="url(#ai)" marker-end="url(#ai)"/>
<text x="210.0" y="280" font-size="12" text-anchor="middle" fill="#55667D">L_A = 120 mm</text>
<line x1="360" y1="264" x2="540" y2="264" stroke="#55667D" stroke-width="1" marker-start="url(#ai)" marker-end="url(#ai)"/>
<text x="450.0" y="280" font-size="12" text-anchor="middle" fill="#55667D">L_B = 120 mm</text>
<line x1="300" y1="38" x2="360" y2="38" stroke="#55667D" stroke-width="1" marker-start="url(#ai)" marker-end="url(#ai)"/>
<text x="330.0" y="54" font-size="12" text-anchor="middle" fill="#55667D"></text>
<text x="330.0" y="32" font-size="11.5" text-anchor="middle" fill="#55667D">0.025 mm (enlarged)</text>
<line x1="140" y1="70" x2="520" y2="70" stroke="#D2552B" stroke-width="2" marker-end="url(#ah)" stroke-opacity="0.9"/>
<text x="144" y="65" font-size="13" text-anchor="start" fill="#D2552B" font-weight="bold" font-style="italic">q</text>
<text x="20" y="300" font-size="13" text-anchor="start" fill="#1E2B3A" font-weight="bold">Resistance circuit (per m² of face area):</text>
<circle cx="50" cy="362" r="3.5" fill="#D2552B"/><text x="50" y="384" font-size="13" text-anchor="middle" fill="#D2552B">t₁</text>
<path d="M50,362 L95.0,362.0 L100.0,355.0 L110.0,369.0 L120.0,355.0 L130.0,369.0 L140.0,355.0 L150.0,369.0 L155.0,362.0 L200,362" fill="none" stroke="#1E2B3A" stroke-width="1.8"/>
<text x="125.0" y="349" font-size="12.5" text-anchor="middle" fill="#1E2B3A">R_A = L_A/k_A</text>
<circle cx="200" cy="362" r="3.5" fill="#1E2B3A"/><line x1="210" y1="324" x2="210" y2="400" stroke="#1E2B3A" stroke-width="1.8"/>
<line x1="450" y1="324" x2="450" y2="400" stroke="#1E2B3A" stroke-width="1.8"/>
<line x1="200" y1="362" x2="210" y2="362" stroke="#1E2B3A" stroke-width="1.8"/><line x1="450" y1="362" x2="460" y2="362" stroke="#1E2B3A" stroke-width="1.8"/>
<path d="M210,324 L300.0,324.0 L305.0,317.0 L315.0,331.0 L325.0,317.0 L335.0,331.0 L345.0,317.0 L355.0,331.0 L360.0,324.0 L450,324" fill="none" stroke="#1E2B3A" stroke-width="1.8"/>
<text x="330.0" y="311" font-size="12.5" text-anchor="middle" fill="#1E2B3A"></text>
<text x="330" y="313" font-size="11.5" text-anchor="middle" fill="#1E2B3A">R_A1 = L_c/(k_A·0.15)</text>
<path d="M210,362 L300.0,362.0 L305.0,355.0 L315.0,369.0 L325.0,355.0 L335.0,369.0 L345.0,355.0 L355.0,369.0 L360.0,362.0 L450,362" fill="none" stroke="#0B7C8C" stroke-width="1.8"/>
<text x="330.0" y="349" font-size="12.5" text-anchor="middle" fill="#0B7C8C"></text>
<text x="330" y="351" font-size="11.5" text-anchor="middle" fill="#0B7C8C">R_C = L_c/(k_air·0.70)</text>
<path d="M210,400 L300.0,400.0 L305.0,393.0 L315.0,407.0 L325.0,393.0 L335.0,407.0 L345.0,393.0 L355.0,407.0 L360.0,400.0 L450,400" fill="none" stroke="#1E2B3A" stroke-width="1.8"/>
<text x="330.0" y="387" font-size="12.5" text-anchor="middle" fill="#1E2B3A"></text>
<text x="330" y="389" font-size="11.5" text-anchor="middle" fill="#1E2B3A">R_B1 = L_c/(k_B·0.15)</text>
<circle cx="460" cy="362" r="3.5" fill="#1E2B3A"/><path d="M460,362 L500.0,362.0 L505.0,355.0 L515.0,369.0 L525.0,355.0 L535.0,369.0 L545.0,355.0 L555.0,369.0 L560.0,362.0 L600,362" fill="none" stroke="#1E2B3A" stroke-width="1.8"/>
<text x="530.0" y="349" font-size="12.5" text-anchor="middle" fill="#1E2B3A">R_B = L_B/k_B</text>
<circle cx="600" cy="362" r="3.5" fill="#0B7C8C"/><text x="600" y="384" font-size="13" text-anchor="middle" fill="#0B7C8C">t₂</text>
<text x="200" y="418" font-size="12" text-anchor="start" fill="#1E2B3A"></text>
<text x="20" y="412" font-size="12.5" text-anchor="start" fill="#55667D">Contact zone = three parallel paths, in series with the two slabs.</text>
</svg>
