<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="Helvetica, Arial, sans-serif">
<title>Annulus of a 3 in × 2 in IPS double-pipe exchanger</title>
<defs>
<marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#1E2B3A"/></marker>
<marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#1E2B3A"/></marker>
<marker id="ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#D2552B"/></marker>
<marker id="as-hot" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#D2552B"/></marker>
<marker id="ah-cold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#0B7C8C"/></marker>
<marker id="as-cold" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#0B7C8C"/></marker>
<marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#9AA8B8"/></marker>
<marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#9AA8B8"/></marker>
<marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#B7840A"/></marker>
<marker id="as-acc" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#B7840A"/></marker>
<marker id="ah-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#55667D"/></marker>
<marker id="as-sec" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#55667D"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern>
<pattern id="mhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9AA8B8" stroke-width="1"/></pattern>
</defs>
<rect width="560" height="300" fill="#FFFFFF"/>
<circle cx="170" cy="150" r="105" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.5"/>
<circle cx="170" cy="150" r="100" fill="#FBE2D6" stroke="#1E2B3A" stroke-width="1.5"/>
<circle cx="170" cy="150" r="78" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.5"/>
<circle cx="170" cy="150" r="67" fill="#D9F0F2" stroke="#1E2B3A" stroke-width="1.5"/>
<line x1="70" y1="272" x2="270" y2="272" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#ah-grey)" marker-start="url(#as-grey)"/>
<text x="170" y="290.6" font-size="12" text-anchor="middle" fill="#55667D">D<tspan dy="3.6" font-size="8.6">2</tspan><tspan dy="-3.6">​</tspan> = 3.068 in (outer pipe ID)</text>
<line x1="70" y1="150" x2="70" y2="276" stroke="#9AA8B8" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="270" y1="150" x2="270" y2="276" stroke="#9AA8B8" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="92" y1="32" x2="248" y2="32" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#ah-grey)" marker-start="url(#as-grey)"/>
<text x="170" y="23" font-size="12" text-anchor="middle" fill="#55667D">D<tspan dy="3.6" font-size="8.6">1</tspan><tspan dy="-3.6">​</tspan> = 2.38 in (inner pipe OD)</text>
<line x1="92" y1="150" x2="92" y2="28" stroke="#9AA8B8" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="248" y1="150" x2="248" y2="28" stroke="#9AA8B8" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="103" y1="150" x2="237" y2="150" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#ah-grey)" marker-start="url(#as-grey)"/>
<text x="170" y="141" font-size="12" text-anchor="middle" fill="#55667D"></text>
<text x="170" y="146" font-size="12" text-anchor="middle" fill="#1E2B3A">D = 2.067 in</text>
<text x="170" y="64" font-size="11.5" text-anchor="middle" fill="#D2552B">annulus</text>
<text x="320" y="80" font-size="12.5" fill="#1E2B3A">a<tspan dy="3.8" font-size="9.0">a</tspan><tspan dy="-3.8">​</tspan> = π(D<tspan dy="3.8" font-size="9.0">2</tspan><tspan dy="-3.8">​</tspan>² − D<tspan dy="3.8" font-size="9.0">1</tspan><tspan dy="-3.8">​</tspan>²)/4</text>
<text x="320" y="99" font-size="12.5" fill="#1E2B3A">a<tspan dy="3.8" font-size="9.0">p</tspan><tspan dy="-3.8">​</tspan> = πD²/4</text>
<text x="320" y="118" font-size="12.5" fill="#1E2B3A"></text>
<text x="320" y="137" font-size="12.5" fill="#1E2B3A">heat transfer (wetted by D<tspan dy="3.8" font-size="9.0">1</tspan><tspan dy="-3.8">​</tspan>):</text>
<text x="320" y="156" font-size="12.5" fill="#1E2B3A">D<tspan dy="3.8" font-size="9.0">e</tspan><tspan dy="-3.8">​</tspan> = (D<tspan dy="3.8" font-size="9.0">2</tspan><tspan dy="-3.8">​</tspan>² − D<tspan dy="3.8" font-size="9.0">1</tspan><tspan dy="-3.8">​</tspan>²)/D<tspan dy="3.8" font-size="9.0">1</tspan><tspan dy="-3.8">​</tspan></text>
<text x="320" y="175" font-size="12.5" fill="#1E2B3A"></text>
<text x="320" y="194" font-size="12.5" fill="#1E2B3A">pressure drop (both walls):</text>
<text x="320" y="213" font-size="12.5" fill="#1E2B3A">D′<tspan dy="3.8" font-size="9.0">e</tspan><tspan dy="-3.8">​</tspan> = D<tspan dy="3.8" font-size="9.0">2</tspan><tspan dy="-3.8">​</tspan> − D<tspan dy="3.8" font-size="9.0">1</tspan><tspan dy="-3.8">​</tspan></text>
</svg>
