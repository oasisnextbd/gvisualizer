<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2B3A">
<title>Liquid-nitrogen spherical tank with superinsulation</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1E2B3A"/></marker>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#D2552B"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#0B7C8C"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#55667D"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#B7840A"/></marker>
<pattern id="ins" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern>
<pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#FBE2D6"/><path d="M0,0.5 H24 M0,6.5 H24 M12,0.5 V6.5 M0.5,6.5 V12 M24,6.5 V12" stroke="#D2552B" stroke-width="0.8" fill="none" opacity="0.7"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#FFF3D6"/><circle cx="2" cy="2" r="0.9" fill="#C98A00"/><circle cx="5.5" cy="5.5" r="0.9" fill="#C98A00"/></pattern>
<pattern id="dense" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#E9D3A6"/><circle cx="1" cy="1" r="0.8" fill="#8A6200"/><circle cx="3" cy="3" r="0.8" fill="#8A6200"/></pattern>
</defs>
<rect width="680" height="400" fill="#FFFFFF"/>
<circle cx="170" cy="175" r="151" fill="#FFFFFF" opacity="0.55"/>
<circle cx="170" cy="175" r="125" fill="url(#ins)" stroke="#1E2B3A" stroke-width="1.3"/>
<circle cx="170" cy="175" r="95" fill="#D9F0F2" stroke="#1E2B3A" stroke-width="1.3"/>
<text x="170" y="191" text-anchor="middle" font-size="10.5">Liquid N₂</text>
<text x="170" y="203" text-anchor="middle" font-size="10.5">−196°C</text>
<text x="170" y="215" text-anchor="middle" font-size="10.5">h<tspan dy="4" font-size="75%">fg</tspan><tspan dy="-4">​</tspan> = 200 kJ/kg</text>
<line x1="170" y1="175" x2="125.4" y2="91.1" stroke="#1E2B3A" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="125.4" y1="91.1" x2="92.5" y2="29.3" stroke="#9AA8B8" stroke-width="0.9" stroke-dasharray="3 2"/>
<text x="88.5" y="25.3" text-anchor="end" font-size="12">r<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4"> = 0.305 m</tspan></text>
<line x1="170" y1="175" x2="272.4" y2="103.3" stroke="#1E2B3A" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="272.4" y1="103.3" x2="305.2" y2="80.4" stroke="#9AA8B8" stroke-width="0.9" stroke-dasharray="3 2"/>
<text x="309.2" y="84.4" font-size="12">r<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4"> = 0.330 m</tspan></text>
<circle cx="170" cy="175" r="2" fill="#1E2B3A"/>
<text x="25" y="330" fill="#0B7C8C" font-size="12">Outer surface held at 21°C;  tank ID = 0.61 m</text>
<rect x="400" y="78" width="22" height="16" fill="url(#ins)" stroke="#1E2B3A" stroke-width="1"/>
<text x="430" y="90" font-size="12.5">Superinsulation, 2.5 cm thick</text>
<text x="430" y="105" fill="#55667D" font-size="12">k = 2 × 10⁻⁴ W/m·°C</text>
<rect x="400" y="124" width="22" height="16" fill="#D9F0F2" stroke="#1E2B3A" stroke-width="1"/>
<text x="430" y="136" font-size="12.5">Liquid nitrogen at −196°C</text>
<text x="430" y="151" fill="#55667D" font-size="12">tank wall at the LN₂ temperature</text>
<circle cx="400" cy="230" r="3.2" fill="#1E2B3A"/>
<text x="400" y="221" text-anchor="middle" font-size="12">T<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">​</tspan> = −196°C</text>
<line x1="400" y1="230" x2="430" y2="230" stroke="#1E2B3A" stroke-width="1.6"/>
<path d="M430,230 L434,230 L440,224 L452,236 L464,224 L476,236 L488,224 L500,236 L506,230 L510,230" fill="none" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="470" y="256" text-anchor="middle" font-size="12">R<tspan dy="4" font-size="75%">sph</tspan><tspan dy="-4">​</tspan> = (r<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan> − r<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">​</tspan>)/(4πkr<tspan dy="4" font-size="75%">1</tspan><tspan dy="-4">​</tspan>r<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan>)</text>
<line x1="510" y1="230" x2="540" y2="230" stroke="#1E2B3A" stroke-width="1.6"/>
<circle cx="540" cy="230" r="3.2" fill="#1E2B3A"/>
<text x="540" y="221" text-anchor="middle" font-size="12">T<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan> = 21°C</text>
<text x="400" y="310" font-size="12.5">Boil-off: ṁ = Q̇ / h<tspan dy="4" font-size="75%">fg</tspan><tspan dy="-4">​</tspan></text>
<text x="20" y="385" fill="#55667D" font-size="10">Sphere cross-section, not to scale</text>
</svg>
