<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" width="700" height="410" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2B3A">
<title>Triangular-pitch unit cell for the shell-side equivalent diameter</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1E2B3A"/></marker>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#D2552B"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#0B7C8C"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#55667D"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#B7840A"/></marker>
<pattern id="ins" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern>
<pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#FBE2D6"/><path d="M0,0.5 H24 M0,6.5 H24 M12,0.5 V6.5 M0.5,6.5 V12 M24,6.5 V12" stroke="#D2552B" stroke-width="0.8" fill="none" opacity="0.7"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#FFF3D6"/><circle cx="2" cy="2" r="0.9" fill="#C98A00"/><circle cx="5.5" cy="5.5" r="0.9" fill="#C98A00"/></pattern>
<pattern id="dense" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#E9D3A6"/><circle cx="1" cy="1" r="0.8" fill="#8A6200"/><circle cx="3" cy="3" r="0.8" fill="#8A6200"/></pattern>
</defs>
<rect width="700" height="410" fill="#FFFFFF"/>
<path d="M150,270 L305,270 L227.5,135.8 Z" fill="#D9F0F2" stroke="#B7840A" stroke-width="1.4" stroke-dasharray="5 3"/>
<circle cx="150" cy="270" r="62" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.3"/>
<circle cx="305" cy="270" r="62" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.3"/>
<circle cx="227.5" cy="135.8" r="62" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.3"/>
<path d="M212,270 A62,62 0 0 0 181,216.3" fill="none" stroke="#B7840A" stroke-width="3"/>
<path d="M274,216.3 A62,62 0 0 0 243,270" fill="none" stroke="#B7840A" stroke-width="3"/>
<path d="M196.5,189.5 A62,62 0 0 0 258.5,189.5" fill="none" stroke="#B7840A" stroke-width="3"/>
<line x1="150" y1="350" x2="305" y2="350" stroke="#55667D" stroke-width="1" marker-end="url(#ag)" marker-start="url(#ag)"/>
<text x="227.5" y="365" text-anchor="middle" fill="#55667D" font-size="12">P<tspan dy="4" font-size="75%">T</tspan><tspan dy="-4">​</tspan> = d + C' = 2.5 in</text>
<line x1="212" y1="270" x2="243" y2="270" stroke="#1E2B3A" stroke-width="1" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="227.5" y1="273" x2="227.5" y2="376" stroke="#9AA8B8" stroke-width="0.9"/>
<text x="227.5" y="390" text-anchor="middle" font-size="12">C' = 0.5 in</text>
<line x1="389" y1="135.8" x2="389" y2="270" stroke="#55667D" stroke-width="1" marker-end="url(#ag)" marker-start="url(#ag)"/>
<text x="395" y="206.9" fill="#55667D" font-size="12">0.86 P<tspan dy="4" font-size="75%">T</tspan><tspan dy="-4">​</tspan></text>
<line x1="235.5" y1="135.8" x2="393" y2="135.8" stroke="#9AA8B8" stroke-width="0.8" stroke-dasharray="3 2"/>
<line x1="165.5" y1="135.8" x2="289.5" y2="135.8" stroke="#1E2B3A" stroke-width="1" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="227.5" y="127.8" text-anchor="middle" font-size="12">d = 2 in</text>
<text x="470" y="120" font-size="12.5">Unit cell: equilateral triangle</text>
<text x="470" y="138" font-size="12.5">containing half a tube</text>
<text x="470" y="166" fill="#0B7C8C" font-size="12">Shaded: free-flow area</text>
<text x="470" y="184" fill="#B7840A" font-size="12">Orange arcs: wetted perimeter</text>
<text x="470" y="202" fill="#55667D" font-size="12">(½πd; the shell is ignored)</text>
<text x="470" y="236" font-size="12.5">D<tspan dy="4" font-size="75%">e</tspan><tspan dy="-4">​</tspan> = 4 × flow area / wetted perimeter</text>
</svg>
