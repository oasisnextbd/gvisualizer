<rect x="104" y="40" width="16" height="200" fill="url(#mhatch)" stroke="#1E2B3A" stroke-width="1.4"/>
<rect x="460" y="40" width="16" height="200" fill="url(#mhatch)" stroke="#1E2B3A" stroke-width="1.4"/>
