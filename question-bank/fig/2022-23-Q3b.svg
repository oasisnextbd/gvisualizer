<text x="290" y="224" font-size="12" text-anchor="middle" fill="#55667D">L = 300 mm</text>
<text x="120" y="268" font-size="14" text-anchor="middle" fill="#D2552B">T<tspan dy="4.2" font-size="10.1">1</tspan><tspan dy="-4.2">​</tspan> = 150°C</text>
<text x="460" y="268" font-size="14" text-anchor="middle" fill="#D2552B">T<tspan dy="4.2" font-size="10.1">2</tspan><tspan dy="-4.2">​</tspan> = 100°C</text>
