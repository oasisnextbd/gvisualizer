<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="Helvetica, Arial, sans-serif">
<title>Fixed-tubesheet, U-tube and floating-head exchangers</title>
<defs>
<marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#1E2B3A"/></marker>
<marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#1E2B3A"/></marker>
<marker id="ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#D2552B"/></marker>
<marker id="as-hot" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#D2552B"/></marker>
<marker id="ah-cold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#0B7C8C"/></marker>
<marker id="as-cold" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#0B7C8C"/></marker>
<marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#9AA8B8"/></marker>
<marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#9AA8B8"/></marker>
<marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#B7840A"/></marker>
<marker id="as-acc" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#B7840A"/></marker>
<marker id="ah-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#55667D"/></marker>
<marker id="as-sec" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#55667D"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern>
<pattern id="mhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9AA8B8" stroke-width="1"/></pattern>
</defs>
<rect width="700" height="470" fill="#FFFFFF"/>
<text x="20" y="36" font-size="13" font-weight="bold" fill="#1E2B3A">(a) Fixed tubesheet (BEM)</text>
<text x="680" y="36" font-size="11.5" text-anchor="end" fill="#55667D">cheap; expansion bellows if shell–tube ΔT is large</text>
<rect x="150" y="70" width="400" height="70" fill="#F4F6F9" stroke="#1E2B3A" stroke-width="2"/>
<rect x="142" y="62" width="8" height="86" fill="url(#mhatch)" stroke="#1E2B3A" stroke-width="1.4"/>
<rect x="550" y="62" width="8" height="86" fill="url(#mhatch)" stroke="#1E2B3A" stroke-width="1.4"/>
<line x1="142" y1="80" x2="558" y2="80" stroke="#9AA8B8" stroke-width="1"/>
<line x1="142" y1="92.5" x2="558" y2="92.5" stroke="#9AA8B8" stroke-width="1"/>
<line x1="142" y1="105" x2="558" y2="105" stroke="#9AA8B8" stroke-width="1"/>
<line x1="142" y1="117.5" x2="558" y2="117.5" stroke="#9AA8B8" stroke-width="1"/>
<line x1="142" y1="130" x2="558" y2="130" stroke="#9AA8B8" stroke-width="1"/>
<path d="M142,62 L100,62 Q88,62 88,74 L88,136 Q88,148 100,148 L142,148" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M558,62 L600,62 Q612,62 612,74 L612,136 Q612,148 600,148 L558,148" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="338" y="64" width="24" height="82" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.4"/>
<line x1="342" y1="64" x2="342" y2="146" stroke="#1E2B3A" stroke-width="1"/>
<line x1="350" y1="64" x2="350" y2="146" stroke="#1E2B3A" stroke-width="1"/>
<line x1="358" y1="64" x2="358" y2="146" stroke="#1E2B3A" stroke-width="1"/>
<text x="350" y="162" font-size="11" text-anchor="middle" fill="#55667D">expansion joint</text>
<text x="20" y="186" font-size="13" font-weight="bold" fill="#1E2B3A">(b) U-tube (BEU)</text>
<text x="680" y="186" font-size="11.5" text-anchor="end" fill="#55667D">one tubesheet; bundle free to expand; tube bends hard to clean</text>
<rect x="150" y="220" width="400" height="70" fill="#F4F6F9" stroke="#1E2B3A" stroke-width="2"/>
<rect x="142" y="212" width="8" height="86" fill="url(#mhatch)" stroke="#1E2B3A" stroke-width="1.4"/>
<path d="M142,212 L100,212 Q88,212 88,224 L88,286 Q88,298 100,298 L142,298" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M550,220 L570,220 Q590,220 590,255.0 Q590,290 570,290 L550,290" fill="#F4F6F9" stroke="#1E2B3A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M150,227.0 L540,227.0 A28,28 0 0 1 540,283.0 L150,283.0" fill="none" stroke="#9AA8B8" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M150,237.0 L540,237.0 A18,18 0 0 1 540,273.0 L150,273.0" fill="none" stroke="#9AA8B8" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M150,247.0 L540,247.0 A8,8 0 0 1 540,263.0 L150,263.0" fill="none" stroke="#9AA8B8" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="88" y1="255" x2="142" y2="255" stroke="#1E2B3A" stroke-width="3"/>
<text x="20" y="336" font-size="13" font-weight="bold" fill="#1E2B3A">(c) Floating head (AES / AET)</text>
<text x="680" y="336" font-size="11.5" text-anchor="end" fill="#55667D">both sides cleanable; handles large ΔT; most expensive</text>
<rect x="150" y="370" width="400" height="70" fill="#F4F6F9" stroke="#1E2B3A" stroke-width="2"/>
<rect x="142" y="362" width="8" height="86" fill="url(#mhatch)" stroke="#1E2B3A" stroke-width="1.4"/>
<path d="M142,362 L100,362 Q88,362 88,374 L88,436 Q88,448 100,448 L142,448" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M550,362 L590,362 Q620,362 620,405.0 Q620,448 590,448 L550,448 Z" fill="#F4F6F9" stroke="#1E2B3A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="520" y="376" width="8" height="58" fill="url(#mhatch)" stroke="#1E2B3A" stroke-width="1.4"/>
<path d="M528,376 L544,376 Q562,376 562,405.0 Q562,434 544,434 L528,434 Z" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="142" y1="384" x2="520" y2="384" stroke="#9AA8B8" stroke-width="1"/>
<line x1="142" y1="398" x2="520" y2="398" stroke="#9AA8B8" stroke-width="1"/>
<line x1="142" y1="412" x2="520" y2="412" stroke="#9AA8B8" stroke-width="1"/>
<line x1="142" y1="426" x2="520" y2="426" stroke="#9AA8B8" stroke-width="1"/>
<text x="626" y="401" font-size="11" fill="#55667D">floating</text>
<text x="626" y="415" font-size="11" fill="#55667D">head</text>
<text x="350" y="462" font-size="11" text-anchor="middle" fill="#55667D">bundle slides; removable for mechanical cleaning</text>
</svg>
