<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Helvetica, Arial, sans-serif">
<title>Shell-side equivalent diameter: square and triangular pitch</title>
<defs>
<marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#1E2B3A"/></marker>
<marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#1E2B3A"/></marker>
<marker id="ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#D2552B"/></marker>
<marker id="as-hot" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#D2552B"/></marker>
<marker id="ah-cold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#0B7C8C"/></marker>
<marker id="as-cold" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#0B7C8C"/></marker>
<marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#9AA8B8"/></marker>
<marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#9AA8B8"/></marker>
<marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#B7840A"/></marker>
<marker id="as-acc" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#B7840A"/></marker>
<marker id="ah-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#55667D"/></marker>
<marker id="as-sec" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#55667D"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern>
<pattern id="mhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9AA8B8" stroke-width="1"/></pattern>
</defs>
<rect width="640" height="330" fill="#FFFFFF"/>
<text x="155" y="28" font-size="13" text-anchor="middle" font-weight="bold" fill="#1E2B3A">Square pitch</text>
<rect x="90" y="90" width="130" height="130" fill="#FBE2D6" stroke="#1E2B3A" stroke-width="1.2"/>
<circle cx="90" cy="90" r="38" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.4"/>
<circle cx="220" cy="90" r="38" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.4"/>
<circle cx="90" cy="220" r="38" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.4"/>
<circle cx="220" cy="220" r="38" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="155" y="159" font-size="11.5" text-anchor="middle" fill="#D2552B">free area</text>
<line x1="90" y1="274" x2="220" y2="274" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#ah-grey)" marker-start="url(#as-grey)"/>
<text x="155" y="292.6" font-size="12" text-anchor="middle" fill="#55667D">P<tspan dy="3.6" font-size="8.6">T</tspan><tspan dy="-3.6">​</tspan></text>
<line x1="182" y1="220" x2="258" y2="220" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#ah-grey)" marker-start="url(#as-grey)"/>
<text x="220" y="211" font-size="12" text-anchor="middle" fill="#55667D"></text>
<text x="264" y="224" font-size="12" fill="#1E2B3A">d<tspan dy="3.6" font-size="8.6">o</tspan><tspan dy="-3.6">​</tspan></text>
<text x="155" y="316" font-size="12" text-anchor="middle" fill="#1E2B3A">D<tspan dy="3.6" font-size="8.6">e</tspan><tspan dy="-3.6">​</tspan> = 4(P<tspan dy="3.6" font-size="8.6">T</tspan><tspan dy="-3.6">​</tspan>² − πd<tspan dy="3.6" font-size="8.6">o</tspan><tspan dy="-3.6">​</tspan>²/4)/(πd<tspan dy="3.6" font-size="8.6">o</tspan><tspan dy="-3.6">​</tspan>)</text>
<text x="155" y="40" font-size="11" text-anchor="middle" fill="#55667D">unit cell: one tube (4 quarters)</text>
<path d="M390,230 L540,230 L465,100.096 Z" fill="#FBE2D6" stroke="#1E2B3A" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="390" cy="230" r="38" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.4"/>
<circle cx="540" cy="230" r="38" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.4"/>
<circle cx="465" cy="100.096" r="38" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="465" y="28" font-size="13" text-anchor="middle" font-weight="bold" fill="#1E2B3A">Triangular pitch</text>
<text x="465" y="196" font-size="11.5" text-anchor="middle" fill="#D2552B">free area</text>
<line x1="390" y1="284" x2="540" y2="284" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#ah-grey)" marker-start="url(#as-grey)"/>
<text x="465" y="302.6" font-size="12" text-anchor="middle" fill="#55667D">P<tspan dy="3.6" font-size="8.6">T</tspan><tspan dy="-3.6">​</tspan></text>
<text x="465" y="316" font-size="12" text-anchor="middle" fill="#1E2B3A">D<tspan dy="3.6" font-size="8.6">e</tspan><tspan dy="-3.6">​</tspan> = 4(½P<tspan dy="3.6" font-size="8.6">T</tspan><tspan dy="-3.6">​</tspan>·0.86P<tspan dy="3.6" font-size="8.6">T</tspan><tspan dy="-3.6">​</tspan> − πd<tspan dy="3.6" font-size="8.6">o</tspan><tspan dy="-3.6">​</tspan>²/8)/(πd<tspan dy="3.6" font-size="8.6">o</tspan><tspan dy="-3.6">​</tspan>/2)</text>
<text x="465" y="60" font-size="11" text-anchor="middle" fill="#55667D">unit cell: half a tube (3 sixths)</text>
</svg>
