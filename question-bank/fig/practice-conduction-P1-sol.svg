<text x="310.0" y="180.0" font-size="12" text-anchor="middle" fill="#55667D" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">R = L/(kA) in °C/W;  R<tspan dy="3.6" font-size="8.6">total</tspan><tspan dy="-3.6"> </tspan> = 0.02 + (R<tspan dy="3.6" font-size="8.6">B</tspan><tspan dy="-3.6"> </tspan> ∥ R<tspan dy="3.6" font-size="8.6">C</tspan><tspan dy="-3.6"> </tspan> = 0.147) + 0.1 = 0.267 °C/W</text>
