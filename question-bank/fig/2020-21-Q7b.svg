<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="Helvetica, Arial, sans-serif">
<title>Flat plate 600 mm × 300 mm with air along either side</title>
<defs><marker id="aI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="aIs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1E2B3A"/></marker><marker id="aH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="aHs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#D2552B"/></marker><marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="aCs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0B7C8C"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><marker id="aGs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9AA8B8"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="aAs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#B7840A"/></marker><marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="aSs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#55667D"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="mhatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA8B8" stroke-width="0.9"/></pattern></defs>
<rect width="640" height="340" fill="#FFFFFF"/>
<rect x="80" y="70" width="180" height="90" fill="#FBE2D6" stroke="#D2552B" stroke-width="1.5"/>
<line x1="20" y1="92.5" x2="72" y2="92.5" stroke="#0B7C8C" stroke-width="1.8" marker-end="url(#aC)"/>
<line x1="20" y1="115" x2="72" y2="115" stroke="#0B7C8C" stroke-width="1.8" marker-end="url(#aC)"/>
<line x1="20" y1="137.5" x2="72" y2="137.5" stroke="#0B7C8C" stroke-width="1.8" marker-end="url(#aC)"/>
<text x="46" y="62" font-size="12" text-anchor="middle" fill="#0B7C8C">u<tspan dy="3.6" font-size="8.6">∞</tspan><tspan dy="-3.6">​</tspan></text>
<line x1="80" y1="178" x2="260" y2="178" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#aG)" marker-start="url(#aGs)"/>
<text x="170" y="194" font-size="12" text-anchor="middle" fill="#55667D">L = 600 mm (flow length)</text>
<line x1="274" y1="70" x2="274" y2="160" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#aG)" marker-start="url(#aGs)"/>
<text x="280" y="119" font-size="12" text-anchor="start" fill="#55667D">300 mm</text>
<text x="170" y="119" font-size="12" text-anchor="middle" fill="#D2552B">T<tspan dy="3.6" font-size="8.6">w</tspan><tspan dy="-3.6">​</tspan> = 95°C</text>
<text x="160" y="34" font-size="13" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Case 1: flow along the 600 mm side</text>
<text x="160" y="224" font-size="12" text-anchor="middle" fill="#B7840A" font-weight="bold">h̄ = 7.9 W/m²K, q ≈ 100 W</text>
<rect x="450" y="60" width="90" height="180" fill="#FBE2D6" stroke="#D2552B" stroke-width="1.5"/>
<line x1="390" y1="105" x2="442" y2="105" stroke="#0B7C8C" stroke-width="1.8" marker-end="url(#aC)"/>
<line x1="390" y1="150" x2="442" y2="150" stroke="#0B7C8C" stroke-width="1.8" marker-end="url(#aC)"/>
<line x1="390" y1="195" x2="442" y2="195" stroke="#0B7C8C" stroke-width="1.8" marker-end="url(#aC)"/>
<text x="416" y="52" font-size="12" text-anchor="middle" fill="#0B7C8C">u<tspan dy="3.6" font-size="8.6">∞</tspan><tspan dy="-3.6">​</tspan></text>
<line x1="450" y1="258" x2="540" y2="258" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#aG)" marker-start="url(#aGs)"/>
<text x="495" y="274" font-size="12" text-anchor="middle" fill="#55667D">L = 300 mm (flow length)</text>
<line x1="554" y1="60" x2="554" y2="240" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#aG)" marker-start="url(#aGs)"/>
<text x="560" y="154" font-size="12" text-anchor="start" fill="#55667D">600 mm</text>
<text x="495" y="154" font-size="12" text-anchor="middle" fill="#D2552B">T<tspan dy="3.6" font-size="8.6">w</tspan><tspan dy="-3.6">​</tspan> = 95°C</text>
<text x="485" y="34" font-size="13" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Case 2: along the 300 mm side</text>
<text x="485" y="304" font-size="12" text-anchor="middle" fill="#B7840A" font-weight="bold">h̄ = 11.2 W/m²K, q ≈ 141 W</text>
<text x="320" y="330" font-size="12" text-anchor="middle" fill="#55667D">Air 25°C, 2.5 m/s, laminar (Re<tspan dy="3.6" font-size="8.6">L</tspan><tspan dy="-3.6">​</tspan> &lt; 5×10<tspan dy="-4.6" font-size="8.6">5</tspan><tspan dy="4.6">​</tspan>); h̄ ∝ L<tspan dy="-4.6" font-size="8.6">−1/2</tspan><tspan dy="4.6">​</tspan>, same area → q<tspan dy="3.6" font-size="8.6">2</tspan><tspan dy="-3.6">​</tspan>/q<tspan dy="3.6" font-size="8.6">1</tspan><tspan dy="-3.6">​</tspan> = √2</text>
</svg>
