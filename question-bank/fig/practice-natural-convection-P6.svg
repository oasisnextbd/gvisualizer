<text x="175" y="326.6" font-size="12" text-anchor="middle" fill="#55667D">D</text>
<line x1="94" y1="40" x2="94" y2="290" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#ah-grey)" marker-start="url(#as-grey)"/>
<text x="85" y="169.2" font-size="12" text-anchor="end" fill="#55667D">L = 1.5 m</text>
<text x="240" y="56" font-size="12" font-style="italic" fill="#55667D">δ ≪ D</text>
<text x="300" y="120" font-size="12.5" fill="#1E2B3A">Plate relation valid if</text>
<text x="300" y="135.625" font-size="12.5" fill="#1E2B3A">D ≥ 35 L / Gr<tspan dy="3.8" font-size="9.0">L</tspan><tspan dy="-3.8">​</tspan><tspan dy="-4.8" font-size="9.0">1/4</tspan><tspan dy="4.8">​</tspan></text>
<text x="300" y="151.25" font-size="12.5" fill="#1E2B3A">(boundary layer thin</text>
<text x="300" y="166.875" font-size="12.5" fill="#1E2B3A">compared with D)</text>
<text x="300" y="182.5" font-size="12.5" fill="#1E2B3A"></text>
<text x="300" y="198.125" font-size="12.5" fill="#1E2B3A">Air at T<tspan dy="3.8" font-size="9.0">∞</tspan><tspan dy="-3.8">​</tspan> = 20°C</text>
