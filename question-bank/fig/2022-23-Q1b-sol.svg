<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Helvetica, Arial, sans-serif">
<title>Temperature through one 8 mm glass sheet and two pressed 4 mm sheets</title>
<defs><marker id="aI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="aIs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1E2B3A"/></marker><marker id="aH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="aHs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#D2552B"/></marker><marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="aCs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0B7C8C"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><marker id="aGs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9AA8B8"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="aAs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#B7840A"/></marker><marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="aSs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#55667D"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="mhatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA8B8" stroke-width="0.9"/></pattern></defs>
<rect width="640" height="300" fill="#FFFFFF"/>
<text x="140" y="40" font-size="13" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Single 8 mm sheet</text>
<rect x="60" y="70" width="160" height="160" fill="#E6F3F6" stroke="#1E2B3A" stroke-width="1.4"/>
<line x1="60" y1="90" x2="220" y2="210" stroke="#D2552B" stroke-width="2.2"/>
<text x="54" y="94" font-size="12" text-anchor="end" fill="#D2552B">T<tspan dy="3.6" font-size="8.6">1</tspan><tspan dy="-3.6">​</tspan></text>
<text x="226" y="214" font-size="12" text-anchor="start" fill="#D2552B">T<tspan dy="3.6" font-size="8.6">2</tspan><tspan dy="-3.6">​</tspan></text>
<line x1="60" y1="246" x2="220" y2="246" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#aG)" marker-start="url(#aGs)"/>
<text x="140" y="262" font-size="12" text-anchor="middle" fill="#55667D">8 mm</text>
<text x="380" y="40" font-size="13" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Two 4 mm sheets</text>
<rect x="300" y="70" width="80" height="160" fill="#E6F3F6" stroke="#1E2B3A" stroke-width="1.4"/>
<rect x="380" y="70" width="80" height="160" fill="#E6F3F6" stroke="#1E2B3A" stroke-width="1.4"/>
<path d="M300,90 L380,137 L380,163 L460,210" stroke="#D2552B" stroke-width="2.2" fill="none"/>
<text x="386" y="154" font-size="11" text-anchor="start" fill="#B7840A" font-weight="bold">ΔT<tspan dy="3.3" font-size="7.9">contact</tspan><tspan dy="-3.3">​</tspan></text>
<text x="294" y="94" font-size="12" text-anchor="end" fill="#D2552B">T<tspan dy="3.6" font-size="8.6">1</tspan><tspan dy="-3.6">​</tspan></text>
<text x="466" y="214" font-size="12" text-anchor="start" fill="#D2552B">T<tspan dy="3.6" font-size="8.6">2</tspan><tspan dy="-3.6">​</tspan></text>
<line x1="300" y1="246" x2="460" y2="246" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#aG)" marker-start="url(#aGs)"/>
<text x="380" y="262" font-size="12" text-anchor="middle" fill="#55667D">4 mm + 4 mm</text>
<rect x="520" y="90" width="100" height="120" fill="#FFFFFF" stroke="#55667D" stroke-width="1" stroke-dasharray="3 2"/>
<path d="M520,90 L564,90 L576,100 L564,110 L576,120 L564,130 L576,140 L564,150 L576,160 L564,170 L576,180 L564,190 L576,200 L564,210 L520,210 Z" stroke="#1E2B3A" stroke-width="1" fill="#E6F3F6"/>
<path d="M620,90 L568,90 L574,100 L568,110 L574,120 L568,130 L574,140 L568,150 L574,160 L568,170 L574,180 L568,190 L574,200 L568,210 L620,210 Z" stroke="#1E2B3A" stroke-width="1" fill="#E6F3F6"/>
<text x="570" y="228" font-size="10" text-anchor="middle" fill="#55667D">contact spots +</text>
<text x="570" y="241" font-size="10" text-anchor="middle" fill="#55667D">air-filled gaps</text>
<line x1="380" y1="150" x2="520" y2="150" stroke="#55667D" stroke-width="0.8" stroke-dasharray="2 2"/>
<text x="320" y="292" font-size="12" text-anchor="middle" fill="#55667D">R″<tspan dy="3.6" font-size="8.6">double</tspan><tspan dy="-3.6">​</tspan> = 0.008/k + R″<tspan dy="3.6" font-size="8.6">tc</tspan><tspan dy="-3.6">​</tspan> &gt; R″<tspan dy="3.6" font-size="8.6">single</tspan><tspan dy="-3.6">​</tspan> → slightly less heat through two sheets</text>
</svg>
