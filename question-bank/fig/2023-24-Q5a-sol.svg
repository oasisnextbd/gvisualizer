<text x="310" y="50" font-size="11" text-anchor="middle" fill="#55667D">BCs: θ = 0 and ∂²θ/∂y² = 0 at y = 0;  θ = θ<tspan dy="3.3" font-size="7.9">∞</tspan><tspan dy="-3.3">​</tspan> and ∂θ/∂y = 0 at y = δ<tspan dy="3.3" font-size="7.9">t</tspan><tspan dy="-3.3">​</tspan></text>
