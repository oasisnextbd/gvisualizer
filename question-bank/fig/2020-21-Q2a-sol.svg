<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Helvetica, Arial, sans-serif">
<title>Annulus perimeters for heat transfer and for pressure drop</title>
<defs><marker id="aI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="aIs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1E2B3A"/></marker><marker id="aH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="aHs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#D2552B"/></marker><marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="aCs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0B7C8C"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><marker id="aGs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9AA8B8"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="aAs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#B7840A"/></marker><marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="aSs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#55667D"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="mhatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA8B8" stroke-width="0.9"/></pattern></defs>
<rect width="640" height="330" fill="#FFFFFF"/>
<text x="160" y="30" font-size="15" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Heat transfer: D<tspan dy="4.5" font-size="10.8">e</tspan><tspan dy="-4.5">​</tspan></text>
<circle cx="160" cy="150" r="98" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.4"/>
<circle cx="160" cy="150" r="90" fill="#D9F0F2" stroke="#1E2B3A" stroke-width="1.4"/>
<circle cx="160" cy="150" r="52" fill="#FBE2D6" stroke="#D2552B" stroke-width="4"/>
<circle cx="160" cy="150" r="45" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1"/>
<text x="160" y="140" font-size="11" text-anchor="middle" fill="#55667D">inner pipe</text>
<text x="160" y="83" font-size="11" text-anchor="middle" fill="#0B7C8C">annulus</text>
<line x1="160" y1="150" x2="196.764" y2="186.764" stroke="#1E2B3A" stroke-width="1" marker-end="url(#aI)"/>
<text x="182" y="176" font-size="11" text-anchor="start" fill="#1E2B3A">D<tspan dy="3.3" font-size="7.9">1</tspan><tspan dy="-3.3">​</tspan>/2</text>
<line x1="160" y1="150" x2="96.37" y2="213.63" stroke="#1E2B3A" stroke-width="1" marker-end="url(#aI)"/>
<text x="116" y="202" font-size="11" text-anchor="end" fill="#1E2B3A">D<tspan dy="3.3" font-size="7.9">2</tspan><tspan dy="-3.3">​</tspan>/2</text>
<text x="160" y="272" font-size="13" text-anchor="middle" fill="#D2552B">heated perimeter π D<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9">​</tspan> only</text>
<text x="160" y="296" font-size="14" text-anchor="middle" fill="#1E2B3A" font-weight="bold">D<tspan dy="4.2" font-size="10.1">e</tspan><tspan dy="-4.2">​</tspan> = (D<tspan dy="4.2" font-size="10.1">2</tspan><tspan dy="-4.2">​</tspan>² − D<tspan dy="4.2" font-size="10.1">1</tspan><tspan dy="-4.2">​</tspan>²)/D<tspan dy="4.2" font-size="10.1">1</tspan><tspan dy="-4.2">​</tspan></text>
<text x="480" y="30" font-size="15" text-anchor="middle" fill="#1E2B3A" font-weight="bold">Pressure drop: D′<tspan dy="4.5" font-size="10.8">e</tspan><tspan dy="-4.5">​</tspan></text>
<circle cx="480" cy="150" r="98" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.4"/>
<circle cx="480" cy="150" r="90" fill="#D9F0F2" stroke="#0B7C8C" stroke-width="4"/>
<circle cx="480" cy="150" r="52" fill="#FBE2D6" stroke="#D2552B" stroke-width="4"/>
<circle cx="480" cy="150" r="45" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1"/>
<text x="480" y="140" font-size="11" text-anchor="middle" fill="#55667D">inner pipe</text>
<text x="480" y="83" font-size="11" text-anchor="middle" fill="#0B7C8C">annulus</text>
<line x1="480" y1="150" x2="516.764" y2="186.764" stroke="#1E2B3A" stroke-width="1" marker-end="url(#aI)"/>
<text x="502" y="176" font-size="11" text-anchor="start" fill="#1E2B3A">D<tspan dy="3.3" font-size="7.9">1</tspan><tspan dy="-3.3">​</tspan>/2</text>
<line x1="480" y1="150" x2="416.37" y2="213.63" stroke="#1E2B3A" stroke-width="1" marker-end="url(#aI)"/>
<text x="436" y="202" font-size="11" text-anchor="end" fill="#1E2B3A">D<tspan dy="3.3" font-size="7.9">2</tspan><tspan dy="-3.3">​</tspan>/2</text>
<text x="480" y="272" font-size="13" text-anchor="middle" fill="#0B7C8C">wetted perimeter π(D<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9">​</tspan> + D<tspan dy="3.9" font-size="9.4">2</tspan><tspan dy="-3.9">​</tspan>)</text>
<text x="480" y="296" font-size="14" text-anchor="middle" fill="#1E2B3A" font-weight="bold">D′<tspan dy="4.2" font-size="10.1">e</tspan><tspan dy="-4.2">​</tspan> = 4A/P = D<tspan dy="4.2" font-size="10.1">2</tspan><tspan dy="-4.2">​</tspan> − D<tspan dy="4.2" font-size="10.1">1</tspan><tspan dy="-4.2">​</tspan></text>
<text x="320" y="320" font-size="11" text-anchor="middle" fill="#55667D">thick outlines = perimeter counted; flow area A = π(D<tspan dy="3.3" font-size="7.9">2</tspan><tspan dy="-3.3">​</tspan>² − D<tspan dy="3.3" font-size="7.9">1</tspan><tspan dy="-3.3">​</tspan>²)/4 in both</text>
</svg>
