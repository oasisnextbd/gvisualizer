<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="Helvetica, Arial, sans-serif">
<title>Electrically heated tube: constant heat flux</title>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="a-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="a-cold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="a-vap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><pattern id="ins" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="metal" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA8B8" stroke-width="0.8"/></pattern></defs>
<rect width="680" height="400" fill="#FFFFFF"/>
<rect x="120" y="34" width="440" height="10" rx="0" fill="url(#ins)" stroke="#C98A00" stroke-width="1"/>
<rect x="120" y="116" width="440" height="10" rx="0" fill="url(#ins)" stroke="#C98A00" stroke-width="1"/>
<rect x="120" y="44" width="440" height="6" rx="0" fill="#D2552B"/>
<rect x="120" y="110" width="440" height="6" rx="0" fill="#D2552B"/>
<rect x="120" y="50" width="440" height="60" rx="0" fill="#D9F0F2"/>
<line x1="120" y1="50" x2="560" y2="50" stroke="#1E2B3A" stroke-width="1.4"/>
<line x1="120" y1="110" x2="560" y2="110" stroke="#1E2B3A" stroke-width="1.4"/>
<line x1="40" y1="80" x2="160" y2="80" stroke="#0B7C8C" stroke-width="2.4" marker-end="url(#a-cold)"/>
<line x1="520" y1="80" x2="640" y2="80" stroke="#0B7C8C" stroke-width="2.4" marker-end="url(#a-cold)"/>
<text x="38" y="70" font-size="12" fill="#0B7C8C" font-weight="bold">Water in</text>
<text x="38" y="102" font-size="11" fill="#0B7C8C">15°C, 10 L/min</text>
<text x="562" y="70" font-size="12" fill="#0B7C8C" font-weight="bold">out 65°C</text>
<text x="390.0" y="84" font-size="12" fill="#D2552B" text-anchor="middle">uniform heat flux q″<tspan dy="3.8" font-size="8.6">s</tspan><tspan dy="-3.8"> </tspan> from the heater</text>
<text x="340.0" y="28" font-size="11" fill="#55667D" text-anchor="middle">resistance heater (outside well insulated)</text>
<line x1="180" y1="50" x2="180" y2="110" stroke="#55667D" stroke-width="1" marker-end="url(#a-dim)" marker-start="url(#a-dim)"/><line x1="175" y1="50" x2="185" y2="50" stroke="#55667D" stroke-width="1"/><line x1="175" y1="110" x2="185" y2="110" stroke="#55667D" stroke-width="1"/><text x="187" y="84.0" font-size="12" fill="#55667D">D = 3 cm</text>
<line x1="120" y1="144" x2="560" y2="144" stroke="#55667D" stroke-width="1" marker-end="url(#a-dim)" marker-start="url(#a-dim)"/><line x1="120" y1="139" x2="120" y2="149" stroke="#55667D" stroke-width="1"/><line x1="560" y1="139" x2="560" y2="149" stroke="#55667D" stroke-width="1"/><text x="340.0" y="160" font-size="12" fill="#55667D" text-anchor="middle">L = 5 m</text>
<line x1="120" y1="370" x2="600" y2="370" stroke="#1E2B3A" stroke-width="1.5" marker-end="url(#a-ink)"/><line x1="120" y1="370" x2="120" y2="170" stroke="#1E2B3A" stroke-width="1.5" marker-end="url(#a-ink)"/><text x="600" y="390" font-size="13" fill="#1E2B3A" text-anchor="end">x</text><text x="112" y="174" font-size="13" fill="#1E2B3A" text-anchor="end">T</text>
<line x1="120" y1="347.2" x2="560" y2="271.2" stroke="#0B7C8C" stroke-width="2.6"/>
<path d="M120,336.56 C150,294.0 170,275.76 200,257.3818181818182 L560,195.2" stroke="#D2552B" stroke-width="2.6" fill="none"/>
<text x="270" y="341.2909090909091" font-size="12" fill="#0B7C8C">T<tspan dy="3.8" font-size="8.6">m</tspan><tspan dy="-3.8"> </tspan>(x): linear</text>
<text x="270" y="235.2909090909091" font-size="12" fill="#D2552B">T<tspan dy="3.8" font-size="8.6">s</tspan><tspan dy="-3.8"> </tspan>(x)</text>
<line x1="560" y1="271.2" x2="560" y2="195.2" stroke="#B7840A" stroke-width="1.4" marker-end="url(#a-acc)" marker-start="url(#a-acc)"/>
<text x="568" y="230.16" font-size="11" fill="#B7840A">q″<tspan dy="3.5" font-size="7.9">s</tspan><tspan dy="-3.5"> </tspan>/h ≈ 50 K</text>
<circle cx="560" cy="195.2" r="4" fill="#B7840A"/>
<text x="554" y="187.2" font-size="12" fill="#B7840A" text-anchor="end" font-weight="bold">T<tspan dy="3.8" font-size="8.6">s,e</tspan><tspan dy="-3.8"> </tspan> ≈ 115°C</text>
<text x="114" y="351.2" font-size="11" fill="#55667D" text-anchor="end">15</text>
<text x="568" y="283.2" font-size="11" fill="#55667D">65°C</text>
<line x1="120" y1="271.2" x2="560" y2="271.2" stroke="#9AA8B8" stroke-width="0.6" stroke-dasharray="3 3"/>
</svg>
