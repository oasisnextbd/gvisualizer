<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Helvetica, Arial, sans-serif">
<title>Condensing tube: vertical versus horizontal</title>
<defs>
<marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#1E2B3A"/></marker>
<marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#1E2B3A"/></marker>
<marker id="ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#D2552B"/></marker>
<marker id="as-hot" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#D2552B"/></marker>
<marker id="ah-cold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#0B7C8C"/></marker>
<marker id="as-cold" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#0B7C8C"/></marker>
<marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#9AA8B8"/></marker>
<marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#9AA8B8"/></marker>
<marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#B7840A"/></marker>
<marker id="as-acc" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#B7840A"/></marker>
<marker id="ah-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#55667D"/></marker>
<marker id="as-sec" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#55667D"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern>
<pattern id="mhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9AA8B8" stroke-width="1"/></pattern>
</defs>
<rect width="640" height="330" fill="#FFFFFF"/>
<text x="130" y="24" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1E2B3A">(i) Vertical tube</text>
<rect x="112" y="50" width="36" height="230" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.6"/>
<path d="M110.0,50.0 L106.8,57.7 L106.0,65.3 L105.5,73.0 L105.1,80.7 L104.7,88.3 L104.4,96.0 L104.2,103.7 L103.9,111.3 L103.7,119.0 L103.5,126.7 L103.3,134.3 L103.2,142.0 L103.0,149.7 L102.8,157.3 L102.7,165.0 L102.5,172.7 L102.4,180.3 L102.3,188.0 L102.2,195.7 L102.0,203.3 L101.9,211.0 L101.8,218.7 L101.7,226.3 L101.6,234.0 L101.5,241.7 L101.4,249.3 L101.3,257.0 L101.2,264.7 L101.1,272.3 L101.0,280.0" fill="none" stroke="#0B7C8C" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M150.0,50.0 L153.2,57.7 L154.0,65.3 L154.5,73.0 L154.9,80.7 L155.3,88.3 L155.6,96.0 L155.8,103.7 L156.1,111.3 L156.3,119.0 L156.5,126.7 L156.7,134.3 L156.8,142.0 L157.0,149.7 L157.2,157.3 L157.3,165.0 L157.5,172.7 L157.6,180.3 L157.7,188.0 L157.8,195.7 L158.0,203.3 L158.1,211.0 L158.2,218.7 L158.3,226.3 L158.4,234.0 L158.5,241.7 L158.6,249.3 L158.7,257.0 L158.8,264.7 L158.9,272.3 L159.0,280.0" fill="none" stroke="#0B7C8C" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="86" y1="50" x2="86" y2="280" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#ah-grey)" marker-start="url(#as-grey)"/>
<text x="77" y="169.2" font-size="12" text-anchor="end" fill="#55667D">L = 1.5 m</text>
<line x1="112" y1="298" x2="148" y2="298" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#ah-grey)" marker-start="url(#as-grey)"/>
<text x="130" y="316.6" font-size="12" text-anchor="middle" fill="#55667D">D</text>
<text x="172" y="165" font-size="11.5" fill="#0B7C8C">film runs</text>
<text x="172" y="179" font-size="11.5" fill="#0B7C8C">down 1.5 m</text>
<text x="430" y="24" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1E2B3A">(ii) Horizontal tube</text>
<circle cx="360" cy="156" r="54" fill="#D9F0F2" stroke="#0B7C8C" stroke-width="1.2"/>
<circle cx="360" cy="150" r="46" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.6"/>
<line x1="314" y1="84" x2="406" y2="84" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#ah-grey)" marker-start="url(#as-grey)"/>
<text x="360" y="75" font-size="12" text-anchor="middle" fill="#55667D">D = 2.5 cm</text>
<text x="360" y="228" font-size="11.5" text-anchor="middle" fill="#0B7C8C">film runs only πD/2</text>
<text x="440" y="110" font-size="12" fill="#1E2B3A">Surface T<tspan dy="3.6" font-size="8.6">s</tspan><tspan dy="-3.6">​</tspan> = 90°C</text>
<text x="440" y="128" font-size="12" fill="#1E2B3A">Steam 1 atm (T<tspan dy="3.6" font-size="8.6">sat</tspan><tspan dy="-3.6">​</tspan> = 100°C)</text>
<text x="440" y="146" font-size="12" fill="#1E2B3A"></text>
<text x="440" y="164" font-size="12" fill="#1E2B3A">h̄<tspan dy="3.6" font-size="8.6">vert</tspan><tspan dy="-3.6">​</tspan>: 0.943[…/L]<tspan dy="-4.6" font-size="8.6">1/4</tspan><tspan dy="4.6">​</tspan></text>
<text x="440" y="182" font-size="12" fill="#1E2B3A">h̄<tspan dy="3.6" font-size="8.6">horiz</tspan><tspan dy="-3.6">​</tspan>: 0.729[…/D]<tspan dy="-4.6" font-size="8.6">1/4</tspan><tspan dy="4.6">​</tspan></text>
<text x="440" y="200" font-size="12" fill="#1E2B3A">equal when L = 2.77 D</text>
</svg>
