<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2B3A">
<title>Shell-side equivalent diameter: square and triangular pitch unit cells</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1E2B3A"/></marker>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#D2552B"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#0B7C8C"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#55667D"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#B7840A"/></marker>
<pattern id="ins" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern>
<pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#FBE2D6"/><path d="M0,0.5 H24 M0,6.5 H24 M12,0.5 V6.5 M0.5,6.5 V12 M24,6.5 V12" stroke="#D2552B" stroke-width="0.8" fill="none" opacity="0.7"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#FFF3D6"/><circle cx="2" cy="2" r="0.9" fill="#C98A00"/><circle cx="5.5" cy="5.5" r="0.9" fill="#C98A00"/></pattern>
<pattern id="dense" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#E9D3A6"/><circle cx="1" cy="1" r="0.8" fill="#8A6200"/><circle cx="3" cy="3" r="0.8" fill="#8A6200"/></pattern>
</defs>
<rect width="700" height="400" fill="#FFFFFF"/>
<text x="170" y="28" text-anchor="middle" font-weight="bold" font-size="14">Square pitch</text>
<rect x="95" y="100" width="110" height="110" fill="#D9F0F2" stroke="#B7840A" stroke-width="1.4" stroke-dasharray="5 3"/>
<circle cx="95" cy="100" r="41.2" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.3"/>
<circle cx="205" cy="100" r="41.2" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.3"/>
<circle cx="95" cy="210" r="41.2" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.3"/>
<circle cx="205" cy="210" r="41.2" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.3"/>
<path d="M136.25,100 A41.25,41.25 0 0 1 95,141.25" fill="none" stroke="#B7840A" stroke-width="3"/>
<path d="M205.0,141.25 A41.25,41.25 0 0 1 163.75,100" fill="none" stroke="#B7840A" stroke-width="3"/>
<path d="M95,168.75 A41.25,41.25 0 0 1 136.25,210.0" fill="none" stroke="#B7840A" stroke-width="3"/>
<path d="M163.75,210.0 A41.25,41.25 0 0 1 205.0,168.75" fill="none" stroke="#B7840A" stroke-width="3"/>
<line x1="95" y1="44.8" x2="205" y2="44.8" stroke="#55667D" stroke-width="1" marker-end="url(#ag)" marker-start="url(#ag)"/>
<text x="150" y="39.8" text-anchor="middle" fill="#55667D" font-size="12">P<tspan dy="4" font-size="75%">T</tspan><tspan dy="-4">​</tspan> = 1 in</text>
<line x1="53.8" y1="100" x2="136.2" y2="100" stroke="#1E2B3A" stroke-width="1" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="95" y="94" text-anchor="middle" font-size="11">d<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan> = 0.75 in</text>
<line x1="136.2" y1="210" x2="163.8" y2="210" stroke="#1E2B3A" stroke-width="1" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="150" y1="213" x2="150" y2="259.2" stroke="#9AA8B8" stroke-width="0.9"/>
<text x="150" y="271.2" text-anchor="middle" font-size="12">C' = 0.25 in</text>
<text x="495" y="28" text-anchor="middle" font-weight="bold" font-size="14">Triangular pitch</text>
<path d="M440,250 L550,250 L495,154.7 Z" fill="#D9F0F2" stroke="#B7840A" stroke-width="1.4" stroke-dasharray="5 3"/>
<circle cx="440" cy="250" r="41.2" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.3"/>
<circle cx="550" cy="250" r="41.2" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.3"/>
<circle cx="495" cy="154.7" r="41.2" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.3"/>
<path d="M481.2,250 A41.2,41.2 0 0 0 460.6,214.3" fill="none" stroke="#B7840A" stroke-width="3"/>
<path d="M529.4,214.3 A41.2,41.2 0 0 0 508.8,250" fill="none" stroke="#B7840A" stroke-width="3"/>
<path d="M474.4,190.5 A41.2,41.2 0 0 0 515.6,190.5" fill="none" stroke="#B7840A" stroke-width="3"/>
<line x1="440" y1="303.2" x2="550" y2="303.2" stroke="#55667D" stroke-width="1" marker-end="url(#ag)" marker-start="url(#ag)"/>
<text x="495" y="298.2" text-anchor="middle" fill="#55667D" font-size="12">P<tspan dy="4" font-size="75%">T</tspan><tspan dy="-4">​</tspan> = 1 in</text>
<line x1="613.2" y1="154.7" x2="613.2" y2="250" stroke="#55667D" stroke-width="1" marker-end="url(#ag)" marker-start="url(#ag)"/>
<text x="619.2" y="206.4" fill="#55667D" font-size="12">0.86 P<tspan dy="4" font-size="75%">T</tspan><tspan dy="-4">​</tspan></text>
<line x1="503" y1="154.7" x2="617.2" y2="154.7" stroke="#9AA8B8" stroke-width="0.8" stroke-dasharray="3 2"/>
<line x1="40" y1="322" x2="660" y2="322" stroke="#9AA8B8" stroke-width="0.8"/>
<text x="30" y="342" fill="#55667D" font-size="12">Shaded: free-flow area of the unit cell.   Orange arcs: wetted perimeter (tube surface only).</text>
<text x="30" y="364" font-size="12.5">Square: D<tspan dy="4" font-size="75%">e</tspan><tspan dy="-4">​</tspan> = 4(P<tspan dy="4" font-size="75%">T</tspan><tspan dy="-4">²</tspan> − πd<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">²</tspan>/4)/(πd<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan>) = 0.95 in</text>
<text x="30" y="386" font-size="12.5">Triangular: D<tspan dy="4" font-size="75%">e</tspan><tspan dy="-4">​</tspan> = 4(½·P<tspan dy="4" font-size="75%">T</tspan><tspan dy="-4">​</tspan>·0.86P<tspan dy="4" font-size="75%">T</tspan><tspan dy="-4">​</tspan> − ½·πd<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">²</tspan>/4)/(½πd<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan>) = 0.71 in</text>
</svg>
