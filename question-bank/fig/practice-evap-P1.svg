<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Helvetica, Arial, sans-serif">
<title>Power-plant evaporator producing distilled water</title>
<defs>
<marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#1E2B3A"/></marker>
<marker id="as-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#1E2B3A"/></marker>
<marker id="ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#D2552B"/></marker>
<marker id="as-hot" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#D2552B"/></marker>
<marker id="ah-cold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#0B7C8C"/></marker>
<marker id="as-cold" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#0B7C8C"/></marker>
<marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#9AA8B8"/></marker>
<marker id="as-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#9AA8B8"/></marker>
<marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#B7840A"/></marker>
<marker id="as-acc" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#B7840A"/></marker>
<marker id="ah-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#55667D"/></marker>
<marker id="as-sec" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,1 L0,5 L10,9 Z" fill="#55667D"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern>
<pattern id="mhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#DCE3EC"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9AA8B8" stroke-width="1"/></pattern>
</defs>
<rect width="640" height="330" fill="#FFFFFF"/>
<rect x="155" y="52" width="40" height="20" rx="4" fill="#F4F6F9" stroke="#1E2B3A" stroke-width="1.6"/>
<path d="M130,86 Q130,70 146,70 L204,70 Q220,70 220,86 L220,190 L187.0,222 L163.0,222 L130,190 Z" fill="#F4F6F9" stroke="#1E2B3A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M131.5,128 L218.5,128 L218.5,190 L187.0,220.5 L163.0,220.5 L131.5,190 Z" fill="#D9F0F2" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M134,128 q6,-4 12,0 t12,0 t12,0 t12,0 t12,0 t12,0 t12,0" fill="none" stroke="#0B7C8C" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="130" y="140" width="90" height="40" fill="#FBE2D6" stroke="#1E2B3A" stroke-width="1.6"/>
<line x1="140" y1="140" x2="140" y2="180" stroke="#1E2B3A" stroke-width="1"/>
<line x1="154" y1="140" x2="154" y2="180" stroke="#1E2B3A" stroke-width="1"/>
<line x1="168" y1="140" x2="168" y2="180" stroke="#1E2B3A" stroke-width="1"/>
<line x1="182" y1="140" x2="182" y2="180" stroke="#1E2B3A" stroke-width="1"/>
<line x1="196" y1="140" x2="196" y2="180" stroke="#1E2B3A" stroke-width="1"/>
<line x1="210" y1="140" x2="210" y2="180" stroke="#1E2B3A" stroke-width="1"/>
<rect x="169" y="222" width="12" height="10" fill="#F4F6F9" stroke="#1E2B3A" stroke-width="1.4"/>
<text x="175" y="110" font-size="10.5" text-anchor="middle" fill="#1E2B3A">shell</text>
<line x1="25" y1="160" x2="128" y2="160" stroke="#D2552B" stroke-width="2.2" marker-end="url(#ah-hot)"/>
<text x="25" y="153" font-size="11.5" fill="#D2552B">Steam 300°F</text>
<path d="M175.0,52 L175.0,38 L269.5,38 L269.5,82 L281.5,82" fill="none" stroke="#9AA8B8" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#ah-grey)" stroke-linejoin="round" stroke-linecap="round"/>
<text x="229.25" y="32" font-size="11" text-anchor="middle" fill="#55667D">vapour 10,000 lb/h</text>
<rect x="283.5" y="58" width="34" height="110" rx="8" fill="#F4F6F9" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="300.5" y="186" font-size="11" text-anchor="middle" fill="#1E2B3A">Condenser (vented)</text>
<line x1="343.5" y1="74" x2="319.5" y2="74" stroke="#0B7C8C" stroke-width="1.8" marker-end="url(#ah-cold)"/>
<text x="345.5" y="70" font-size="10.5" fill="#0B7C8C">cooling</text>
<text x="345.5" y="82" font-size="10.5" fill="#0B7C8C">water</text>
<line x1="319.5" y1="152" x2="343.5" y2="152" stroke="#0B7C8C" stroke-width="1.8" marker-end="url(#ah-cold)"/>
<line x1="300.5" y1="58" x2="300.5" y2="30" stroke="#9AA8B8" stroke-width="1.6" marker-end="url(#ah-grey)"/>
<text x="305.5" y="38" font-size="10.5" fill="#55667D">to vacuum</text>
<line x1="25" y1="275" x2="110" y2="275" stroke="#0B7C8C" stroke-width="2.2" marker-end="url(#ah-cold)"/>
<line x1="110" y1="275" x2="118" y2="275" stroke="#0B7C8C" stroke-width="2.2"/>
<text x="25" y="269" font-size="11.5" fill="#0B7C8C">Feed (untreated)</text>
<path d="M118,275 L118,198 L128,198" fill="none" stroke="#0B7C8C" stroke-width="2" marker-end="url(#ah-cold)" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="175" y1="232" x2="175" y2="250" stroke="#55667D" stroke-width="1.6" marker-end="url(#ah-sec)"/>
<text x="170" y="250" font-size="10.5" text-anchor="end" fill="#55667D">blowdown</text>
<path d="M212.0,180.0 L212.0,298.0" fill="none" stroke="#FFFFFF" stroke-width="6.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M212.0,180.0 L212.0,298.0" fill="none" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ah-hot)" stroke-linejoin="round" stroke-linecap="round"/>
<text x="212" y="312" font-size="10.5" text-anchor="middle" fill="#D2552B">condensate</text>
<text x="400" y="220" font-size="12" fill="#1E2B3A">Shell at 19.7 psia (226°F)</text>
<text x="400" y="238" font-size="12" fill="#1E2B3A">Δt = 300 − 226 = 74°F</text>
<text x="400" y="256" font-size="12" fill="#1E2B3A">U<tspan dy="3.6" font-size="8.6">D</tspan><tspan dy="-3.6">​</tspan> = 700 × Fig. 14.7 factor</text>
<text x="400" y="274" font-size="12" fill="#1E2B3A">Distillate = vapour condensed</text>
</svg>
