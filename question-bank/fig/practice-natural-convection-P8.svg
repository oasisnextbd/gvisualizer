<line x1="412" y1="122" x2="412" y2="88" stroke="#D2552B" stroke-width="1.5" marker-end="url(#ah-hot)"/>
<line x1="464" y1="122" x2="464" y2="88" stroke="#D2552B" stroke-width="1.5" marker-end="url(#ah-hot)"/>
<line x1="516" y1="122" x2="516" y2="88" stroke="#D2552B" stroke-width="1.5" marker-end="url(#ah-hot)"/>
<line x1="568" y1="122" x2="568" y2="88" stroke="#D2552B" stroke-width="1.5" marker-end="url(#ah-hot)"/>
