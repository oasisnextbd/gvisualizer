<rect x="330" y="128" width="270" height="44" rx="6" fill="#FBE2D6" stroke="#D2552B" stroke-width="2"/>
<line x1="330" y1="196" x2="600" y2="196" stroke="#9AA8B8" stroke-width="1.1" marker-end="url(#ah-grey)" marker-start="url(#as-grey)"/>
