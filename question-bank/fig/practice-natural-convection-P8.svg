<text x="330" y="250" font-size="12" fill="#0B7C8C">Still air at T<tspan dy="3.6" font-size="8.6">∞</tspan><tspan dy="-3.6">​</tspan> = 25°C</text>
<text x="330" y="265" font-size="12" fill="#0B7C8C">Walls at T<tspan dy="3.6" font-size="8.6">surr</tspan><tspan dy="-3.6">​</tspan> = 25°C</text>
