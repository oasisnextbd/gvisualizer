<line x1="206.382" y1="149.479" x2="236.452" y2="138.534" stroke="#B7840A" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#ah-acc)"/>
<line x1="93.6184" y1="190.521" x2="63.5483" y2="201.466" stroke="#B7840A" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#ah-acc)"/>
<line x1="98.0385" y1="140" x2="70.3257" y2="124" stroke="#B7840A" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#ah-acc)"/>
<text x="12" y="94" font-size="11.5" fill="#B7840A">radiation, ε = 0.8</text>
