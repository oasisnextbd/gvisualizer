<circle cx="150" cy="170" r="48" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.2"/>
<text x="150" y="174" font-size="12" text-anchor="middle" fill="#1E2B3A">T<tspan dy="3.6" font-size="8.6">s</tspan><tspan dy="-3.6">​</tspan> = 160°C</text>
<path d="M64,220.4 Q82,170 124.8,100" fill="none" stroke="#D2552B" stroke-width="1.6" marker-end="url(#ah-hot)" stroke-linejoin="round" stroke-linecap="round"/>
