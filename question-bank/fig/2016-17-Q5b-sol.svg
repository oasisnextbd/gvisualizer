<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2B3A">
<title>Hollow cylinder with convection inside and outside: resistance analogy</title>
<defs>
