<text x="501" y="256" text-anchor="middle" font-size="12">ln(r<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan>/r<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan>)/(2πkL)</text>
<line x1="536" y1="230" x2="558" y2="230" stroke="#1E2B3A" stroke-width="1.6"/>
<circle cx="558" cy="230" r="3.2" fill="#1E2B3A"/>
<text x="558" y="221" text-anchor="middle" font-size="12">T<tspan dy="4" font-size="75%">2</tspan><tspan dy="-4">​</tspan></text>
<line x1="558" y1="230" x2="580" y2="230" stroke="#1E2B3A" stroke-width="1.6"/>
<path d="M580,230 L584,230 L589.2,224 L599.5,236 L609.8,224 L620.2,236 L630.5,224 L640.8,236 L646,230 L650,230" fill="none" stroke="#1E2B3A" stroke-width="1.6"/>
<text x="615" y="256" text-anchor="middle" font-size="12">1/(h<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan>A<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan>)</text>
<line x1="650" y1="230" x2="672" y2="230" stroke="#1E2B3A" stroke-width="1.6"/>
<circle cx="672" cy="230" r="3.2" fill="#1E2B3A"/>
<text x="672" y="221" text-anchor="middle" font-size="12">T<tspan dy="4" font-size="75%">B</tspan><tspan dy="-4">​</tspan></text>
<text x="330" y="300" font-size="12.5">q = U<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan>A<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan>(T<tspan dy="4" font-size="75%">A</tspan><tspan dy="-4">​</tspan> − T<tspan dy="4" font-size="75%">B</tspan><tspan dy="-4">​</tspan>) = U<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan>A<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan>(T<tspan dy="4" font-size="75%">A</tspan><tspan dy="-4">​</tspan> − T<tspan dy="4" font-size="75%">B</tspan><tspan dy="-4">​</tspan>)</text>
<text x="330" y="322" font-size="12.5">U<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan>A<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan> = U<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan>A<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan> = 1/ΣR</text>
