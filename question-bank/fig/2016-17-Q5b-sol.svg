<text x="25" y="295" fill="#0B7C8C" font-size="12">T<tspan dy="4" font-size="75%">B</tspan><tspan dy="-4">​</tspan>, h<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan> (outer fluid)</text>
<rect x="370" y="48" width="22" height="16" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1"/>
