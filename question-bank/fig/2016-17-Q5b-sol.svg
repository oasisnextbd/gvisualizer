<rect x="370" y="140" width="22" height="16" fill="#D9F0F2" stroke="#1E2B3A" stroke-width="1"/>
<text x="400" y="152" font-size="12.5">Outer fluid T<tspan dy="4" font-size="75%">B</tspan><tspan dy="-4">​</tspan>, A<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan> = 2πr<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan>L</text>
<circle cx="330" cy="230" r="3.2" fill="#1E2B3A"/>
<text x="330" y="221" text-anchor="middle" font-size="12">T<tspan dy="4" font-size="75%">A</tspan><tspan dy="-4">​</tspan></text>
