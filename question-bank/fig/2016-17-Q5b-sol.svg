<text x="387" y="256" text-anchor="middle" font-size="12">1/(h<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan>A<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan>)</text>
<line x1="422" y1="230" x2="444" y2="230" stroke="#1E2B3A" stroke-width="1.6"/>
