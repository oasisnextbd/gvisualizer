<pattern id="dense" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#E9D3A6"/><circle cx="1" cy="1" r="0.8" fill="#8A6200"/><circle cx="3" cy="3" r="0.8" fill="#8A6200"/></pattern>
</defs>
<rect width="700" height="400" fill="#FFFFFF"/>
<circle cx="150" cy="160" r="131" fill="#D9F0F2" opacity="0.55"/>
<circle cx="150" cy="160" r="105" fill="#DCE3EC" stroke="#1E2B3A" stroke-width="1.3"/>
<circle cx="150" cy="160" r="55" fill="#FBE2D6" stroke="#1E2B3A" stroke-width="1.3"/>
<text x="150" y="176" text-anchor="middle" font-size="10.5">T<tspan dy="4" font-size="75%">A</tspan><tspan dy="-4">​</tspan>, h<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan></text>
<line x1="150" y1="160" x2="124.2" y2="111.4" stroke="#1E2B3A" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="124.2" y1="111.4" x2="81.9" y2="32" stroke="#9AA8B8" stroke-width="0.9" stroke-dasharray="3 2"/>
<text x="77.9" y="28" text-anchor="end" font-size="12">r<tspan dy="4" font-size="75%">i</tspan><tspan dy="-4">​</tspan></text>
<line x1="150" y1="160" x2="230.4" y2="92.5" stroke="#1E2B3A" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="230.4" y1="92.5" x2="261.1" y2="66.8" stroke="#9AA8B8" stroke-width="0.9" stroke-dasharray="3 2"/>
<text x="265.1" y="70.8" font-size="12">r<tspan dy="4" font-size="75%">o</tspan><tspan dy="-4">​</tspan></text>
