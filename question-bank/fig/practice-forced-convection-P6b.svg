<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230" font-family="Helvetica, Arial, sans-serif"><title>Hydraulic diameter: square duct and concentric annulus wetted on both surfaces</title><defs><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2B3A"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2552B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7C8C"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7840A"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55667D"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/></marker><marker id="dg" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#9AA8B8"/></marker><marker id="dg0" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#9AA8B8"/></marker><pattern id="ins" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF3D6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C98A00" stroke-width="1.2"/></pattern><pattern id="gen" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#FBE2D6"/><circle cx="6" cy="6" r="1.3" fill="#D2552B"/></pattern><pattern id="wtr" width="16" height="8" patternUnits="userSpaceOnUse"><rect width="16" height="8" fill="#D9F0F2"/><path d="M0,4 q4,-3 8,0 t8,0" stroke="#0B7C8C" stroke-width="0.7" fill="none"/></pattern></defs><rect width="600" height="230" fill="white"/>
<rect x="70.0" y="50.0" width="120.0" height="120.0" fill="#D9F0F2" stroke="#B7840A" stroke-width="3"/>
<line x1="70.0" y1="186.0" x2="190.0" y2="186.0" stroke="#9AA8B8" stroke-width="1" marker-end="url(#dg)" marker-start="url(#dg0)"/>
<text x="130.0" y="201.0" font-size="12" text-anchor="middle" fill="#55667D" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">a = 4 cm</text>
<text x="130.0" y="114.0" font-size="12" text-anchor="middle" fill="#1E2B3A" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke" font-weight="bold">D<tspan dy="3.6" font-size="8.6">h</tspan><tspan dy="-3.6"> </tspan> = 4a²/4a = a</text>
<text x="130.0" y="30.0" font-size="12.5" text-anchor="middle" fill="#1E2B3A" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke" font-weight="bold">(i) square duct</text>
<circle cx="410.0" cy="110.0" r="70.0" fill="#D9F0F2" stroke="#B7840A" stroke-width="3"/>
<circle cx="410.0" cy="110.0" r="35.0" fill="#DCE3EC" stroke="#B7840A" stroke-width="3"/>
<line x1="410.0" y1="110.0" x2="377.1" y2="122.0" stroke="#1E2B3A" stroke-width="1.1" marker-end="url(#ai)"/>
<text x="365.8" y="130.1" font-size="11" text-anchor="end" fill="#1E2B3A" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke"></text>
<line x1="410.0" y1="110.0" x2="470.6" y2="145.0" stroke="#1E2B3A" stroke-width="1.1" marker-end="url(#ai)"/>
<text x="481.0" y="155.0" font-size="11" text-anchor="start" fill="#1E2B3A" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke"></text>
<text x="370.0" y="136.0" font-size="11" text-anchor="end" fill="#55667D" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">D<tspan dy="3.3" font-size="7.9">i</tspan><tspan dy="-3.3"> </tspan> = 2.5 cm</text>
<text x="476.0" y="168.0" font-size="11" text-anchor="start" fill="#55667D" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">D<tspan dy="3.3" font-size="7.9">o</tspan><tspan dy="-3.3"> </tspan> = 5 cm</text>
<text x="410.0" y="30.0" font-size="12.5" text-anchor="middle" fill="#1E2B3A" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke" font-weight="bold">(ii) annulus, both surfaces wetted</text>
<text x="410.0" y="206.0" font-size="11.5" text-anchor="middle" fill="#1E2B3A" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">D<tspan dy="3.4" font-size="8.3">h</tspan><tspan dy="-3.4"> </tspan> = 4·(π/4)(D<tspan dy="3.4" font-size="8.3">o</tspan><tspan dy="-3.4"> </tspan>² − D<tspan dy="3.4" font-size="8.3">i</tspan><tspan dy="-3.4"> </tspan>²)/[π(D<tspan dy="3.4" font-size="8.3">o</tspan><tspan dy="-3.4"> </tspan> + D<tspan dy="3.4" font-size="8.3">i</tspan><tspan dy="-3.4"> </tspan>)] = D<tspan dy="3.4" font-size="8.3">o</tspan><tspan dy="-3.4"> </tspan> − D<tspan dy="3.4" font-size="8.3">i</tspan><tspan dy="-3.4"> </tspan></text>
<text x="300.0" y="226.0" font-size="11.5" text-anchor="middle" fill="#B7840A" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">thick gold line = wetted perimeter P; D<tspan dy="3.4" font-size="8.3">h</tspan><tspan dy="-3.4"> </tspan> = 4A/P</text>
</svg>
